version: "2"

run:
  build-tags: [integration]   # lint the integration tests too

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosec
    - errorlint
    - bodyclose
    - noctx
    - revive
    - misspell
    - unconvert
  settings:
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1001"]
    gosec:
      excludes:
        - G104 # unchecked errors: errcheck covers them with its own exclusions
  exclusions:
    generated: strict        # *.gen.go carry "Code generated ... DO NOT EDIT"
    paths:
      - '.*\.gen\.go$'
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose]
      # Developer tools that read and write repository files at paths given on the command line.
      - path: (cmd/mcpgen|cmd/helpsync|internal/contract)/
        linters: [gosec]

formatters:
  enable:
    - gofmt
  exclusions:
    generated: strict
