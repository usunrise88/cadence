# written by Cadence — permission preset (docs/spec/08-resolutions.md R7). Keys are stable; keep prose in comments.
#
# The Guardrails table of docs/spec/05-agents.md as rules. The server's policy engine evaluates `tools` on every
# command an agent (or an automation key) sends: in order, first match wins, no match = deny. People are allowed
# everything except the rules marked `everyone`. The same file renders into Claude Code's .claude/settings.json and
# opencode's `permission` block; those files only reduce prompts and never widen what the server allows.
#
# Classes: read and draft → allow; spend → allow while the GPU-hours estimate fits the remaining budget, otherwise
# approval; gated → approval; forbidden → deny.
name: guardrails-default
description: Agents do anything reversible on their own; over-budget spend, baselines, gates, golden sets, deployments and registry changes wait for a person; deletes, secrets and credentials are out of reach.

tools:
  # An agent never decides approvals, its own or anyone's.
  - id: approvals-are-for-people
    class: forbidden
    operations: [approvals.approve, approvals.deny]
    reason: approvals are decided by a person

  # A draft exists so a person decides; an agent may revert its own draft but never accept one (auto-accept is the
  # project's draft policy `direct`, not an agent's choice).
  - id: drafts-are-for-people
    class: forbidden
    operations: [drafts.accept]
    reason: drafts are accepted by a person

  # Sessions are started, steered and merged by people: an agent never starts another session (a playbook session
  # included: playbooks.get shows it the estimate), sends a session
  # messages, or accepts or reverts a session branch — its own included.
  - id: sessions-are-for-people
    class: forbidden
    operations: ["agentSessions.*", "agentMessages.*", playbooks.run]
    verbClass: mutate
    reason: agent sessions are started, steered and merged by people

  # Secrets never enter an agent context; credentials, compute, policies, notification routing, the Telegram bot
  # and backups are the admin's. The agents'
  # own model accounts (agentCredentials, Settings → Agents) are not MCP tools at all (exempt tag); the rule is a
  # second fence.
  - id: admin-only
    class: forbidden
    operations: ["secrets.*", "credentials.*", "agentCredentials.*", "agentProviders.*", compute.new, compute.edit,
                 compute.archive, policies.edit, notificationRules.edit, notificationSettings.edit, "telegramBot.*",
                 backups.new, backups.verify]
    reason: secrets, credentials, agent model accounts, compute, policies, notifications and backups are changed by the admin only

  # R8: the baseline alias is gated for everyone, people included (production moves only by promotion).
  - id: baseline-alias
    class: gated
    everyone: true
    operations: [aliases.set]
    params: { name: baseline }
    reason: changing a project's baseline changes what every gate compares against

  # Content-store eviction deletes blobs (06 "Artifacts, metrics and logs", Retention): agents never evict, and a
  # person's real call waits for an approval too (no destructive data operation without an approval command). The
  # first rule stops agents (first match wins); people read only `everyone` rules, so they meet the second.
  - id: agents-never-evict
    class: forbidden
    operations: [artifacts.evict]
    reason: freeing content-store space deletes artifacts; only a person asks for it
  - id: store-eviction
    class: gated
    everyone: true
    operations: [artifacts.evict]
    reason: eviction deletes blobs from the content store; only the backup mirror can bring them back

  # R26: an auxiliary model (LID, pseudo-label member, aligner) writes text that reaches datasets, so adopting one is
  # a registry-scope approval the admin decides after reading its licence, for people too. The handler names the
  # version's kind to the engine (projects.adopt of an auxiliary version: kind=auxiliary).
  - id: auxiliary-adoption
    class: gated
    everyone: true
    operations: [projects.adopt]
    params: { kind: auxiliary }
    reason: an auxiliary model's outputs become training text; the admin checks its licence before any project uses it

  # Annotation (phase 4 · stream A): a human transcript is a person's. Agents sample and watch batches (batches.new,
  # batches.get) but never annotate, adjudicate, resolve a disputed pseudo-label or invite a reviewer; freezing a batch
  # registers a golden set or training data, so it is an approval for everyone, like goldenSets.freeze.
  - id: annotation-is-for-people
    class: forbidden
    operations: [annotations.new, batchItems.accept, triage.accept, triage.correct, triage.reject, "invitations.*"]
    reason: transcripts written as human are a person's, and reviewers are invited by the admin
  - id: annotation-batch-freeze
    class: gated
    everyone: true
    operations: [batches.freeze]
    reason: a frozen batch becomes a golden set every project's gate compares against, or training data; the admin decides

  # A golden set decides what every project's gate compares against: freezing one is a registry-scope approval the
  # admin decides, for people too (05 "Approvals have a scope"; phase-3 plan stream G).
  - id: golden-set-freeze
    class: gated
    everyone: true
    operations: [goldenSets.freeze]
    reason: a golden set is frozen for every project; the admin decides what counts as held-out test data

  # A project bundle (phase 4 tail) registers versions this instance lacks — golden sets, auxiliary models, sources
  # cleared for training — for every project: importing one (bundles.adopt, or projects.new with bundle; the handlers
  # name from=bundle to the engine) is a registry-scope approval the admin decides, for people too.
  - id: bundle-import
    class: gated
    everyone: true
    operations: [bundles.adopt, projects.new]
    params: { from: bundle }
    reason: a bundle registers golden sets, auxiliary models and sources for every project; the admin decides what this instance takes in

  # "Freeze a golden set, change a baseline or gate" → approval.
  - id: evaluation-gates
    class: gated
    operations: [goldenSets.freeze, gates.edit]
    reason: golden sets and gates decide what counts as better

  # The agent profile renders the agent's own permission files and instructions: an agent changing it waits for a
  # person (the server-side scope of its token does not change either way).
  - id: agent-profile
    class: gated
    operations: [agentProfile.edit]
    reason: the agent profile decides what agents may do and what they are told

  # A deployment target names production (R46, phase 5): creating or changing one is a registry-scope approval the
  # admin decides, for people too, as mounts. Archiving one is the admin's (agents meet no-deletes below).
  - id: deployment-targets
    class: gated
    everyone: true
    operations: [deploymentTargets.new, deploymentTargets.edit]
    reason: a deployment target names production; the admin decides where models are delivered and what each target serves

  # A delivery is confirmed with the receipt the delivery script printed on a production host no agent reaches
  # (R33, phase 5): agents never confirm one, whatever the receipt says.
  - id: delivery-is-for-people
    class: forbidden
    operations: [promotions.verify]
    reason: a delivery is confirmed by the person who ran its script on the production host

  # "Canary, production, rollback" → approval (shadow is decided by the promotion's own stage check, phase 5).
  - id: deployments
    class: gated
    operations: [deployments.promote, deployments.rollback]
    reason: deployments reach real traffic

  # A mount is shared by every project and reaches storage outside Cadence: registering one is a registry-scope
  # approval the admin decides, for people too (phase-4 plan stream M).
  - id: mount-registration
    class: gated
    everyone: true
    operations: [mounts.new]
    reason: a mount is shared by every project and opens storage outside Cadence; the admin decides which locations Cadence reads and writes

  # A dataset pushed to the Hugging Face Hub leaves the instance with its audio and transcripts: an approval the admin
  # decides, for people too (spec 03 "Interoperability": exports follow the approval rules of a registry publication;
  # phase-4 plan stream I). datasets.export names its body's format to the policy; exports to a mount or the content
  # store stay drafts (the draft rule below).
  - id: hub-export
    class: gated
    everyone: true
    operations: [datasets.export]
    params: { format: hf-hub }
    reason: a dataset pushed to the Hugging Face Hub leaves the instance; the admin decides what is published

  # Registry-scope approvals: model registration and source edits — clearing a source for training (its
  # licence allows it and the data may be used) is a person's decision (R18).
  - id: registry-changes
    class: gated
    operations: [models.register, sources.edit]
    reason: registry changes are shared by every project; clearing a source for training is a person's decision

  # Phase-1 fixture for the approval loop until real gated commands arrive: archiving a project is a soft delete.
  - id: archive-project
    class: gated
    operations: [projects.archive]
    reason: archiving a project hides its work from every panel

  # An agent edits recipe files in its session worktree, where every turn is a commit on the session branch that
  # merges through the project's auto-merge policy; recipes.new and recipes.edit commit straight to main and are the
  # Recipe document's (a person's) path.
  - id: recipes-through-the-worktree
    class: forbidden
    operations: [recipes.new, recipes.edit]
    reason: agents change recipe files in their session worktree, not directly on main

  # "Delete anything" → not allowed; revoking credentials is the admin's.
  - id: no-deletes
    class: forbidden
    verbs: [archive, revoke]
    reason: removing things is left to people

  # "GPU job within the session budget → allowed; over budget → approval" (the estimate comes from the dry run; the
  # budget is the project's GPU-hours per day and the session's, metered from lease time on GPU cards). A dry run
  # never waits: it answers the estimate with a Cadence-Policy header naming the approval the real call would need.
  # A cost Cadence cannot estimate (a step without a measured or declared estimate) fails closed: approval.
  - id: gpu-spend
    class: spend
    operations: [runs.new, runs.calibrate, runs.resume, runs.stage, checkpoints.average, evals.new, pipelines.run, sweeps.run,
      goldenSets.align, pipelineRuns.retry, jobs.resume]
    reason: the job spends GPU time

  # "Read any entity, log, metric or result" → allowed.
  - id: read
    class: read
    verbClass: read

  # "Edit recipes and drafts", "create sources, dataset versions, mixes, eval runs" → allowed (reversible).
  - id: draft
    class: draft
    verbs: [new, open, edit, preview, calibrate, run, pause, resume, cancel, retry, stage, freeze, materialize,
            evict, scan, export, parity, benchmark, average, gate, set, adopt, pin, accept, correct, reject, revert,
            package, note, sync, verify, align]

files:
  worktree: true          # nothing outside the session worktree
  read: allow
  edit: allow             # reversible: every turn is a commit on the session branch
  deny: [".env", ".env.*", "**/*.pem", "**/*.key", ".git/**"]

shell:
  default: ask
  # File contents are read with the agent's own read tool, which the `files` rules cover; cat and friends ask.
  # git add / commit stay in the worktree: the host scans everything since the last push for credentials and pushes
  # it at the end of the turn (an agent's own commits included), so they need no person.
  allow: ["git status", "git status *", "git diff *", "git log *", "git show *", "git add *", "git commit *", "ls *",
          "wc *", "uv run *", "python *",
          "python3 *", "pytest *", "jq *", "yq *"]
  ask: ["pip install *", "uv add *", "uv pip install *", "rm *", "mv *"]
  deny: ["git push *", "git remote *", "git config *", "sudo *", "ssh *", "scp *", "curl *", "wget *", "nc *",
         "docker *", "rm -rf /*", "env", "printenv *"]

web: ask

sandbox:
  enabled: true
  # R4: the network sandbox for the shell — Hugging Face, PyPI and NGC.
  network: [huggingface.co, "*.huggingface.co", "*.hf.co", pypi.org, files.pythonhosted.org, nvcr.io, "*.nvcr.io",
            ngc.nvidia.com, "*.ngc.nvidia.com"]
