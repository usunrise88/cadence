# written by Cadence — starter pipeline: label untranscribed audio on a mount with an ensemble of models (R26,
# Granary-style agreement), then normalise, filter, split and register a draft dataset version — data-ingest for
# audio without transcripts (docs/review/2026-10-03-phase-4-plan.md decisions 6–7).
#
# segments_cut cuts the segments without text into a dataset the members read; each member writes hypotheses keyed by
# the segment's audio hash; pseudolabel_ensemble keeps a text when the members agree within
# pseudolabel.max_pairwise_wer and language identification agrees, and marks the rest pseudo-label:disputed
# (triage.list; manifest_filter drops them, so they never reach training).
#
# Members: Whisper and OASIS (owner decision 2026-10-04). The base model is not a member: it is the model being
# taught, and on the stand it added nothing (FLEURS sr: WER 0.336 against Whisper's 0.121; the ensemble with it kept
# 490 of 2 944 segments, no better than Whisper alone). With two members OASIS is required: the oasis step is not
# optional, so when its service does not answer the dry run refuses (auxiliary-unavailable) instead of running a
# one-member "ensemble" that agrees with itself (pseudolabel_ensemble refuses fewer than pseudolabel.min_members).
# Cadence never starts OASIS: a person runs scripts/serve.sh ensemble no-300m in the OASIS checkout, and the admin
# keeps its token in the secret oasis-token. OASIS writes lowercase without punctuation; when the two agree the
# ensemble keeps Whisper's cased, punctuated text (pseudolabel.prefer_written_form), the training style.
# Language identification is lid_classify@2: SpeechBrain's VoxLingua107 classifier (auxiliary/lid-voxlingua107) in the
# omni runtime (worker-omni); Whisper's own detected language is the ensemble's second opinion.
#
# Inputs: normalizer — the scoring normalizer the ensemble compares texts after (normalizers.get). Before running,
# the project adopts the auxiliaries the members name (projects.adopt: an approval the admin decides) and the params
# marked "set me" are set. Serbian: Whisper writes Cyrillic (transliterate: sr-Cyrl-Latn, also on oasis and
# text_normalise). Hebrew: whisper's auxiliary auxiliary/whisper-he-ivrit, no transliterate. Help:
# docs/help/steps/segments-cut.md, docs/help/steps/pseudolabel-ensemble.md, docs/help/guides/playbooks.md.
name: pseudo-label
description: Pseudo-label untranscribed audio on a mount (model ensemble + LID) into a draft dataset version
inputs: { normalizer: normalizer }
steps:
  - id: index
    kind: sdp_ingest@2
    params:
      source: my-corpus                                # set me: a registered source
      path: mount://corpora/my-corpus/set-me-revision  # set me: <mount>/<source>/<revision>
      language: sr-RS                                  # set me
  - id: audio
    kind: segments_cut@1
    in: { segments: index.segments }
  - id: whisper
    kind: whisper_transcribe@1
    in: { data: audio.data }
    params:
      transliterate: sr-Cyrl-Latn                      # set me: "" outside Serbian
  - id: oasis
    kind: oasis_transcribe@1
    in: { data: audio.data }
    params:
      transliterate: sr-Cyrl-Latn                      # set me: "" outside Serbian
  - id: lid
    kind: lid_classify@2
    in: { data: audio.data }
  - id: ensemble
    kind: pseudolabel_ensemble@2
    in:
      segments: index.segments
      hypotheses.0: whisper.hypotheses
      hypotheses.1: oasis.hypotheses
      lid: lid.lid
      normalizer: $inputs.normalizer
  - id: normalise
    kind: text_normalise@1
    in: { segments: ensemble.segments }
    params:
      transliterate: sr-Cyrl-Latn                      # set me: lang/<locale>/normalizer.yaml training
  - id: filter
    kind: manifest_filter@2
    in: { segments: normalise.segments }
  - id: split
    kind: speaker_disjoint_split@1
    in: { segments: filter.segments }
  - id: draft
    kind: dataset_freeze@1
    in: { segments: split.segments }
    params:
      name: my-corpus                                  # set me: dataset/<name>
      tags: [pseudo-label]
