# Starter pipeline: one eval cell by hand — transcribe a checkpoint on a golden set's dataset at a latency profile with
# the real streaming decoder, then score it after the golden set's normalizer (docs/spec/03-pipelines-defaults.md
# "The eval pipeline"). evals.new generates this shape per eval (materialize → transcribe → score for each missing
# cell, the kinds from the model family's roles) and caches the scores as eval records; a run of this file by
# pipelines.run writes scores but no eval record.
name: eval-matrix
description: Transcribe a checkpoint on a golden dataset at a latency profile and score it (one eval cell; evals.new runs the matrix)
inputs: { model: checkpoint, data: dataset, normalizer: normalizer }
steps:
  # target_lang "" prompts each clip with its own language from the dataset (he → he-IL); name a locale to force one.
  - id: transcribe
    kind: nemotron_transcribe@3
    in: { model: $inputs.model, data: $inputs.data }
    params: { profile: 160ms, target_lang: "" }
  - id: score
    kind: wer_score@1
    in: { hypotheses: transcribe.hypotheses, data: $inputs.data, normalizer: $inputs.normalizer }
