# written by Cadence — R17 replay data: the replay corpus and the replay golden sets (docs/spec/08-resolutions.md).
#
# Replay stops catastrophic forgetting in the base model's other locales, so it needs breadth, not volume. The base
# model nvidia/nemotron-3.5-asr-streaming-0.6b lists 40 language-locales on its model card (19 transcription-ready,
# 13 broad-coverage, 8 adaptation-ready); he-IL is the target, the other 39 are replayed. Source: FLEURS
# (google/fleurs at revision 70bb2e84b976b7e960aa89f1c648e09c59f894dd),
# licence CC-BY-4.0 — commercial use allowed with attribution (A. Conneau et al., 2022). Licence check: every step
# below records CC-BY-4.0 on the source `fleurs`; the source is eval-only until a person clears it for training
# (sources.edit), which is the licence decision R17 asks for.
#
# Phase-2 cap (docs/review/2026-09-30-phase-2-plan.md "Decisions"): about 1 h per locale from FLEURS train in one
# dataset version, dataset/replay-base; the ≈ 5 h per locale corpus of R17 (Common Voice and Granary where they cover
# a locale) is a later re-freeze of the same collection with this pipeline widened. Replay golden sets: FLEURS test,
# at most 300 utterances per locale, each its own dataset version dataset/replay-golden-<locale>, tagged golden,
# replay and eval-only (registered as dataset versions until the Golden set entity arrives in phase 3).
#
# FLEURS has one configuration per language, not per regional variant: 34 configurations cover 34 locales. Five
# locales have no configuration of their own and are covered by their sister variant only (a known gap, closed by
# the Common Voice re-freeze):
#   en-GB → en_us (shared with en-US)
#   es-ES → es_419 (shared with es-US)
#   fr-CA → fr_fr (shared with fr-FR)
#   pt-PT → pt_br (shared with pt-BR)
#   nn-NO → nb_no (shared with nb-NO)
#
# Locale table (locale · model-card tier · FLEURS configuration):
#   en-US  transcription-ready  en_us
#   en-GB  transcription-ready  en_us (shared with en-US)
#   es-US  transcription-ready  es_419
#   es-ES  transcription-ready  es_419 (shared with es-US)
#   fr-FR  transcription-ready  fr_fr
#   fr-CA  transcription-ready  fr_fr (shared with fr-FR)
#   it-IT  transcription-ready  it_it
#   pt-BR  transcription-ready  pt_br
#   pt-PT  transcription-ready  pt_br (shared with pt-BR)
#   nl-NL  transcription-ready  nl_nl
#   de-DE  transcription-ready  de_de
#   tr-TR  transcription-ready  tr_tr
#   ru-RU  transcription-ready  ru_ru
#   ar-AR  transcription-ready  ar_eg
#   hi-IN  transcription-ready  hi_in
#   ja-JP  transcription-ready  ja_jp
#   ko-KR  transcription-ready  ko_kr
#   vi-VN  transcription-ready  vi_vn
#   uk-UA  transcription-ready  uk_ua
#   pl-PL  broad-coverage       pl_pl
#   sv-SE  broad-coverage       sv_se
#   cs-CZ  broad-coverage       cs_cz
#   nb-NO  broad-coverage       nb_no
#   da-DK  broad-coverage       da_dk
#   bg-BG  broad-coverage       bg_bg
#   fi-FI  broad-coverage       fi_fi
#   hr-HR  broad-coverage       hr_hr
#   sk-SK  broad-coverage       sk_sk
#   zh-CN  broad-coverage       cmn_hans_cn
#   hu-HU  broad-coverage       hu_hu
#   ro-RO  broad-coverage       ro_ro
#   et-EE  broad-coverage       et_ee
#   el-GR  adaptation-ready     el_gr
#   lt-LT  adaptation-ready     lt_lt
#   lv-LV  adaptation-ready     lv_lv
#   mt-MT  adaptation-ready     mt_mt
#   sl-SI  adaptation-ready     sl_si
#   th-TH  adaptation-ready     th_th
#   nn-NO  adaptation-ready     nb_no (shared with nb-NO)
#
# Do not run this on a laptop: ≈ 34 h of training audio plus ≈ 10 000 test utterances (≈ 4 GB of 16 kHz WAV).
name: replay-base
steps:
  - id: corpus
    kind: dataset_import@2
    params:
      name: replay-base
      source_name: fleurs
      licence: CC-BY-4.0
      hf_revision: 70bb2e84b976b7e960aa89f1c648e09c59f894dd
      hf_configs:
        en_us: en-US
        es_419: es-US
        fr_fr: fr-FR
        it_it: it-IT
        pt_br: pt-BR
        nl_nl: nl-NL
        de_de: de-DE
        tr_tr: tr-TR
        ru_ru: ru-RU
        ar_eg: ar-AR
        hi_in: hi-IN
        ja_jp: ja-JP
        ko_kr: ko-KR
        vi_vn: vi-VN
        uk_ua: uk-UA
        pl_pl: pl-PL
        sv_se: sv-SE
        cs_cz: cs-CZ
        nb_no: nb-NO
        da_dk: da-DK
        bg_bg: bg-BG
        fi_fi: fi-FI
        hr_hr: hr-HR
        sk_sk: sk-SK
        cmn_hans_cn: zh-CN
        hu_hu: hu-HU
        ro_ro: ro-RO
        et_ee: et-EE
        el_gr: el-GR
        lt_lt: lt-LT
        lv_lv: lv-LV
        mt_mt: mt-MT
        sl_si: sl-SI
        th_th: th-TH
      max_hours: 1
      split_rule: all-train
      tags: [replay]
  - id: golden-en-us
    kind: dataset_import@2
    params:
      name: replay-golden-en-us
      source_name: fleurs
      licence: CC-BY-4.0
      locale: en-US
      hf_config: en_us
      hf_split: test
      hf_revision: 70bb2e84b976b7e960aa89f1c648e09c59f894dd
      max_utterances: 300
      split_rule: all-test
      eval_only: true
      tags: [golden, replay]
