# Starter pipeline: index a mount, pseudo-label, normalise, filter, split, freeze (step kinds arrive in phase 4).
name: data-ingest
description: Turn audio on a mount into a frozen, fingerprinted dataset version
steps:
  - id: index
    kind: sdp_ingest@1
  - id: pseudolabel
    kind: pseudolabel_ensemble@1
    in: { manifest: index.manifest }
  - id: normalise
    kind: text_normalise@1
    in: { manifest: pseudolabel.manifest }
  - id: filter
    kind: manifest_filter@1
    in: { manifest: normalise.manifest }
  - id: split
    kind: speaker_disjoint_split@1
    in: { manifest: filter.manifest }
  - id: freeze
    kind: dataset_freeze@1
    in: { manifest: split.manifest }
