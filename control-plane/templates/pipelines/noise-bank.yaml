# written by Cadence — starter pipeline: import a licensed public noise set as a frozen noise-bank version (docs/spec/02
# entity Noise bank; docs/spec/03 "Augmentation", Background noise).
#
# dataset_import@4 with purpose noise reads every audio file under `path` (no metadata.csv needed), keeps no
# transcripts and writes a `dataset` artifact marked purpose noise; the control plane's dataset hook registers the
# Source with its licence and a frozen version in noise-bank/<name> (registry kind noise_bank) — no utterances, and a
# noise bank never enters a mix. Augmentation profiles name the noise bank. Noise from the project's own calls is
# pipelines/noise-from-calls.yaml.
#
# As shipped it imports the noise part of MUSAN (OpenSLR 17, CC BY 4.0: about 930 clips, 6 h, free-sound and
# sound-bible) from the corpora mount, laid out as the fetch scripts write a corpus (<source>/<revision>/):
#   tar -xzf musan.tar.gz musan/noise   # into /cadence/corpora/musan/<revision>/
# The archive is 11 GB (music, speech and noise together); only musan/noise is imported. A path on the worker host
# works too. Help: docs/help/steps/dataset-import.md.
name: noise-bank
steps:
  - id: import
    kind: dataset_import@4
    params:
      format: folder-csv
      purpose: noise
      path: mount://corpora/musan/2015-09-01/noise    # set me: the revision directory you extracted
      name: musan-noise
      source_name: musan
      licence: CC-BY-4.0
      source_url: https://www.openslr.org/17/
