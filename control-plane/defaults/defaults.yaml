# written by Cadence — the defaults every form, pipeline, budget and estimate starts from.
#
# docs/spec/03-pipelines-defaults.md "Defaults" and docs/spec/08-resolutions.md R11: one versioned file, embedded in
# the control-plane binary and packaged with the worker. Every value carries a description, a source and, where it
# applies, a safe range; a value without a published source is a "Cadence recommendation" re-checked after the spikes.
# Keys are addressed as <section>.<key> (x-cadence.defaultRef: training.steps). Bump `version` on every change.
version: 10

# The project wizard's Recommended mode (docs/spec/02-domain-projects-registry.md "Project wizard").
wizard:
  locale:
    value: he-IL
    description: Locale of the project's target language (BCP 47)
    source: docs/spec/02-domain-projects-registry.md "First project"
  domain:
    value: telephony
    description: Acoustic domain the project adapts to; picks the augmentation profile and golden-set recipe
    source: docs/spec/02-domain-projects-registry.md "First project"
  base_model:
    value: base-model/nemotron-3.5-asr-streaming-0.6b
    description: Registry collection of the default base model; the wizard pins its newest frozen version
    source: Model card (huggingface.co/nvidia/nemotron-3.5-asr-streaming-0.6b); docs/spec/03 "Key defaults"
  driver:
    value: claude-code
    description: Agent driver for the project's sessions
    source: Cadence recommendation
    range: { values: [claude-code, opencode] }
  claude_code_model:
    value: sonnet
    description: Model of Claude Code sessions, as a Claude Code alias (the subscription resolves it to the current model)
    source: docs/spec/08-resolutions.md R6 (Claude subscription); Cadence recommendation for the alias
    range: { values: [sonnet, opus, haiku] }
  opencode_model:
    value: minimax/MiniMax-M3
    description: Model of opencode sessions as provider/model; any provider configured in the agent-credentials volume is accepted
    source: docs/spec/08-resolutions.md R6 (MiniMax Token Plan); model chosen by the owner, 2026-09-30
    range: { values: [minimax/MiniMax-M3] }
  auto_merge:
    value: when-clean
    description: Whether a session branch merges into main at session end when it applies cleanly (when-clean) or always waits for a person (never)
    source: docs/spec/05-agents.md "Worktree, drafts and merge"
    range: { values: [when-clean, never] }
  draft_policy:
    value: { mix: draft, gate: draft, note: direct, language_pack: draft }
    description: Per draftable kind, whether agent changes land at once (direct) or as drafts to accept or revert (draft)
    source: docs/spec/05-agents.md "Worktree, drafts and merge"; Cadence recommendation (notes are append-only learnings)
  permission_preset:
    value: guardrails-default
    description: Permission preset rendered into the agent config and used by the policy engine
    source: docs/spec/08-resolutions.md R7
  instructions_template:
    value: default
    description: Template for the project's AGENTS.md
    source: docs/spec/02-domain-projects-registry.md "Project wizard"
    range: { values: [default, minimal] }
  repository:
    value: internal
    description: Where the project repository lives — the internal bare repository, a new GitHub repository, or an existing URL
    source: docs/spec/08-resolutions.md R10
    range: { values: [internal, github, url] }

# Per-project and per-session budgets; policies.edit changes the instance-wide values inside these ranges.
budgets:
  gpu_hours_per_project_per_day:
    value: 8
    unit: GPU-h
    description: GPU-hours a project may spend per day before a run needs an approval
    source: Cadence recommendation (docs/spec/03 "Key defaults")
    range: { min: 0, max: 192 }
  agent_tokens_per_project_per_day:
    value: 20000000
    unit: tokens
    description: Agent spend a project may use per day, in tokens (money counts only in API-key mode, R6)
    source: Cadence recommendation — re-check after spike A2 measures a playbook session
    range: { min: 0, max: 1000000000 }
  agent_turns_per_session:
    value: 200
    unit: turns
    description: Turns an agent session may take before it pauses with a budget reason
    source: Cadence recommendation (docs/spec/03 "Key defaults")
    range: { min: 1, max: 2000 }
  agent_tokens_per_session:
    value: 10000000
    unit: tokens
    description: Input plus output tokens (cached reads not counted) an agent session may use before it pauses with a budget reason
    source: Cadence recommendation — re-check after spike A2 measures a playbook session
    range: { min: 1000, max: 1000000000 }
  agent_tokens_per_turn:
    value: 1000000
    unit: tokens
    description: A turn that uses more input plus output tokens than this is cancelled and the session pauses (runaway check)
    source: docs/spec/05-agents.md "Budgets and runaway protection"; Cadence recommendation for the value
    range: { min: 1000, max: 100000000 }
  agent_gpu_hours_per_session:
    value: 4
    unit: GPU-h
    description: GPU-hours one agent session's commands may spend (lease time on GPU cards) before a spending command waits for a person's approval
    source: docs/spec/05-agents.md "Guardrails" (GPU job within the session budget allowed, over budget approval); Cadence recommendation for the value (half the project's daily budget)
    range: { min: 0, max: 192 }
  manual_test_gpu_hours_per_project_per_day:
    value: 1
    unit: GPU-h
    description: GPU-hours of manual transcription tests per project per day
    source: docs/spec/08-resolutions.md R47–R49 (Cadence recommendation)
    range: { min: 0, max: 24 }
  queue_priority_per_project:
    value: 0
    unit: priority
    description: A project's queue priority; waiting step jobs start by project priority (higher first), then the job's own priority, then first come
    source: docs/spec/02-domain-projects-registry.md "Budgets" (the queue interleaves projects by priority)
    range: { min: -100, max: 100 }

# The three session clocks of R5.
timeouts:
  stuck_turn_minutes:
    value: 5
    unit: min
    description: No ACP update for this long during a turn cancels the turn and pauses the session
    source: docs/spec/08-resolutions.md R5
    range: { min: 1, max: 60 }
  idle_session_minutes:
    value: 30
    unit: min
    description: An interactive session without a user message for this long pauses (cheap resume)
    source: docs/spec/08-resolutions.md R5
    range: { min: 5, max: 480 }
  approval_expiry_hours:
    value: 24
    unit: h
    description: A pending approval expires after this long and counts as denied
    source: docs/spec/08-resolutions.md R5
    range: { min: 1, max: 168 }

# Training-run defaults the estimate needs now; the full x-cadence coverage of step parameters follows in phase 2.
training:
  init:
    value: base
    description: Where a run's weights start
    source: docs/spec/08-resolutions.md R44
    range: { values: [base, checkpoint] }
  steps:
    value: 3000
    unit: steps
    description: Optimiser steps of one training stage
    source: Community fine-tune kit; North Sami fine-tune (docs/spec/03 "Key defaults")
    range: { min: 1, max: 200000 }
  precision:
    value: bf16
    description: Training precision
    source: Community fine-tune kit (docs/spec/03 "Key defaults")
    range: { values: [bf16, fp16, fp32] }
  gpus:
    value: 1
    unit: cards
    description: Cards per run; gang leases of several cards are deferred
    source: docs/spec/08-resolutions.md R44
    range: { min: 1, max: 1 }
  keep_top_k:
    value: 3
    unit: checkpoints
    description: Checkpoints per run kept in its top k by validation WER (the ones listed as kept and offered for averaging)
    source: Cadence recommendation (NeMo's checkpoint callback keeps the best k by the monitored metric; averaging the best few is the usual practice)
    range: { min: 1, max: 50 }
  pipeline:
    value: train-stage
    description: The recipe a run executes — a pipeline of the project repository whose steps include the model family's train role
    source: docs/spec/03-pipelines-defaults.md "Pipelines as built" (the train-stage starter)

# R12, table path: what an estimate answers before runs.calibrate has measured anything (phase 2).
estimates:
  measured_plus_minus:
    value: 0.15
    unit: fraction
    description: Relative uncertainty of a measured estimate when the calibration reports no spread of its own
    source: Cadence recommendation (step times vary with the bucket drawn; re-check against spike A3's timed steps)
    range: { min: 0, max: 1 }
  lease_overhead_seconds:
    value: 120
    unit: s
    description: Fixed seconds one training lease adds to its steps (model and state load before step 1, the final validation and the state and checkpoint saves at the end) when the calibration measured none; the estimate is this plus steps × seconds per step
    source: docs/review/2026-10-01-phase-2-rehearsal.md (staging card, Nemotron 0.6B — about 75–80 s of load before step 1 and 45 s of final validation and saves per lease)
    range: { min: 0, max: 3600 }
  bytes_per_audio_hour:
    value: 115200000
    unit: bytes
    description: Bytes of one hour of 16 kHz 16-bit mono PCM; the upper bound for data volume before shards exist
    source: Arithmetic (16 000 samples/s × 2 bytes × 3 600 s)
    range: { min: 1 }
  training:
    - base_model: base-model/nemotron-3.5-asr-streaming-0.6b
      card_class: blackwell-48gb
      memory_cap_gb: 22
      precision: bf16
      seconds_per_step: 0.7
      plus_minus: 0.2
      description: Seconds per optimiser step under OOMptimizer bucket sizes for the capped card
      source: docs/spikes/A3-nemotron-finetune.md (0.67 s/step training only on the staging card at a 20.5 GiB allocator cap, bf16; ± covers validation and checkpoint saves)

# Mixes (docs/spec/08-resolutions.md R13): the values a new mix starts from.
mix:
  temperature:
    value: 1.0
    description: Sampling temperature over group weights; a group is drawn with probability ∝ weight^(1/temperature), so 1 follows the weights and larger values flatten towards uniform
    source: Cadence recommendation (temperature-based sampling over data groups, as in multilingual ASR training)
    range: { min: 0.1, max: 10 }
  replay_share:
    value: 0.15
    unit: fraction
    description: Share of training samples drawn from replay groups (the base model's other locales) when a mix has one
    source: docs/spec/03-pipelines-defaults.md "Key defaults" (replay 15 % of steps; NVIDIA recommends replay, the share is a Cadence recommendation)
    range: { min: 0, max: 0.9 }
  group_weight:
    value: 1.0
    description: Weight of a mix group that gives none
    source: Cadence recommendation
    range: { min: 0.001, max: 1000 }

# Drafts (docs/spec/05-agents.md "Worktree, drafts and merge"): what an agent's edit of a draftable kind does —
# `draft` lands as a draft a person accepts or reverts, `direct` applies at once (still attributed). A project's
# agent profile (draftPolicy, filled from agent.draft_policy) decides per kind; these apply to projects without one.
drafts:
  mix:
    value: draft
    description: What an agent's edit of a mix does
    source: docs/spec/08-resolutions.md R13 (mixes are draftable; agent edits land as drafts)
    range: { values: [draft, direct] }
  presence_seconds:
    value: 30
    unit: s
    description: How long an agent's direct edit keeps the entity marked "agent editing" (an open draft keeps it until accepted or reverted)
    source: Cadence recommendation
    range: { min: 1, max: 600 }

# Local NVMe cache (docs/spec/02 "Materialisation").
cache:
  high_water_mark:
    value: 0.8
    unit: fraction
    description: Share of the local cache above which unpinned shards are evicted, least recently used first
    source: Cadence recommendation (docs/spec/03 "Key defaults")
    range: { min: 0.5, max: 0.95 }
  project_quota:
    value: 0.4
    unit: fraction
    description: Share of the local cache one project's frozen shards may occupy
    source: Cadence recommendation (docs/spec/03 "Key defaults")
    range: { min: 0.05, max: 1 }
  store_low_free:
    value: 0.15
    unit: fraction
    description: Share of the content store's filesystem free below which Cadence warns (a failure notification, at
      most once a day) and names the training states artifacts.evict could reclaim
    source: Cadence recommendation (the test stand filled 93 % of its disk in one day of fine-tunes, 2026-10-01)
    range: { min: 0.02, max: 0.5 }

# Instance operations (docs/spec/06-platform.md "Operations"): the clock quiet hours, the digest and backups follow.
operations:
  timezone:
    value: UTC
    description: IANA timezone of the instance; quiet hours, the daily digest and the backup schedule are local to it (policies.edit changes it)
    source: Cadence recommendation

# Notification routing (docs/spec/06-platform.md "Notifications"); the routing table itself is seeded by migration.
notifications:
  digest_time:
    value: "09:00"
    description: Local time of the daily digest (runs, evals, spend against budgets, open approvals)
    source: docs/spec/06-platform.md "Notifications"
  quiet_hours_enabled:
    value: false
    description: Whether quiet hours hold Telegram messages back (failures still go out)
    source: Cadence recommendation (off until the admin sets their hours)
  quiet_hours_start:
    value: "22:00"
    description: Local time quiet hours begin
    source: Cadence recommendation
  quiet_hours_end:
    value: "08:00"
    description: Local time quiet hours end (before the digest, so the digest is never held back)
    source: Cadence recommendation

# Backups (docs/spec/06-platform.md "Operations": 24 h RPO, 1 h RTO).
backups:
  nightly_at:
    value: "03:00"
    description: Local time of the nightly backup set (pg_dump custom format plus the new content-store blobs)
    source: docs/spec/06-platform.md "Operations" (nightly, 24 h RPO); Cadence recommendation for the hour
  restore_test_weekday:
    value: sunday
    description: Day of the weekly restore test; the set taken that night is the weekly set, kept longer
    source: docs/spec/06-platform.md "Operations" (weekly automated restore)
    range: { values: [monday, tuesday, wednesday, thursday, friday, saturday, sunday] }
  restore_test_at:
    value: "04:00"
    description: Local time of the weekly restore test into a scratch database (after the nightly set)
    source: Cadence recommendation
  keep_nightly:
    value: 7
    unit: sets
    description: Nightly (and manual) backup sets kept; older ones have their files removed
    source: Cadence recommendation (one week of daily restore points)
    range: { min: 1, max: 60 }
  keep_weekly:
    value: 4
    unit: sets
    description: Weekly backup sets kept beside the nightly ones
    source: Cadence recommendation (a month of weekly restore points)
    range: { min: 1, max: 52 }

# The recommended augmentation profile (docs/spec/03-pipelines-defaults.md "Augmentation"): a project's
# augment/<name>.yaml starts from these values and the Recipe form's "Reset to recommended" writes them back. Each
# transform is applied to an utterance with its probability; ranges are drawn uniformly per utterance.
augment:
  seed:
    value: 1234
    description: Seed of the augmentation draw, recorded on the run so the same draw can be repeated
    source: docs/spec/03-pipelines-defaults.md "Augmentation" (the seed is recorded on the run); the value is a Cadence recommendation
    range: { min: 0, max: 2147483647 }
  codec_probability:
    value: 0.5
    unit: fraction
    description: Share of utterances passed through a lossy telephony codec
    source: Cadence recommendation (NeMo's lossy-codec augmentation and Lhotse's codec transforms are the base, docs/spec/03 "Augmentation")
    range: { min: 0, max: 1 }
  codecs:
    value: [g711-ulaw, g711-alaw, gsm-fr, amr-nb, opus]
    description: Codecs one is drawn from per augmented utterance (G.711 μ-law and A-law, GSM full rate, AMR narrowband, Opus at 6–16 kbps)
    source: docs/spec/03-pipelines-defaults.md "Augmentation" (Codecs)
    range: { values: [g711-ulaw, g711-alaw, gsm-fr, amr-nb, opus] }
  band_limit_probability:
    value: 0.5
    unit: fraction
    description: Share of utterances band-limited to narrowband telephony and resampled back to the model rate
    source: Cadence recommendation
    range: { min: 0, max: 1 }
  band_limit_hz:
    value: 3400
    unit: Hz
    description: Upper edge of the band-limit (the telephone channel passes 300–3400 Hz)
    source: ITU-T G.712 (telephone channel passband 300–3400 Hz); docs/spec/03 "Augmentation" (band-limit to 8 kHz sampling)
    range: { min: 3000, max: 8000 }
  level_probability:
    value: 0.3
    unit: fraction
    description: Share of utterances whose level is changed by a random gain
    source: Cadence recommendation
    range: { min: 0, max: 1 }
  level_gain_db:
    value: [-10, 6]
    unit: dB
    description: Range the gain is drawn from (quiet handsets to hot lines)
    source: Cadence recommendation — re-checked against the noise-bank level statistics (docs/spec/03 "Augmentation", Level and dynamics)
    range: { min: -30, max: 20 }
  speed_probability:
    value: 0.3
    unit: fraction
    description: Share of utterances speed-perturbed
    source: Cadence recommendation
    range: { min: 0, max: 1 }
  speed_factor:
    value: [0.9, 1.1]
    description: Range the speed factor is drawn from (tempo and pitch change together)
    source: Ko et al., "Audio augmentation for speech recognition", Interspeech 2015 (factors 0.9, 1.0, 1.1); NeMo and Lhotse defaults
    range: { min: 0.8, max: 1.2 }

# Hosts seeded into the compute entity at first start; Settings edits them afterwards (compute.edit).
compute:
  hosts:
    - name: staging
      description: The shared staging host; other services stay resident on the card
      source: docs/review/2026-09-30-phase-2-plan.md "Facts that change the plan" (RTX PRO 5000 Blackwell 48 GB; the resident vLLM service holds 23.8 GB); docs/spikes/A3-nemotron-finetune.md (a 24 GB cap does not fit beside it, so 22 GB per process as nvidia-smi counts it, with a 20.5 GiB PyTorch allocator); docs/spec/03 "Key defaults" (Batch)
      cards:
        - index: 0
          name: Staging card (RTX PRO 5000 Blackwell, 48 GB)
          card_class: blackwell-48gb
          memory_gb: 48
          memory_cap_gb: 22
          allowed_job_kinds: [training, eval, shadow, export, data]

# Imports (docs/spec/08-resolutions.md R17, R18): what the dataset_import step kind starts from.
data:
  validation_share:
    value: 0.02
    unit: fraction
    description: Share of an import's speakers (or, without speakers, of its distinct transcripts) held out as the validation split by the speaker-disjoint split rule
    source: Cadence recommendation (docs/spec/03-pipelines-defaults.md starter pipeline, speaker_disjoint_split val_share 0.02)
    range: { min: 0, max: 0.5 }
  min_validation_utterances:
    value: 100
    unit: utterances
    description: Fewest validation utterances a speaker-disjoint import holds out; when validation_share yields fewer, more whole speakers (or transcripts) move to validation, never past half the import
    source: docs/review/2026-10-01-phase-2-rehearsal.md (a 3 h FLEURS import at share 0.02 left 19 validation clips, so validation WER moved in steps of three words)
    range: { min: 0, max: 100000 }
  max_hours:
    value: 0
    unit: h
    description: Cap on the audio hours one import (or one language of a multi-language import) takes, in source order; 0 takes everything
    source: Cadence recommendation (R17 replay caps about 1 h per locale in phase 2)
    range: { min: 0, max: 10000 }
  max_utterances:
    value: 0
    unit: utterances
    description: Cap on the utterances one import (or one language) takes, in source order; 0 takes everything
    source: Cadence recommendation (R17 replay golden sets of at most 300 utterances per locale)
    range: { min: 0, max: 10000000 }
  sample_rate:
    value: 16000
    unit: Hz
    description: Sample rate imported audio is stored at (16-bit PCM WAV, mono)
    source: nvidia/nemotron-3.5-asr-streaming-0.6b model card (16 kHz mono input)
    range: { min: 8000, max: 48000 }
  text_normalisation:
    value: false
    description: Whether an import normalises transcripts; off keeps the source's cased, punctuated text, the style the base model is trained on
    source: nvidia/nemotron-3.5-asr-streaming-0.6b model card (punctuated, cased output); .claude/rules/worker.md

# Evaluation (phase 3; docs/review/2026-10-02-phase-3-plan.md): the matrix, scoring and significance.
eval:
  primary_profile:
    value: 160ms
    description: Latency profile of the primary cell, the one the gate reads; the latency production runs at (a project may change it in gates.yaml)
    source: docs/spec/08-resolutions.md R20 ([56,1], 160 ms)
  matrix_profiles:
    value: [80ms, 160ms, 1120ms]
    description: Latency profiles an eval runs by default (those the model's family declares); 1120ms is the high-latency reference
    source: docs/spec/08-resolutions.md R20, R43 ([56,0], [56,1], [56,13])
  normalizer:
    value: normalizer/basic
    description: Scoring normalizer a golden set is frozen with when the freeze names none (the locale's language pack names its own)
    source: docs/spec/08-resolutions.md R21
  duration_buckets_s:
    value: [0, 2, 5, 10, 20]
    unit: s
    description: Lower bounds of the utterance-duration buckets an eval reports WER for; the last bucket is open
    source: Cadence recommendation (docs/spec/04-blocks.md Block 3, duration buckets)
  bootstrap_samples:
    value: 1000
    unit: samples
    description: Bootstrap resamples behind every confidence interval on a WER delta
    source: Bisani & Ney, ICASSP 2004 (docs/spec/03-pipelines-defaults.md "Key defaults", Significance)
    range: { min: 100, max: 100000 }
  confidence:
    value: 0.95
    unit: fraction
    description: Coverage of the confidence intervals; a gain or regression counts only when the interval excludes zero
    source: docs/spec/03-pipelines-defaults.md "Key defaults" (Significance)
    range: { min: 0.5, max: 0.999 }
  bootstrap_seed:
    value: 1
    description: Seed of the bootstrap resampling, so a verdict is reproducible
    source: Cadence recommendation
    range: { min: 0, max: 2147483647 }

gate:
  target_rule:
    value: beat-baseline
    description: What the target golden sets must show at the primary cell; beat-baseline needs a WER delta below zero with the whole interval below zero
    source: docs/spec/03-pipelines-defaults.md "Key defaults" (Gate)
    range: { values: [beat-baseline] }
  replay_max_regression:
    value: 0.005
    unit: fraction
    description: Largest WER rise (absolute, 0.005 = 0.5 points) a replay-locale golden set may show before the gate fails, counted only when the interval excludes zero
    source: docs/spec/03-pipelines-defaults.md "Key defaults" (Gate)
    range: { min: 0, max: 0.1 }
  deletions_insertions:
    value: true
    description: Fail the gate when the target cells' deletion rate falls while their insertion rate rises (both intervals excluding zero)
    source: docs/spec/03-pipelines-defaults.md "Key defaults" (Gate)

# Framework packs (R45): one section per pack, read by its step kinds through x-cadence defaultRef packs.<pack>.<key>.
packs:
  # The CPU toy pack (runtime `toy`, family `toy-ctc`): a tiny CTC model trained in seconds that exists only to keep the
  # framework seams honest in CI.
  toy:
    train_steps:
      value: 300
      unit: steps
      description: Optimiser steps of a toy training run (a resumed run continues up to this total)
      source: Cadence recommendation (the fixtures reach a WER of 0 in about 300 steps, eight seconds on one CPU thread)
      range: { min: 1, max: 5000 }
    learning_rate:
      value: 0.003
      description: Adam learning rate of the toy model
      source: Cadence recommendation
      range: { min: 0.00001, max: 0.1 }
    batch_size:
      value: 8
      unit: utterances
      description: Utterances per optimiser step before the OOM retry's batch scale
      source: Cadence recommendation
      range: { min: 1, max: 64 }
    val_every:
      value: 20
      unit: steps
      description: Steps between validation passes (validation WER is also measured at the end)
      source: Cadence recommendation
      range: { min: 1, max: 5000 }
    seed:
      value: 0
      description: Random seed of initialisation and batch order
      source: Cadence recommendation
      range: { min: 0, max: 2147483647 }
    calibrate_steps:
      value: 3
      unit: steps
      description: Timed optimiser steps the calibration averages after one warm-up step
      source: Cadence recommendation
      range: { min: 1, max: 50 }
    profile:
      value: offline
      description: Latency profile a toy transcription decodes with
      source: The toy-ctc family descriptor (latency profiles offline and 320ms)
      range: { values: [offline, 320ms] }
  # The NeMo pack (runtime `nemo-speech`, family `nemo.fastconformer-rnnt.cache-aware`: Nemotron 3.5 streaming). Its
  # step kinds oomptimizer_calibrate, nemotron_finetune, checkpoint_average and nemotron_transcribe read these;
  # docs/help/guides/nemo-pack.md. Spike A3 (docs/spikes/A3-nemotron-finetune.md) measured most of them on the staging
  # card under the shared-card cap.
  nemo:
    cuda_context_reserve_mb:
      value: 1024
      unit: MiB
      description: Card memory kept free for the CUDA context and library workspaces, which sit outside PyTorch's allocator; the allocator gets the lease's cap minus this
      source: Spike A3 (a 20.5 GiB allocator cap showed 21.6 GB in nvidia-smi, about 0.65 GB outside the allocator); rounded up
      range: { min: 0, max: 8192 }
    seed:
      value: 0
      description: Random seed of data order, augmentation draws and the prompt-mode coin (recorded on the run)
      source: Cadence recommendation
      range: { min: 0, max: 2147483647 }
    peak_lr:
      value: 0.0002
      description: Peak learning rate of a training stage, reached at the end of warm-up; the NoamAnnealing scale is derived from it and posted with the run
      source: docs/spec/03-pipelines-defaults.md "Key defaults" (community fine-tune kit; North Sami fine-tune)
      range: { min: 0.000001, max: 0.002 }
    warmup_steps:
      value: 100
      unit: steps
      description: Optimiser steps of learning-rate warm-up before the Noam decay
      source: docs/spec/03-pipelines-defaults.md "Key defaults"; spike A3 (warm-up 100)
      range: { min: 1, max: 20000 }
    min_lr:
      value: 0.000001
      description: Floor of the learning rate after warm-up
      source: The base model's own optimiser configuration (model_config.yaml, sched.min_lr)
      range: { min: 0, max: 0.001 }
    weight_decay:
      value: 0.001
      description: AdamW weight decay
      source: The base model's own optimiser configuration (model_config.yaml); spike A3
      range: { min: 0, max: 0.1 }
    grad_clip:
      value: 5.0
      description: Gradient norm clipping threshold (0 turns clipping off)
      source: docs/spec/03-pipelines-defaults.md "Key defaults" (grad clip 5); spike A3 ran 500 steps at 0.5 without trouble
      range: { min: 0, max: 100 }
    val_every:
      value: 500
      unit: steps
      description: Optimiser steps between validation passes; each pass posts val_wer and the best one becomes the stage's best checkpoint
      source: Cadence recommendation (spike A3 validated every 250 of 500 steps; a pass over 200 clips takes about 20 s)
      range: { min: 1, max: 200000 }
    val_max_utterances:
      value: 200
      unit: utterances
      description: Validation clips per pass, taken from the mix's validation split in order
      source: Spike A3 (200 FLEURS dev clips)
      range: { min: 1, max: 5000 }
    val_batch_size:
      value: 8
      unit: utterances
      description: Clips per validation batch
      source: Spike A3
      range: { min: 1, max: 64 }
    log_every:
      value: 10
      unit: steps
      description: Optimiser steps between metric points (loss, lr, grad_norm, throughput, card memory)
      source: Spike A3 (its metrics callback wrote every 10 steps)
      range: { min: 1, max: 1000 }
    state_every_minutes:
      value: 20
      unit: min
      description: Minutes between training states written during a stage, so a stop can release a recent one even when a fresh save would not fit the stop grace
      source: docs/spec/03-pipelines-defaults.md "Key defaults" (checkpoints and windows)
      range: { min: 1, max: 240 }
    max_duration:
      value: 20
      unit: s
      description: Longest training clip; longer clips are left out of training
      source: Spike A3 (the base model was trained with 20 s; under the shared-card cap one 20 s clip is the largest batch that fits); the Key defaults' 40 s needs a larger cap
      range: { min: 1, max: 40 }
    min_duration:
      value: 0.5
      unit: s
      description: Shortest training clip
      source: docs/spec/03-pipelines-defaults.md "Key defaults" (data filters 0.5–40 s)
      range: { min: 0.05, max: 10 }
    num_workers:
      value: 4
      unit: processes
      description: Dataloader worker processes (audio loading and augmentation run there)
      source: Cadence recommendation (spike A3 used 8 on the staging host; 4 leaves CPU for the resident services)
      range: { min: 0, max: 32 }
    prompt_mode:
      value: unified
      description: How training picks the language prompt — unified (auto or the clip's language at random), langID (always the language) or auto (never)
      source: The base model's release recipe (fastconformer_transducer_bpe_streaming_prompt.yaml); spike A3
      range: { values: [unified, langID, auto] }
    unified_auto_ratio:
      value: 0.5
      unit: fraction
      description: Share of training clips that get the auto prompt in unified mode
      source: The base model's release recipe; spike A3
      range: { min: 0, max: 1 }
    target_lang:
      value: ""
      description: Language prompt for every clip; empty takes each clip's language from its dataset (he-IL, or he matched to he-IL)
      source: Cadence recommendation
    augmentation:
      value:
        profile: telephony
        telephone: { p: 0.5, sample_rate: 8000, codecs: [ulaw, alaw, gsm], codec_p: 0.7 }
        gain: { p: 0.5, min_db: -6, max_db: 6 }
        speed: { p: 0.3, min: 0.95, max: 1.05 }
      description: Augmentation profile applied on the fly while training — band-limit to 8 kHz with an optional G.711 or GSM codec, level jitter, speed perturbation; {profile clean} turns it off
      source: docs/spec/03-pipelines-defaults.md "Augmentation" (telephony profile); probabilities are a Cadence recommendation; speed kept within 0.95–1.05 so calibrated buckets stay valid
    bucket_bins:
      value: [4, 6, 8, 10, 12, 14, 16, 18, 20]
      unit: s
      description: Upper bounds of the duration buckets OOMptimizer sizes; the largest caps the clip length
      source: Spike A3 (the invocation of step 1)
    tokens_per_second:
      value: 0
      unit: tokens/s
      description: Transcript tokens per audio second OOMptimizer sizes the targets with; 0 measures the 99th percentile on the mix
      source: Spike A3 (upstream guesses 12; measured p99 16 on Hebrew with the language tag)
      range: { min: 0, max: 60 }
    start_batch_size:
      value: 16
      unit: utterances
      description: Batch size the OOMptimizer search starts from in the longest bucket
      source: Spike A3
      range: { min: 1, max: 512 }
    search_threshold:
      value: 0.05
      unit: fraction
      description: OOMptimizer stops when the gap between the largest batch that fits and the smallest that does not is this share of the latter
      source: NeMo OOMptimizer default
      range: { min: 0.01, max: 0.5 }
    calibrate_timed_steps:
      value: 20
      unit: steps
      description: Real optimiser steps on the mix's data the calibration times after its warm-up (seconds per step and its spread)
      source: Cadence recommendation
      range: { min: 1, max: 500 }
    calibrate_warmup_steps:
      value: 3
      unit: steps
      description: Untimed steps before the timed ones (kernel autotuning, allocator growth)
      source: Cadence recommendation
      range: { min: 0, max: 50 }
    profile:
      value: 160ms
      description: Latency profile a transcription streams at — the primary cell
      source: docs/spec/03-pipelines-defaults.md "Key defaults" (eval latency [56,1], 160 ms)
      range: { values: [80ms, 160ms, 320ms, 560ms, 1120ms] }
    transcribe_batch_size:
      value: 32
      unit: utterances
      description: Utterances streamed together (each keeps its own encoder cache)
      source: Spike A3 (batch 32, fp32)
      range: { min: 1, max: 256 }
    boost_weight:
      value: 0.5
      description: Weight of a boost list's phrase-boosting score in decoding (NeMo's boosting_tree_alpha) when the list names none; 0 turns boosting off. Above about 0.7 listed words start replacing others (over-boosting)
      source: "Cadence recommendation: FLEURS he_il test, 120 utterances, base model at 160 ms, 40 missed words boosted — recall 0.11 → 0.29 / 0.36 / 0.50 / 0.52 / 0.54 and WER 0.466 → 0.462 / 0.460 / 0.461 / 0.490 / 0.623 at weight 0.3 / 0.5 / 0.7 / 1 / 2 (staging card, 2026-10-02)"
      range: { min: 0, max: 10 }
