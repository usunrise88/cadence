      operationId: recipes.new
      summary: Create one text file in the project repository and commit it to main
      tags: [projects]
      x-cadence:
        toolDescription: >
          Create one UTF-8 text file in the project repository and commit it to main as the caller; a path that
          exists answers 409 (change it with recipes.edit). Agents create files in their session worktree; the
          default preset does not allow this tool.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RecipeNew" } } }
      responses:
        "201":
          description: The file as committed (or, for a dry run, as it would be)
          content: { application/json: { schema: { $ref: "#/components/schemas/Recipe" } } }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{p}/recipes/{path}:
    x-cadence: { entity: recipes }
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - { name: path, in: path, required: true, description: "File path in the repository, URL-encoded (pipelines%2Ftrain-stage.yaml)", schema: { $ref: "#/components/schemas/RecipePath" } }
    get:
      operationId: recipes.get
      summary: One file of the project repository at a branch or commit, with its commit history
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/RecipeRef"
      responses:
        "200":
          description: The file
          content: { application/json: { schema: { $ref: "#/components/schemas/Recipe" } } }
        default: { $ref: "#/components/responses/Problem" }
    # phase 2 · wave 2 · stream U: the Recipe document's form edits (an augmentation profile) commit through this.
    patch:
      operationId: recipes.edit
      summary: Write one text file of the project repository and commit it to main (the Recipe document's edits)
      tags: [projects]
      x-cadence:
        toolDescription: >
          Change one UTF-8 text file of the project repository and commit it to main as the caller. Send ifMatch with
          the commit that last changed the file (history[0].sha from recipes.get); recipes.new creates a file. Files rendered from the agent profile (AGENTS.md, CLAUDE.md, .claude/settings.json,
          opencode.json) change through agentProfile.edit instead. Agents edit files in their session worktree; the
          default preset does not allow this tool.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RecipeEdit" } } }
      responses:
        "200":
          description: The file as committed (or, for a dry run, as it would be), with its history
          content: { application/json: { schema: { $ref: "#/components/schemas/Recipe" } } }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{p}/branches:
    x-cadence: { entity: branches }
    parameters: [{ $ref: "#/components/parameters/ProjectSlug" }]
    get:
      operationId: branches.list
      summary: Open branches of the project repository (session and sync branches not merged into main)
      tags: [projects]
      responses:
        "200":
          description: Open branches, most recently updated first
          content: { application/json: { schema: { $ref: "#/components/schemas/BranchList" } } }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{p}/branches/{name}:
    x-cadence: { entity: branches }
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - $ref: "#/components/parameters/BranchName"
    get:
      operationId: branches.get
      summary: A branch with its diff against main and the conflicts a merge would meet
      tags: [projects]
      responses:
        "200":
          description: The branch; ETag is its head commit
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/BranchDiff" } } }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{p}/branches/{name}:compare:
    x-cadence: { entity: branches }
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - $ref: "#/components/parameters/BranchName"
    get:
      operationId: branches.compare
      summary: A branch compared with main file by file in three ways (merge base, main, branch), with conflict hunks
      tags: [projects]
      x-cadence:
        toolDescription: >
          Compare a session or sync branch with main per file: the merge base, main and branch versions (blob ids),
          whether each file merges cleanly and, for conflicting files, the three texts (each cut at 128 KiB) and the
          hunks that cover them, each marked same, main, branch, both or conflict. Use it to see why
          agentSessions.accept or branches.accept answered merge-conflict; resolve on the branch, then accept again.
      responses:
        "200":
          description: The comparison; ETag is the branch head
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/BranchCompare" } } }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{p}/branches/{name}:accept:
    x-cadence: { entity: branches }
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - $ref: "#/components/parameters/BranchName"
    post:
      operationId: branches.accept
      summary: Merge a sync branch into main (fast-forward when possible, otherwise a merge commit)
      tags: [projects]
      x-cadence:
        toolDescription: >
          Merge a draft branch (sync/<date>) into main: fast-forward when main has not moved, otherwise a merge
          commit. A conflict answers 409 merge-conflict with the conflicting files and leaves main unchanged.
          Session branches are merged with agentSessions.accept. Send ifMatch with the branch head from branches.get,
          so you accept exactly what you reviewed.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      responses:
        "200":
          description: The merge (or, for a dry run, whether it would fast-forward)
