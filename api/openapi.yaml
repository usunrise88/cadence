        default: { $ref: "#/components/responses/Problem" }

  /registry/models/{id}:
    x-cadence: { entity: models, kind: model }
    parameters: [{ $ref: "#/components/parameters/VersionId" }]
    get:
      operationId: models.get
      summary: Get a model version with its model card, gate, lineage and the projects that use it
      tags: [registry]
      responses:
        "200":
          description: The version
          content: { application/json: { schema: { $ref: "#/components/schemas/ModelVersion" } } }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- language packs, boost lists, lineage (phase 3 · stream L) — add paths below this line

  /projects/{p}/langpacks:
    x-cadence: { entity: langpacks, kind: language_pack }
    parameters: [{ $ref: "#/components/parameters/ProjectSlug" }]
    get:
      operationId: langpacks.list
      summary: The project's language packs (lang/<locale>/ on main) and the locales Cadence ships packs for
      tags: [projects]
      x-cadence:
        toolDescription: >
          List the language packs in the project repository (lang/<locale>/ on main): per locale the pack's commit,
          its scoring normalizer and its boost lists. shipped names the locales Cadence has starter packs for;
          projects.sync offers a shipped pack for every project locale that lacks one. Read one with langpacks.get.
      responses:
        "200":
          description: Packs by locale
          content: { application/json: { schema: { $ref: "#/components/schemas/LanguagePackList" } } }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{p}/langpacks/{locale}:
    x-cadence: { entity: langpacks, kind: language_pack }
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - $ref: "#/components/parameters/PackLocale"
    get:
      operationId: langpacks.get
      summary: One language pack with its files, scoring normalizer and boost lists; ETag is the pack's commit
      tags: [projects]
      x-cadence:
        toolDescription: >
          Read the language pack of one locale (lang/<locale>/ on main): every file with its content, the scoring
          normalizer normalizer.yaml names (R21: a registry normalizer; the training text style stays in the pack),
          the boost lists with their weights, and the pack's commit sha (the last commit that changed it), which
          langpacks.edit and boost.edit take as If-Match. issues lists files whose shape is wrong.
      responses:
        "200":
          description: The pack
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/LanguagePack" } } }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: langpacks.edit
      summary: Write or delete files of one language pack in one commit (If-Match is the pack's commit)
      tags: [projects]
      x-cadence:
        toolDescription: >
          Change files of one language pack in one commit: each entry writes a file (path relative to
          lang/<locale>/, e.g. normalizer.yaml or boost/names.txt) or deletes it (delete: true). If-Match is the
          pack's sha from langpacks.get. YAML files are checked against their shape (normalizer.yaml, itn.yaml,
          translit.yaml, lid.yaml, golden-recipe.yaml) and boost lists against the boost format before anything is
          committed; dryRun only checks. A person's edit commits to main; an agent's edit, under the project's draft
          policy language_pack: draft, lands on a branch langpack/<locale>-<date> for a person to accept
          (branches.accept). Use boost.edit to replace one boost list.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LanguagePackEdit" } } }
      responses:
        "200":
          description: The pack as committed (or, for a dry run, as it would be)
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/LanguagePack" } } }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{p}/langpacks/{locale}/boost/{domain}:
    x-cadence: { entity: boost, kind: boost_list }
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - $ref: "#/components/parameters/PackLocale"
      - { name: domain, in: path, required: true, description: "The list's domain: boost/<domain>.txt (names, products, streets, …)", schema: { $ref: "#/components/schemas/BoostDomain" } }
    patch:
      operationId: boost.edit
      summary: Replace one boost list of a language pack (terms and weight) in one commit
      tags: [projects]
      x-cadence:
        toolDescription: >
          Replace the terms and weight of one boost list (lang/<locale>/boost/<domain>.txt; created when missing) in
          one commit. Terms are whole phrases as the decoder should write them, one per entry, without duplicates;
          weight is how strongly the list is boosted at decode (defaults.yaml langpacks.boost_weight when the list
          is new and none is sent). If-Match is the pack's sha from langpacks.get. Boosting is evaluated, not
          assumed: an eval with decoding {boost: <list>} shows what it does to WER and to the listed terms. Under
          the draft policy language_pack: draft an agent's edit lands on a branch, like langpacks.edit.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BoostEdit" } } }
      responses:
        "200":
          description: The pack with the list as committed (or, for a dry run, as it would be)
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/LanguagePack" } } }
        default: { $ref: "#/components/responses/Problem" }

  /registry/{id}:lineage:
    x-cadence: { entity: registry, kind: registry_version }
    parameters:
      - { name: id, in: path, required: true, description: "Any entity id lineage knows: a registry version (ver_…), source (src_…), pipeline run (plr_…), run (run_…), checkpoint (ckp_…), mix (mix_…)", schema: { type: string, pattern: "^[a-z]{3}_[A-Za-z0-9-]{1,64}$" } }
    get:
      operationId: registry.lineage
      summary: The lineage graph around an entity — what it was built from (upstream) and what uses it (downstream)
      tags: [registry]
      x-cadence:
        toolDescription: >
          Walk the lineage graph from one entity, both ways: upstream is what it was built from (a model's
          checkpoint, run, mix and base model; a dataset version's sources and pipeline run; a golden set's dataset
          and normalizer), downstream what uses it (projects that adopted it and their aliases, golden sets over a
          dataset, mixes and runs that read it, models from a base). depth bounds the hops each way. Nodes in
          projects the caller cannot see are left out and counted in hidden.
      parameters:
        - { name: direction, in: query, description: "Which way to walk", schema: { type: string, enum: [both, upstream, downstream], default: both } }
        - { name: depth, in: query, description: Hops to follow each way, schema: { type: integer, minimum: 1, maximum: 10, default: 3 } }
        - { name: limit, in: query, description: Most nodes returned; the walk stops there and says truncated, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
      responses:
        "200":
          description: Nodes and edges; edges point from what was used to what used it
          content: { application/json: { schema: { $ref: "#/components/schemas/Lineage" } } }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- experiments and sweeps (phase 3 · stream X) — add paths below this line
  /projects/{p}/experiments:
    x-cadence: { entity: experiments }
    parameters: [{ $ref: "#/components/parameters/ProjectSlug" }]
    get:
      operationId: experiments.list
      summary: List the project's experiments, newest first (question, mix, base model, run count, best run, sweeps)
      tags: [runs]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Experiments, newest first (runs and parameters omitted; experiments.get has them)
          content: { application/json: { schema: { $ref: "#/components/schemas/ExperimentList" } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: experiments.new
      summary: Open an experiment — a question with a fixed mix revision and base model — that runs and sweeps join
      tags: [runs]
      x-cadence:
        toolDescription: >
          Group the runs that answer one question: name, question, the mix (mix_… or its name, pinned to its current
          revision unless mixRevision) and the base model (pinned to a version; default the defaults' base model).
          Every run of the experiment trains on exactly that mix revision and base model: runs.new with
          experiment=exp_… inherits them, and sweeps.run generates runs over recipe parameters. dryRun checks the mix
          and base model and answers the experiment as it would be. Follow with sweeps.run (dry run first) or
          runs.new, then experiments.get for the comparison.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExperimentNew" } } }
      responses:
        "200":
          description: Dry run — the experiment as it would be; nothing was written
          content: { application/json: { schema: { $ref: "#/components/schemas/Experiment" } } }
        "201":
          description: The experiment
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Experiment" } } }
        default: { $ref: "#/components/responses/Problem" }

  /experiments/{id}:
    x-cadence: { entity: experiments }
    parameters: [{ name: id, in: path, required: true, description: "Experiment id (exp_…)", schema: { type: string } }]
    get:
      operationId: experiments.get
      summary: Get an experiment with its runs as parameters × metrics, the best run by validation WER, and its sweeps
      tags: [runs]
      x-cadence:
        toolDescription: >
          The comparison of an experiment: one row per run with the values of the compared parameters (every swept
          parameter and every train-step parameter some run departs from defaults with; departures marked), the
          best validation WER and its checkpoint, GPU-hours, and the latest eval of that checkpoint with its gate
          verdict. best names the run with the lowest validation WER and whether its checkpoint can be registered
          now (models.register needs a passed gate: evals.new, then evals.gate). sweeps lists each sweep's state,
          points and GPU-hours spent against its cap.
      responses:
        "200":
          description: The experiment
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Experiment" } } }
        default: { $ref: "#/components/responses/Problem" }

  /experiments/{id}/sweeps:run:
    x-cadence: { entity: sweeps }
    parameters: [{ name: id, in: path, required: true, description: "Experiment id (exp_…)", schema: { type: string } }]
    post:
      operationId: sweeps.run
      summary: Run a grid or random sweep over recipe parameters as sequential runs of the experiment under a GPU-hour cap
      tags: [runs]
      x-cadence:
        toolDescription: >
          Generate the experiment's runs from a parameter set: mode grid (every combination of the listed values) or
          random (points drawn with seed from each parameter's values or its min–max range, log scale for learning
          rates). Parameters are the train step's (peak_lr, warmup_steps, augmentation, … — any parameter with an
          x-cadence range) and replayShare (the mix's replay share; the mix revision stays fixed). Each point becomes
          one run through runs.new on the experiment's mix and base model; runs are queued one after another on the
          project's training slot. Always call it with dryRun=true first: the answer lists the points with their
          estimates and the total against gpuHourCap. The whole estimate must fit the cap (sweep-over-cap) and is
          weighed against the GPU budgets like runs.new (202 with an approvalId when it exceeds them). The sweep
          stops when the GPU-hours its runs used plus the next run's estimate would pass the cap. Cancelling the
          running run (jobs.cancel on its current job) cancels the sweep. Watch experiments.get or
          entity.experiment.{id}.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SweepNew" } } }
      responses:
        "200":
          description: Dry run — the points, their estimates and the total against the cap; nothing was written or queued
          content: { application/json: { schema: { $ref: "#/components/schemas/SweepPlan" } } }
        "201":
          description: The sweep with its first run queued
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Sweep" } } }
        "202": { $ref: "#/components/responses/ApprovalAccepted" }
        default: { $ref: "#/components/responses/Problem" }


  # ---------------------------------------------------------------- media: audio serving (phase 3 · stream A) — add paths below this line
  # Tag media (R25, 06 "Media"): exempt from the verb vocabulary and never MCP tools; people only (an agent session
  # token is refused). Utterances live under /registry/utterances (R1), so R25's /utterances/{id}/audio is
  # /registry/utterances/{id}/audio here.
  /registry/utterances/{id}/audio:
    x-cadence: { entity: audio, kind: utterance_audio, singleton: true }
    parameters: [{ $ref: "#/components/parameters/UtteranceRef" }]
    get:
      operationId: audio.get
      summary: A span of an utterance's audio as 16 kHz 16-bit PCM WAV, with byte ranges; a signed link plays without a session
      tags: [media]
      description: >
        The utterance's audio, or a span of it, as a 16 kHz 16-bit PCM WAV file (the stored file itself when it is
        already one and the whole file is asked). Byte ranges (Range: bytes=…) answer 206 Partial Content. A request
        signed by audio.sign (exp, viewer, sig) needs no session and is attributed to its viewer. Every play — a request
        from byte 0 — is written to the audit log with the viewer and the span. Agent session tokens are refused.
      parameters:
        - { name: channel, in: query, description: "One channel (0-based); omitted: every channel", schema: { type: integer, minimum: 0, maximum: 15 } }
        - { name: start, in: query, description: "Span start in seconds (default 0)", schema: { type: number, format: double, minimum: 0 } }
        - { name: end, in: query, description: "Span end in seconds (default the end of the audio)", schema: { type: number, format: double, minimum: 0 } }
        - { name: exp, in: query, description: "Signed link: expiry (Unix seconds)", schema: { type: integer, format: int64 } }
        - { name: viewer, in: query, description: "Signed link: the user it was minted for", schema: { type: string, maxLength: 100 } }
        - { name: sig, in: query, description: "Signed link: the signature over utterance, span, channel, viewer and expiry", schema: { type: string, maxLength: 100 } }
        - { name: Range, in: header, description: "Byte range (RFC 9110), e.g. bytes=0-", schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: The WAV file
          headers:
            Accept-Ranges: { schema: { type: string } }
            Content-Length: { schema: { type: integer } }
          content: { audio/wav: { schema: { type: string, format: binary } } }
        "206":
          description: The requested byte range of the WAV file
          headers:
            Content-Range: { schema: { type: string } }
          content: { audio/wav: { schema: { type: string, format: binary } } }
        default: { $ref: "#/components/responses/Problem" }

  /registry/utterances/{id}/audio:sign:
    x-cadence: { entity: audio, kind: utterance_audio, singleton: true }
    parameters: [{ $ref: "#/components/parameters/UtteranceRef" }]
    post:
      operationId: audio.sign
      summary: Mint a short-lived signed link that plays a span of an utterance (bound to the span, the viewer and an expiry)
      tags: [media]
      description: >
        A link a media element can play without headers: audio.get with exp, viewer and sig. It is bound to the
        utterance, the span, the channel and the signed-in viewer, and expires after defaults media.signed_link_ttl_s.
        Minting writes an audit row (who, which span). Not a command: it changes no entity, so it takes no
        Idempotency-Key, If-Match or dryRun. Agent session tokens are refused.
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/AudioSignRequest" } } }
      responses:
        "200":
          description: The signed link
          content: { application/json: { schema: { $ref: "#/components/schemas/AudioLink" } } }
        default: { $ref: "#/components/responses/Problem" }

  /registry/utterances/{id}/peaks:
    x-cadence: { entity: peaks, kind: utterance_peaks, singleton: true }
    parameters: [{ $ref: "#/components/parameters/UtteranceRef" }]
    get:
      operationId: peaks.get
      summary: Min/max peaks per channel of an utterance (or a span) at a resolution, for the waveform track
      tags: [media]
      description: >
        int8 min/max pairs (value / 127 = sample) per hop and channel, frames × channels × [min, max], base64. The 10 ms
        peaks are computed from the audio on first use and cached in the content store as a peaks artifact (a stored
        peaks artifact of the audio is used when present); coarser hops are max-pooled from them.
      parameters:
        - { name: hopMs, in: query, description: "Resolution: milliseconds per min/max pair, a multiple of 10", schema: { type: integer, minimum: 10, maximum: 60000, default: 10 } }
        - { name: start, in: query, description: "Span start in seconds (default 0)", schema: { type: number, format: double, minimum: 0 } }
        - { name: end, in: query, description: "Span end in seconds (default the end of the audio)", schema: { type: number, format: double, minimum: 0 } }
      responses:
        "200":
          description: The peaks
          content: { application/json: { schema: { $ref: "#/components/schemas/AudioPeaks" } } }
        default: { $ref: "#/components/responses/Problem" }

  /registry/utterances/{id}/spectrogram:
    x-cadence: { entity: spectrogram, kind: utterance_spectrogram, singleton: true }
    parameters: [{ $ref: "#/components/parameters/UtteranceRef" }]
    get:
      operationId: spectrogram.get
      summary: The spectrogram tile pyramid of an utterance's audio (spectrogram_tiles@1) — its manifest, or one tile
      tags: [media]
      description: >
        For audio longer than views.audio.browser_stft_max_s the audio view reads a server tile pyramid: the newest
        spectrogram_tiles artifact computed for the utterance's audio. Without tile: the manifest (JSON). With
        tile=c<ch>/l<level>/<index>: that tile's bytes (uint8 dB, bins × 512 frames, dB = -120 + 0.5 × value). 404 when
        no pyramid was computed for this audio.
      parameters:
        - { name: tile, in: query, description: "A tile: c<channel>/l<level>/<index>", schema: { type: string, pattern: "^c[0-9]{1,2}/l[0-9]{1,2}/[0-9]{1,7}$" } }
      responses:
        "200":
          description: The manifest (no tile) or the tile's bytes
          content:
            application/json: { schema: { $ref: "#/components/schemas/SpectrogramManifest" } }
            application/octet-stream: { schema: { type: string, format: binary } }
        default: { $ref: "#/components/responses/Problem" }

  /registry/utterances/{id}/words:
    x-cadence: { entity: words, kind: utterance_words, singleton: true }
    parameters: [{ $ref: "#/components/parameters/UtteranceRef" }]
    get:
      operationId: words.get
      summary: An utterance's hypothesis words with times from a hypotheses artifact, marked S/D/I against the reference by a scores artifact
      tags: [media]
      description: >
        The audio view's word track for one utterance: its row of a hypotheses artifact (words with start, end and
        confidence; partial events of a streaming decode), and, with scores, the alignment of that utterance's row in
        the scores artifact — each hypothesis word marked =, S or I (with the reference word for S), and the reference
        words the hypothesis deleted placed between hypothesis words.
      parameters:
        - { name: hypotheses, in: query, required: true, description: "The hypotheses artifact (b3:…), e.g. an eval cell's", schema: { type: string, pattern: "^b3:[0-9a-f]{64}$" } }
        - { name: scores, in: query, description: "The scores artifact (b3:…) of the same cell", schema: { type: string, pattern: "^b3:[0-9a-f]{64}$" } }
      responses:
        "200":
          description: The words
          content: { application/json: { schema: { $ref: "#/components/schemas/UtteranceWords" } } }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- transcriptions and the live channel (phase 3 · stream T) — add paths below this line
  # Tag media (R47, R48, 06 "Media"): exempt from the verb vocabulary and never MCP tools; people only (an agent
  # session token is refused). transcriptions.new is the only operation on transcriptions: there is nothing to get or
  # list, because nothing outlives the session but the interactive job's record (who, when, targets, GPU time).
  /projects/{p}/transcriptions:
    x-cadence: { entity: transcriptions }
    parameters: [{ $ref: "#/components/parameters/ProjectSlug" }]
    post:
      operationId: transcriptions.new
      summary: Open a manual transcription test of one to three models on a file, the microphone or an utterance span; answers the live socket's URL and a single-use ticket
      tags: [media]
      description: >
        A manual test (R47): one to three targets (a checkpoint, a model version or a base model version, each with
        its latency profile, language and optional boost list) receive the same audio and stream partial and final
        words back over the live channel (stream.connect, R48). The answer carries the session (trs_…), the socket URL
        and a single-use ticket valid transcriptions.ticket_ttl_s (60 s); the socket also checks Origin. The session is
        an interactive job (R49): it reserves the family's interactive memory on a card beside training under the
        card's cap, never beside a benchmark, at the highest queue priority, and counts against the project's daily
        budgets.manual_test_gpu_hours_per_project_per_day (lease wall time). One open session per person, at most
        transcriptions.session_max_minutes long, closed after transcriptions.idle_minutes without audio or keepalive.
        Nothing else is stored: no audio, text or metric. ?dryRun=true checks the targets and the allowance and
        answers the session without opening it (no ticket). Agent session tokens are refused.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TranscriptionNew" } } }
      responses:
        "200":
          description: "?dryRun=true: the session it would open (no ticket, nothing queued)"
          content: { application/json: { schema: { $ref: "#/components/schemas/TranscriptionSession" } } }
        "201":
          description: The session, waiting for its socket
          content: { application/json: { schema: { $ref: "#/components/schemas/TranscriptionSession" } } }
        default: { $ref: "#/components/responses/Problem" }

  /transcriptions/{id}/stream:
    x-cadence: { entity: stream, kind: transcription_stream, singleton: true }
    parameters:
      - { name: id, in: path, required: true, description: "The session (trs_…)", schema: { type: string, pattern: "^trs_[0-9a-f-]{36}$" } }
    get:
      operationId: stream.connect
      summary: The live channel of a transcription session — a WebSocket opened with the session's single-use ticket from a same-origin page
      tags: [media]
      description: >
        Upgrades to a WebSocket (no WebRTC, R48). The ticket from transcriptions.new is single-use and valid 60 s; the
        Origin header must name this server (or one of CADENCE_ALLOWED_ORIGINS); the signed-in user must be the
        session's. Client → server: text frames are LiveClientMessage (start first, then fileEnd, finalize, keepalive,
        ping, end) and binary frames carry audio — PCM16 little-endian mono at the capture rate in frames of at most
        transcriptions.frame_ms (20 ms) for the microphone, or a file's bytes. Server → client: LiveServerMessage
        (waiting while the job is queued or loading, started, partial, final, stats, pong, error, summary). The socket
        closes with 1000 after summary; 4001 idle, 4002 session cap, 4003 the worker was lost, 4004 the job could not
        start, 1013 backpressure (the worker fell behind), 1001 the control plane is stopping.
      parameters:
        - { name: ticket, in: query, required: true, description: "The single-use ticket transcriptions.new answered", schema: { type: string, minLength: 16, maxLength: 128 } }
      responses:
        "101": { description: "Switching Protocols: the live channel (LiveClientMessage up, LiveServerMessage down)" }
        default: { $ref: "#/components/responses/Problem" }

  /worker-live/{jobId}:
    x-cadence: { entity: workerLive, kind: worker_live, singleton: true }
    parameters:
      - { name: jobId, in: path, required: true, description: "The interactive job the worker leased (job_…)", schema: { type: string, maxLength: 100 } }
    get:
      operationId: workerLive.connect
      summary: A worker's live job dials out to its session (WebSocket) and receives the browser's messages unchanged
      tags: [worker]
      description: >
        The pull model of R14 for the live channel: a worker running an interactive job (a family's live role kind)
        loads every target, then dials this socket with the lease's live token (header Cadence-Live-Token, from the
        lease's env CADENCE_LIVE_TOKEN) or its worker credential (Bearer cwk_…, the lease's host). The relay forwards
        the browser's frames byte for byte (it reads only "type") and the worker's LiveServerMessage frames back. One
        dial serves one session; a dial for a session that ended answers 409 lease-ended.
      parameters:
        - { name: Cadence-Live-Token, in: header, required: false, description: "The lease's live token (CADENCE_LIVE_TOKEN)", schema: { type: string, maxLength: 128 } }
      responses:
        "101": { description: "Switching Protocols: the session's messages (LiveClientMessage and audio down to the worker, LiveServerMessage up)" }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- mounts, cache, storage (phase 4 · stream M) — add paths below this line (move /mounts from planned)

  /mounts:
    x-cadence: { entity: mounts }
    get:
      operationId: mounts.list
      summary: Registered mounts with their health and last scan
      tags: [storage]
      x-cadence:
        toolDescription: >
          List the storage mounts Cadence reads audio from and writes exports to: a local path, an NFS or SMB share the
          OS mounted at a path, an S3-compatible bucket or a Hugging Face Hub repository pinned to a revision. Each
          mount has a name (utterances name their audio as mount://<name>/<path>[#t=<start>,<end>][&ch=<n>]), a
          read-only flag, its last health check (reachable, free space, a throughput sample, run by a worker) and its
          last scan (files, bytes, top-level entries, content-store blob copies found). A job never starts on an
          unhealthy mount.
      responses:
        "200":
          description: Mounts by name
          content: { application/json: { schema: { $ref: "#/components/schemas/MountList" } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: mounts.new
      summary: Register a local path, NFS/SMB path, S3-compatible bucket or Hub repository (registry approval, the admin decides)
      tags: [storage]
      x-cadence:
        toolDescription: >
          Ask for a new mount. Mounts are shared by every project, so the real call always answers 202 with an
          approvalId, for people too; the admin decides it, and the approved request registers the mount and queues
          its first health check on a worker. kind local, nfs and smb take root = the absolute path where workers and
          the control plane see the share; s3 takes root = bucket[/prefix], endpoint and credentials (the name of a
          secret holding <accessKeyId>:<secretAccessKey>); hf takes root = datasets/<org>/<name> (or <org>/<model>)
          and revision = a commit SHA. Mounts are read-only unless readOnly is false. dryRun=true validates.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MountNew" } } }
      responses:
        "200":
          description: Dry run — the mount as it would be registered; nothing changed
          content: { application/json: { schema: { $ref: "#/components/schemas/Mount" } } }
        "201":
          description: The registered mount (the approved request)
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Mount" } } }
        "202": { $ref: "#/components/responses/ApprovalAccepted" }
        default: { $ref: "#/components/responses/Problem" }

  /mounts/{id}:
    x-cadence: { entity: mounts }
    parameters:
      - { name: id, in: path, required: true, description: "Mount id (mnt_…) or name", schema: { type: string } }
    get:
      operationId: mounts.get
      summary: Get a mount with its health, last scan, utterance URIs and content-store copies
      tags: [storage]
      responses:
        "200":
          description: The mount
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Mount" } } }
        default: { $ref: "#/components/responses/Problem" }

  /mounts/{id}:scan:
    x-cadence: { entity: mounts }
    parameters:
      - { name: id, in: path, required: true, description: "Mount id (mnt_…) or name", schema: { type: string } }
    post:
      operationId: mounts.scan
      summary: Rescan a mount — files, bytes, top-level entries and content-store blob copies — and check its health (202 with the job)
      tags: [storage]
      x-cadence:
        toolDescription: >
          Walk a mount (or one path under it) and record what is there: files, bytes and the top-level entries
          (source/revision directories on a corpora mount), plus blobs laid out as a content store (cas/b3/<ab>/<hash>,
          e.g. an export or a backup mirror) — those become copies that let datasets.evict free cache space. The scan
          also queues a health check on a worker. Answers 202 with the job; the mount's inventory and health change
          when it ends (mount.{id}). Nothing on the mount is changed.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/MountScan" } } }
      responses:
        "200":
          description: Dry run — the mount as it is now; nothing queued
          content: { application/json: { schema: { $ref: "#/components/schemas/Mount" } } }
        "202": { $ref: "#/components/responses/JobAccepted" }
        default: { $ref: "#/components/responses/Problem" }

  /mounts/{id}:verify:
    x-cadence: { entity: mounts }
    parameters:
      - { name: id, in: path, required: true, description: "Mount id (mnt_…) or name", schema: { type: string } }
    post:
      operationId: mounts.verify
      summary: Check a mount's health on a worker now — reachable, free space, a throughput sample (202 with the job)
      tags: [storage]
      x-cadence:
        toolDescription: >
          Run the mount health check (step kind mount_check@1) on a worker: is the mount reachable from the worker
          host, how much space is free, and how fast a sample of its files reads. The result lands in the mount's
          health (mounts.get; event mount.health on mount.{id}). Health is also checked when a mount is registered,
          by every scan and every storage.mount_check_hours. A job that names an unhealthy mount fails at once
          (mount-unhealthy).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      responses:
        "200":
          description: Dry run — the mount as it is now; nothing queued
          content: { application/json: { schema: { $ref: "#/components/schemas/Mount" } } }
        "202": { $ref: "#/components/responses/JobAccepted" }
        default: { $ref: "#/components/responses/Problem" }

  /storage:
    x-cadence: { entity: storage, singleton: true }
    get:
      operationId: storage.get
      summary: Cache use, water marks, per-project quotas, pinned and evictable dataset versions
      tags: [storage]
      x-cadence:
        toolDescription: >
          The local cache (the content store) as Cadence accounts it: the filesystem's size and free space, the high
          and low water marks (above the high mark unpinned dataset shards that also live on a mount are evicted,
          least recently used first, down to the low mark), each project's frozen dataset bytes against its quota,
          the dataset versions pinned (a queued or running job or a promoted model needs them) and those that are
          evictable or already evicted (datasets.materialize brings them back).
      responses:
        "200":
          description: The cache now
          content: { application/json: { schema: { $ref: "#/components/schemas/StorageUse" } } }
        default: { $ref: "#/components/responses/Problem" }

  /registry/datasets:materialize:
    x-cadence: { entity: datasets }
    post:
      operationId: datasets.materialize
      summary: Copy a dataset version's evicted shards back into the local cache from their mount copies (resumable job)
      tags: [storage]
      x-cadence:
        toolDescription: >
          Bring a dataset version's shards back onto the local cache (the content store) from the mounts that hold
          copies of them, verifying each by hash. Training reads only cached shards. dryRun=true answers how many
          shards and bytes must be copied and from which mounts (and which shards have no copy anywhere). The real
          call answers 202 with a job that copies shard by shard with progress; a retry skips what is already back.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DatasetCacheRequest" } } }
      responses:
        "200":
          description: Dry run — what would be copied and from where; nothing changed
          content: { application/json: { schema: { $ref: "#/components/schemas/DatasetCachePlan" } } }
        "202": { $ref: "#/components/responses/JobAccepted" }
        default: { $ref: "#/components/responses/Problem" }

  /registry/datasets:evict:
    x-cadence: { entity: datasets }
    post:
      operationId: datasets.evict
      summary: Free a dataset version's shards from the local cache when every shard also lives on a mount (202 with the job)
      tags: [storage]
      x-cadence:
        toolDescription: >
          Remove a dataset version's shards from the local cache. Only shards with a copy on a mount go (a shard that
          exists on no mount — imported audio — is never evicted), and a pinned version (a queued or running job or a
          promoted model needs it) is refused with artifact-not-evictable. Reversible: datasets.materialize copies the
          shards back. dryRun=true answers the bytes freed and what keeps it pinned.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DatasetCacheRequest" } } }
      responses:
        "200":
          description: Dry run — what would be freed and what blocks it; nothing changed
          content: { application/json: { schema: { $ref: "#/components/schemas/DatasetCachePlan" } } }
        "202": { $ref: "#/components/responses/JobAccepted" }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- interoperability: imports, exports, noise bank (phase 4 · stream I) — add paths below this line

  /registry/datasets:export:
    x-cadence: { entity: datasets, kind: dataset_version }
    post:
      operationId: datasets.export
      summary: Export a frozen dataset version as Lhotse Shar, a NeMo manifest or a Cadence bundle (to a writable mount or the content store), or to the Hugging Face Hub (approval); 202 with the job
      tags: [registry]
      x-cadence:
        toolDescription: >
          Export a frozen dataset version (a draft is refused with dataset-not-frozen; freeze it first). Formats:
          lhotse-shar (Shar shards — cuts.NNNNNN.jsonl.gz and recording.NNNNNN.tar with the 16 kHz WAV audio — that
          Lhotse's Shar reader opens), nemo-manifest (manifest.<split>.jsonl with audio_filepath, duration, text and
          lang, the WAV files beside it), cadence-bundle (the version's registry record, its sources with their licences
          and every blob laid out as a content store, cas/b3/<ab>/<hash>, which another Cadence instance imports with
          dataset_import format cadence-bundle) and hf-hub (an audiofolder dataset with its card pushed to hubRepo; refused
          for production sources and sources without a usable licence, and always an approval the admin decides, for
          people too). target is cas (the export stays in the content store as an export artifact) or a directory on a
          writable path mount, mount://exports/<path>; the default is mount://<storage.export_mount>/<collection>/<version>/<format>
          when that mount is registered and writable, else cas. Audio an export writes unchanged onto a mount
          (nemo-manifest, cadence-bundle) is recorded as a copy of its content-store blob, so the cache may evict the
          version and datasets.materialize can bring it back. The export runs as a pipeline run in project (default: the
          project the version was ingested or imported in). dryRun=true answers the plan: step kind, target, utterances,
          bytes and whether an approval is needed. The real call answers 201 with the export (entity.export.{id}), or
          202 with an approvalId for hf-hub.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DatasetExportRequest" } } }
      responses:
        "200":
          description: Dry run — the export as it would run; nothing started
          content: { application/json: { schema: { $ref: "#/components/schemas/DatasetExportPlan" } } }
        "201":
          description: "The export, started: its pipeline run is queued (follow entity.export.{id} or pipeline_run.{pipelineRunId}); an identical earlier export reused by its input hash comes back done"
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/DatasetExport" } } }
        "202": { $ref: "#/components/responses/ApprovalAccepted" }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{p}/exports:
    x-cadence: { entity: exports, kind: export }
    parameters: [{ $ref: "#/components/parameters/ProjectSlug" }]
    get:
      operationId: exports.list
      summary: Dataset exports run in a project, newest first
      tags: [storage]
      parameters:
        - { name: version, in: query, description: "Only exports of this dataset version (ver_…)", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Exports, newest first
          content: { application/json: { schema: { $ref: "#/components/schemas/DatasetExportList" } } }
        default: { $ref: "#/components/responses/Problem" }

  /exports/{id}:
    x-cadence: { entity: exports, kind: export }
    parameters: [{ name: id, in: path, required: true, description: "Export id (dex_…)", schema: { type: string } }]
    get:
      operationId: exports.get
      summary: Get a dataset export with its state, target, files, bytes, mount copies and Hub commit
      tags: [storage]
      responses:
        "200":
          description: The export
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/DatasetExport" } } }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- ingest, draft datasets, freeze, sources, utterance search (phase 4 · stream D) — add paths below this line

  /registry/datasets:preview:
    x-cadence: { entity: datasets, kind: dataset_version }
    post:
      operationId: datasets.preview
      summary: Hours per language and split of a dataset version after filters (metadata only; nothing is written)
      tags: [registry]
      x-cadence:
        toolDescription: >
          Preview a dataset version (a draft from pipelines/data-ingest, or a frozen one) under filters before you
          freeze or mix it: utterances and hours per language and split, and how many each filter would drop
          (duration, characters per second, origin, language, split). Reads the registry only; no audio is read and
          nothing is written. A body with only version previews the version as it is.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DatasetPreviewRequest" } } }
      responses:
        "200":
          description: The preview
          content: { application/json: { schema: { $ref: "#/components/schemas/DatasetPreview" } } }
        default: { $ref: "#/components/responses/Problem" }

  /registry/datasets:freeze:
    x-cadence: { entity: datasets, kind: dataset_version }
    post:
      operationId: datasets.freeze
      summary: Freeze a draft dataset version — leakage check, then cut its segments into the content store (202 with the pipeline run)
      tags: [registry]
      x-cadence:
        toolDescription: >
          Freeze a draft dataset version (state draft, dataset.frozen false — what pipelines/data-ingest ends in).
          First the leakage check: the draft's train and validation utterances must share nothing (by canonical hash
          or fingerprint) with any golden set, else golden-set-leakage lists the overlaps and nothing starts. Then a
          CPU pipeline run in the draft's project cuts every segment from its mount into the content store
          (dataset_freeze, mode cut), verifies each hash, writes the shards, quality checks and the dataset card, and
          sets frozen: true. Only frozen versions can be mixed, trained on, exported or adopted. dryRun=true runs the
          leakage check only. Answers 202 with the jobId of the cut step (datasets.get shows dataset.freeze with the
          pipeline run); a version already frozen, or a cut reused from an earlier identical freeze, answers 200.
          A draft is frozen once: a second call answers the frozen version, or the freeze already running.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DatasetFreezeRequest" } } }
      responses:
        "200":
          description: Dry run (the leakage check passed; nothing started), or the version is already frozen
          content: { application/json: { schema: { $ref: "#/components/schemas/DatasetFreeze" } } }
        "202": { $ref: "#/components/responses/JobAccepted" }
        default: { $ref: "#/components/responses/Problem" }

  /registry/utterances:search:
    x-cadence: { entity: utterances }
    get:
      operationId: utterances.search
      summary: Search utterances by transcript text, source, language, speaker, duration, origin and split
      tags: [registry]
      x-cadence:
        toolDescription: >
          Search utterances, oldest first, a page at a time. q matches transcript text (case-insensitive substring);
          source (id or name), language (he or he-IL), speaker, origin (human, pseudo-label, model:<id>),
          minDuration/maxDuration in seconds, and dataset (ver_…) with split narrow it. Each result carries its
          transcripts and, within a dataset, its split. Pass next as after for the next page.
      parameters:
        - { name: q, in: query, description: Text the transcript contains (case-insensitive), schema: { type: string, maxLength: 200 } }
        - { name: source, in: query, description: Source id (src_…) or name, schema: { type: string } }
        - { name: language, in: query, description: "Language (he or he-IL; either matches the other)", schema: { type: string } }
        - { name: speaker, in: query, description: Speaker id within the source, schema: { type: string } }
        - { name: origin, in: query, description: "Transcript origin (human, pseudo-label, model:<id>)", schema: { type: string } }
        - { name: minDuration, in: query, description: Shortest duration in seconds, schema: { type: number, format: double, minimum: 0 } }
        - { name: maxDuration, in: query, description: Longest duration in seconds, schema: { type: number, format: double, minimum: 0 } }
        - { name: dataset, in: query, description: Dataset version id (ver_…), schema: { type: string } }
        - { name: split, in: query, description: Split within the dataset version (needs dataset), schema: { $ref: "#/components/schemas/DatasetSplitName" } }
        - { name: after, in: query, description: "Cursor: the `next` value of the previous page", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: A page of matching utterances, oldest first
          content: { application/json: { schema: { $ref: "#/components/schemas/UtteranceList" } } }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- auxiliary models, pseudo-labels, triage queue (phase 4 · stream X) — add paths below this line

  # ---------------------------------------------------------------- planned (later phases)

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-chosen key; a repeat with the same key returns the original result
      schema: { type: string, minLength: 8, maxLength: 200 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The revision the change is based on (the ETag of the last read); a mismatch answers 412 with currentRev
      schema: { type: string }
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: The revision the change is based on; required unless the target does not exist yet
      schema: { type: string }
    DryRun:
      name: dryRun
      in: query
      required: false
      description: Validate and report what would happen without changing anything
      schema: { type: boolean, default: false }
    PackLocale:
      name: locale
      in: path
      required: true
      description: "Locale of a language pack: its directory lang/<locale>/ (he-IL, sr)"
      schema: { $ref: "#/components/schemas/PackLocaleName" }
    ProjectSlug:
      name: p
      in: path
      required: true
      description: Project slug
      schema: { $ref: "#/components/schemas/Slug" }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    AgentCredentialId:
      name: id
      in: path
      required: true
      description: "claude-code or opencode.<provider>"
      schema: { $ref: "#/components/schemas/AgentCredentialIdValue" }
    SourceId:
      name: id
      in: path
      required: true
      description: Source id (src_…) or name (fleurs)
      schema: { type: string }
    MixId:
      name: id
      in: path
      required: true
      description: Mix id (mix_…)
      schema: { type: string }
    LeaseId:
      name: id
      in: path
      required: true
      description: Lease id (lse_…)
      schema: { type: string }
    UtteranceRef:
      name: id
      in: path
      required: true
      description: "Utterance id (utt_…) or the audio's content hash (b3:…)"
      schema: { type: string, maxLength: 100 }
    ArtifactHash:
      name: hash
      in: path
      required: true
      description: "Artifact hash (b3:<64 hex>, BLAKE3-256 of the content)"
      schema: { type: string, pattern: "^b3:[0-9a-f]{64}$" }
    AgentSessionId:
      name: id
      in: path
      required: true
      description: Agent session id (ses_…)
      schema: { type: string }
    DraftId:
      name: id
      in: path
      required: true
      description: Draft id (drf_…)
      schema: { type: string }
    VersionId:
      name: id
      in: path
      required: true
      description: Registry version id (ver_…)
      schema: { type: string }
    RegistryCollectionFilter:
      name: collection
      in: query
      required: false
      description: "Only versions of this collection (id reg_… or name, e.g. dataset/fleurs-he-smoke)"
      schema: { type: string }
    RegistryStateFilter:
      name: state
      in: query
      required: false
      description: Only versions in this state
      schema: { $ref: "#/components/schemas/VersionState" }
    RecipeRef:
      name: ref
      in: query
      required: false
      description: "Branch (main, session/<id>, sync/<date>) or commit sha to read at; main when absent"
      schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$" }
    BranchName:
      name: name
      in: path
      required: true
      description: "Branch name, URL-encoded (sync%2F2026-09-30, session%2F<id>)"
      schema: { $ref: "#/components/schemas/BranchName" }

  headers:
    ETag:
      description: The entity revision, quoted (e.g. "3"); send it back as If-Match
      schema: { type: string }
    SessionCookie:
      description: "cadence_session=<token>; HttpOnly; SameSite=Lax; Path=/; Secure behind TLS; 30-day sliding"
      schema: { type: string }

  requestBodies:
    PlannedBody:
      required: false
      content: { application/json: { schema: { type: object, additionalProperties: true } } }

  responses:
    Problem:
      description: Error (RFC 9457)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    JobAccepted:
      description: Accepted; follow the job on job.{jobId}
      content: { application/json: { schema: { $ref: "#/components/schemas/JobAccepted" } } }
    ApprovalAccepted:
      description: Gated; a person decides the approval on the approvals topic
      content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalAccepted" } } }
    PlannedEntity:
      description: Shape defined when the operation's phase implements it
      content: { application/json: { schema: { type: object, additionalProperties: true } } }

  schemas:
    Slug:
      type: string
      pattern: "^[a-z][a-z0-9-]{1,38}[a-z0-9]$"
      description: Lowercase letters, digits and dashes; 3–40 characters
    WorkspaceName:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9 _-]{0,62}$"

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, description: "https://cadence.local/help/errors/<slug> — the help article for this error" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        currentRev: { type: integer, description: Present on 412 — the revision to rebase on }
        errors:
          type: array
          description: Field-level problems on 422
          items: { $ref: "#/components/schemas/ProblemFieldError" }
    ProblemFieldError:
      type: object
      required: [path, message]
      properties: { path: { type: string }, message: { type: string } }

    JobAccepted:
      type: object
      required: [jobId]
      properties: { jobId: { type: string } }
    ApprovalAccepted:
      type: object
      required: [approvalId]
      properties: { approvalId: { type: string } }

    Actor:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, enum: [user, agent, automation] }
        id: { type: string }
        name: { type: string }
        sessionId: { type: string }
        channel: { type: string, enum: [telegram], description: "The channel a person acted through when it was not the web UI or the API (an approval decided from Telegram)" }

    Project:
      type: object
      required: [id, slug, name, rev, state, locales, domain, budgets, createdAt, updatedAt]
      properties:
        id: { type: string }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        description: { type: string }
        rev: { type: integer }
        state: { $ref: "#/components/schemas/ProjectState" }
        locales: { type: array, items: { $ref: "#/components/schemas/LocaleTag" } }
        domain: { type: string }
        baseModel: { $ref: "#/components/schemas/ProjectBaseModel" }
        repository: { $ref: "#/components/schemas/ProjectRepository" }
        budgets: { $ref: "#/components/schemas/ProjectBudgets" }
        bootstrapJobId: { type: string, description: The job that bootstrapped (or is bootstrapping) the repository }
        bootstrapError: { type: string, description: Why the bootstrap failed (state failed) }
        archivedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectNew:
      type: object
      description: "The wizard's choices; everything but name defaults from defaults.yaml (section wizard, budgets)"
      required: [name]
      additionalProperties: false
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        locales: { type: array, minItems: 1, maxItems: 50, items: { $ref: "#/components/schemas/LocaleTag" } }
        domain: { type: string, minLength: 1, maxLength: 60 }
        baseModel: { type: string, maxLength: 200, description: "A frozen base-model version id (ver_…) or collection name (its newest frozen version)" }
        agent: { $ref: "#/components/schemas/AgentChoice" }
        instructionsTemplate: { $ref: "#/components/schemas/InstructionsTemplateName" }
        repository: { $ref: "#/components/schemas/RepositoryChoice" }
        budgets: { $ref: "#/components/schemas/ProjectBudgetsEdit" }
    ProjectEdit:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        locales: { type: array, minItems: 1, maxItems: 50, items: { $ref: "#/components/schemas/LocaleTag" } }
        domain: { type: string, minLength: 1, maxLength: 60 }
        baseModel: { type: string, maxLength: 200, description: "A frozen base-model version id (ver_…); adopted when the project has not yet" }
        budgets: { $ref: "#/components/schemas/ProjectBudgetsEdit" }
    ProjectList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Project" } }

    Workspace:
      type: object
      required: [id, name, schemaVersion, layout, panels, rev, updatedAt]
      properties:
        id: { type: string }
        name: { $ref: "#/components/schemas/WorkspaceName" }
        schemaVersion: { type: integer, minimum: 1 }
        layout: { type: object, additionalProperties: true, description: "Dockview api.toJSON()" }
        panels:
          type: object
          additionalProperties: { $ref: "#/components/schemas/PanelState" }
        rev: { type: integer }
        updatedAt: { type: string, format: date-time }
    WorkspaceSet:
      type: object
      required: [schemaVersion, layout, panels]
      additionalProperties: false
      properties:
        schemaVersion: { type: integer, minimum: 1 }
        layout: { type: object, additionalProperties: true }
        panels:
          type: object
          additionalProperties: { $ref: "#/components/schemas/PanelState" }
    PanelState:
      type: object
      properties:
        pinnedTo: { type: string, description: "Document reference kind:id" }
        viewState: { type: object, additionalProperties: true }
    WorkspaceSummary:
      type: object
      required: [name, rev, updatedAt]
      properties:
        name: { $ref: "#/components/schemas/WorkspaceName" }
        rev: { type: integer }
        updatedAt: { type: string, format: date-time }
    WorkspaceList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WorkspaceSummary" } }

    CadenceEvent:
      type: object
      required: [seq, topic, type, actor, at]
      properties:
        seq: { type: integer, format: int64, description: Global, monotonic; the SSE id for resume }
        topic: { type: string, example: entity.project.4b1c… }
        type: { type: string, example: project.created }
        projectId: { type: string, description: Work events only; registry events carry none }
        entity:
          type: object
          required: [kind, id, rev]
          properties: { kind: { type: string }, id: { type: string }, rev: { type: integer } }
        actor: { $ref: "#/components/schemas/Actor" }
        causedBy:
          type: object
          required: [commandId]
          properties:
            commandId: { type: string }
            toolCallId: { type: string, description: The agent tool call (Cadence-Tool-Call-Id request header) }
            approvalId: { type: string, description: The approval a person granted for this command }
            draftId: { type: string, description: The draft a person accepted (drafts.accept) }
        payload: { type: object, additionalProperties: true }
        at: { type: string, format: date-time }
    EventList:
      type: object
      required: [items, lastSeq]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CadenceEvent" } }
        lastSeq: { type: integer, format: int64, description: Pass as `after` to continue }

    HelpArticle:
      type: object
      required: [id, title, section, body]
      properties:
        id: { type: string }
        title: { type: string }
        section: { type: string, enum: [errors, panels, steps, guides, shell] }
        summary: { type: string }
        body: { type: string, description: Markdown }
        contexts: { type: array, items: { type: string }, description: "Qualifiers this article answers, e.g. panel:library" }
    HelpHit:
      type: object
      required: [id, title, section]
      properties:
        id: { type: string }
        title: { type: string }
        section: { type: string }
        summary: { type: string }
    HelpSearchResult:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/HelpHit" } }

    RegistryVersion:
      type: object
      description: One immutable version of a registry collection. Versions never change once frozen; only aliases move.
      required: [kind, id, collectionId, name, version, state, tags, licence, fingerprint, actor, createdAt, updatedAt]
      properties:
        kind: { $ref: "#/components/schemas/RegistryKind" }
        id: { type: string, description: "ver_…" }
        collectionId: { type: string, description: "reg_…" }
        name: { type: string, description: "The collection's name, e.g. dataset/fleurs-he-smoke" }
        version:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}\\.[0-9a-f]{12}$"
          description: "YYYY-MM-DD.<sha>: the registration date and the first 12 hex digits of the content fingerprint"
        state: { $ref: "#/components/schemas/VersionState" }
        tags: { type: array, items: { type: string }, description: "The collection's tags (locale:he-IL, domain:telephony, …)" }
        licence: { type: string, description: The collection's licence (SPDX id where one exists) }
        fingerprint: { type: string, description: "sha256 of the version's canonical content (hex)" }
        actor: { $ref: "#/components/schemas/Actor" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: The last state change }
    RegistryKindCount:
      type: object
      required: [kind, count]
      properties: { kind: { $ref: "#/components/schemas/RegistryKind" }, count: { type: integer } }
    RegistrySearchResult:
      type: object
      required: [items, kinds]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RegistryVersion" } }
        kinds: { type: array, items: { $ref: "#/components/schemas/RegistryKindCount" } }

    # ---------------------------------------------------------------- auth and credentials schemas (stream A) — add below
    AuthStatus:
      type: object
      required: [setupRequired]
      properties:
        setupRequired: { type: boolean, description: "First start: no admin password is set yet; auth.setup sets it" }
        actor: { $ref: "#/components/schemas/Actor" }
        totpEnabled: { type: boolean, description: The signed-in user signs in with a TOTP code }
    Username:
      type: string
      pattern: "^[a-z][a-z0-9._-]{1,31}$"
      description: Lowercase letters, digits, dots, dashes and underscores; 2–32 characters
    Password:
      type: string
      minLength: 12
      maxLength: 1024
      description: At least 12 characters (Cadence recommendation, after NIST SP 800-63B)
    AuthSetup:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        username: { $ref: "#/components/schemas/Username" }
        password: { $ref: "#/components/schemas/Password" }
    AuthLogin:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 1024 }
        totpCode: { type: string, pattern: "^[0-9]{6}$", description: Required when the user has TOTP on }
    TotpEnrollment:
      type: object
      required: [secret, uri]
      properties:
        secret: { type: string, description: Base32 secret for manual entry }
        uri: { type: string, description: "otpauth://totp/… URI for a QR code" }
    TotpCode:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }

    CredentialKind:
      type: string
      enum: [session, api_key, agent, agent_host, egress_proxy, invitation, worker]
    CredentialScope:
      type: object
      properties:
        all: { type: boolean, description: Every project and the registry (the admin's own sessions) }
        projectId: { type: string, description: The one project this credential reaches }
        project: { $ref: "#/components/schemas/Slug" }
        registryRead: { type: boolean, description: May read the registry }
        preset: { type: string, description: Permission preset (agent session tokens) }
        agentSessions: { type: boolean, description: "May start, message, stop and merge agent sessions in its project (API keys, opt-in)" }
    Credential:
      type: object
      required: [id, kind, name, scope, rev, createdAt]
      properties:
        id: { type: string, description: "crd_<uuidv7>" }
        kind: { $ref: "#/components/schemas/CredentialKind" }
        name: { type: string }
        scope: { $ref: "#/components/schemas/CredentialScope" }
        userId: { type: string, description: The user who owns or created it }
        subject: { type: string, description: "What it stands for: the agent session, invitation batch or worker" }
        current: { type: boolean, description: The credential of this request }
        rev: { type: integer }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, description: Updated at most once a minute }
        revokedAt: { type: string, format: date-time }
    CredentialNew:
      type: object
      required: [name, scope]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        scope:
          type: object
          additionalProperties: false
          description: One project, registry read, or both; agentSessions needs the project
          properties:
            project: { $ref: "#/components/schemas/Slug" }
            registryRead: { type: boolean }
            agentSessions:
              type: boolean
              description: >
                May start, message, stop and merge agent sessions in its project (automation such as the agent evals);
                every other rule of the default preset still applies. Off unless asked for.
        expiresAt: { type: string, format: date-time, description: Never expires when absent }
    CredentialCreated:
      type: object
      required: [credential]
      properties:
        credential: { $ref: "#/components/schemas/Credential" }
        token: { type: string, description: "The secret (cdk_…); only in the first 201 — store it now" }
    CredentialList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Credential" } }


    # ---------------------------------------------------------------- registry, compute, secrets, defaults, policies schemas (stream B) — add below
    #
    #
    #
    RegistryKind:
      type: string
      enum: [base_model, dataset_version, template, runtime, model_family, step_kind, noise_bank, golden_set, normalizer, model]
      description: "The kinds registered so far; runtime, model_family and step_kind are published by workers (R40, R41, R45); noise_bank holds background noise for augmentation, registered by dataset_import with purpose noise or mined from call silences by noise_mine; golden_set (goldenSets.freeze), normalizer (scoring normalizers, R21) and model (models.register, R22) arrive in phase 3"
    VersionState:
      type: string
      enum: [draft, frozen, deprecated]
      description: "draft → frozen → deprecated; a frozen version never changes"
    UsedBy:
      type: object
      description: A project that adopted the version, and its aliases pointing at it
      required: [projectId, projectSlug, adoptedAt, aliases]
      properties:
        projectId: { type: string }
        projectSlug: { $ref: "#/components/schemas/Slug" }
        adoptedAt: { type: string, format: date-time }
        aliases: { type: array, items: { $ref: "#/components/schemas/AliasName" } }
    VersionSummary:
      type: object
      required: [id, version, state, createdAt]
      properties:
        id: { type: string }
        version: { type: string }
        state: { $ref: "#/components/schemas/VersionState" }
        createdAt: { type: string, format: date-time }
    Collection:
      type: object
      description: A named series of immutable versions of one kind
      required: [id, kind, name, description, tags, licence, versionCount, createdAt]
      properties:
        id: { type: string, description: "reg_…" }
        kind: { $ref: "#/components/schemas/RegistryKind" }
        name: { type: string, description: "<kind>/<name>, e.g. dataset/fleurs-he-smoke" }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        licence: { type: string }
        versionCount: { type: integer }
        latest: { $ref: "#/components/schemas/VersionSummary" }
        versions: { type: array, items: { $ref: "#/components/schemas/VersionSummary" }, description: "Newest first; collections.get only" }
        createdAt: { type: string, format: date-time }
    CollectionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Collection" } }

    BaseModelPayload:
      type: object
      description: An upstream checkpoint pinned to one Hugging Face revision
      required: [hfRepo, revision, licence, familyId, locales]
      properties:
        hfRepo: { type: string, example: nvidia/nemotron-3.5-asr-streaming-0.6b }
        revision: { type: string, description: The pinned Hugging Face commit sha }
        licence: { type: string }
        licenceUrl: { type: string }
        familyId: { type: string, description: "Model family descriptor id (R41); the descriptor itself arrives with the worker in phase 2" }
        checkpointFile: { type: string, description: "The file a run initialises from, e.g. the .nemo archive" }
        parameters: { type: string, description: "Model size as the model card states it, e.g. 0.6B" }
        sampleRateHz: { type: integer }
        locales: { type: array, items: { type: string }, description: Locales the model card lists }
    BaseModelVersion:
      allOf:
        - $ref: "#/components/schemas/RegistryVersion"
        - type: object
          required: [baseModel, usedBy]
          properties:
            baseModel: { $ref: "#/components/schemas/BaseModelPayload" }
            usedBy: { type: array, items: { $ref: "#/components/schemas/UsedBy" } }
    BaseModelVersionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BaseModelVersion" } }

    DatasetSplit:
      type: object
      required: [name, utterances, hours]
      properties:
        name: { type: string, example: train }
        utterances: { type: integer }
        hours: { type: number, format: double }
        speakers: { type: integer }
    DatasetPayload:
      type: object
      description: A fingerprinted selection of utterances with splits, statistics and lineage
      required: [source, locales, splits, hours, utterances, bytes, fixture]
      properties:
        source: { type: string, description: "Where the audio comes from, e.g. hf://datasets/google/fleurs" }
        sourceRevision: { type: string, description: The pinned revision of the source }
        subset: { type: string, description: "The source's configuration or subset, e.g. he_il" }
        locales: { type: array, items: { type: string } }
        domain: { type: string }
        sampleRateHz: { type: integer }
        splits: { type: array, items: { $ref: "#/components/schemas/DatasetSplit" } }
        hours: { type: number, format: double }
        utterances: { type: integer }
        bytes: { type: integer, format: int64, description: Size of the frozen shards; estimated for fixtures }
        fixture: { type: boolean, description: "Metadata only: no audio is stored (phase-1 fixture so mixes have something to reference)" }
        sourceIds: { type: array, items: { type: string }, description: "Sources (src_…) of the utterances; an imported version is eval-only while any of them is not cleared for training (phase 2)" }
        licence: { type: string, description: "The sources' licences, joined with ' AND ' when there are several" }
        languages: { type: array, items: { $ref: "#/components/schemas/DatasetLanguage" }, description: Utterances and hours per language }
        artifact: { $ref: "#/components/schemas/ArtifactRef" }
        evalOnly: { type: boolean, description: "Registered for evaluation only (golden and replay test sets): never mixed or trained on, whatever its sources" }
        splitRule: { type: string, description: "How utterances were assigned to splits (speaker-disjoint, source, all-train, all-validation, all-test)" }
        speakers: { type: integer }
        tags: { type: array, items: { type: string }, description: "Tags given at import (golden, replay, eval-only, …)" }
        lineage: { $ref: "#/components/schemas/DatasetLineage" }
        frozen: { type: boolean, description: "false for a draft (pipelines/data-ingest: segments indexed in place on a mount, no audio copied); datasets.freeze cuts it into the content store and sets true. Absent on phase-2 imports, which are frozen at import" }
        quality: { $ref: "#/components/schemas/DatasetQuality" }
        card: { $ref: "#/components/schemas/DatasetCard" }
        stats: { $ref: "#/components/schemas/DatasetStats" }
        shards: { type: array, items: { $ref: "#/components/schemas/DatasetShard" }, description: "The frozen audio in shards of the content store (empty for a draft)" }
        segments: { $ref: "#/components/schemas/ArtifactRef" }
        recipe: { $ref: "#/components/schemas/DatasetRecipe" }
        contentFingerprint: { type: string, description: "sha256 of the sorted [audio hash, split, text] tuples; with the recipe commit it makes the version's fingerprint" }
        freeze: { $ref: "#/components/schemas/DatasetFreezeState" }
    DatasetVersion:
      allOf:
        - $ref: "#/components/schemas/RegistryVersion"
        - type: object
          required: [dataset, usedBy]
          properties:
            dataset: { $ref: "#/components/schemas/DatasetPayload" }
            usedBy: { type: array, items: { $ref: "#/components/schemas/UsedBy" } }
    DatasetVersionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DatasetVersion" } }

    TemplateKind:
      type: string
      enum: [instructions, preset, skill, pipeline, agent-config, playbook, langpack]
    TemplateFile:
      type: object
      required: [path, sha256, bytes]
      properties:
        path: { type: string, description: Path inside the bundled templates tree }
        sha256: { type: string }
        bytes: { type: integer }
    TemplatePayload:
      type: object
      description: Bundled configuration the bootstrap copies into a project; the contents ship in the binary
      required: [templateKind, path, files]
      properties:
        templateKind: { $ref: "#/components/schemas/TemplateKind" }
        path: { type: string, description: "Directory or file in the templates tree, e.g. instructions/default" }
        files: { type: array, items: { $ref: "#/components/schemas/TemplateFile" } }
    TemplateVersion:
      allOf:
        - $ref: "#/components/schemas/RegistryVersion"
        - type: object
          required: [template, usedBy]
          properties:
            template: { $ref: "#/components/schemas/TemplatePayload" }
            usedBy: { type: array, items: { $ref: "#/components/schemas/UsedBy" } }
    TemplateVersionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TemplateVersion" } }

    AdoptionNew:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: string, description: "The registry version to adopt (ver_…)" }
    Adoption:
      type: object
      required: [projectId, version, actor, adoptedAt, aliases]
      properties:
        projectId: { type: string }
        version: { $ref: "#/components/schemas/RegistryVersion" }
        actor: { $ref: "#/components/schemas/Actor" }
        adoptedAt: { type: string, format: date-time }
        aliases: { type: array, items: { $ref: "#/components/schemas/AliasName" } }
    AdoptionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Adoption" } }

    AliasName:
      type: string
      pattern: "^[a-z][a-z0-9-]{1,38}[a-z0-9]$"
      description: "Lowercase letters, digits and dashes, shown with a leading @; baseline and production are reserved (R8)"
    AliasSet:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: string, description: "A registry version the project adopted (ver_…)" }
    Alias:
      type: object
      required: [id, name, projectId, version, reserved, rev, actor, updatedAt]
      properties:
        id: { type: string, description: "als_…" }
        name: { $ref: "#/components/schemas/AliasName" }
        projectId: { type: string }
        version: { $ref: "#/components/schemas/RegistryVersion" }
        reserved:
          type: string
          enum: [free, gated, promotion]
          description: "free: aliases.set moves it; gated: aliases.set needs an approval (baseline); promotion: only deployments.promote moves it (production)"
        rev: { type: integer }
        actor: { $ref: "#/components/schemas/Actor" }
        updatedAt: { type: string, format: date-time }
    AliasList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Alias" } }

    JobKind:
      type: string
      enum: [training, eval, shadow, export, data, interactive]
    ComputeCard:
      type: object
      required: [index, name, cardClass, memoryGb, memoryCapGb, allowedJobKinds]
      properties:
        index: { type: integer, minimum: 0, description: The card's index on its host (CUDA device order) }
        name: { type: string }
        cardClass: { type: string, description: Key into the estimate table in defaults.yaml }
        memoryGb: { type: number, format: double }
        memoryCapGb: { type: number, format: double, description: "The memory a Cadence job may use on this card (CADENCE_GPU_MEMORY_CAP_GB)" }
        allowedJobKinds: { type: array, items: { $ref: "#/components/schemas/JobKind" } }
        windows: { $ref: "#/components/schemas/AvailabilityWindows" }
        telemetry: { $ref: "#/components/schemas/CardTelemetryReport" }
    ComputeHealth:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [unknown, healthy, degraded, unreachable], description: "unknown until a worker reports (phase 2)" }
        checkedAt: { type: string, format: date-time }
        detail: { type: string }
    ComputeHost:
      type: object
      required: [id, name, description, cards, health, rev, createdAt, updatedAt]
      properties:
        id: { type: string, description: "cmp_…" }
        name: { type: string }
        description: { type: string }
        cards: { type: array, items: { $ref: "#/components/schemas/ComputeCard" } }
        health: { $ref: "#/components/schemas/ComputeHealth" }
        rev: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ComputeList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ComputeHost" } }
    ComputeCardEdit:
      type: object
      required: [index]
      additionalProperties: false
      properties:
        index: { type: integer, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 200 }
        cardClass: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$", description: "Key into the estimate table in defaults.yaml (a corrected card: blackwell-48gb)" }
        memoryGb: { type: number, format: double, exclusiveMinimum: 0, description: "The card's memory; the cap must stay at or below it" }
        memoryCapGb: { type: number, format: double, exclusiveMinimum: 0 }
        allowedJobKinds: { type: array, uniqueItems: true, items: { $ref: "#/components/schemas/JobKind" } }
        windows: { $ref: "#/components/schemas/AvailabilityWindows" }
    ComputeEdit:
      type: object
      additionalProperties: false
      properties:
        description: { type: string, maxLength: 2000 }
        cards: { type: array, minItems: 1, items: { $ref: "#/components/schemas/ComputeCardEdit" } }

    SecretKind:
      type: string
      enum: [huggingface, ngc, github, s3, judge-api, telegram, other]
    SecretName:
      type: string
      pattern: "^[a-z][a-z0-9_-]{1,62}$"
    SecretScope:
      type: string
      pattern: "^(instance|project:[a-z][a-z0-9-]{1,38}[a-z0-9])$"
      description: "instance, or project:<slug> when only that project's jobs and bootstrap may read it"
    Secret:
      type: object
      description: A named credential; its value is never returned
      required: [id, name, kind, scope, rev, actor, createdAt]
      properties:
        id: { type: string, description: "sec_…" }
        name: { $ref: "#/components/schemas/SecretName" }
        kind: { $ref: "#/components/schemas/SecretKind" }
        scope: { $ref: "#/components/schemas/SecretScope" }
        rev: { type: integer }
        actor: { $ref: "#/components/schemas/Actor" }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, description: The last time a server-side consumer read the value }
    SecretNew:
      type: object
      required: [name, kind, value]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/SecretName" }
        kind: { $ref: "#/components/schemas/SecretKind" }
        scope: { $ref: "#/components/schemas/SecretScope" }
        value: { type: string, writeOnly: true, minLength: 1, maxLength: 16384, description: Write-only; stored encrypted outside the database }
    SecretList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Secret" } }

    DefaultRange:
      type: object
      properties:
        min: { type: number, format: double }
        max: { type: number, format: double }
        values: { type: array, items: { type: string } }
    DefaultValue:
      type: object
      description: One default with its description, source and safe range
      required: [value, description, source]
      properties:
        value: { description: "The default: a number, string, boolean or list" }
        unit: { type: string }
        description: { type: string }
        source: { type: string, description: "The published source, or \"Cadence recommendation\"" }
        range: { $ref: "#/components/schemas/DefaultRange" }
    DefaultSection:
      type: object
      additionalProperties: { $ref: "#/components/schemas/DefaultValue" }
    TrainingEstimateRow:
      type: object
      description: "Seconds per training step for one base model × card class × memory cap × precision (R12 table path)"
      required: [base_model, card_class, memory_cap_gb, precision, seconds_per_step, plus_minus, description, source]
      properties:
        base_model: { type: string, description: Registry collection name of the base model }
        card_class: { type: string }
        memory_cap_gb: { type: number, format: double }
        precision: { type: string }
        seconds_per_step: { type: number, format: double }
        plus_minus: { type: number, format: double, description: "Relative uncertainty: 0.5 means ±50%" }
        description: { type: string }
        source: { type: string }
    DefaultCard:
      type: object
      required: [index, name, card_class, memory_gb, memory_cap_gb, allowed_job_kinds]
      properties:
        index: { type: integer }
        name: { type: string }
        card_class: { type: string }
        memory_gb: { type: number, format: double }
        memory_cap_gb: { type: number, format: double }
        allowed_job_kinds: { type: array, items: { $ref: "#/components/schemas/JobKind" } }
    DefaultHost:
      type: object
      description: A compute host seeded at first start
      required: [name, description, cards, source]
      properties:
        name: { type: string }
        description: { type: string }
        cards: { type: array, items: { $ref: "#/components/schemas/DefaultCard" } }
        source: { type: string }
    Defaults:
      type: object
      description: "defaults.yaml (R11): keys are snake_case, addressed as <section>.<key> (x-cadence.defaultRef)"
      required: [version, wizard, budgets, timeouts, training, estimates, mix, drafts, cache, compute]
      properties:
        version: { type: integer }
        wizard: { $ref: "#/components/schemas/DefaultSection" }
        budgets: { $ref: "#/components/schemas/DefaultSection" }
        timeouts: { $ref: "#/components/schemas/DefaultSection" }
        training: { $ref: "#/components/schemas/DefaultSection" }
        mix: { $ref: "#/components/schemas/DefaultSection" }
        drafts: { $ref: "#/components/schemas/DefaultSection" }
        cache: { $ref: "#/components/schemas/DefaultSection" }
        storage: { $ref: "#/components/schemas/DefaultSection", description: "Mounts and the local cache (phase 4): water marks, project quota, sweep and health-check cadence, scan limit" }
        data: { $ref: "#/components/schemas/DefaultSection" }
        operations: { $ref: "#/components/schemas/DefaultSection" }
        notifications: { $ref: "#/components/schemas/DefaultSection" }
        backups: { $ref: "#/components/schemas/DefaultSection" }
        augment: { $ref: "#/components/schemas/DefaultSection", description: "The recommended augmentation profile (docs/spec/03 \"Augmentation\"): what the Recipe form's Reset to recommended writes" }
        eval: { $ref: "#/components/schemas/DefaultSection", description: "Evaluation (phase 3): matrix profiles, primary cell, scoring normalizer, duration buckets, bootstrap" }
        gate: { $ref: "#/components/schemas/DefaultSection", description: "The default gate a project's gates.yaml departs from (phase 3)" }
        langpacks: { $ref: "#/components/schemas/DefaultSection", description: "Language packs (phase 3): the boost weight a new list starts with and the size cap of a list" }
        media: { $ref: "#/components/schemas/DefaultSection", description: "Audio serving (phase 3): the signed link lifetime and the longest span served" }
        views:
          type: object
          description: "Client view defaults, one section per view (views.audio: the audio view's budgets and spectrogram, R52)"
          additionalProperties: { $ref: "#/components/schemas/DefaultSection" }
        sweeps: { $ref: "#/components/schemas/DefaultSection", description: "Sweeps (phase 3): mode, run counts, the GPU-hour cap and the seed of a random draw" }
        transcriptions: { $ref: "#/components/schemas/DefaultSection", description: "Manual transcription tests and the live channel (phase 3): ticket, session and idle limits, frame size, file caps, the relay's queue and the interactive job's priority" }
        estimates:
          type: object
          required: [bytes_per_audio_hour, training]
          properties:
            bytes_per_audio_hour: { $ref: "#/components/schemas/DefaultValue" }
            measured_plus_minus: { $ref: "#/components/schemas/DefaultValue" }
            lease_overhead_seconds: { $ref: "#/components/schemas/DefaultValue" }
            training: { type: array, items: { $ref: "#/components/schemas/TrainingEstimateRow" } }
        compute:
          type: object
          required: [hosts]
          properties:
            hosts: { type: array, items: { $ref: "#/components/schemas/DefaultHost" } }
        packs:
          type: object
          description: "One section per framework pack (R45), addressed as packs.<pack>.<key> by the step kinds' x-cadence defaultRef"
          additionalProperties: { $ref: "#/components/schemas/DefaultSection" }

    PolicyBudgets:
      type: object
      required: [gpuHoursPerProjectPerDay, agentTurnsPerSession]
      properties:
        gpuHoursPerProjectPerDay: { type: number, format: double, description: "Default budgets.gpu_hours_per_project_per_day" }
        agentTurnsPerSession: { type: integer, description: "Default budgets.agent_turns_per_session" }
    Policies:
      type: object
      required: [rev, updatedAt, budgets, timezone, departures]
      properties:
        rev: { type: integer }
        updatedAt: { type: string, format: date-time }
        budgets: { $ref: "#/components/schemas/PolicyBudgets" }
        timezone: { type: string, description: "The instance timezone (IANA, e.g. Europe/Berlin): quiet hours, the daily digest and the backup schedule follow it" }
        departures:
          type: array
          items: { type: string }
          description: "Fields that differ from defaults.yaml, e.g. budgets.gpuHoursPerProjectPerDay"
    PoliciesEdit:
      type: object
      additionalProperties: false
      properties:
        budgets:
          type: object
          additionalProperties: false
          properties:
            gpuHoursPerProjectPerDay: { type: number, format: double }
            agentTurnsPerSession: { type: integer }
        timezone: { type: string, minLength: 1, maxLength: 64, description: "IANA timezone name, e.g. Europe/Berlin or UTC" }

    RunInit:
      type: string
      enum: [base, checkpoint]
      description: "Where the weights start (R44); scratch is deferred"
    Precision:
      type: string
      enum: [bf16, fp16, fp32]
    RunNew:
      type: object
      additionalProperties: false
      properties:
        init: { $ref: "#/components/schemas/RunInit" }
        baseModel:
          type: string
          description: "Base model version (ver_…), collection name (its newest frozen version) or @alias; default the defaults' base model"
        checkpoint: { type: string, description: "The checkpoint to start from (ckp_…); required when init is checkpoint. The run's base model is then the checkpoint's" }
        steps: { type: integer, minimum: 1, description: "Step budget of the stage (default training.steps); the train step's steps parameter" }
        precision: { $ref: "#/components/schemas/Precision" }
        gpus: { type: integer, minimum: 1, description: "Cards for the run; v1 accepts 1 (training.gpus)" }
        compute: { type: string, description: "Host id or name; default the first host whose card allows training" }
        datasets:
          type: array
          maxItems: 100
          items: { type: string }
          description: "Dry runs without a mix only: dataset versions (ver_… or @alias) for the data volume"
        mix: { type: string, maxLength: 200, description: "The mix to train on (mix_… or its name); required unless dryRun with datasets" }
        mixRevision: { type: integer, minimum: 1, description: "The mix revision (default its current one)" }
        seed: { type: integer, minimum: 0, maximum: 2147483647, description: "The train step's seed parameter, when its kind has one (default: the kind's default)" }
        pipeline: { type: string, maxLength: 63, description: "The recipe: a pipeline of the project repository (default training.pipeline, train-stage)" }
        ref: { type: string, maxLength: 200, description: "Branch, tag or commit to read the pipeline at (default main)" }
        params:
          type: object
          description: "Overrides of the train step's parameters (recorded as departures when they differ from the default)"
        priority: { type: integer, minimum: -100, maximum: 100, default: 0, description: "Queue priority of the run's step jobs (higher first)" }
        experiment: { type: string, maxLength: 200, description: "The experiment the run belongs to (exp_…): the run trains on its mix revision and base model (phase 3)" }
    EstimateRange:
      type: object
      required: [value, low, high]
      properties:
        value: { type: number, format: double }
        low: { type: number, format: double }
        high: { type: number, format: double }
    RunEstimate:
      type: object
      description: "What a run would cost (R12). basis table: from the estimate table in defaults.yaml; measured: from runs.calibrate (phase 2)"
      required: [basis, plusMinus, gpuHours, durationSeconds, secondsPerStep, steps, gpus, precision, init, baseModel, card, data, budget, source]
      properties:
        basis: { type: string, enum: [measured, table] }
        plusMinus: { type: number, format: double, description: "Relative uncertainty: 0.5 means ±50%" }
        gpuHours: { $ref: "#/components/schemas/EstimateRange" }
        durationSeconds: { $ref: "#/components/schemas/EstimateRange" }
        secondsPerStep: { type: number, format: double }
        leaseOverheadSeconds: { type: number, format: double, description: "Fixed seconds a lease adds before and after its steps (model load, state and checkpoint saves): the calibration's measurement, else estimates.lease_overhead_seconds; durationSeconds = leaseOverheadSeconds + steps × secondsPerStep, the ± applying to the steps" }
        steps: { type: integer }
        gpus: { type: integer }
        precision: { $ref: "#/components/schemas/Precision" }
        init: { $ref: "#/components/schemas/RunInit" }
        baseModel: { $ref: "#/components/schemas/RegistryVersion" }
        card:
          type: object
          required: [computeId, host, index, cardClass, memoryCapGb]
          properties:
            computeId: { type: string }
            host: { type: string }
            index: { type: integer }
            cardClass: { type: string }
            memoryCapGb: { type: number, format: double }
        data:
          type: object
          required: [datasets, hours, bytes]
          properties:
            datasets: { type: array, items: { type: string }, description: Resolved dataset version ids }
            hours: { type: number, format: double }
            bytes: { type: integer, format: int64, description: What must be materialised on the worker's disk }
        budget:
          type: object
          required: [gpuHoursPerProjectPerDay, withinDailyBudget]
          properties:
            gpuHoursPerProjectPerDay: { type: number, format: double, description: "The project's daily GPU-hour budget" }
            usedTodayGpuHours: { type: number, format: double, description: "GPU-hours the project's leases on GPU cards used today (policies timezone)" }
            remainingGpuHours: { type: number, format: double, description: "Budget minus today's use (negative when overspent)" }
            withinDailyBudget: { type: boolean, description: "Today's use plus the estimate fits the project's daily budget (over it, an agent's run waits for an approval)" }
            sessionGpuHours: { type: number, format: double, description: "An agent session's GPU-hour budget (budgets.agent_gpu_hours_per_session), for a session's request" }
            sessionUsedGpuHours: { type: number, format: double, description: "GPU-hours the session's leases used so far" }
        source: { type: string, description: "The source of the estimate-table row, or the calibration it was measured by" }
        measuredAt: { type: string, format: date-time, description: "basis measured: when the calibration ran" }
        mix:
          type: object
          required: [id, name, revision, hash]
          description: "The mix revision the run trains on, rendered as a mix artifact (its hash is the content hash of the resolved input_cfg)"
          properties:
            id: { type: string }
            name: { type: string }
            revision: { type: integer }
            hash: { type: string }

    # ---------------------------------------------------------------- approvals, audit, jobs schemas (stream C) — add below
    #
    #
    #
    Approval:
      type: object
      required: [id, state, scope, operation, actor, rule, reason, request, rev, createdAt, expiresAt]
      properties:
        id: { type: string, description: "apr_<uuidv7>" }
        state: { type: string, enum: [pending, approved, denied] }
        scope: { type: string, enum: [project, registry], description: Registry approvals are decided by the admin only }
        operation: { type: string, description: "The gated operation, e.g. projects.archive" }
        projectId: { type: string }
        actor: { $ref: "#/components/schemas/Actor" }
        rule: { type: string, description: The policy rule that asked for approval }
        reason: { type: string }
        estimate: { $ref: "#/components/schemas/PolicyEstimate" }
        request: { $ref: "#/components/schemas/ApprovalRequest" }
        rev: { type: integer }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: Pending approvals are denied when this passes (24 h) }
        decidedAt: { type: string, format: date-time }
        decidedBy: { $ref: "#/components/schemas/Actor" }
        decision: { $ref: "#/components/schemas/ApprovalDecision" }
        result: { $ref: "#/components/schemas/ApprovalResult" }
        kind:
          type: string
          enum: [command, agent_permission]
          description: "command: a gated command, replayed when approved; agent_permission: an ACP permission request of an agent session, answered to the agent (no replay)"
        permission: { $ref: "#/components/schemas/ApprovalPermission" }
    ApprovalPermission:
      type: object
      required: [sessionId, toolCallId, title, class, options]
      description: What the agent asked to do (agent_permission approvals)
      properties:
        sessionId: { type: string }
        toolCallId: { type: string }
        title: { type: string }
        class: { type: string, description: "mcp, edit, shell, fetch, …" }
        command: { type: string, description: The shell command }
        paths: { type: array, items: { type: string } }
        options: { type: array, items: { type: string, enum: [allow_once, allow_always, reject_once, reject_always] } }
    ApprovalDecision:
      type: object
      required: [grant]
      properties:
        grant:
          type: string
          enum: [once, session]
          description: session also allows the same operation on the same path for the rest of the agent session
        note: { type: string }
        expired: { type: boolean, description: Denied because nobody decided within 24 h }
    ApprovalRequest:
      type: object
      required: [method, path, headers]
      description: The stored request, without credentials or cookies
      properties:
        method: { type: string }
        path: { type: string }
        query: { type: string }
        headers: { type: object, additionalProperties: { type: string } }
        body: { description: The JSON body, when there was one }
    ApprovalResult:
      type: object
      required: [status, commandId]
      description: What the replayed request answered
      properties:
        status: { type: integer }
        commandId: { type: string }
        body: { description: The JSON body of the replay's response }
    PolicyEstimate:
      type: object
      properties:
        gpuHours: { type: number, format: double, minimum: 0 }
        remainingGpuHours: { type: number, format: double }
    ApprovalApprove:
      type: object
      additionalProperties: false
      properties:
        grant: { type: string, enum: [once, session], default: once }
        note: { type: string, maxLength: 2000 }
    ApprovalDeny:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 2000 }
    ApprovalList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Approval" } }

    AuditEntry:
      type: object
      required: [id, operation, actor, outcome, status, at]
      properties:
        id: { type: string, description: "aud_<uuidv7>" }
        commandId: { type: string }
        operation: { type: string }
        actor: { $ref: "#/components/schemas/Actor" }
        preset: { type: string, description: The permission preset the policy engine applied }
        projectId: { type: string }
        outcome:
          type: string
          description: "ok, approval (stored as an approval), denied (policy), expired (approval nobody decided), or the problem slug of a failed attempt"
        status: { type: integer, description: HTTP status answered }
        rule: { type: string, description: The policy rule that decided }
        causedBy: { $ref: "#/components/schemas/AuditCause" }
        detail: { type: object, additionalProperties: true, description: "What a job did for the command (artifacts.evict: artifacts, bytesFreed, blobs)" }
        at: { type: string, format: date-time }
    AuditCause:
      type: object
      properties:
        commandId: { type: string }
        toolCallId: { type: string }
        approvalId: { type: string }
    AuditList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        next: { type: string, description: Pass as `before` for the next (older) page; absent on the last page }

    JobState:
      type: string
      enum: [queued, running, done, failed, cancelled]
    Job:
      type: object
      required: [id, kind, state, progress, attempt, rev, actor, createdAt, updatedAt]
      properties:
        id: { type: string, description: "job_<uuidv7>" }
        kind: { type: string }
        projectId: { type: string }
        state: { $ref: "#/components/schemas/JobState" }
        progress: { type: number, format: double, minimum: 0, maximum: 1 }
        message: { type: string, description: The last progress message }
        result: { description: What the job produced (kind-specific JSON), once done }
        error: { type: string, description: Why it failed, once failed }
        attempt: { type: integer }
        rev: { type: integer, description: "Changes with state, priority, pause and cancel; progress reports leave it (job.progress carries them)" }
        actor: { $ref: "#/components/schemas/Actor" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        cancelRequestedAt: { type: string, format: date-time }
        priority: { type: integer, description: "Step jobs: start order in the queue, higher first (jobs.edit); 0 for other jobs" }
        pausedAt: { type: string, format: date-time, description: "Step jobs: paused (jobs.pause) and held in the queue until jobs.resume" }
    JobList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Job" } }

    # ---------------------------------------------------------------- search and saved views schemas (wave 2 · search) — add below
    SearchQualifier:
      type: object
      required: [field, op, value, raw]
      description: One parsed qualifier, rendered by the UI as a chip
      properties:
        field: { type: string, description: "kind, status, lang, actor, updated, project, scope, tag, alias, or a numeric field (wer, cer, dur, hours, progress, rev)" }
        op: { type: string, enum: [":", "<", "<=", ">", ">=", "=", ".."] }
        value: { type: string }
        raw: { type: string, description: The qualifier as typed }
    SearchHit:
      type: object
      required: [kind, id, title, ref, scope, tags, updatedAt]
      properties:
        kind: { type: string, description: "EntityKind of the hit (project, base_model, dataset_version, template, registry_collection, job, approval, mix, help_article, …)" }
        id: { type: string }
        title: { type: string }
        snippet: { type: string, description: A short excerpt of the text the hit carries }
        ref: { type: string, description: "The document reference the UI opens: <kind>:<id> (project:<slug>, help_article:<id>, …)" }
        scope: { type: string, enum: [project, registry, instance, help], description: Where the entity lives }
        projectId: { type: string }
        project: { type: string, description: The project's slug, for project work }
        status: { type: string }
        lang: { type: string }
        tags: { type: array, items: { type: string } }
        actor: { $ref: "#/components/schemas/Actor" }
        numbers: { type: object, additionalProperties: { type: number, format: double }, description: "Numeric fields the comparisons read (wer, progress, …)" }
        updatedAt: { type: string, format: date-time }
    SearchGroup:
      type: object
      required: [kind, items]
      properties:
        kind: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/SearchHit" } }
    SearchResult:
      type: object
      required: [q, text, qualifiers, groups, total, truncated]
      properties:
        q: { type: string, description: The query as sent }
        text: { type: string, description: The free text left after the qualifiers }
        qualifiers: { type: array, items: { $ref: "#/components/schemas/SearchQualifier" } }
        groups: { type: array, items: { $ref: "#/components/schemas/SearchGroup" }, description: "By kind; the group of the best hit first" }
        total: { type: integer, description: Hits returned over all groups }
        truncated: { type: boolean, description: More hits matched than limit }

    SavedViewName:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9 _.-]{0,62}$"
    SavedView:
      type: object
      required: [id, name, query, rev, createdAt, updatedAt]
      description: A saved search — a named query in the qualifier language, per user per project
      properties:
        id: { type: string, description: "vew_<uuidv7>" }
        name: { $ref: "#/components/schemas/SavedViewName" }
        query: { type: string }
        description: { type: string }
        rev: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SavedViewSet:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query: { type: string, minLength: 1, maxLength: 1000, description: Checked by the query parser; an unknown qualifier fails with invalid-query }
        description: { type: string, maxLength: 500 }
    SavedViewList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SavedView" } }

    # ---------------------------------------------------------------- mixes, drafts, presence schemas (mix stream) — add below
    #
    #
    #
    MixGroup:
      type: object
      required: [name, datasets]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9 ._-]{0,59}$"
          description: Unique within the mix, e.g. target or replay-ru
        weight:
          type: number
          format: double
          exclusiveMinimum: 0
          maximum: 1000
          description: "Relative sampling weight; mix.group_weight of defaults.yaml when omitted"
        replay:
          type: boolean
          description: "A replay group (other locales of the base model): replay groups together get replayShare of the samples"
        datasets:
          type: array
          minItems: 1
          maxItems: 50
          description: "Frozen dataset versions: ver_…, @alias or a collection name (its newest frozen version); stored as ver_ ids"
          items: { type: string, minLength: 1, maxLength: 200 }
    MixNew:
      type: object
      required: [name, groups]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120, description: Unique within the project }
        description: { type: string, maxLength: 2000 }
        groups: { type: array, minItems: 1, maxItems: 20, items: { $ref: "#/components/schemas/MixGroup" } }
        temperature:
          type: number
          format: double
          description: "Sampling temperature over group weights (probability ∝ weight^(1/temperature)); mix.temperature of defaults.yaml when omitted"
        replayShare:
          type: number
          format: double
          description: "Share of samples drawn from replay groups; mix.replay_share of defaults.yaml when the mix has a replay group, else 0"
    MixEdit:
      type: object
      additionalProperties: false
      minProperties: 1
      description: The fields to change; groups replace the whole list
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        groups: { type: array, minItems: 1, maxItems: 20, items: { $ref: "#/components/schemas/MixGroup" } }
        temperature: { type: number, format: double }
        replayShare: { type: number, format: double }
    Mix:
      type: object
      description: Project work with revisions (R13); a run records the revision it trained on
      required: [id, projectId, name, groups, temperature, replayShare, rev, createdBy, updatedBy, createdAt, updatedAt, presence, preview]
      properties:
        id: { type: string, description: "mix_<uuidv7>" }
        projectId: { type: string }
        name: { type: string }
        description: { type: string }
        groups: { type: array, items: { $ref: "#/components/schemas/MixGroup" }, description: Weights and replay flags filled in, datasets as ver_ ids }
        temperature: { type: number, format: double }
        replayShare: { type: number, format: double }
        rev: { type: integer }
        createdBy: { $ref: "#/components/schemas/Actor" }
        updatedBy: { $ref: "#/components/schemas/Actor" }
        cause: { $ref: "#/components/schemas/RevisionCause" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        presence: { type: array, items: { $ref: "#/components/schemas/Presence" }, description: Agents editing the mix now }
        preview: { $ref: "#/components/schemas/MixPreview" }
    RevisionCause:
      type: object
      description: Why the current revision exists beyond its actor (updatedBy is the person who accepted a draft)
      properties:
        draftId: { type: string, description: The accepted draft this revision applied }
        draftAuthor: { $ref: "#/components/schemas/Actor" }
        toolCallId: { type: string, description: The agent tool call that wrote the revision or the draft }
    MixList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Mix" } }
    MixEditResult:
      type: object
      required: [mix]
      properties:
        mix: { $ref: "#/components/schemas/Mix" }
        draft: { $ref: "#/components/schemas/Draft" }
    MixPreview:
      type: object
      description: Hours per language and sampling shares from dataset-version metadata (no audio is read)
      required: [totalHours, languages, groups, datasets, warnings, basis]
      properties:
        totalHours: { type: number, format: double, description: Train-split hours of every referenced dataset version }
        languages:
          type: array
          items: { $ref: "#/components/schemas/MixPreviewLanguage" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/MixPreviewGroup" }
        datasets:
          type: array
          items: { $ref: "#/components/schemas/MixPreviewDataset" }
        warnings: { type: array, items: { type: string } }
        basis: { type: string, enum: [metadata] }
    MixPreviewLanguage:
      type: object
      required: [locale, hours, share]
      properties:
        locale: { type: string }
        hours: { type: number, format: double, description: Train-split hours in this locale }
        share: { type: number, format: double, description: Expected share of training samples }
    MixPreviewGroup:
      type: object
      required: [name, replay, weight, hours, share, locales]
      properties:
        name: { type: string }
        replay: { type: boolean }
        weight: { type: number, format: double }
        hours: { type: number, format: double }
        share: { type: number, format: double, description: Probability that a sample comes from this group }
        locales: { type: array, items: { type: string } }
    MixPreviewDataset:
      type: object
      required: [id, name, version, locales, hours, adopted]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        locales: { type: array, items: { type: string } }
        hours: { type: number, format: double }
        adopted: { type: boolean, description: The project adopted this version (otherwise it is adoptable) }
    Presence:
      type: object
      description: An agent editing an entity (an open draft, or a direct edit in the last seconds)
      required: [actor, since]
      properties:
        actor: { $ref: "#/components/schemas/Actor" }
        toolCallId: { type: string }
        draftId: { type: string }
        since: { type: string, format: date-time }
        until: { type: string, format: date-time, description: When a direct edit stops counting as editing; absent while a draft is open }
    DraftableKind:
      type: string
      enum: [mix]
      description: Kinds whose agent edits can land as drafts (gate, note and language pack follow)
    Draft:
      type: object
      description: An unaccepted change to a draftable entity, usually by an agent
      required: [id, projectId, entityKind, entityId, baseRev, currentRev, rev, state, content, changes, author, stale, createdAt, updatedAt]
      properties:
        id: { type: string, description: "drf_<uuidv7>" }
        projectId: { type: string }
        entityKind: { $ref: "#/components/schemas/DraftableKind" }
        entityId: { type: string }
        baseRev: { type: integer, description: The entity revision the draft is based on }
        currentRev: { type: integer, description: The entity's revision now; the draft is stale when it differs from baseRev }
        rev: { type: integer, description: "The draft's own revision (If-Match for drafts.accept and drafts.revert)" }
        state: { type: string, enum: [open, accepted, reverted] }
        content: { type: object, additionalProperties: true, description: The entity content the draft proposes (for a mix, MixNew) }
        changes: { type: array, items: { $ref: "#/components/schemas/DraftChange" } }
        author: { $ref: "#/components/schemas/Actor" }
        toolCallId: { type: string, description: The tool call of the draft's latest edit }
        stale: { type: boolean, description: The entity moved on since the draft's base; accepting fails with draft-stale }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        decidedBy: { $ref: "#/components/schemas/Actor" }
        decidedAt: { type: string, format: date-time }
        appliedRev: { type: integer, description: The entity revision an accepted draft produced }
    DraftChange:
      type: object
      required: [path]
      description: One changed field, as a JSON pointer into the content, with its value before and after
      properties:
        path: { type: string, example: /groups/0/weight }
        before: { description: Absent when the field was added }
        after: { description: Absent when the field was removed }
    DraftList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Draft" } }
    DraftAccepted:
      type: object
      required: [draft, entity]
      properties:
        draft: { $ref: "#/components/schemas/Draft" }
        entity: { type: object, additionalProperties: true, description: The entity at its new revision (a Mix for mix drafts) }

    # ---------------------------------------------------------------- projects: wizard, agent profile, recipes schemas (wave 2) — add below
    #
    #
    #
    LocaleTag:
      type: string
      pattern: "^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
      description: "BCP 47 locale, e.g. he-IL"
    ProjectState:
      type: string
      enum: [bootstrapping, active, failed]
      description: "bootstrapping while the bootstrap job writes the repository; failed when it could not (bootstrapError says why); archived projects keep their state and carry archivedAt"
    AgentDriver:
      type: string
      enum: [claude-code, opencode]
    RepositoryKind:
      type: string
      enum: [internal, github, url]
      description: "internal: the bare repository on the control plane; github: a new GitHub repository created with a stored token; url: an existing repository to link"
    ProjectRepository:
      type: object
      required: [kind, branch, cloneUrl]
      properties:
        kind: { $ref: "#/components/schemas/RepositoryKind" }
        branch: { type: string, description: The project branch (main) }
        cloneUrl: { type: string, description: "Where to clone from Cadence over smart HTTP (/git/<slug>.git); authenticate with an API key or agent token as the password" }
        remote: { type: string, description: "The GitHub or linked repository every commit to main is pushed to (github, url)" }
        secret: { type: string, description: Name of the stored secret that authenticates the remote }
        pushError: { type: string, description: Why the last push to the remote failed; absent when it succeeded }
    ProjectBaseModel:
      type: object
      required: [versionId, name, version, hfRepo, revision]
      properties:
        versionId: { type: string, description: "ver_…" }
        name: { type: string, description: "The registry collection, e.g. base-model/nemotron-3.5-asr-streaming-0.6b" }
        version: { type: string }
        hfRepo: { type: string }
        revision: { type: string, description: The pinned Hugging Face revision }
    ProjectBudgets:
      type: object
      required: [gpuHoursPerDay, agentTokensPerDay, queuePriority]
      properties:
        gpuHoursPerDay: { type: number, format: double, minimum: 0, description: "Default budgets.gpu_hours_per_project_per_day" }
        agentTokensPerDay: { type: integer, minimum: 0, description: "Agent spend per day in tokens; default budgets.agent_tokens_per_project_per_day" }
        queuePriority:
          type: integer
          minimum: -100
          maximum: 100
          description: "The project's queue priority: waiting step jobs start by project priority (higher first), then the job's priority, then first come; default budgets.queue_priority_per_project"
    ProjectBudgetsEdit:
      type: object
      additionalProperties: false
      properties:
        gpuHoursPerDay: { type: number, format: double, minimum: 0, maximum: 192 }
        agentTokensPerDay: { type: integer, minimum: 0, maximum: 1000000000 }
        queuePriority: { type: integer, minimum: -100, maximum: 100, description: "Queue priority of the project's step jobs against other projects (higher first)" }
    AgentChoice:
      type: object
      additionalProperties: false
      properties:
        driver: { $ref: "#/components/schemas/AgentDriver" }
        model: { $ref: "#/components/schemas/AgentModelId" }
        permissionPreset: { $ref: "#/components/schemas/PresetName" }
    AgentModelId:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:/@-]{0,119}$"
      description: "The driver's own model id: a Claude Code alias (sonnet, opus, haiku) or opencode's provider/model"
    PresetName:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,62}$"
      description: "A permission preset (templates.list templateKind=preset), e.g. guardrails-default"
    InstructionsTemplateName:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,62}$"
      description: "An instructions template (templates.list templateKind=instructions): default or minimal; custom once AGENTS.md was edited by hand"
    RepositoryChoice:
      type: object
      additionalProperties: false
      properties:
        kind: { $ref: "#/components/schemas/RepositoryKind" }
        url: { type: string, maxLength: 500, description: "url: the repository to link (https://…, ssh is not supported)" }
        secret: { type: string, maxLength: 120, description: "Name of the stored secret (secrets.new) holding the token for github or a private url" }
        owner: { type: string, maxLength: 100, description: "github: the organisation to create the repository in; the token's user when absent" }
        name: { type: string, maxLength: 100, description: "github: the repository name; the project slug when absent" }
        private: { type: boolean, default: true, description: "github: create the repository private" }

    ProjectNoteNew:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1, maxLength: 4000, description: One learning in a sentence or two; Markdown }
    ProjectNote:
      type: object
      required: [date, text, path, commit]
      properties:
        date: { type: string, format: date, description: The heading the note was filed under }
        text: { type: string }
        path: { type: string, description: NOTES.md }
        commit: { type: string, description: The commit on main; empty for a dry run }
    RecipeChange:
      type: object
      required: [path, status]
      properties:
        path: { type: string }
        status: { type: string, enum: [added, modified, deleted] }
    ProjectSync:
      type: object
      required: [upToDate, base, changes]
      properties:
        upToDate: { type: boolean, description: Nothing differs from the current templates }
        base: { type: string, description: The main commit the sync compared against }
        branch: { type: string, description: "The draft branch sync/<date>; absent when up to date or for a dry run" }
        commit: { type: string, description: The draft commit on the branch }
        changes: { type: array, items: { $ref: "#/components/schemas/RecipeChange" } }

    DraftMode:
      type: string
      enum: [direct, draft]
      description: "direct: agent changes land at once; draft: they land as drafts to accept or revert"
    DraftPolicy:
      type: object
      additionalProperties: false
      required: [mix, gate, note, language_pack]
      properties:
        mix: { $ref: "#/components/schemas/DraftMode" }
        gate: { $ref: "#/components/schemas/DraftMode" }
        note: { $ref: "#/components/schemas/DraftMode" }
        language_pack: { $ref: "#/components/schemas/DraftMode" }
    AutoMerge:
      type: string
      enum: [when-clean, never]
      description: "when-clean: a session branch merges into main at session end when it applies cleanly; never: it always waits as Session changes"
    RenderedFile:
      type: object
      required: [path, content]
      properties:
        path: { type: string }
        content: { type: string }
    AgentProfile:
      type: object
      required: [driver, model, permissionPreset, instructionsTemplate, autoMerge, draftPolicy, rev, updatedAt, files]
      properties:
        driver: { $ref: "#/components/schemas/AgentDriver" }
        model: { $ref: "#/components/schemas/AgentModelId" }
        permissionPreset: { $ref: "#/components/schemas/PresetName" }
        instructionsTemplate: { $ref: "#/components/schemas/InstructionsTemplateName" }
        autoMerge: { $ref: "#/components/schemas/AutoMerge" }
        draftPolicy: { $ref: "#/components/schemas/DraftPolicy" }
        rev: { type: integer }
        updatedAt: { type: string, format: date-time }
        commit: { type: string, description: The commit on main that holds the rendered files }
        files:
          type: array
          description: "The rendered .claude/settings.json, opencode.json, AGENTS.md and CLAUDE.md"
          items: { $ref: "#/components/schemas/RenderedFile" }
    AgentProfileEdit:
      type: object
      additionalProperties: false
      properties:
        driver: { $ref: "#/components/schemas/AgentDriver" }
        model: { $ref: "#/components/schemas/AgentModelId" }
        permissionPreset: { $ref: "#/components/schemas/PresetName" }
        instructionsTemplate: { $ref: "#/components/schemas/InstructionsTemplateName" }
        autoMerge: { $ref: "#/components/schemas/AutoMerge" }
        draftPolicy:
          type: object
          additionalProperties: false
          properties:
            mix: { $ref: "#/components/schemas/DraftMode" }
            gate: { $ref: "#/components/schemas/DraftMode" }
            note: { $ref: "#/components/schemas/DraftMode" }
            language_pack: { $ref: "#/components/schemas/DraftMode" }
        agentsMd: { type: string, minLength: 1, maxLength: 100000, description: "The AGENTS.md text; setting it makes the instructions custom (instructionsTemplate becomes custom)" }
    AgentModel:
      type: object
      required: [id, name]
      properties:
        id: { $ref: "#/components/schemas/AgentModelId" }
        name: { type: string }
    AgentModels:
      type: object
      required: [driver, default, models, freeForm, description, source]
      properties:
        driver: { $ref: "#/components/schemas/AgentDriver" }
        default: { $ref: "#/components/schemas/AgentModelId" }
        models: { type: array, items: { $ref: "#/components/schemas/AgentModel" } }
        freeForm: { type: boolean, description: "Any provider/model id is accepted, not only the listed ones (opencode)" }
        description: { type: string }
        source: { type: string }
    AgentModelList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentModels" } }

    RecipePath:
      type: string
      minLength: 1
      maxLength: 400
      pattern: "^[^/\\x00][^\\x00]*$"
      description: A path relative to the repository root
    BranchName:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$"
    RecipeFile:
      type: object
      required: [path, bytes, blob]
      properties:
        path: { type: string }
        bytes: { type: integer }
        blob: { type: string, description: The git blob id }
    RecipeList:
      type: object
      required: [ref, commit, items]
      properties:
        ref: { type: string }
        commit: { type: string, description: The commit the ref resolved to; empty for a repository without commits }
        items: { type: array, items: { $ref: "#/components/schemas/RecipeFile" } }
    RecipeCommit:
      type: object
      required: [sha, message, author, at]
      properties:
        sha: { type: string }
        message: { type: string, description: The subject line }
        author: { type: string }
        at: { type: string, format: date-time }
    Recipe:
      type: object
      required: [path, ref, commit, bytes, encoding, content, history]
      properties:
        path: { type: string }
        ref: { type: string }
        commit: { type: string }
        bytes: { type: integer }
        encoding: { type: string, enum: [utf-8, base64], description: base64 for files that are not UTF-8 text }
        content: { type: string }
        history: { type: array, items: { $ref: "#/components/schemas/RecipeCommit" }, description: "Commits that changed the file, newest first (at most 50)" }
    Branch:
      type: object
      required: [name, kind, head, updatedAt, ahead, behind]
      properties:
        name: { $ref: "#/components/schemas/BranchName" }
        kind: { type: string, enum: [session, sync, other] }
        sessionId: { type: string, description: "The agent session of a session/<id> branch" }
        head: { type: string }
        subject: { type: string, description: The head commit's subject line }
        updatedAt: { type: string, format: date-time, description: The head commit's date }
        ahead: { type: integer, description: Commits on the branch that main does not have }
        behind: { type: integer, description: Commits on main that the branch does not have }
    BranchList:
      type: object
      required: [main, items]
      properties:
        main: { type: string, description: The commit main points at }
        items: { type: array, items: { $ref: "#/components/schemas/Branch" } }
    BranchFileChange:
      type: object
      required: [path, status, additions, deletions, binary]
      properties:
        path: { type: string }
        status: { type: string, enum: [added, modified, deleted] }
        additions: { type: integer }
        deletions: { type: integer }
        binary: { type: boolean }
    BranchDiff:
      allOf:
        - $ref: "#/components/schemas/Branch"
        - type: object
          required: [main, base, fastForward, conflicts, files, patch, truncated]
          properties:
            main: { type: string }
            base: { type: string, description: The merge base of the branch and main }
            fastForward: { type: boolean, description: Main has not moved since the branch left it }
            conflicts: { type: array, items: { type: string }, description: Files a merge into main would conflict on }
            files: { type: array, items: { $ref: "#/components/schemas/BranchFileChange" } }
            patch: { type: string, description: "The unified diff of the branch against its merge base with main (git diff main...branch)" }
            truncated: { type: boolean, description: The patch was cut at 512 KiB }
    MergeSide:
      type: object
      required: [exists]
      description: One version of a file in a three-way comparison
      properties:
        exists: { type: boolean, description: The file exists in this version }
        blob: { type: string, description: The blob id }
        bytes: { type: integer }
        binary: { type: boolean }
        text: { type: string, description: "The content (conflicting text files only; absent when binary or cut)" }
        cut: { type: boolean, description: The text was left out because it is over 128 KiB or the response budget ran out }
    LineRange:
      type: object
      required: [start, count]
      properties:
        start: { type: integer, description: 0-based index of the first line }
        count: { type: integer }
    MergeHunk:
      type: object
      required: [kind, base, main, branch]
      description: One region of a file in all three versions; the hunks of a file cover every line of each, in order
      properties:
        kind:
          type: string
          enum: [same, main, branch, both, conflict]
          description: "Which side changed the region: neither (same), only main, only the branch, both alike, or both differently (conflict)"
        base: { $ref: "#/components/schemas/LineRange" }
        main: { $ref: "#/components/schemas/LineRange" }
        branch: { $ref: "#/components/schemas/LineRange" }
    BranchCompareFile:
      type: object
      required: [path, clean, base, main, branch]
      properties:
        path: { type: string }
        clean: { type: boolean, description: The file merges into main without a conflict }
        conflict:
          type: string
          enum: [content, add/add, modify/delete, binary]
          description: What kind of conflict (conflicting files only)
        base: { $ref: "#/components/schemas/MergeSide" }
        main: { $ref: "#/components/schemas/MergeSide" }
        branch: { $ref: "#/components/schemas/MergeSide" }
        hunks: { type: array, items: { $ref: "#/components/schemas/MergeHunk" }, description: "Conflicting text files whose three texts are present" }
    BranchCompare:
      type: object
      required: [name, kind, head, main, base, fastForward, files, cut]
      properties:
        name: { $ref: "#/components/schemas/BranchName" }
        kind: { type: string, enum: [session, sync, other] }
        head: { type: string }
        main: { type: string }
        base: { type: string, description: The merge base of the branch and main }
        fastForward: { type: boolean }
        files: { type: array, items: { $ref: "#/components/schemas/BranchCompareFile" }, description: "Every file the branch changed since the merge base, conflicting files first" }
        cut: { type: boolean, description: "Some conflicting files' texts were left out (1 MiB of text per response)" }
    BranchMerge:
      type: object
      required: [branch, head, main, fastForward, changes]
      properties:
        branch: { type: string }
        head: { type: string, description: The branch head that was merged }
        main: { type: string, description: "main after the merge (for a dry run: before it)" }
        fastForward: { type: boolean }
        changes: { type: array, items: { $ref: "#/components/schemas/RecipeChange" } }

    # ---------------------------------------------------------------- agent sessions schemas (sessions stream) — add below
    AgentSessionKind:
      type: string
      enum: [interactive, read-only, playbook]
      description: "interactive: a conversation on its own branch; read-only: one turn under the read-only preset, no branch; playbook: started by playbooks.run, its plan is the playbook's chain (a branch like interactive)"
    AgentSessionState:
      type: string
      enum: [created, running, waiting_approval, paused, done, failed, cancelled]
      description: "docs/spec/05-agents.md \"Session lifecycle\"; done, failed and cancelled are terminal"
    AgentPauseReason:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [user, idle, stuck_turn, runaway, budget_turns, budget_tokens, turn_tokens, project_tokens, host_lost]
        message: { type: string, description: What happened, for the header chip and the note for the next session }
    AgentBudget:
      type: object
      required: [turns, tokens, tokensPerTurn]
      properties:
        turns: { type: integer, description: "Turns before the session pauses (budgets.agent_turns_per_session)" }
        tokens: { type: integer, format: int64, description: "Input + output tokens before it pauses (budgets.agent_tokens_per_session)" }
        tokensPerTurn: { type: integer, format: int64, description: "A turn over this is cancelled and the session pauses (budgets.agent_tokens_per_turn)" }
        gpuHours: { type: number, format: double, description: "GPU-hours the session's commands may spend before a spending one waits for an approval (budgets.agent_gpu_hours_per_session)" }
    AgentUse:
      type: object
      required: [turns, inputTokens, outputTokens]
      properties:
        turns: { type: integer }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        cachedReadTokens: { type: integer, format: int64 }
        costUsd: { type: number, format: double, description: What the agent reports; API-equivalent on a subscription (R6) }
        contextUsed: { type: integer, format: int64, description: Tokens in the agent's context window now }
        contextSize: { type: integer, format: int64 }
    AgentMerge:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [none, pending, merged, conflict, discarded]
          description: "none: no changes (or read-only); pending: Session changes waiting for accept or revert; conflict: a merge would conflict"
        commit: { type: string, description: main after the merge }
        head: { type: string, description: The branch head that was merged or discarded }
        conflicts: { type: array, items: { type: string } }
        fastForward: { type: boolean }
        at: { type: string, format: date-time }
        by: { $ref: "#/components/schemas/Actor" }
    WorkingChange:
      type: object
      required: [path, status]
      additionalProperties: false
      properties:
        path: { type: string, minLength: 1, maxLength: 400 }
        status: { type: string, enum: [added, modified, deleted] }
        bytes: { type: integer, minimum: 0, description: The file's size in the worktree (not for deleted files) }
        additions: { type: integer, minimum: 0, description: Lines added since the last commit (tracked text files) }
        deletions: { type: integer, minimum: 0, description: Lines removed since the last commit (tracked text files) }
    AgentWorking:
      type: object
      required: [files, truncated]
      additionalProperties: false
      description: >
        Uncommitted changes in the session's worktree while a turn runs, from the agent host's watcher (paths and
        sizes, no content); the turn's commit empties it
      properties:
        turn: { type: integer, minimum: 0 }
        files: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/WorkingChange" } }
        truncated: { type: boolean, description: More files changed than listed (the first 200 by path are) }
        at: { type: string, format: date-time, description: When the control plane received it }
    AgentReference:
      type: object
      required: [ref]
      properties:
        ref: { type: string, description: "The textual reference: @run:123, @mix:mix_…, @utt:9f3c#t=1.5-3.0" }
        kind: { type: string, description: "EntityKind (snake singular), filled by the server from ref" }
        id: { type: string }
        fragment: { type: string, description: "The part after #" }
        label: { type: string, description: What the UI showed }
    AgentSession:
      type: object
      required: [id, number, projectId, project, kind, driver, model, preset, state, branch, merge, autoMerge, budget, use, references, startedBy, rev, createdAt, updatedAt]
      properties:
        id: { type: string, description: "ses_<uuidv7>" }
        number: { type: integer, description: "The session's ordinal in its project (claude-code · session 3)" }
        projectId: { type: string }
        project: { $ref: "#/components/schemas/Slug" }
        kind: { $ref: "#/components/schemas/AgentSessionKind" }
        driver: { $ref: "#/components/schemas/AgentDriver" }
        model: { type: string }
        preset: { type: string, description: The permission preset of the session token }
        state: { $ref: "#/components/schemas/AgentSessionState" }
        busy: { type: boolean, description: A turn is in progress }
        turn: { type: integer, description: The current (or last) turn number }
        pauseReason: { $ref: "#/components/schemas/AgentPauseReason" }
        pendingControl: { type: string, enum: [cancel, pause, resume, end], description: A request the agent host has not carried out yet }
        hostState:
          type: string
          enum: [waiting, connected, released, lost]
          description: >
            Live sessions only. waiting: no agent host took it yet; connected: a host runs it; released: its host shut
            down (a restart) and the next host has not taken it yet; lost: its host stopped answering and the session
            moves to the next host that claims work. Requests (stop, pause, end) and messages wait for the next host.
        hostLeftAt: { type: string, format: date-time, description: When the session's host released it or was found silent (released, lost) }
        error: { type: string, description: Why it failed }
        branch: { type: string, description: "session/<id> (empty for read-only sessions)" }
        merge: { $ref: "#/components/schemas/AgentMerge" }
        working: { $ref: "#/components/schemas/AgentWorking" }
        autoMerge: { $ref: "#/components/schemas/AutoMerge" }
        budget: { $ref: "#/components/schemas/AgentBudget" }
        use: { $ref: "#/components/schemas/AgentUse" }
        prompt: { type: string, description: The first message }
        references: { type: array, items: { $ref: "#/components/schemas/AgentReference" } }
        startedBy: { $ref: "#/components/schemas/Actor" }
        rev: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        lastMessageAt: { type: string, format: date-time, description: The last user message; the idle clock (R5) runs from it }
        playbook: { $ref: "#/components/schemas/AgentPlaybook" }
    AgentSessionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentSession" } }
    AgentSessionNew:
      type: object
      additionalProperties: false
      properties:
        kind: { allOf: [{ $ref: "#/components/schemas/AgentSessionKind" }], default: interactive }
        driver: { $ref: "#/components/schemas/AgentDriver" }
        model: { type: string, minLength: 1, maxLength: 200, description: Defaults to the agent profile's model (for the profile's driver) or the driver's default }
        prompt: { type: string, minLength: 1, maxLength: 100000, description: "The first message; required for read-only sessions" }
        references: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/AgentReference" } }
    AgentSessionCancel:
      type: object
      additionalProperties: false
      properties:
        end: { type: boolean, default: false, description: Also end the session (done); its branch merges per the auto-merge policy }
    AgentSessionResume:
      type: object
      additionalProperties: false
      properties:
        budget:
          type: object
          additionalProperties: false
          description: Raise the session budget (a session paused by its budget resumes only with room left)
          properties:
            turns: { type: integer, minimum: 1, maximum: 2000 }
            tokens: { type: integer, format: int64, minimum: 1, maximum: 1000000000 }
    AgentMessageKind:
      type: string
      enum: [user_message, notice, agent_message, thought, plan, tool_call, permission, turn, commit]
    AgentPlanEntry:
      type: object
      required: [content, status]
      properties:
        content: { type: string }
        status: { type: string, enum: [pending, in_progress, completed] }
        priority: { type: string, enum: [high, medium, low] }
    AgentFileDiff:
      type: object
      required: [path, newText]
      properties:
        path: { type: string }
        oldText: { type: string, description: Absent for a new file }
        newText: { type: string }
    AgentToolCall:
      type: object
      required: [id, title, class, status]
      properties:
        id: { type: string, description: "The agent's tool call id (Cadence-Tool-Call-Id of the commands it caused)" }
        title: { type: string }
        class: { type: string, enum: [mcp, edit, shell, read, search, fetch, think, other] }
        status: { type: string, enum: [pending, in_progress, completed, failed] }
        operation: { type: string, description: "The Cadence operation of an MCP call (<entity>.<verb>)" }
        server: { type: string, description: The MCP server of an MCP call }
        diffs: { type: array, items: { $ref: "#/components/schemas/AgentFileDiff" } }
        shell:
          type: object
          required: [command]
          properties:
            command: { type: string }
            exitCode: { type: integer, description: Only when the agent reports one (Claude does not) }
            output: { type: string }
        locations: { type: array, items: { type: string } }
        text: { type: string }
        input: { description: The tool's arguments }
        output: { description: The tool's result (MCP results are Cadence's data-marked JSON) }
        approvalId: { type: string, description: The approval a gated MCP call returned }
        jobId: { type: string, description: The job a long MCP call returned }
    AgentPermission:
      type: object
      required: [source, state]
      properties:
        source: { type: string, enum: [agent, command], description: "agent: an ACP permission request; command: a gated Cadence command (202)" }
        approvalId: { type: string }
        toolCallId: { type: string }
        title: { type: string }
        operation: { type: string, description: The gated operation (command) }
        class: { type: string }
        options:
          type: array
          items:
            type: object
            required: [optionId, name, kind]
            properties:
              optionId: { type: string }
              name: { type: string }
              kind: { type: string, enum: [allow_once, allow_always, reject_once, reject_always] }
        state: { type: string, enum: [pending, approved, denied, cancelled] }
        grant: { type: string, enum: [once, session] }
        decidedBy: { $ref: "#/components/schemas/Actor" }
        rule: { type: string, description: The preset rule that answered without asking a person }
        note: { type: string }
    AgentCommit:
      type: object
      properties:
        sha: { type: string }
        files: { type: array, items: { type: string } }
        refused: { type: boolean, description: The staged diff held a credential; nothing was committed }
        findings:
          type: array
          items:
            type: object
            required: [path, kind]
            properties:
              path: { type: string }
              kind: { type: string, description: "The credential kind found (cst_, cdk_, cwk_, anthropic, …); the value is never reported" }
              line: { type: integer }
    AgentTurn:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [started, ended] }
        stopReason: { type: string, description: "end_turn, cancelled, max_tokens, refusal, …" }
        messageId: { type: string, description: The user message the turn answers }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        cachedReadTokens: { type: integer, format: int64 }
    AgentMessage:
      type: object
      required: [id, sessionId, seq, kind, turn, actor, rev, createdAt, updatedAt]
      description: "One transcript entry; tool calls, plans, permissions and streamed text are updated in place (rev)"
      properties:
        id: { type: string, description: "msg_<uuidv7>" }
        sessionId: { type: string }
        seq: { type: integer, format: int64, description: Order in the transcript }
        kind: { $ref: "#/components/schemas/AgentMessageKind" }
        turn: { type: integer }
        actor: { $ref: "#/components/schemas/Actor" }
        rev: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        text: { type: string, description: "user_message, notice, agent_message (Markdown), thought" }
        final: { type: boolean, description: Streamed text is complete }
        references: { type: array, items: { $ref: "#/components/schemas/AgentReference" } }
        context: { type: string, description: The context block the references expanded into (user_message) }
        delivery: { type: string, enum: [pending, delivered], description: "user_message and notice: whether the agent host took it" }
        plan: { type: array, items: { $ref: "#/components/schemas/AgentPlanEntry" } }
        toolCall: { $ref: "#/components/schemas/AgentToolCall" }
        permission: { $ref: "#/components/schemas/AgentPermission" }
        turnInfo: { $ref: "#/components/schemas/AgentTurn" }
        commit: { $ref: "#/components/schemas/AgentCommit" }
        level: { type: string, enum: [info, warning, error], description: notice }
    AgentMessageList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentMessage" } }
        next: { type: integer, format: int64, description: Pass as after for the next page; absent on the last page }
    AgentMessageNew:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1, maxLength: 100000 }
        references: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/AgentReference" } }

    # ---------------------------------------------------------------- agent host protocol schemas (tag host)
    HostClaim:
      type: object
      required: [hostId]
      additionalProperties: false
      properties:
        hostId: { type: string, minLength: 1, maxLength: 200, description: "This host process (hostname and boot id); a session belongs to one" }
        version: { type: string, maxLength: 100 }
        wait: { type: integer, minimum: 0, maximum: 30, default: 20, description: Seconds to wait for work }
        capacity: { type: integer, minimum: 0, maximum: 256, description: How many more sessions this host may start }
    HostStart:
      type: object
      required: [session, token, cloneUrl, mcpUrl, budget, clocks]
      properties:
        session: { $ref: "#/components/schemas/AgentSession" }
        token: { type: string, description: "The session token (cst_…), shown once: MCP Authorization and git password; never written to disk" }
        cloneUrl: { type: string, description: "Path of the project repository on the control plane (/git/<slug>.git)" }
        mcpUrl: { type: string, description: Path of the MCP endpoint (/mcp) }
        budget: { $ref: "#/components/schemas/AgentBudget" }
        clocks:
          type: object
          required: [stuckTurnSeconds, identicalCalls]
          properties:
            stuckTurnSeconds: { type: integer, description: "timeouts.stuck_turn_minutes" }
            identicalCalls: { type: integer, description: The same tool with the same arguments this many times in a row is a runaway }
        allowedTools:
          type: array
          items: { type: string }
          description: >
            Cadence MCP tools (operation ids, e.g. mixes.get) the session's permission preset lets the agent call
            without a permission prompt; the driver pre-allows them in the agent (Claude Code does not apply allow
            rules from the repository's .claude/settings.json). The server still applies the preset to every call.
        resume:
          type: object
          description: The session ran before (host restart or resume after pause)
          properties:
            acpSessionId: { type: string }
            summary: { type: string, description: A transcript summary for a new ACP session when resume fails }
            note: { type: string, description: "What the agent is told before its next prompt, e.g. that its last turn was interrupted by a host restart" }
    HostControl:
      type: object
      required: [id, sessionId, action]
      properties:
        id: { type: string }
        sessionId: { type: string }
        action: { type: string, enum: [cancel, pause, resume, end] }
        reason: { $ref: "#/components/schemas/AgentPauseReason" }
        budget: { $ref: "#/components/schemas/AgentBudget" }
        resume:
          type: object
          properties:
            acpSessionId: { type: string }
            summary: { type: string }
    HostMessage:
      type: object
      required: [id, sessionId, kind, text]
      properties:
        id: { type: string }
        sessionId: { type: string }
        kind: { type: string, enum: [user_message, notice] }
        text: { type: string }
        context: { type: string, description: The expanded references, sent before the text }
    HostDecision:
      type: object
      required: [outcome]
      properties:
        sessionId: { type: string }
        approvalId: { type: string }
        toolCallId: { type: string }
        outcome: { type: string, enum: [pending, allow_once, allow_always, reject_once] }
        rule: { type: string, description: The preset rule when the policy answered without a person }
        reason: { type: string }
    HostWork:
      type: object
      required: [start, messages, controls, decisions]
      properties:
        start: { type: array, items: { $ref: "#/components/schemas/HostStart" } }
        messages: { type: array, items: { $ref: "#/components/schemas/HostMessage" } }
        controls: { type: array, items: { $ref: "#/components/schemas/HostControl" } }
        decisions: { type: array, items: { $ref: "#/components/schemas/HostDecision" } }
    HostEntry:
      type: object
      required: [key, kind]
      additionalProperties: false
      description: "A transcript entry keyed by the host (e.g. t3:m1, tool:<id>): the same key updates the same entry"
      properties:
        key: { type: string, minLength: 1, maxLength: 300 }
        kind: { type: string, enum: [notice, agent_message, thought, plan, tool_call, turn, commit] }
        turn: { type: integer, minimum: 0 }
        text: { type: string, maxLength: 1000000 }
        final: { type: boolean }
        level: { type: string, enum: [info, warning, error] }
        plan: { type: array, items: { $ref: "#/components/schemas/AgentPlanEntry" } }
        toolCall: { $ref: "#/components/schemas/AgentToolCall" }
        turnInfo: { $ref: "#/components/schemas/AgentTurn" }
        commit: { $ref: "#/components/schemas/AgentCommit" }
    HostReport:
      type: object
      required: [hostId]
      additionalProperties: false
      properties:
        hostId: { type: string, minLength: 1, maxLength: 200 }
        entries: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/HostEntry" } }
        state:
          type: object
          required: [state]
          additionalProperties: false
          properties:
            state: { type: string, enum: [running, paused, done, failed, cancelled] }
            busy: { type: boolean }
            turn: { type: integer }
            reason: { $ref: "#/components/schemas/AgentPauseReason" }
            error: { type: string, maxLength: 20000 }
        use: { $ref: "#/components/schemas/AgentUse" }
        acpSessionId: { type: string, maxLength: 300 }
        note: { type: string, maxLength: 4000, description: "A note for the next session (projects.note), e.g. why the session paused" }
        withdraw: { type: array, items: { type: string }, description: "Agent-permission approvals the agent no longer waits for (its turn was cancelled)" }
        working: { $ref: "#/components/schemas/AgentWorking" }
    HostRelease:
      type: object
      required: [hostId]
      additionalProperties: false
      properties:
        hostId: { type: string, minLength: 1, maxLength: 200 }
        messages: { type: array, maxItems: 1000, items: { type: string }, description: "Messages this host took but never gave its agent; they go back to pending for the next host" }
    HostReleased:
      type: object
      required: [released]
      properties:
        released: { type: array, items: { type: string }, description: The ids of the sessions released }
    HostAsk:
      type: object
      required: [hostId, toolCall, options]
      additionalProperties: false
      properties:
        hostId: { type: string, minLength: 1, maxLength: 200 }
        turn: { type: integer }
        toolCall: { $ref: "#/components/schemas/AgentToolCall" }
        options:
          type: array
          minItems: 1
          items:
            type: object
            required: [optionId, name, kind]
            properties:
              optionId: { type: string }
              name: { type: string }
              kind: { type: string, enum: [allow_once, allow_always, reject_once, reject_always] }

    # ---------------------------------------------------------------- agent credentials
    AgentCredentialIdValue:
      type: string
      pattern: "^(claude-code|opencode\\.[a-z][a-z0-9-]{0,39})$"
      description: "claude-code (the Claude subscription) or opencode.<provider> (minimax, anthropic, openai, openrouter, deepseek, or a custom provider id)"
    AgentCredentialDelivery:
      type: object
      description: Whether the agent host has the value in the agent-credentials volume
      required: [state]
      properties:
        state:
          type: string
          enum: [pending, written, removing, removed, failed]
          description: "pending: waiting for the agent host to write it; written: in the volume; removing: waiting for the host to delete it; failed: the host could not write it (detail)"
        detail: { type: string }
        at: { type: string, format: date-time }
    AgentCredentialVerification:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [none, pending, ok, failed]
          description: "none: never verified since the value was set; pending: waiting for the agent host; ok or failed: the last result"
        detail: { type: string, description: "The agent's answer or error, shortened (never the value)" }
        model: { type: string, description: The model the check ran with }
        at: { type: string, format: date-time }
    AgentCredential:
      type: object
      description: "An agent's model account. Metadata only: the value lives in the agent-credentials volume and is never returned"
      required: [id, agent, provider, catalogueId, name, hasValue, delivery, verification, models, hosts, rev, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/AgentCredentialIdValue" }
        agent: { $ref: "#/components/schemas/AgentDriver" }
        provider: { type: string, description: "The provider id in the agent's own configuration (opencode's provider/model prefix); anthropic for Claude Code" }
        catalogueId: { type: string, description: The catalogue entry (agentProviders.list) it was configured from }
        name: { type: string, description: Display name }
        baseUrl: { type: string, description: The API base URL of a custom (OpenAI-compatible) provider }
        hasValue: { type: boolean, description: A key or token is stored (a custom provider may have none) }
        hint: { type: string, description: "The value's last four characters (…ab12), to tell tokens apart" }
        setAt: { type: string, format: date-time, description: When the value was last set }
        setBy: { $ref: "#/components/schemas/Actor" }
        expiresAt: { type: string, format: date-time, description: "Expected expiry (Claude's setup-token lasts about a year); warn 30 days before" }
        delivery: { $ref: "#/components/schemas/AgentCredentialDelivery" }
        verification: { $ref: "#/components/schemas/AgentCredentialVerification" }
        models: { type: array, items: { type: string }, description: "opencode: the provider's models as provider/model, from the last verification" }
        defaultModel: { type: string, description: "opencode: set on the one credential whose model new projects default to" }
        hosts: { type: array, items: { type: string }, description: The API hosts added to the egress allowlist for it }
        archivedAt: { type: string, format: date-time }
        rev: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AgentCredentialList:
      type: object
      required: [items, host, opencodeDefault]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentCredential" } }
        host:
          type: object
          required: [connected]
          description: Whether an agent host claimed work recently; values and checks wait for one
          properties:
            connected: { type: boolean }
            seenAt: { type: string, format: date-time }
        opencodeDefault:
          type: object
          required: [model, source]
          description: The model new opencode projects start from
          properties:
            model: { type: string }
            source: { type: string, enum: [configured, defaults], description: "configured: chosen here; defaults: defaults.yaml wizard.opencode_model" }
    AgentCredentialSet:
      type: object
      additionalProperties: false
      properties:
        value: { type: string, writeOnly: true, minLength: 1, maxLength: 8192, description: "Write-only: the token (claude setup-token) or the provider's API key. Omit to keep the stored one" }
        name: { type: string, minLength: 1, maxLength: 80, description: "Display name (custom providers)" }
        catalogueId: { type: string, maxLength: 40, description: "The catalogue entry, for a custom provider: openai-compatible (else derived from the id)" }
        baseUrl: { type: string, maxLength: 500, description: "API base URL of a custom provider, e.g. http://vllm.lan:8000/v1" }
        defaultModel: { type: string, maxLength: 200, description: "opencode: make this provider/model the default of new projects (one of the credential's models)" }
    AgentProvider:
      type: object
      required: [id, agent, name, description, keyLabel, keyRequired, custom, hosts]
      properties:
        id: { type: string, description: "Catalogue id (claude-subscription, minimax, anthropic, openai, openrouter, deepseek, openai-compatible)" }
        agent: { $ref: "#/components/schemas/AgentDriver" }
        name: { type: string }
        description: { type: string }
        keyLabel: { type: string }
        keyPrefix: { type: string, description: The value's expected prefix, when the provider has one }
        keyRequired: { type: boolean }
        custom: { type: boolean, description: The admin names the provider id and base URL (OpenAI-compatible, e.g. a self-hosted vLLM) }
        hosts: { type: array, items: { type: string }, description: API hosts added to the egress allowlist when configured }
        defaultModel: { type: string, description: "The model suggested as the default once configured (minimax/MiniMax-M3)" }
        verifyModel: { type: string, description: The cheap model the verification request runs with }
        help: { type: string, description: How to get the key or token }
        docsUrl: { type: string }
    AgentProviderList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentProvider" } }
    HostCredentialClaim:
      type: object
      required: [hostId]
      additionalProperties: false
      properties:
        hostId: { type: string, minLength: 1, maxLength: 200 }
        wait: { type: integer, minimum: 0, maximum: 30, default: 20, description: Seconds to wait for a task }
    HostCredentialTask:
      type: object
      required: [id, action, credentialId, agent, provider, catalogueId]
      properties:
        id: { type: string, description: "act_…" }
        action: { type: string, enum: [write, remove, verify] }
        credentialId: { $ref: "#/components/schemas/AgentCredentialIdValue" }
        agent: { $ref: "#/components/schemas/AgentDriver" }
        provider: { type: string }
        catalogueId: { type: string }
        name: { type: string }
        value: { type: string, description: "write: the value to store (from the transit store; the host writes it to the volume and never logs it)" }
        baseUrl: { type: string, description: A custom provider's API base URL (opencode provider block) }
        verifyModel: { type: string, description: "verify: the model of the tiny check (Claude alias or opencode provider/model); empty = the first listed" }
        models: { type: array, items: { type: string }, description: "A custom provider's known models (write), so the provider block keeps them" }
    HostCredentialWork:
      type: object
      required: [tasks]
      properties:
        tasks: { type: array, items: { $ref: "#/components/schemas/HostCredentialTask" } }
    HostCredentialReport:
      type: object
      required: [hostId, ok]
      additionalProperties: false
      properties:
        hostId: { type: string, minLength: 1, maxLength: 200 }
        ok: { type: boolean }
        detail: { type: string, maxLength: 2000, description: "What happened, shortened; never the value" }
        model: { type: string, maxLength: 200, description: "verify: the model the check ran with" }
        models: { type: array, maxItems: 2000, items: { type: string, maxLength: 200 }, description: "verify (opencode): the provider's models as provider/model" }
    HostCredentialAck:
      type: object
      required: [id, state]
      properties:
        id: { type: string }
        state: { type: string, enum: [done, superseded] }
    EgressHostList:
      type: object
      required: [hosts]
      properties:
        hosts: { type: array, items: { type: string }, description: "Host names, *.domain patterns or host:port (a custom base URL with a port)" }

    # ---------------------------------------------------------------- worker protocol schemas (tag worker; phase 2 · wave 0)
    WorkerRegistration:
      type: object
      required: [host, runtime, stepKinds]
      additionalProperties: false
      properties:
        host: { type: string, minLength: 1, maxLength: 200, description: "The compute host this worker runs on (compute entity name, e.g. staging)" }
        instance: { type: string, maxLength: 200, description: "This worker process (hostname and boot id), so a restart is told apart from a second worker" }
        runtime: { $ref: "#/components/schemas/RuntimeDescriptor" }
        stepKinds:
          type: object
          description: Step kinds this runtime can run, by name
          additionalProperties: { $ref: "#/components/schemas/StepKindDescriptor" }
        modelFamilies:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/ModelFamilyDescriptor" }
    RuntimeDescriptor:
      type: object
      required: [name, version]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$", description: "Runtime name (nemo-speech, toy)" }
        version: { type: string, maxLength: 100, description: "The runtime's own version (26.07)" }
        image: { type: string, maxLength: 500, description: "Container image reference" }
        digest: { type: string, maxLength: 100, description: "Image digest (sha256:…); empty for a development worker outside a container" }
        environment:
          type: object
          description: "Environment lock: framework and library versions (cuda, torch, nemo, lhotse, …)"
          additionalProperties: { type: string }
        plugin: { type: string, maxLength: 100, description: "Version of the cadence-worker plugin the image carries" }
    StepKindDescriptor:
      type: object
      required: [version, params, consumes, produces, resources, help]
      properties:
        version: { type: string, maxLength: 20 }
        params: { type: object, description: "JSON Schema of the parameters; every property carries x-cadence {default, description, source, range[, defaultRef]}" }
        consumes: { type: object, additionalProperties: { type: string }, description: "Input name → artifact type" }
        optionalInputs:
          type: array
          items: { type: string }
          description: "Inputs of consumes a pipeline may leave unwired (a transcribe step's boost list); the step runs without them"
        produces: { type: object, additionalProperties: { type: string }, description: "Output name → artifact type" }
        optionalOutputs:
          type: array
          items: { type: string }
          description: "Outputs of produces a successful step may leave unwritten (a train step's final training state); no pipeline may wire them into another step"
        resources: { $ref: "#/components/schemas/StepResources" }
        role: { type: string, maxLength: 40, description: "The model-family role this kind fills (calibrate, train, average, transcribe, export, parity, materialize, live), empty for neutral kinds" }
        neutral: { type: boolean, description: "Runtime-neutral core kind shipped in every runtime image" }
        secrets: { type: array, items: { type: string }, description: Secret names the step needs as environment variables }
        help: { type: string, description: "Help slug (steps.<name>)" }
    StepResources:
      type: object
      properties:
        gpu: { type: boolean }
        gpus: { type: integer, minimum: 0, maximum: 1, description: "Cards (1 in v1, R44)" }
        memoryGb: { type: number, minimum: 0, description: Card memory the step needs; a training step takes the card's whole cap }
        diskGb: { type: number, minimum: 0 }
        jobKind: { type: string, enum: [training, eval, export, data, interactive], description: "Which compute job kinds may take it (interactive: a live transcription session, R49)" }
    ModelFamilyDescriptor:
      type: object
      required: [name, version, framework, architecture, latencyProfiles, roles]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9.-]{1,62}$" }
        version: { type: string, maxLength: 20 }
        title: { type: string, maxLength: 200 }
        framework: { type: string, maxLength: 100 }
        architecture: { type: string, maxLength: 200 }
        formats: { type: array, items: { type: string }, description: "Checkpoint and export formats (.nemo, onnx, …)" }
        input: { type: object, properties: { sampleRate: { type: integer }, channels: { type: integer } } }
        features: { type: object, description: "Feature extraction the family computes itself (R42: never stored in shar)" }
        tokenizer: { type: string, description: "Tokenizer kind (sentencepiece-bpe, chars, …)" }
        capabilities:
          type: object
          properties:
            streaming: { type: boolean }
            wordTimestamps: { type: boolean }
            confidence: { type: boolean }
            boosting: { type: string, description: "Boosting method, empty when none" }
            languagePrompt: { type: boolean }
            trainModes: { type: array, items: { type: string, enum: [finetune, adapter, scratch] } }
        latencyProfiles:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/LatencyProfile" }
        roles:
          type: object
          description: "Role → step kind (calibrate, train, average, transcribe, export, parity; materialize turns a base_model artifact into a checkpoint so evals can transcribe a base model; live serves transcription sessions, R48)"
          additionalProperties: { type: string }
        interactive:
          type: object
          required: [memoryMb]
          description: "The card memory a live transcription session of the family reserves (R49, phase 3 · stream T)"
          properties:
            memoryMb: { type: integer, minimum: 1, description: "One model loaded: steady memory plus the load peak and margin (Nemotron 0.6B: 6000, spike A5)" }
            extraCheckpointMb: { type: integer, minimum: 0, description: "Each further distinct model of the session (targets of one model share its weights)" }
        defaultsSection: { type: string, description: "The defaults.yaml section of this family" }
        help: { type: string }
        skill: { type: string }
    LatencyProfile:
      type: object
      required: [name, latencyMs]
      properties:
        name: { type: string, description: "80ms, 160ms, …, offline" }
        latencyMs: { type: integer, minimum: 0, description: Algorithmic latency }
        chunkMs: { type: integer, minimum: 0 }
        leftContextMs: { type: integer, minimum: 0 }
        params: { type: object, description: "Family parameters that realise it, e.g. {att_context_size: [56, 1]}" }
        label: { type: string, description: "How the UI shows it: 160 ms · [56,1]" }
    Worker:
      type: object
      required: [id, host, runtime, state]
      properties:
        id: { type: string, description: "wrk_…" }
        host: { type: string }
        hostId: { type: string, description: "cmp_… of the compute host" }
        instance: { type: string }
        runtime: { $ref: "#/components/schemas/RuntimeDescriptor" }
        runtimeVersionId: { type: string, description: "The runtime's registry version (ver_…)" }
        stepKinds: { type: array, items: { type: string }, description: "kind@version this worker may lease" }
        state: { type: string, enum: [online, offline] }
        lastSeenAt: { type: string, format: date-time }
    WorkerClaim:
      type: object
      required: [workerId, cards]
      additionalProperties: false
      properties:
        workerId: { type: string }
        wait: { type: integer, minimum: 0, maximum: 30, default: 20, description: Seconds to wait for work }
        cards: { type: array, maxItems: 16, items: { $ref: "#/components/schemas/CardTelemetry" } }
    CardTelemetry:
      type: object
      required: [index]
      properties:
        index: { type: integer, minimum: 0 }
        name: { type: string }
        memoryTotalMb: { type: integer, minimum: 0 }
        memoryUsedMb: { type: integer, minimum: 0, description: Used by every process on the card, resident services included }
        utilization: { type: number, minimum: 0, maximum: 1 }
        temperatureC: { type: number }
        powerW: { type: number }
    WorkerClaimResult:
      type: object
      properties:
        lease: { $ref: "#/components/schemas/Lease" }
    Lease:
      type: object
      required: [id, jobId, spec, card, heartbeatSeconds]
      properties:
        id: { type: string, description: "lse_…" }
        jobId: { type: string }
        spec: { $ref: "#/components/schemas/StepSpec" }
        inputs:
          type: object
          description: Input name → where to read it (cas://b3:<hash> in v1)
          additionalProperties: { type: string }
        card: { type: object, required: [index, memoryCapMb], properties: { index: { type: integer }, memoryCapMb: { type: integer } } }
        env: { type: object, additionalProperties: { type: string }, description: "Secret environment for the step subprocess only; never logged" }
        traceparent: { type: string, description: W3C trace context of the job }
        heartbeatSeconds: { type: integer }
        mounts:
          type: array
          description: "Every registered mount, so the step can resolve mount://<name>/<path>[#t=<start>,<end>][&ch=<n>] URIs (cadence_worker.mounts); credentials only for steps that may read them"
          items: { $ref: "#/components/schemas/LeaseMount" }
    StepSpec:
      type: object
      required: [stepId, pipelineRunId, kind, kindVersion, params, inputs, outputs, resources, attempt]
      properties:
        stepId: { type: string }
        pipelineRunId: { type: string }
        projectId: { type: string }
        runId: { type: string, description: "The training run this step belongs to, when it does (metrics go to run.{id}.metrics)" }
        kind: { type: string }
        kindVersion: { type: string }
        params: { type: object, description: Resolved parameters (defaults applied) }
        inputs: { type: object, additionalProperties: { $ref: "#/components/schemas/ArtifactRef" } }
        outputs: { type: object, additionalProperties: { type: string }, description: Output name → artifact type }
        resources: { $ref: "#/components/schemas/StepResources" }
        priority: { type: integer }
        estimateSeconds: { type: number, description: "Estimated wall time (availability windows, R19); absent when unknown" }
        overrides:
          type: object
          properties:
            batchScale: { type: number, exclusiveMinimum: 0, maximum: 1, description: "0.75 on the automatic OOM retry" }
            resumeFrom: { type: string, description: "b3 hash of a training-state artifact to resume from" }
        attempt: { type: integer, minimum: 1 }
    ArtifactRef:
      type: object
      required: [hash, type]
      properties:
        hash: { type: string, pattern: "^b3:[0-9a-f]{64}$" }
        type: { type: string, description: "shar, dataset, mix, base_model, checkpoint, training-state, calibration, hypotheses, analysis, eval-report, deployable, text" }
        size: { type: integer, format: int64, minimum: 0 }
        meta: { type: object, description: "Neutral, self-describing metadata of the type (R42)" }
    WorkerReport:
      type: object
      additionalProperties: false
      properties:
        progress: { type: object, properties: { fraction: { type: number, minimum: 0, maximum: 1 }, message: { type: string, maxLength: 500 } } }
        cards: { type: array, maxItems: 16, items: { $ref: "#/components/schemas/CardTelemetry" } }
    WorkerReportAck:
      type: object
      required: [stop]
      properties:
        stop: { type: boolean, description: "Stop the step now (checkpoint first when it can)" }
        reason: { type: string, enum: [cancelled, paused, window-closed] }
    WorkerLogLine:
      type: object
      required: [t, msg]
      properties:
        t: { type: string, format: date-time }
        level: { type: string, enum: [debug, info, warn, error], default: info }
        msg: { type: string, maxLength: 16000 }
        fields: { type: object }
    WorkerMetricBatch:
      type: object
      required: [points]
      additionalProperties: false
      properties:
        points: { type: array, minItems: 1, maxItems: 5000, items: { $ref: "#/components/schemas/MetricPoint" } }
    MetricPoint:
      type: object
      required: [name, value, wallTime]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9_./]{0,99}$", description: "loss, val_wer, lr, grad_norm, throughput_audio_s_per_s, gpu_memory_mb, …" }
        step: { type: integer, format: int64, minimum: 0 }
        epoch: { type: number }
        value: { type: number }
        wallTime: { type: string, format: date-time }
    StepOutcome:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state: { type: string, enum: [done, failed, cancelled] }
        error: { $ref: "#/components/schemas/StepError" }
        outputs: { type: object, additionalProperties: { $ref: "#/components/schemas/ArtifactRef" } }
        metrics: { type: object, additionalProperties: { type: number }, description: "Final values (val_wer, seconds_per_step, …)" }
    WorkerOutput:
      type: object
      required: [name, artifact]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: "The step output it is an instance of (its type must match the output's)" }
        artifact: { $ref: "#/components/schemas/ArtifactRef" }
        metrics: { type: object, additionalProperties: { type: number }, description: "Values at this point (val_wer, …) the hooks may read when the meta lacks them" }
    StepError:
      type: object
      required: [type, message]
      properties:
        type: { type: string, enum: [oom, step, lost, cancelled, input], description: "oom gets one automatic retry at 0.75× batch; lost = reaped after missed heartbeats" }
        message: { type: string, maxLength: 4000 }
        retryable: { type: boolean }

    # ---------------------------------------------------------------- worker, queue, telemetry, runtimes schemas (stream W) — add below
    RuntimeVersion:
      allOf:
        - $ref: "#/components/schemas/RegistryVersion"
        - type: object
          required: [runtime, workers]
          properties:
            runtime: { $ref: "#/components/schemas/RuntimeDescriptor" }
            workers: { type: array, items: { $ref: "#/components/schemas/Worker" }, description: Workers that registered with this version, newest first }
    RuntimeVersionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RuntimeVersion" } }
    ModelFamilyVersion:
      allOf:
        - $ref: "#/components/schemas/RegistryVersion"
        - type: object
          required: [modelFamily]
          properties:
            modelFamily: { $ref: "#/components/schemas/ModelFamilyDescriptor" }
    ModelFamilyVersionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ModelFamilyVersion" } }
    StepKindPayload:
      allOf:
        - $ref: "#/components/schemas/StepKindDescriptor"
        - type: object
          required: [name, runtime, runtimeVersionId, schemaHash]
          properties:
            name: { type: string, description: "The step kind's name; pipelines pin <name>@<version>" }
            runtime: { type: string, description: The runtime that publishes it }
            runtimeVersionId: { type: string, description: "The runtime's registry version (ver_…) when first published" }
            schemaHash: { type: string, description: "sha256 of the canonical parameter schema; neutral kinds of several runtimes agree on it" }
    StepKindVersion:
      allOf:
        - $ref: "#/components/schemas/RegistryVersion"
        - type: object
          required: [stepKind]
          properties:
            stepKind: { $ref: "#/components/schemas/StepKindPayload" }
    StepKindVersionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/StepKindVersion" } }
    JobEdit:
      type: object
      required: [priority]
      additionalProperties: false
      properties:
        priority: { type: integer, minimum: -1000, maximum: 1000, description: "Start order in the queue, higher first" }
    JobLogLine:
      type: object
      required: [seq, t, level, msg]
      properties:
        seq: { type: integer, description: Line number in the job's log, from 1 }
        t: { type: string, format: date-time }
        level: { type: string, enum: [debug, info, warn, error] }
        msg: { type: string }
        fields: { type: object }
    JobLogPage:
      type: object
      required: [items, nextAfter]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/JobLogLine" } }
        nextAfter: { type: integer, description: "Pass as after= to read on (the last line number scanned)" }
    QueueLease:
      type: object
      required: [id, workerId, host, card, memoryCapMb, startedAt, heartbeatAt]
      properties:
        id: { type: string, description: "lse_…" }
        workerId: { type: string }
        runtime: { type: string }
        host: { type: string }
        card: { type: integer, description: "Card index; -1 for a step that needs no card" }
        memoryCapMb: { type: integer }
        startedAt: { type: string, format: date-time }
        heartbeatAt: { type: string, format: date-time }
        progress: { type: number }
        message: { type: string }
        stopReason: { type: string, enum: [cancelled, paused, window-closed], description: The stop the worker was told about }
    QueueEntry:
      type: object
      required: [jobId, kind, kindVersion, jobKind, state, priority, enqueuedAt, attempt]
      properties:
        jobId: { type: string }
        projectId: { type: string }
        pipelineRunId: { type: string }
        stepId: { type: string }
        runId: { type: string }
        kind: { type: string }
        kindVersion: { type: string }
        jobKind: { $ref: "#/components/schemas/JobKind" }
        gpu: { type: boolean }
        memoryGb: { type: number }
        state: { type: string, enum: [waiting, paused, running, stopping] }
        priority: { type: integer }
        projectPriority: { type: integer, description: "The project's queue priority (budgets.queuePriority): the first sort key, before priority" }
        enqueuedAt: { type: string, format: date-time }
        estimateSeconds: { type: number }
        attempt: { type: integer }
        resumeFrom: { type: string, description: "The training state it resumes from (b3 hash), after a pause or a window close" }
        lease: { $ref: "#/components/schemas/QueueLease" }
    QueueEntryList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/QueueEntry" } }
    AvailabilityWindow:
      type: object
      required: [days, start, end]
      additionalProperties: false
      properties:
        days:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
          description: Days the window opens on (a window past midnight belongs to the day it opens)
        start: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "Opens at HH:MM" }
        end: { type: string, pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$", description: "Closes at HH:MM (24:00 = midnight); before start = the next day" }
        timezone: { type: string, maxLength: 64, description: "IANA time zone, e.g. Europe/Berlin; empty follows the instance time zone (policies.timezone)" }
    AvailabilityWindows:
      type: object
      description: >
        R19: job kind → the windows in which a job of that kind may run on the card. A kind without an entry may run
        any time. A job starts only when its estimate fits before its window closes; a running training job is
        paused at the close and resumes from its training state when a window opens.
      additionalProperties:
        type: array
        maxItems: 28
        items: { $ref: "#/components/schemas/AvailabilityWindow" }
    CardTelemetryReport:
      allOf:
        - $ref: "#/components/schemas/CardTelemetry"
        - type: object
          required: [reportedAt]
          properties:
            reportedAt: { type: string, format: date-time }

    # ---------------------------------------------------------------- artifacts and pipelines schemas (stream P) — add below
    Artifact:
      type: object
      required: [hash, type, size, directory, meta, createdAt]
      properties:
        hash: { type: string, description: "b3:<64 hex>, BLAKE3-256 of the content (of the manifest for a directory)" }
        type: { type: string, description: "Artifact type (text, dataset, mix, base_model, checkpoint, calibration, …)" }
        size: { type: integer, format: int64, description: "Bytes: the file's, or the sum of a directory's files" }
        directory: { type: boolean, description: "A directory artifact: a manifest of files, each its own blob" }
        meta: { type: object, description: "Neutral, self-describing metadata of the type (R42)" }
        projectId: { type: string, description: "The project that first produced it; absent for a registry artifact" }
        producer: { $ref: "#/components/schemas/ArtifactProducer" }
        createdAt: { type: string, format: date-time }
        files:
          type: array
          description: A directory artifact's files, by path
          items:
            type: object
            required: [path, hash, size]
            properties:
              path: { type: string }
              hash: { type: string }
              size: { type: integer, format: int64 }
        encoding: { type: string, description: "How content is encoded (content=true): utf8 or base64" }
        content: { type: string, description: "The content (content=true, at most 1 MiB)" }
        contentOmitted: { type: string, description: "Why content was not included (too large, a directory without path, …)" }
        evicted: { $ref: "#/components/schemas/ArtifactEviction" }
    ArtifactProducer:
      type: object
      required: [pipelineRunId, stepId, step, output]
      description: The pipeline step whose output first recorded this artifact
      properties:
        pipelineRunId: { type: string }
        stepId: { type: string, description: "pls_…" }
        step: { type: string, description: "The step's id in the pipeline file" }
        output: { type: string }
    PipelineList:
      type: object
      required: [ref, items]
      properties:
        ref: { type: string }
        commit: { type: string, description: "The commit ref resolved to; absent when the project has no repository" }
        items: { type: array, items: { $ref: "#/components/schemas/Pipeline" } }
    Pipeline:
      type: object
      required: [name, source, path, version, inputs, steps]
      properties:
        name: { type: string }
        description: { type: string }
        source: { type: string, enum: [repository, template], description: "The project repository, or a bundled template the repository has no file for" }
        path: { type: string, description: "pipelines/<name>.yaml" }
        version: { type: string, description: "The commit that last changed the file (a template: template-<sha256 prefix>); pipelines.run takes it as If-Match" }
        inputs: { type: object, additionalProperties: { type: string }, description: Pipeline input → artifact type }
        steps: { type: array, items: { $ref: "#/components/schemas/PipelineStepDefinition" } }
        error: { type: string, description: The file does not parse (steps and inputs are then empty) }
    PipelineStepDefinition:
      type: object
      required: [id, kind]
      properties:
        id: { type: string }
        kind: { type: string, description: "kind@version, pinned" }
        in: { type: object, additionalProperties: { type: string }, description: "Step input → $inputs.<name> or <step>.<output>" }
        params: { type: object, description: Only the parameters that depart from defaults }
        optional: { type: boolean, default: false, description: "The step's failure does not fail the run: the steps that read its outputs (optional too) are skipped and the run ends done without them" }
    PipelineRunNew:
      type: object
      additionalProperties: false
      properties:
        ref: { type: string, maxLength: 200, description: "Branch, tag or commit to read the pipeline at (default main)" }
        inputs:
          type: object
          description: Pipeline input → artifact (it must be in the content store)
          additionalProperties: { $ref: "#/components/schemas/ArtifactRef" }
        params:
          type: object
          description: "Step id → parameter overrides (recorded as departures when they differ from the default)"
          additionalProperties: { type: object }
        fresh: { type: boolean, default: false, description: Run every step even when a finished step has the same input hash }
        priority: { type: integer, minimum: -100, maximum: 100, default: 0, description: "Queue priority of the step jobs (higher first)" }
    PipelinePlan:
      type: object
      required: [pipeline, source, version, steps, estimate]
      properties:
        pipeline: { type: string }
        source: { type: string, enum: [repository, template] }
        ref: { type: string }
        commit: { type: string }
        version: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/PipelinePlanStep" } }
        estimate: { $ref: "#/components/schemas/PipelineEstimate" }
    PipelinePlanStep:
      type: object
      required: [step, kind, kindVersion, params, departures, in, produces, resources]
      properties:
        step: { type: string }
        kind: { type: string }
        kindVersion: { type: string }
        stepKindVersionId: { type: string, description: "The step kind's registry version (ver_…)" }
        runtime: { type: string }
        params: { type: object, description: Resolved parameters (defaults applied) }
        departures: { type: array, items: { $ref: "#/components/schemas/ParamDeparture" } }
        in: { type: object, additionalProperties: { type: string } }
        produces: { type: object, additionalProperties: { type: string }, description: Output → artifact type }
        resources: { $ref: "#/components/schemas/StepResources" }
        estimateSeconds: { type: number, description: Absent when unknown }
    PipelineEstimate:
      type: object
      required: [known, unknownSteps]
      properties:
        known: { type: boolean, description: Every step has an estimate }
        seconds: { type: number, description: Sum of the known step estimates }
        gpuHours: { type: number, description: Sum over the steps that need a card }
        unknownSteps: { type: array, items: { type: string }, description: Steps without an estimate }
    ParamDeparture:
      type: object
      required: [param, value]
      properties:
        param: { type: string }
        value: { description: The value the step runs with }
        default: { description: "The default (x-cadence.defaultRef in defaults.yaml, else x-cadence.default); absent when the parameter has none" }
    PipelineRunState: { type: string, enum: [running, done, failed, cancelled] }
    PipelineStepState: { type: string, enum: [waiting, queued, running, done, reused, failed, skipped, cancelled] }
    PipelineRunSummary:
      type: object
      required: [id, projectId, pipeline, source, version, state, rev, actor, createdAt, updatedAt]
      properties:
        id: { type: string, description: "plr_…" }
        projectId: { type: string }
        pipeline: { type: string }
        source: { type: string, enum: [repository, template, inline] }
        ref: { type: string }
        commit: { type: string, description: The commit the pipeline was read at }
        version: { type: string, description: "The pipeline's version (commit that last changed its file)" }
        state: { $ref: "#/components/schemas/PipelineRunState" }
        runId: { type: string, description: "The training run this pipeline run belongs to (run_…), when a facade started it" }
        fresh: { type: boolean }
        priority: { type: integer }
        inputs: { type: object, additionalProperties: { $ref: "#/components/schemas/ArtifactRef" } }
        error: { type: string, description: Why the run failed }
        rev: { type: integer }
        actor: { $ref: "#/components/schemas/Actor" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    PipelineRun:
      allOf:
        - $ref: "#/components/schemas/PipelineRunSummary"
        - type: object
          required: [steps]
          properties:
            steps: { type: array, items: { $ref: "#/components/schemas/PipelineStep" } }
    PipelineRunList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PipelineRunSummary" } }
    PipelineStep:
      type: object
      required: [id, step, position, kind, kindVersion, state, params, departures, in, produces, attempts, attemptLog]
      properties:
        id: { type: string, description: "pls_…" }
        step: { type: string, description: The step's id in the pipeline file }
        position: { type: integer, description: Order of execution (topological) }
        kind: { type: string }
        kindVersion: { type: string }
        stepKindVersionId: { type: string }
        state: { $ref: "#/components/schemas/PipelineStepState" }
        params: { type: object, description: Resolved parameters }
        departures: { type: array, items: { $ref: "#/components/schemas/ParamDeparture" } }
        in: { type: object, additionalProperties: { type: string }, description: Wiring from the pipeline file }
        inputs: { type: object, additionalProperties: { $ref: "#/components/schemas/ArtifactRef" }, description: Resolved inputs once the step is ready }
        produces: { type: object, additionalProperties: { type: string } }
        outputs: { type: object, additionalProperties: { $ref: "#/components/schemas/ArtifactRef" } }
        resources: { $ref: "#/components/schemas/StepResources" }
        estimateSeconds: { type: number }
        inputHash: { type: string, description: "Hash of kind, version, the runtime version that published it, resolved parameters and input hashes: a finished step with the same one is reused" }
        reusedFrom: { type: string, description: "The finished step (pls_…) whose outputs were reused" }
        attempts: { type: integer }
        jobId: { type: string, description: The current attempt's step job }
        error: { $ref: "#/components/schemas/StepError" }
        metrics: { type: object, additionalProperties: { type: number } }
        attemptLog: { type: array, items: { $ref: "#/components/schemas/PipelineStepAttempt" } }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    PipelineStepAttempt:
      type: object
      required: [attempt, jobId, reason, state]
      properties:
        attempt: { type: integer }
        jobId: { type: string }
        reason: { type: string, enum: [initial, oom, lost, retry, resume], description: "Why the attempt started: the first, the automatic OOM retry at 0.75× batch, the retry after a lost lease, pipelineRuns.retry, or runs.resume" }
        batchScale: { type: number }
        resumeFrom: { type: string, description: "The training-state artifact the attempt resumes from (runs.resume)" }
        state: { type: string, enum: [queued, running, done, failed, cancelled] }
        error: { $ref: "#/components/schemas/StepError" }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    PipelineRunRetry:
      type: object
      additionalProperties: false
      properties:
        step: { type: string, maxLength: 63, description: "The step id to retry (default: every failed step)" }
        batchScale: { type: number, format: double, exclusiveMinimum: 0, maximum: 1, description: "Batch scale of the new attempt (1 = full batch)" }

    # ---------------------------------------------------------------- data entities and imports schemas (stream D) — add below
    SourceKind:
      type: string
      enum: [public, production, synthetic]
    Source:
      type: object
      description: "A corpus in the registry (R18): licence, kind, languages; eval-only until a person clears it for training"
      required: [id, name, description, licence, kind, languages, url, trainingCleared, archived, rev, utterances, hours, datasets, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, description: "src_…" }
        name: { type: string, example: fleurs }
        description: { type: string }
        licence: { type: string, example: CC-BY-4.0 }
        kind: { $ref: "#/components/schemas/SourceKind" }
        languages: { type: array, items: { type: string }, example: [he-IL] }
        url: { type: string, description: "Where the corpus comes from, e.g. hf://datasets/google/fleurs" }
        trainingCleared: { type: boolean, description: "false = eval-only: its dataset versions cannot be mixed or trained on" }
        clearedBy: { $ref: "#/components/schemas/Actor" }
        clearedAt: { type: string, format: date-time }
        archived: { type: boolean }
        rev: { type: integer }
        utterances: { type: integer, description: Utterances this source owns }
        hours: { type: number, format: double, description: Their total duration in hours }
        datasets: { type: array, items: { type: string }, description: "Dataset version ids built from this source (sources.get only; empty in lists)" }
        clearances: { type: array, items: { $ref: "#/components/schemas/SourceClearance" }, description: "Licence and training-clearance history, oldest first (sources.get only)" }
        ingests: { type: array, items: { $ref: "#/components/schemas/SourceIngest" }, description: "Imports and ingests that registered dataset versions from this source, newest first (sources.get only; at most 100)" }
        createdBy: { $ref: "#/components/schemas/Actor" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SourceList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Source" } }
    SourceEdit:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        description: { type: string, maxLength: 2000 }
        licence: { type: string, minLength: 1, maxLength: 200 }
        trainingCleared: { type: boolean, description: "true clears the source for training (a person's decision); false makes it eval-only again" }
    DatasetSplitName:
      type: string
      enum: [train, validation, test]
    TranscriptOrigin:
      type: string
      description: "human, pseudo-label, or model:<id> for a single model's output"
      pattern: "^(human|pseudo-label|model:.+)$"
    Transcript:
      type: object
      required: [id, text, origin, createdAt]
      properties:
        id: { type: string, description: "trn_…" }
        text: { type: string }
        origin: { $ref: "#/components/schemas/TranscriptOrigin" }
        confidence: { type: number, format: double, minimum: 0, maximum: 1 }
        createdAt: { type: string, format: date-time }
    UtteranceMembership:
      type: object
      required: [datasetVersionId, split, transcriptId]
      properties:
        datasetVersionId: { type: string }
        split: { $ref: "#/components/schemas/DatasetSplitName" }
        transcriptId: { type: string, description: The transcript this dataset version uses }
    Utterance:
      type: object
      description: One audio segment in the content store; its content hash is its identity
      required: [id, contentHash, sourceId, sourceName, duration, language, speaker, sampleRate, channels, bytes, transcripts, createdAt]
      properties:
        id: { type: string, description: "utt_…" }
        contentHash: { type: string, pattern: "^b3:[0-9a-f]{64}$", description: BLAKE3-256 of the audio file's bytes (its blob in the content store) }
        sourceId: { type: string }
        sourceName: { type: string }
        duration: { type: number, format: double, description: Seconds }
        language: { type: string, example: he-IL }
        speaker: { type: string, description: "Speaker id within the source; empty when unknown" }
        sampleRate: { type: integer, example: 16000 }
        channels: { type: integer, example: 1 }
        bytes: { type: integer, format: int64 }
        transcripts: { type: array, items: { $ref: "#/components/schemas/Transcript" } }
        split: { $ref: "#/components/schemas/DatasetSplitName" }
        fingerprints: { type: object, additionalProperties: { type: string }, description: "Kind → value (audio-b3, …); utterances.get only" }
        datasets: { type: array, items: { $ref: "#/components/schemas/UtteranceMembership" }, description: "utterances.get only" }
        uris: { type: array, items: { type: string }, description: "Where the audio also lives: mount://<name>/<path>[#t=<start>,<end>][&ch=<n>] (utterances.get only)" }
        createdAt: { type: string, format: date-time }
    UtteranceList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Utterance" } }
        next: { type: string, description: Pass as `after` for the next page; absent on the last page }
    DatasetLanguage:
      type: object
      required: [language, utterances, hours]
      properties:
        language: { type: string }
        utterances: { type: integer }
        hours: { type: number, format: double }
    DatasetLineage:
      type: object
      description: Where an imported dataset version came from
      properties:
        pipelineRunId: { type: string }
        stepId: { type: string }
        projectId: { type: string }
        stepKind: { type: string, example: dataset_import@1 }

    # ---------------------------------------------------------------- notifications and operations schemas (stream O) — add below

    NotificationClass:
      type: string
      enum: [approval_requested, failure, outcome, progress, digest]
      description: >
        Event class of the routing table: approval_requested (agent, automation, registry); failure (job failed, mount
        unhealthy, card closed, backup failed); outcome (gate verdict, promotion, schedule finished, batch closed);
        progress (step done, checkpoint saved, triage item added); digest (the daily digest)
    NotificationTiming:
      type: string
      enum: [immediate, digest, daily, none]
      description: "immediate: sent as it happens; digest: held for the next daily digest; daily: the digest itself (its rule only); none: never sent"
    NotificationChannels:
      type: object
      required: [inApp, telegram]
      properties:
        inApp: { type: boolean, description: The in-app notification history }
        telegram: { type: boolean, description: The Telegram bot (allow-listed chats only) }
    NotificationRule:
      type: object
      required: [id, eventClass, label, events, channels, timing, bypassQuietHours, rev, updatedAt, departures]
      properties:
        id: { type: string, description: "ntr_<class>" }
        eventClass: { $ref: "#/components/schemas/NotificationClass" }
        label: { type: string, description: What the row covers, as the Settings table shows it }
        events: { type: array, items: { type: string }, description: The event types the class covers }
        channels: { $ref: "#/components/schemas/NotificationChannels" }
        timing: { $ref: "#/components/schemas/NotificationTiming" }
        bypassQuietHours: { type: boolean, description: "Failures reach Telegram even in quiet hours; fixed per class" }
        rev: { type: integer }
        updatedAt: { type: string, format: date-time }
        departures: { type: array, items: { type: string }, description: "Fields that differ from the seeded table (channels.telegram, timing, …)" }
    NotificationRuleList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/NotificationRule" } }
    NotificationRuleEdit:
      type: object
      additionalProperties: false
      properties:
        channels:
          type: object
          additionalProperties: false
          properties:
            inApp: { type: boolean }
            telegram: { type: boolean }
        timing: { $ref: "#/components/schemas/NotificationTiming" }
    ClockTime:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: "HH:MM on a 24-hour clock, in the instance timezone (policies)"
    QuietHours:
      type: object
      required: [enabled, start, end]
      properties:
        enabled: { type: boolean }
        start: { $ref: "#/components/schemas/ClockTime" }
        end: { $ref: "#/components/schemas/ClockTime" }
    TelegramChat:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int64, description: Telegram chat id (negative for groups) }
        title: { type: string, description: "Chat title or @username, as Telegram last reported it" }
        seenAt: { type: string, format: date-time }
    TelegramStatus:
      type: object
      required: [tokenSet, chats, pendingChats, polling]
      properties:
        tokenSet: { type: boolean, description: "A token is stored (secret telegram-bot-token); the value is never returned" }
        botUsername: { type: string, description: "@username from the last successful getMe" }
        chats: { type: array, items: { $ref: "#/components/schemas/TelegramChat" }, description: Allow-listed chats; the bot talks to no one else }
        pendingChats:
          type: array
          items: { $ref: "#/components/schemas/TelegramChat" }
          description: Chats that wrote to the bot but are not allow-listed (the bot never answers them); add one to the allowlist to use it
        polling: { type: boolean, description: The control plane is long-polling Telegram for button presses }
        lastError: { type: string, description: The last Bot API error, if the last call failed }
        lastSentAt: { type: string, format: date-time }
    NotificationSettings:
      type: object
      required: [rev, updatedAt, timezone, quietHours, digestTime, telegram]
      properties:
        rev: { type: integer }
        updatedAt: { type: string, format: date-time }
        timezone: { type: string, description: The instance timezone quiet hours and the digest follow (policies.timezone) }
        quietHours: { $ref: "#/components/schemas/QuietHours" }
        digestTime: { $ref: "#/components/schemas/ClockTime" }
        telegram: { $ref: "#/components/schemas/TelegramStatus" }
    NotificationSettingsEdit:
      type: object
      additionalProperties: false
      properties:
        quietHours:
          type: object
          additionalProperties: false
          properties:
            enabled: { type: boolean }
            start: { $ref: "#/components/schemas/ClockTime" }
            end: { $ref: "#/components/schemas/ClockTime" }
        digestTime: { $ref: "#/components/schemas/ClockTime" }
        telegramChats:
          type: array
          maxItems: 20
          items: { type: integer, format: int64 }
          description: The complete allowlist of Telegram chat ids
    TelegramBotSet:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, writeOnly: true, minLength: 20, maxLength: 200, pattern: "^[0-9]+:[A-Za-z0-9_-]+$", description: "Write-only: the token @BotFather issued (123456:ABC…)" }
    TelegramBotVerify:
      type: object
      required: [ok, chats]
      properties:
        ok: { type: boolean, description: The token works and every allow-listed chat got the test message }
        botUsername: { type: string }
        error: { type: string, description: Why the token check failed }
        chats:
          type: array
          items:
            type: object
            required: [id, delivered]
            properties:
              id: { type: integer, format: int64 }
              delivered: { type: boolean }
              error: { type: string }

    BackupState:
      type: string
      enum: [queued, running, succeeded, failed]
    BackupTrigger:
      type: string
      enum: [nightly, weekly, manual]
      description: "nightly and weekly are scheduled (the weekly set is the one taken on the restore-test day and is kept longer); manual is backups.new"
    RestoreTest:
      type: object
      required: [state, startedAt]
      properties:
        state: { type: string, enum: [running, passed, failed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        durationMs: { type: integer, format: int64 }
        database: { type: string, description: The scratch database (dropped afterwards) }
        migrationVersion: { type: integer, format: int64, description: The latest migration in the restored database }
        tables:
          type: array
          items:
            type: object
            required: [name, backedUp, restored]
            properties:
              name: { type: string }
              backedUp: { type: integer, format: int64, description: Row count when the set was taken }
              restored: { type: integer, format: int64, description: Row count in the scratch database }
        casChecked: { type: integer, description: Content-store blobs sampled and re-hashed }
        error: { type: string }
    Backup:
      type: object
      required: [id, state, trigger, rev, createdAt]
      properties:
        id: { type: string, description: "bkp_…" }
        state: { $ref: "#/components/schemas/BackupState" }
        trigger: { $ref: "#/components/schemas/BackupTrigger" }
        rev: { type: integer }
        jobId: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        path: { type: string, description: The set's directory under CADENCE_BACKUP_DIR }
        dumpBytes: { type: integer, format: int64 }
        dumpSha256: { type: string }
        pgDumpVersion: { type: string }
        serverVersion: { type: string }
        migrationVersion: { type: integer, format: int64 }
        tables:
          type: array
          description: Row counts of the key tables when the set was taken
          items:
            type: object
            required: [name, rows]
            properties:
              name: { type: string }
              rows: { type: integer, format: int64 }
        casBlobs: { type: integer, format: int64, description: Blobs in the content store when the set was taken }
        casCopied: { type: integer, format: int64, description: New blobs copied by this set (blobs are immutable; older ones were copied before) }
        casBytesCopied: { type: integer, format: int64 }
        error: { type: string }
        restoreTest: { $ref: "#/components/schemas/RestoreTest" }
        prunedAt: { type: string, format: date-time, description: When retention removed the set's files (the record stays) }
    BackupSchedule:
      type: object
      required: [directory, nightlyAt, restoreTestWeekday, restoreTestAt, keepNightly, keepWeekly, timezone]
      properties:
        directory: { type: string, description: CADENCE_BACKUP_DIR }
        nightlyAt: { $ref: "#/components/schemas/ClockTime" }
        restoreTestWeekday: { type: string, enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday] }
        restoreTestAt: { $ref: "#/components/schemas/ClockTime" }
        keepNightly: { type: integer }
        keepWeekly: { type: integer }
        timezone: { type: string }
        nextBackupAt: { type: string, format: date-time }
        nextRestoreTestAt: { type: string, format: date-time }
    BackupList:
      type: object
      required: [items, schedule]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Backup" } }
        schedule: { $ref: "#/components/schemas/BackupSchedule" }
        lastRestoreTest:
          type: object
          required: [backupId, report]
          properties:
            backupId: { type: string }
            report: { $ref: "#/components/schemas/RestoreTest" }

    # ---------------------------------------------------------------- runs, checkpoints, metrics schemas (wave 2 · stream R) — add below
    RunStatus:
      type: string
      enum: [queued, running, paused, done, failed, cancelled]
      description: "Mirrors the run's pipeline run: queued (a step waits for a card), running (a worker holds a step), paused (its step job is paused), done, failed, cancelled"
    RunMixRef:
      type: object
      required: [id, name, revision, hash]
      properties:
        id: { type: string, description: "mix_…" }
        name: { type: string }
        revision: { type: integer, description: The mix revision the run trains on }
        hash: { type: string, description: "The mix artifact (b3:…): the content hash of the resolved input_cfg (R13)" }
    RunRecipe:
      type: object
      required: [pipeline, source, version]
      description: "The pipeline the run executes, read at a commit of the project repository"
      properties:
        pipeline: { type: string }
        source: { type: string, enum: [repository, template, inline] }
        ref: { type: string }
        commit: { type: string }
        version: { type: string }
    RunStage:
      type: object
      additionalProperties: false
      required: [peakLr]
      properties:
        checkpoint: { type: string, description: "The checkpoint to start from (ckp_… of this run); default the run's best kept checkpoint" }
        peakLr: { type: number, format: double, exclusiveMinimum: 0, maximum: 1, description: "The new stage's peak learning rate (the train step's peak_lr, learning_rate or lr parameter)" }
        mix: { type: string, maxLength: 200, description: "The mix (default the parent's)" }
        mixRevision: { type: integer, minimum: 1, description: "The mix revision (default the named mix's current one, or the parent's revision when the mix is the parent's)" }
        steps: { type: integer, minimum: 1, description: "Step budget (default training.steps)" }
        seed: { type: integer, minimum: 0, maximum: 2147483647 }
        precision: { $ref: "#/components/schemas/Precision" }
        compute: { type: string }
        pipeline: { type: string, maxLength: 63, description: "The recipe (default the parent's pipeline)" }
        ref: { type: string, maxLength: 200 }
        params: { type: object, description: "More overrides of the train step's parameters" }
        priority: { type: integer, minimum: -100, maximum: 100, default: 0 }
    RunCalibrate:
      type: object
      additionalProperties: false
      required: [mix]
      properties:
        baseModel: { type: string, description: "Base model version (ver_…), collection name or @alias; default the defaults' base model" }
        mix: { type: string, maxLength: 200, description: "The mix whose data the calibration measures on (mix_… or name)" }
        mixRevision: { type: integer, minimum: 1 }
        precision: { $ref: "#/components/schemas/Precision" }
        compute: { type: string, description: "Host id or name; default the first host whose card allows training" }
        params: { type: object, description: "Overrides of the calibrate step's parameters" }
    CalibrationKey:
      type: object
      required: [baseModel, cardClass, memoryCapGb, precision]
      description: "What a measured estimate is cached by (R12); the bucket configuration is part of the measurement"
      properties:
        baseModel: { type: string, description: The base model's registry collection }
        cardClass: { type: string }
        memoryCapGb: { type: number, format: double }
        precision: { $ref: "#/components/schemas/Precision" }
    RunCalibration:
      type: object
      required: [key, family, step]
      properties:
        key: { $ref: "#/components/schemas/CalibrationKey" }
        family: { type: string, description: The model family whose calibrate role runs }
        step: { type: string, description: "The calibrate step kind (kind@version)" }
        mix: { $ref: "#/components/schemas/RunMixRef" }
        pipelineRun: { $ref: "#/components/schemas/PipelineRun" }
        plan: { $ref: "#/components/schemas/PipelinePlan" }
        current:
          type: object
          description: The calibration cached for the key so far, when there is one
          properties:
            secondsPerStep: { type: number, format: double }
            plusMinus: { type: number, format: double }
            measuredAt: { type: string, format: date-time }
    RunStageEntry:
      type: object
      required: [step, kind, kindVersion, state, attempts]
      description: One step of the run's pipeline run, for the Run panel's stage timeline
      properties:
        step: { type: string }
        kind: { type: string }
        kindVersion: { type: string }
        role: { type: string, description: "The family role the step fills (calibrate, train, average, …), when it fills one" }
        state: { $ref: "#/components/schemas/PipelineStepState" }
        attempts: { type: integer }
        batchScale: { type: number, format: double, description: "The current attempt's batch scale (0.75 after an out-of-memory retry)" }
        oomRetries: { type: integer, description: Attempts started by the automatic OOM retry }
        reusedFrom: { type: string, description: "The finished step (pls_…) whose outputs this step reused (same input hash); it spent no GPU time" }
        reusedFromRun: { type: string, description: "The run (run_…) that step belongs to, when it was a run's" }
        jobId: { type: string }
        paused: { type: boolean, description: The step's job is paused (jobs.pause) }
        estimateSeconds: { type: number, format: double }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        error: { $ref: "#/components/schemas/StepError" }
    RunDeparture:
      type: object
      required: [step, param, value]
      properties:
        step: { type: string, description: The pipeline step the parameter belongs to }
        param: { type: string }
        value: { description: The value the step runs with }
        default: { description: "The default; absent when the parameter has none" }
    RunParentDiff:
      type: object
      required: [param, value]
      properties:
        param: { type: string, description: "A resolved train-step parameter, or a run field (init, mix, pipeline)" }
        value: { description: This run's value }
        parentValue: { description: "The parent's value; absent when the parent had none" }
    Run:
      type: object
      required: [id, projectId, status, init, baseModel, family, mix, recipe, pipelineRunId, trainStep, steps, gpus, precision,
        timeline, departures, finalMetrics, checkpointCount, rev, actor, createdAt, updatedAt]
      properties:
        id: { type: string, description: "run_…" }
        projectId: { type: string }
        status: { $ref: "#/components/schemas/RunStatus" }
        init: { $ref: "#/components/schemas/RunInit" }
        baseModel: { $ref: "#/components/schemas/RegistryVersion" }
        checkpointId: { type: string, description: "init checkpoint: the checkpoint the run starts from" }
        parentRunId: { type: string, description: "The run the start checkpoint came from (runs.stage)" }
        experimentId: { type: string, description: "The experiment the run belongs to (exp_…)" }
        sweepId: { type: string, description: "The sweep that generated the run (swp_…)" }
        family:
          type: object
          required: [name, versionId]
          properties:
            name: { type: string, description: The model family of the base model (R41) }
            versionId: { type: string, description: "The family descriptor's registry version (ver_…)" }
        mix: { $ref: "#/components/schemas/RunMixRef" }
        recipe: { $ref: "#/components/schemas/RunRecipe" }
        pipelineRunId: { type: string, description: "The pipeline run the run mirrors (plr_…)" }
        trainStep: { type: string, description: "The step of the pipeline that fills the family's train role" }
        steps: { type: integer, description: Step budget }
        seed: { type: integer }
        gpus: { type: integer }
        precision: { $ref: "#/components/schemas/Precision" }
        runtime:
          type: object
          description: "The runtime the train step runs in: registry version and image digest"
          properties:
            name: { type: string }
            versionId: { type: string }
            digest: { type: string }
        card:
          type: object
          description: The card the estimate was made for
          properties:
            computeId: { type: string }
            host: { type: string }
            index: { type: integer }
            cardClass: { type: string }
            memoryCapGb: { type: number, format: double }
        estimate: { $ref: "#/components/schemas/RunEstimate" }
        timeline: { type: array, items: { $ref: "#/components/schemas/RunStageEntry" } }
        currentJobId: { type: string, description: "The step job to pause, resume or cancel (jobs.pause | jobs.resume | jobs.cancel)" }
        resumedFrom: { type: string, description: "The training-state the last runs.resume continued from" }
        departures: { type: array, items: { $ref: "#/components/schemas/RunDeparture" }, description: "Parameters that differ from defaults.yaml, per step" }
        parentDiff: { type: array, items: { $ref: "#/components/schemas/RunParentDiff" }, description: "Where this run's train-step parameters differ from the parent's" }
        finalMetrics: { type: object, additionalProperties: { type: number }, description: "The train step's final metrics (val_wer, …)" }
        bestCheckpointId: { type: string, description: The kept checkpoint with the lowest validation WER }
        checkpointCount: { type: integer }
        gpuHours: { type: number, format: double, description: "GPU-hours the run's leases on GPU cards used so far" }
        error: { type: string }
        rev: { type: integer }
        actor: { $ref: "#/components/schemas/Actor" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    RunList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Run" } }
    Checkpoint:
      type: object
      required: [id, runId, projectId, artifact, kind, kept, createdAt]
      properties:
        id: { type: string, description: "ckp_…" }
        runId: { type: string }
        projectId: { type: string }
        artifact: { type: string, description: "The checkpoint artifact (b3:…); artifacts.get lists its files" }
        kind: { type: string, enum: [trained, averaged] }
        step: { type: integer, format: int64, description: The optimiser step it was saved at }
        valWer: { type: number, format: double, description: "Validation WER the step measured (0–1)" }
        family: { type: string }
        weightsHash: { type: string }
        averagedFrom: { type: array, items: { type: string }, description: "The checkpoints an averaged one was made from (ckp_…)" }
        kept: { type: boolean, description: "In its run's top k by validation WER (training.keep_top_k)" }
        rank: { type: integer, description: "1 = the run's best by validation WER" }
        pipelineRunId: { type: string }
        stepId: { type: string }
        meta: { type: object, description: The artifact's neutral metadata (R42) }
        createdAt: { type: string, format: date-time }
    CheckpointList:
      type: object
      required: [items, keepTopK]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Checkpoint" } }
        keepTopK: { type: integer, description: "training.keep_top_k" }
    CheckpointAverage:
      type: object
      additionalProperties: false
      required: [checkpoints]
      properties:
        checkpoints: { type: array, minItems: 2, maxItems: 20, items: { type: string }, description: "Checkpoints of the run (ckp_…)" }
        params: { type: object, description: "Overrides of the average step's parameters" }
    CheckpointAverageStarted:
      type: object
      required: [runId, step, checkpoints]
      properties:
        runId: { type: string }
        step: { type: string, description: "The average step kind (kind@version)" }
        checkpoints: { type: array, items: { type: string } }
        pipelineRun: { $ref: "#/components/schemas/PipelineRun" }
        plan: { $ref: "#/components/schemas/PipelinePlan" }
    MetricAxis:
      type: string
      enum: [step, epoch, wall, gpuHours]
      default: step
      description: "step: optimiser step; epoch; wall: seconds since the run's first point; gpuHours: GPU-hours of the run's leases on GPU cards up to the point (wall hours when it had none)"
    MetricBin:
      type: object
      required: [x, value, min, max, count]
      description: "One point, or the bucket of points a long series was binned into: mean value with min and max (R53)"
      properties:
        x: { type: number, format: double }
        value: { type: number, format: double }
        min: { type: number, format: double }
        max: { type: number, format: double }
        count: { type: integer }
        step: { type: integer, format: int64, description: The last optimiser step in the bucket }
        epoch: { type: number, format: double }
        wallTime: { type: string, format: date-time, description: The last point's wall time }
    MetricSeriesView:
      type: object
      required: [name, total, binned, points]
      properties:
        name: { type: string }
        total: { type: integer, description: Points the series has (after afterStep) }
        binned: { type: boolean, description: The points are buckets }
        points: { type: array, items: { $ref: "#/components/schemas/MetricBin" } }
    MetricSeriesSet:
      type: object
      required: [runId, x, maxPoints, series, checkpoints]
      properties:
        runId: { type: string }
        x: { $ref: "#/components/schemas/MetricAxis" }
        maxPoints: { type: integer }
        lastStep: { type: integer, format: int64, description: "The highest optimiser step returned; pass it as afterStep to append" }
        series: { type: array, items: { $ref: "#/components/schemas/MetricSeriesView" } }
        checkpoints:
          type: array
          description: Checkpoint marks for the chart
          items:
            type: object
            required: [id, kept]
            properties:
              id: { type: string }
              step: { type: integer, format: int64 }
              valWer: { type: number, format: double }
              kind: { type: string }
              kept: { type: boolean }

    # ---------------------------------------------------------------- playbooks schemas (wave 2 · stream K) — add below
    PlaybookInputType:
      type: string
      enum: [dataset_version, base_model, integer, number, string, boolean]
    PlaybookInput:
      type: object
      required: [name, type, required, multiple]
      properties:
        name: { type: string }
        type: { $ref: "#/components/schemas/PlaybookInputType" }
        description: { type: string }
        required: { type: boolean, description: "The caller must give it: it has neither a defaultRef nor a project fact" }
        multiple: { type: boolean, description: A list of values (dataset versions) }
        defaultRef: { type: string, description: "A defaults.yaml key (training.steps) the value defaults to" }
        from: { type: string, enum: [project, adoption], description: "project: a project fact (the default base model); adoption: the project's adopted version of collection" }
        collection: { type: string, description: "from adoption: the registry collection (dataset/replay-base)" }
        default: { description: "The value it takes when not given: from defaults.yaml or the project (absent when there is none)" }
        min: { type: number, format: double, description: The safe range from defaults.yaml }
        max: { type: number, format: double }
    PlaybookStep:
      type: object
      required: [id, title, command, spending, available]
      properties:
        id: { type: string }
        title: { type: string }
        command: { type: string, description: "The operation (<entity>.<verb>) whose success ticks the step" }
        accepts: { type: array, items: { type: string }, description: Other operations that tick it too (mixes.edit for the mix step) }
        until: { type: string, enum: [terminal], description: "terminal: the step ticks when the job it waits for has ended (jobs.wait answered done; failed or cancelled fails it)" }
        phase: { type: integer, description: The roadmap phase that ships the step; a later phase than the running one lists it as skipped }
        spending: { type: boolean, description: "A GPU-spending command: in a playbook session it needs a successful dry run of the same operation first" }
        available: { type: boolean, description: "The step can run now (its phase has shipped)" }
    PlaybookStop:
      type: object
      required: [on, when]
      properties:
        on: { type: string, enum: [gate, budget, step, approval], description: What is watched }
        when: { type: string, description: "The outcome that stops the playbook: gate failed, budget exceeded, step failed, approval denied" }
    PlaybookStepEstimate:
      type: object
      required: [id, command, basis, skipped]
      properties:
        id: { type: string }
        command: { type: string }
        basis: { type: string, enum: [table, measured, hint, none], description: "table/measured: the operation's own dry-run estimate; hint: the playbook's estimate hint; none: spends no GPU time" }
        gpuHours: { $ref: "#/components/schemas/EstimateRange" }
        durationSeconds: { $ref: "#/components/schemas/EstimateRange" }
        skipped: { type: boolean, description: "The step's phase has not shipped: listed, not counted" }
        note: { type: string, description: Why a step has no estimate (e.g. the estimate table has no row) }
    PlaybookEstimate:
      type: object
      required: [basis, plusMinus, gpuHours, durationSeconds, steps]
      description: "The sum of the chain's step estimates (R12, R16); skipped steps are listed and not counted"
      properties:
        basis: { type: string, enum: [table, measured, mixed, hint, none] }
        plusMinus: { type: number, format: double, description: "The largest relative uncertainty of a counted step" }
        gpuHours: { $ref: "#/components/schemas/EstimateRange" }
        durationSeconds: { $ref: "#/components/schemas/EstimateRange" }
        budget:
          type: object
          required: [gpuHoursPerProjectPerDay, withinDailyBudget]
          properties:
            gpuHoursPerProjectPerDay: { type: number, format: double }
            withinDailyBudget: { type: boolean }
        steps: { type: array, items: { $ref: "#/components/schemas/PlaybookStepEstimate" } }
    Playbook:
      type: object
      required: [name, title, description, availableFrom, runnable, inputs, chain, stop, prompt]
      properties:
        name: { type: string, description: "templates/playbooks/<name>.yaml" }
        title: { type: string }
        description: { type: string }
        typicalCost: { type: string, description: "03 \"Playbooks\": the typical GPU-hours, as text" }
        availableFrom: { type: integer, description: The roadmap phase from which the playbook runs }
        runnable: { type: boolean, description: "It can run now (availableFrom has shipped)" }
        unavailable: { type: string, description: "Why it cannot run yet" }
        versionId: { type: string, description: "The registry template version (template/playbook-<name>)" }
        version: { type: string }
        inputs: { type: array, items: { $ref: "#/components/schemas/PlaybookInput" } }
        chain: { type: array, items: { $ref: "#/components/schemas/PlaybookStep" } }
        stop: { type: array, items: { $ref: "#/components/schemas/PlaybookStop" } }
        prompt: { type: string, description: The prompt template (Go text/template over .Inputs and .Project) }
        estimate: { $ref: "#/components/schemas/PlaybookEstimate" }
        estimateError: { type: string, description: "Why no estimate was computed (a required input is missing, the estimate table has no row)" }
    PlaybookList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Playbook" } }
    PlaybookRunNew:
      type: object
      additionalProperties: false
      properties:
        inputs:
          type: object
          additionalProperties: true
          description: "Input name → value (a dataset_version input with multiple takes a list); omitted inputs take their default or project fact"
        driver: { $ref: "#/components/schemas/AgentDriver" }
        model: { type: string, minLength: 1, maxLength: 200 }
    PlaybookPlanItem:
      type: object
      required: [id, title, command, state, spending]
      properties:
        id: { type: string }
        title: { type: string }
        command: { type: string }
        accepts: { type: array, items: { type: string } }
        until: { type: string, enum: [terminal] }
        phase: { type: integer }
        spending: { type: boolean }
        state: { type: string, enum: [pending, running, done, failed, skipped] }
        note: { type: string, description: "What ticked it: the entity or job, the dry run's estimate, why it failed" }
        commandId: { type: string, description: The command that ticked it }
        toolCallId: { type: string }
        entityId: { type: string, description: The entity the command created (mix_…, run_…) }
        jobId: { type: string, description: The job the command started (a later terminal step waits for it) }
        at: { type: string, format: date-time }
        estimate: { $ref: "#/components/schemas/PlaybookStepEstimate" }
    PlaybookRunResult:
      type: object
      required: [playbook, inputs, estimate, plan, prompt]
      properties:
        playbook: { $ref: "#/components/schemas/Playbook" }
        inputs: { type: object, additionalProperties: true, description: Every input resolved (given, default or project fact) }
        estimate: { $ref: "#/components/schemas/PlaybookEstimate" }
        plan: { type: array, items: { $ref: "#/components/schemas/PlaybookPlanItem" } }
        prompt: { type: string, description: The rendered prompt the session starts with }
        session: { $ref: "#/components/schemas/AgentSession" }
    AgentPlaybook:
      type: object
      required: [name, title, state, inputs, estimate, plan]
      description: "A playbook session's playbook: the plan ticks on the server when the session's matching command succeeds"
      properties:
        name: { type: string }
        title: { type: string }
        versionId: { type: string }
        state: { type: string, enum: [running, done, stopped], description: "done: every available step ticked; stopped: a stop condition ended it" }
        inputs: { type: object, additionalProperties: true }
        estimate: { $ref: "#/components/schemas/PlaybookEstimate" }
        plan: { type: array, items: { $ref: "#/components/schemas/PlaybookPlanItem" } }
        stop:
          type: object
          required: [on, when, message]
          properties:
            on: { type: string, enum: [gate, budget, step, approval] }
            when: { type: string }
            message: { type: string }
            at: { type: string, format: date-time }
        summary: { type: string, description: What the chain did, written when it ended }
        next: { type: string, description: The suggested next step }
        dryRuns: { type: array, items: { type: string }, description: Spending operations with a successful dry run in this session }
        nudges: { type: integer, description: Turns that ended without progress since the last tick (the server reminds the agent at most twice) }

    # ---------------------------------------------------------------- panels schemas (wave 2 · stream U) — add below
    RecipeEdit:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content: { type: string, maxLength: 1048576, description: The file's new content (UTF-8 text) }
        message: { type: string, minLength: 1, maxLength: 200, description: "Commit message (default: edit <path>)" }
    RecipeNew:
      type: object
      required: [path, content]
      additionalProperties: false
      properties:
        path: { $ref: "#/components/schemas/RecipePath" }
        content: { type: string, maxLength: 1048576, description: The file's content (UTF-8 text) }
        message: { type: string, minLength: 1, maxLength: 200, description: "Commit message (default: add <path>)" }

    # ---------------------------------------------------------------- content-store retention schemas (stream E) — add below
    ArtifactEvict:
      type: object
      additionalProperties: false
      description: Which artifacts to consider; empty means every superseded training state
      properties:
        type: { type: string, enum: [training-state], default: training-state, description: "The artifact type (v1: training-state only)" }
        runId: { type: string, maxLength: 100, description: "Only the states of this run (run_…)" }
        project: { type: string, maxLength: 100, description: "Only the states of this project (slug or id)" }
        olderThanDays: { type: integer, minimum: 0, maximum: 3650, description: "Only states recorded at least this many days ago" }
        hashes:
          type: array
          maxItems: 1000
          items: { type: string, pattern: "^b3:[0-9a-f]{64}$" }
          description: Exactly these artifacts; one that may not be evicted answers artifact-not-evictable
    EvictionPlan:
      type: object
      required: [artifacts, kept, bytesFreed, blobs, permanent]
      properties:
        artifacts:
          type: array
          description: The artifacts evicted (or, in a dry run, that would be)
          items: { $ref: "#/components/schemas/EvictionCandidate" }
        kept:
          type: array
          description: Training states the filter matched that stay, with the reason
          items: { $ref: "#/components/schemas/EvictionKept" }
        bytesFreed: { type: integer, format: int64, description: Bytes of the blobs deleted (files other artifacts list are not counted) }
        blobs: { type: integer, description: Blobs deleted (manifests and files) }
        permanent: { type: boolean, description: "True when no backup mirror is configured: nothing can bring the blobs back" }
        disk: { $ref: "#/components/schemas/StoreDisk" }
    StoreDisk:
      type: object
      required: [totalBytes, freeBytes, lowFreeFraction]
      description: The filesystem holding the content store, as the control plane sees it now
      properties:
        totalBytes: { type: integer, format: int64 }
        freeBytes: { type: integer, format: int64, description: Bytes available to the control plane }
        lowFreeFraction: { type: number, description: "Below this share free, Cadence warns (cache.store_low_free)" }
    EvictionKept:
      type: object
      required: [hash, reason]
      properties:
        hash: { type: string }
        runId: { type: string }
        reason: { type: string }
    EvictionCandidate:
      type: object
      required: [hash, type, size, createdAt]
      properties:
        hash: { type: string }
        type: { type: string }
        size: { type: integer, format: int64, description: "The artifact's size (a directory's files summed)" }
        projectId: { type: string }
        pipelineRunId: { type: string }
        runId: { type: string }
        reason: { type: string, description: Why it is evictable }
        createdAt: { type: string, format: date-time }
    ArtifactEviction:
      type: object
      required: [at, by]
      description: "The artifact's blobs were deleted from the content store; the backup mirror holds them"
      properties:
        at: { type: string, format: date-time }
        by: { $ref: "#/components/schemas/Actor" }
        jobId: { type: string }

    # ---------------------------------------------------------------- evaluation registry payloads (phase 3 · wave 0)
    NormalizerPayload:
      type: object
      description: "A scoring normalizer (R21): the text both sides of a WER are compared after. Registry kind normalizer, collection normalizer/<name>; the control plane renders it into a normalizer artifact (this JSON) for scorer steps"
      required: [locale, unicode, casefold, punctuation, removeMarks, mappings, numbers]
      properties:
        locale: { type: string, description: "BCP 47 locale it is meant for, or * for any" }
        unicode: { type: string, enum: [NFC, NFKC], description: Unicode normalisation form applied first }
        casefold: { type: boolean }
        punctuation: { type: string, enum: [keep, strip], description: "strip turns every Unicode punctuation character (categories P*) into a space" }
        removeMarks: { type: boolean, description: "Remove nonspacing combining marks (niqqud, accents) after canonical decomposition, then recompose in the unicode form" }
        mappings:
          type: array
          description: Literal replacements applied in order after the Unicode step and before punctuation
          items:
            type: object
            required: [from, to]
            properties:
              from: { type: string, minLength: 1 }
              to: { type: string }
        numbers: { type: string, enum: [keep], description: "keep compares numbers as written; spoken/written conversion through the pack's ITN arrives in phase 4" }
        description: { type: string }
    GoldenSetPayload:
      type: object
      description: "A frozen golden set (goldenSets.freeze): an eval-only dataset version tied to one scoring normalizer version. Runs never read it"
      required: [datasetVersionId, datasetHash, normalizerVersionId, locale, utterances, hours, fingerprint, groups]
      properties:
        datasetVersionId: { type: string }
        datasetHash: { type: string, description: "b3: hash of the dataset artifact" }
        normalizerVersionId: { type: string }
        locale: { type: string }
        domain: { type: string, description: "telephone, read speech, …" }
        utterances: { type: integer }
        hours: { type: number }
        fingerprint: { type: string, description: The dataset version's content fingerprint }
        groups: { type: string, enum: [call, speaker, utterance], description: "The bootstrap's resampling unit (R54): whole calls, else speakers, else utterances" }
        approvalId: { type: string }
    ModelPayload:
      type: object
      description: "A registered model version (models.register, R22): a checkpoint whose gate passed, published with its eval report and model card"
      required: [checkpointId, weightsHash, checkpointHash, familyId, baseModelVersionId, projectId, evalId, gate, lineage]
      properties:
        checkpointId: { type: string }
        weightsHash: { type: string }
        checkpointHash: { type: string, description: "b3: hash of the checkpoint artifact" }
        familyId: { type: string }
        baseModelVersionId: { type: string }
        projectId: { type: string }
        evalId: { type: string }
        gate:
          type: object
          required: [verdict, gatesSha]
          properties:
            verdict: { type: string, enum: [passed, failed] }
            gatesSha: { type: string, description: The commit SHA of the project's gates.yaml the verdict used }
        lineage:
          type: object
          properties:
            runId: { type: string }
            mixSha: { type: string }
            recipeSha: { type: string }
            datasetVersionIds: { type: array, items: { type: string } }
        card: { type: string, description: The generated model card (Markdown) }

    # ---------------------------------------------------------------- golden sets, normalizers, leakage schemas (phase 3 · stream G) — add below
    NormalizerVersion:
      allOf:
        - $ref: "#/components/schemas/RegistryVersion"
        - type: object
          required: [normalizer, usedBy]
          properties:
            normalizer: { $ref: "#/components/schemas/NormalizerPayload" }
            usedBy: { type: array, items: { $ref: "#/components/schemas/UsedBy" } }
    NormalizerVersionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/NormalizerVersion" } }
    GoldenSetVersion:
      allOf:
        - $ref: "#/components/schemas/RegistryVersion"
        - type: object
          required: [goldenSet, usedBy]
          properties:
            goldenSet: { $ref: "#/components/schemas/GoldenSetPayload" }
            usedBy: { type: array, items: { $ref: "#/components/schemas/UsedBy" } }
    GoldenSetVersionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/GoldenSetVersion" } }
    GoldenSetFreeze:
      type: object
      required: [datasetVersionId]
      additionalProperties: false
      properties:
        datasetVersionId: { type: string, minLength: 1, description: "The dataset version to freeze: ver_… or a dataset collection name (its newest frozen version); it must be registered eval-only" }
        normalizerVersionId: { type: string, minLength: 1, description: "The scoring normalizer: ver_… or a normalizer collection name (its newest frozen version); default defaults.yaml eval.normalizer" }
        name: { type: string, minLength: 1, description: "The golden set's collection, golden-set/<name> or <name>; default the dataset collection's name (dataset/replay-golden-he → golden-set/replay-golden-he)" }
        domain: { type: string, minLength: 1, description: "telephone, read-speech, …; default the dataset collection's domain:<x> tag, if any" }
        groups: { type: string, enum: [call, speaker, utterance], description: "The bootstrap's resampling unit (R54); default speaker when the dataset's utterances name speakers, else utterance" }

    # ---------------------------------------------------------------- evals, gates, models schemas (phase 3 · stream E) — add below
    EvalStatus:
      type: string
      enum: [queued, running, done, failed]
    EvalCellRole:
      type: string
      enum: [subject, baseline]
    EvalCellState:
      type: string
      description: "cached: an eval record already held the cell; queued / running: its steps wait or run; done: computed now; failed"
      enum: [cached, queued, running, done, failed]
    EvalSubjectRef:
      type: object
      description: Exactly one of the three
      properties:
        checkpointId: { type: string, description: "A checkpoint of this project (ckp_…)" }
        modelVersionId: { type: string, description: "A registered model version (ver_…, @alias or model/<name>)" }
        baseModelVersionId: { type: string, description: "A base model version (ver_…, @alias or base-model/<name>)" }
    EvalDecodingVariant:
      type: object
      required: [boost]
      properties:
        boost: { type: string, description: "none, or a boost list of the project's language pack at a commit: lang/<locale>/boost/<file>@<commit sha>" }
        weight: { type: number, format: double, minimum: 0, maximum: 100, description: "Boosting weight (with a boost list; default 1)" }
    EvalNew:
      type: object
      required: [subject]
      additionalProperties: false
      properties:
        subject: { $ref: "#/components/schemas/EvalSubjectRef" }
        goldenSets: { type: array, items: { type: string }, description: "Golden set versions (ver_…, @alias, golden-set/<name>); default: those gates.yaml names, else the project's adopted golden sets" }
        profiles: { type: array, items: { type: string }, description: "Latency profiles (R43); default: eval.matrix_profiles that the model families declare, plus the primary profile" }
        decoding: { type: array, items: { $ref: "#/components/schemas/EvalDecodingVariant" }, description: "Decoding variants (R24); default [{boost: none}]" }
        augmentations: { type: array, items: { $ref: "#/components/schemas/EvalAugmentationVariant" }, description: "The robustness axis: augmentation profiles of the project (augment/<name>.yaml@<commit>) applied to the golden sets before transcription; none is always included; default [{profile: none}]" }
        baseline: { type: string, description: "The baseline model (ver_…, @alias, base-model/<name> or model/<name>); default the project's @baseline, else its default base model" }
        priority: { type: integer, minimum: 0, maximum: 100, description: "Queue priority of the eval's steps" }
        languages:
          type: object
          additionalProperties: { type: string, minLength: 1 }
          description: "Golden-set locale → the language the models decode it in (the transcribe kind's language parameter), for both the subject and the baseline, e.g. {\"sr-RS\": \"hr-HR\"} when the model has no prompt for the locale and was fine-tuned under a neighbour's; default each golden set's own locale. Part of the decoding hash"
    EvalModel:
      type: object
      description: A model an eval compares (the subject or the baseline)
      required: [kind, id, label, modelKey, family]
      properties:
        kind: { type: string, enum: [checkpoint, model, base_model] }
        id: { type: string, description: "ckp_… or ver_…" }
        label: { type: string, description: "Readable name (collection and version, or the checkpoint's run and step)" }
        modelKey: { type: string, description: "The eval-record key of the model: the weights hash, or base:<versionId> for a base model" }
        family: { type: string, description: The model family (R41) }
        runId: { type: string }
        source: { type: string, enum: [request, alias, project-default], description: "Baseline only: where it came from" }
    EvalGoldenSet:
      type: object
      required: [versionId, name, version, normalizerVersionId, locale, utterances, hours, groups]
      properties:
        versionId: { type: string }
        name: { type: string, description: "golden-set/<name>" }
        version: { type: string }
        normalizerVersionId: { type: string }
        locale: { type: string }
        domain: { type: string }
        utterances: { type: integer }
        hours: { type: number, format: double }
        groups: { type: string, enum: [call, speaker, utterance], description: The bootstrap's resampling unit }
        replay: { type: boolean, description: "A replay golden set (the gate's replay list, or a language outside the project's locales): scored at the primary profile only" }
        decodeAs: { type: string, description: "The language the models decode this set in when evals.new mapped its locale (languages)" }
    EvalProfile:
      type: object
      required: [name, latencyMs]
      properties:
        name: { type: string, example: 160ms }
        latencyMs: { type: number, format: double }
        label: { type: string, example: "160 ms · [56,1]" }
    EvalDecoding:
      type: object
      required: [index, boost]
      properties:
        index: { type: integer }
        boost: { type: string, description: "none or lang/<locale>/boost/<file>@<commit>" }
        weight: { type: number, format: double }
        terms: { type: integer, description: Terms in the boost list }
        artifact: { type: string, description: "The rendered boost_list artifact (b3:…)" }
    EvalSignificance:
      type: object
      required: [samples, level, seed]
      properties:
        samples: { type: integer, description: Bootstrap resamples }
        level: { type: number, format: double, description: "Interval coverage (0.95)" }
        seed: { type: integer }
    EvalEstimate:
      type: object
      description: "GPU time of the cells to compute: golden audio hours × eval.gpu_hours_per_audio_hour (defaults.yaml, to be calibrated)"
      required: [gpuHours, audioHours, cellsToCompute, gpuHoursPerAudioHour, basis]
      properties:
        gpuHours: { type: number, format: double }
        audioHours: { type: number, format: double, description: Audio decoded by the cells to compute }
        cellsToCompute: { type: integer }
        gpuHoursPerAudioHour: { type: number, format: double }
        basis: { type: string, enum: [table] }
    EvalBucket:
      type: object
      required: [lo, utterances, refWords, wer]
      properties:
        lo: { type: number, format: double, description: Lower bound of the duration bucket (seconds) }
        hi: { type: number, format: double, description: "Upper bound; absent for the open last bucket" }
        utterances: { type: integer }
        refWords: { type: integer }
        wer: { type: number, format: double }
    EvalStability:
      type: object
      description: Partial stability (R54)
      properties:
        partialWords: { type: integer }
        unstableWords: { type: integer }
        ratio: { type: number, format: double, description: Unstable partial word ratio }
        editsPerSecond: { type: number, format: double }
    EvalSummary:
      type: object
      description: "A cell's scores (the scores artifact's summary.json); rates are fractions (0.123), counts are words"
      required: [wer, cer, werNoPunct, sub, del, ins, utterances, refWords]
      properties:
        scorer: { type: string, example: wer_score@1 }
        language: { type: string }
        utterances: { type: integer }
        refWords: { type: integer }
        refChars: { type: integer }
        wer: { type: number, format: double }
        cer: { type: number, format: double }
        werNoPunct: { type: number, format: double, description: WER with punctuation removed after the scoring normalizer }
        sub: { type: integer, description: Substituted words }
        del: { type: integer, description: Deleted words }
        ins: { type: integer, description: Inserted words }
        charErrors: { type: integer }
        buckets: { type: array, items: { $ref: "#/components/schemas/EvalBucket" } }
        stability: { $ref: "#/components/schemas/EvalStability" }
    EvalInterval:
      type: object
      required: [value, low, high]
      properties:
        value: { type: number, format: double, description: "The point estimate (subject − baseline, a fraction)" }
        low: { type: number, format: double }
        high: { type: number, format: double }
    EvalDelta:
      type: object
      description: "Subject − baseline at the same golden set, profile and decoding: paired blockwise bootstrap over the golden set's groups (R54)"
      required: [baselineCellId, wer, del, ins, significant, groups, samples, level]
      properties:
        baselineCellId: { type: string }
        unit: { type: string, enum: [char], description: "char when the golden set's language is written without spaces between words (eval.character_error_languages): wer then holds the CER delta, del and ins are not computed" }
        wer: { $ref: "#/components/schemas/EvalInterval" }
        del: { $ref: "#/components/schemas/EvalInterval", description: Deletion rate delta (deleted words / reference words) }
        ins: { $ref: "#/components/schemas/EvalInterval", description: Insertion rate delta }
        significant: { type: boolean, description: The WER interval excludes zero }
        groups: { type: integer, description: Resampling units (calls, speakers or utterances) }
        samples: { type: integer }
        level: { type: number, format: double }
        error: { type: string, description: "Why the delta could not be computed (e.g. per-utterance scores evicted: older than eval.artifact_retention_days)" }
    EvalUtterance:
      type: object
      required: [index, audio, ref, hyp, refWords, sub, del, ins, errors, wer, ops]
      properties:
        index: { type: integer, description: Position in the golden set }
        audio: { type: string, description: "The audio's content hash" }
        speaker: { type: string }
        group: { type: string }
        durationS: { type: number, format: double }
        ref: { type: string }
        hyp: { type: string }
        refWords: { type: integer }
        sub: { type: integer }
        del: { type: integer }
        ins: { type: integer }
        errors: { type: integer }
        wer: { type: number, format: double }
        ops:
          type: array
          description: "Alignment: [op, ref word, hyp word] with op =, S, D or I"
          items: { type: array, items: { type: string } }
    EvalCell:
      type: object
      required: [id, role, goldenSetVersionId, profile, decodingIndex, decodingHash, modelKey, state]
      properties:
        id: { type: string, description: "evc_…" }
        role: { $ref: "#/components/schemas/EvalCellRole" }
        goldenSetVersionId: { type: string }
        profile: { type: string }
        decodingIndex: { type: integer }
        augmentationIndex: { type: integer, description: "Index into the eval's augmentations (0: none)" }
        decodingHash: { type: string }
        modelKey: { type: string }
        state: { $ref: "#/components/schemas/EvalCellState" }
        recordId: { type: string, description: "The eval record (erc_…) the scores come from" }
        scores: { type: string, description: "The scores artifact (b3:…)" }
        hypotheses: { type: string, description: "The hypotheses artifact (b3:…)" }
        summary: { $ref: "#/components/schemas/EvalSummary" }
        delta: { $ref: "#/components/schemas/EvalDelta" }
        worst: { type: array, items: { $ref: "#/components/schemas/EvalUtterance" } }
        metrics: { $ref: "#/components/schemas/EvalCellMetrics" }
        evicted: { $ref: "#/components/schemas/EvalCellEvicted" }
    EvalCellEvicted:
      type: object
      description: >
        The cell's per-utterance scores left the content store (eval.artifact_retention_days after the record's last
        use, owner decision 2026-10-03): summary, delta and the gate verdict stay; worst is empty and a delta at another
        significance cannot be computed until an eval computes the cell again
      required: [at, note]
      properties:
        at: { type: string, format: date-time, description: When the scores were evicted }
        retentionDays: { type: integer, description: "eval.artifact_retention_days at the time of reading" }
        note: { type: string, description: What is gone and how to get it back }
    EvalGateCheck:
      type: object
      required: [kind, state, message]
      properties:
        kind: { type: string, enum: [target, replay, deletionsInsertions, primaryProfile, baseline], description: "baseline: the eval's baseline is not the project's @baseline or default base model (always failed when present)" }
        goldenSetVersionId: { type: string }
        goldenSet: { type: string }
        profile: { type: string }
        state: { type: string, enum: [passed, failed, inconclusive] }
        delta: { $ref: "#/components/schemas/EvalInterval" }
        threshold: { type: number, format: double, description: "Replay: the allowed regression" }
        baselineWer: { type: number, format: double }
        candidateWer: { type: number, format: double }
        unit: { type: string, enum: [char], description: "char when the set is gated on CER: delta, baselineWer and candidateWer are character error rates" }
        message: { type: string }
    EvalGate:
      type: object
      required: [verdict, gatesSha, checks, at, config]
      properties:
        verdict: { type: string, enum: [passed, failed] }
        gatesSha: { type: string, description: "The commit that last changed gates.yaml (empty: the defaults applied)" }
        checks: { type: array, items: { $ref: "#/components/schemas/EvalGateCheck" } }
        config: { $ref: "#/components/schemas/GateConfig" }
        at: { type: string, format: date-time }
        by: { $ref: "#/components/schemas/Actor" }
    EvalProgress:
      type: object
      required: [cellsTotal, cellsDone, cellsCached]
      properties:
        cellsTotal: { type: integer }
        cellsDone: { type: integer, description: Cells with scores (cached ones included) }
        cellsCached: { type: integer }
    Eval:
      type: object
      required: [id, projectId, status, subject, baseline, goldenSets, profiles, primaryProfile, decoding, significance, progress,
        estimate, rev, actor, createdAt, updatedAt]
      properties:
        id: { type: string, description: "evl_…" }
        projectId: { type: string }
        status: { $ref: "#/components/schemas/EvalStatus" }
        error: { type: string }
        subject: { $ref: "#/components/schemas/EvalModel" }
        baseline: { $ref: "#/components/schemas/EvalModel" }
        goldenSets: { type: array, items: { $ref: "#/components/schemas/EvalGoldenSet" } }
        profiles: { type: array, items: { $ref: "#/components/schemas/EvalProfile" } }
        primaryProfile: { type: string, description: "The cell the gate reads (R20)" }
        decoding: { type: array, items: { $ref: "#/components/schemas/EvalDecoding" } }
        augmentations: { type: array, items: { $ref: "#/components/schemas/EvalAugmentation" }, description: "The robustness axis: index 0 is always none (phase 3 · stream R)" }
        significance: { $ref: "#/components/schemas/EvalSignificance" }
        pipelineRunId: { type: string, description: The pipeline run computing the missing cells (absent when every cell was cached) }
        progress: { $ref: "#/components/schemas/EvalProgress" }
        estimate: { $ref: "#/components/schemas/EvalEstimate" }
        gate: { $ref: "#/components/schemas/EvalGate" }
        cells: { type: array, items: { $ref: "#/components/schemas/EvalCell" }, description: "Absent in evals.list" }
        robustness: { type: array, items: { $ref: "#/components/schemas/EvalRobustnessRow" }, description: "The robustness matrix when the eval has augmentations beyond none (absent in evals.list)" }
        rev: { type: integer }
        actor: { $ref: "#/components/schemas/Actor" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    EvalList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Eval" } }
    EvalPlanCell:
      type: object
      required: [role, goldenSetVersionId, profile, decodingIndex, decodingHash, modelKey, cached]
      properties:
        role: { $ref: "#/components/schemas/EvalCellRole" }
        goldenSetVersionId: { type: string }
        profile: { type: string }
        decodingIndex: { type: integer }
        augmentationIndex: { type: integer, description: "Index into augmentations (0: none)" }
        decodingHash: { type: string }
        modelKey: { type: string }
        cached: { type: boolean }
        recordId: { type: string }
    EvalPlan:
      type: object
      required: [subject, baseline, goldenSets, profiles, primaryProfile, decoding, significance, cells, cellsCached, cellsToCompute,
        estimate, steps]
      properties:
        subject: { $ref: "#/components/schemas/EvalModel" }
        baseline: { $ref: "#/components/schemas/EvalModel" }
        goldenSets: { type: array, items: { $ref: "#/components/schemas/EvalGoldenSet" } }
        profiles: { type: array, items: { $ref: "#/components/schemas/EvalProfile" } }
        primaryProfile: { type: string }
        decoding: { type: array, items: { $ref: "#/components/schemas/EvalDecoding" } }
        augmentations: { type: array, items: { $ref: "#/components/schemas/EvalAugmentation" }, description: "The robustness axis (phase 3 · stream R)" }
        significance: { $ref: "#/components/schemas/EvalSignificance" }
        cells: { type: array, items: { $ref: "#/components/schemas/EvalPlanCell" } }
        cellsCached: { type: integer }
        cellsToCompute: { type: integer, description: "Distinct records to compute (a subject equal to the baseline computes once)" }
        estimate: { $ref: "#/components/schemas/EvalEstimate" }
        steps:
          type: array
          description: "The generated pipeline's steps (materialize → transcribe → score per missing cell)"
          items:
            type: object
            required: [step, kind]
            properties: { step: { type: string }, kind: { type: string } }
    GateConfig:
      type: object
      description: "gates.yaml (docs/review/2026-10-02-phase-3-plan.md \"Gate\"); a value left out takes defaults.yaml gate.* / eval.*"
      additionalProperties: false
      properties:
        primaryProfile: { type: string, description: "The latency profile the gate reads (R20)" }
        target:
          type: object
          additionalProperties: false
          properties:
            goldenSets: { type: array, items: { type: string }, description: "golden-set/<name> (a * wildcard matches several)" }
            rule: { type: string, enum: [beat-baseline] }
        replay:
          type: object
          additionalProperties: false
          properties:
            goldenSets: { type: array, items: { type: string } }
            maxRegression: { type: number, format: double, minimum: 0, maximum: 0.1, description: "Largest absolute WER rise (0.005 = 0.5 points)" }
        deletionsInsertions: { type: boolean }
        significance:
          type: object
          additionalProperties: false
          properties:
            samples: { type: integer, minimum: 100, maximum: 100000 }
            level: { type: number, format: double, minimum: 0.5, maximum: 0.999 }
            seed: { type: integer, minimum: 0 }
    GateDeparture:
      type: object
      required: [param, value, default]
      properties:
        param: { type: string }
        value: {}
        default: {}
    Gates:
      type: object
      required: [path, exists, ref, head, content, config, departures]
      properties:
        path: { type: string, example: gates.yaml }
        exists: { type: boolean, description: "false: the project has no gates.yaml and the defaults apply" }
        ref: { type: string, example: main }
        head: { type: string, description: The head of main the file was read at }
        commit: { type: string, description: The commit that last changed gates.yaml }
        content: { type: string, description: "The file (when it does not exist: the defaults rendered as a starting point)" }
        config: { $ref: "#/components/schemas/GateConfig", description: The effective gate with the defaults filled in }
        departures: { type: array, items: { $ref: "#/components/schemas/GateDeparture" } }
    GatesEdit:
      type: object
      additionalProperties: false
      description: Exactly one of content and config
      properties:
        content: { type: string, description: The new gates.yaml }
        config: { $ref: "#/components/schemas/GateConfig" }
        message: { type: string, description: The commit message }
    ModelRegister:
      type: object
      required: [checkpointId]
      additionalProperties: false
      properties:
        checkpointId: { type: string, description: "ckp_…" }
        name: { type: string, description: "The collection, model/<name> (default model/<project slug>)" }
        evalId: { type: string, description: "The gated eval to publish with (default the checkpoint's latest gated eval)" }
        description: { type: string, description: The collection's description when it is new }
    ModelRegistration:
      type: object
      required: [name, model]
      properties:
        name: { type: string }
        model: { $ref: "#/components/schemas/ModelPayload" }
    ModelVersion:
      allOf:
        - $ref: "#/components/schemas/RegistryVersion"
        - type: object
          required: [model, usedBy]
          properties:
            model: { $ref: "#/components/schemas/ModelPayload" }
            usedBy: { type: array, items: { $ref: "#/components/schemas/UsedBy" } }
    ModelVersionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ModelVersion" } }

    # ---------------------------------------------------------------- robustness and streaming scorers schemas (phase 3 · stream R) — add below
    EvalAugmentationVariant:
      type: object
      required: [profile]
      additionalProperties: false
      properties:
        profile: { type: string, description: "none, or an augmentation profile of the project repository at a commit: augment/<name>.yaml@<commit sha>" }
        seed: { type: integer, minimum: 0, maximum: 2147483647, description: "Seed of the augmentation draw; default the profile file's seed, else augment.seed" }
    EvalAugmentation:
      type: object
      description: "One augmentation of an eval (the robustness axis): none, or a profile applied by augment_dataset before transcription"
      required: [index, profile]
      properties:
        index: { type: integer }
        profile: { type: string, description: "none or augment/<name>.yaml@<commit>" }
        name: { type: string, description: The profile's name }
        seed: { type: integer }
        hash: { type: string, description: "sha256 of the resolved profile (transforms and seed); the cell's decoding hash, and so its eval-record key, includes it" }
        artifact: { type: string, description: "The rendered augment_profile artifact (b3:…)" }
        noiseBank: { type: string, description: "The noise bank version (ver_…) the noise transform mixes from" }
        transforms: { type: object, additionalProperties: true, description: "The resolved transforms (defaults.yaml augment.* where the file is silent)" }
    EvalMetricUnavailable:
      type: object
      required: [metric, reason]
      properties:
        metric: { type: string, enum: [entities, latency] }
        reason: { type: string }
    EvalEntityClass:
      type: object
      required: [class, refEntities, hypEntities, correct]
      properties:
        class: { type: string, description: "An ITN class of the language pack (number, phone, date, amount, …)" }
        refEntities: { type: integer }
        hypEntities: { type: integer }
        correct: { type: integer }
        accuracy: { type: number, format: double, description: "correct / refEntities (absent or null without reference entities)" }
        precision: { type: number, format: double, description: correct / hypEntities }
    EvalEntityScores:
      type: object
      description: "Entity accuracy of a cell (entity_score): the pack's ITN classes compared between references and hypotheses; reported, not gated"
      required: [scorer, available, refEntities, correct]
      properties:
        scorer: { type: string, example: entity_score@1 }
        scores: { type: string, description: "The metric_scores artifact (b3:…)" }
        available: { type: boolean }
        reason: { type: string }
        itn: { type: object, additionalProperties: true, description: "{locale, commit}: the itn.yaml the classes came from" }
        utterances: { type: integer }
        utterancesWithEntities: { type: integer }
        refEntities: { type: integer }
        hypEntities: { type: integer }
        correct: { type: integer }
        accuracy: { type: number, format: double }
        precision: { type: number, format: double }
        classes: { type: array, items: { $ref: "#/components/schemas/EvalEntityClass" } }
    EvalLatencyScores:
      type: object
      description: "Latency to final at real-time pace (R54, latency_score): speech end (frame VAD) to the partial whose text is final"
      required: [scorer, available, measured]
      properties:
        scorer: { type: string, example: latency_score@1 }
        scores: { type: string, description: "The metric_scores artifact (b3:…)" }
        available: { type: boolean }
        reason: { type: string }
        pace: { type: string, enum: [simulated, realtime, mixed], description: "simulated: emit times at real-time pace from a file decode's compute times; realtime: a decode run at real-time pace" }
        utteranceEnd: { type: string, enum: [vad], description: Where utterance ends come from }
        vad: { type: object, additionalProperties: true, description: "{kind, model, revision, …} of the VAD step" }
        profile: { type: string }
        utterances: { type: integer }
        measured: { type: integer, description: Utterances with speech and a non-empty final }
        p50Ms: { type: number, format: double }
        p95Ms: { type: number, format: double }
        meanMs: { type: number, format: double }
        maxMs: { type: number, format: double }
        earlyFinals: { type: integer, description: Finals emitted before the VAD's speech end (counted as 0 ms) }
        noSpeech: { type: integer }
        emptyFinals: { type: integer }
    EvalCellMetrics:
      type: object
      description: Metrics beside WER, kept with the cell's eval record (absent while their steps run)
      properties:
        entities: { $ref: "#/components/schemas/EvalEntityScores" }
        latency: { $ref: "#/components/schemas/EvalLatencyScores" }
        unavailable: { type: array, items: { $ref: "#/components/schemas/EvalMetricUnavailable" }, description: "Metrics this cell does not get, and why" }
    EvalRobustnessRow:
      type: object
      description: "One cell of the robustness matrix (golden set × augmentation × latency profile): WER under the augmentation against the same cell without it"
      required: [role, goldenSetVersionId, profile, decodingIndex, augmentationIndex, cellId]
      properties:
        role: { $ref: "#/components/schemas/EvalCellRole" }
        goldenSetVersionId: { type: string }
        profile: { type: string }
        decodingIndex: { type: integer }
        augmentationIndex: { type: integer }
        cellId: { type: string }
        wer: { type: number, format: double, description: WER under the augmentation (absent until scored) }
        werNone: { type: number, format: double, description: WER of the same cell without augmentation }
        degradation: { type: number, format: double, description: "wer − werNone (absolute, a fraction)" }
        unit: { type: string, enum: [char], description: "char when the golden set is scored on CER (eval.character_error_languages): wer, werNone and degradation are character error rates" }
    # ---------------------------------------------------------------- language packs, boost lists, lineage schemas (phase 3 · stream L) — add below

    PackLocaleName:
      type: string
      pattern: "^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8}){0,3}$"
      description: "BCP 47 locale of a language pack: its directory lang/<locale>/ (he-IL, sr)"
    BoostDomain:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
      description: "A boost list's domain: the file boost/<domain>.txt"
    LanguagePackFile:
      type: object
      required: [path, bytes, content]
      properties:
        path: { type: string, description: "Path inside the pack (normalizer.yaml, boost/names.txt)" }
        bytes: { type: integer }
        content: { type: string, description: The file as UTF-8 text }
    BoostList:
      type: object
      description: "One boost list (boost/<domain>.txt): a '# weight: <float>' header, then one term per line; blank lines and other # lines are comments. The eval decoder receives it as a boost_list artifact {terms, weight}"
      required: [domain, path, weight, terms, sha256]
      properties:
        domain: { $ref: "#/components/schemas/BoostDomain" }
        path: { type: string, description: "Path inside the pack, boost/<domain>.txt" }
        weight: { type: number, format: double }
        terms: { type: array, items: { type: string } }
        sha256: { type: string, description: "sha256 (hex) of the list's canonical JSON {\"terms\":[…],\"weight\":w}: the identity an eval's decoding names" }
    PackScoring:
      type: object
      description: "The scoring normalizer normalizer.yaml names (R21): a registry normalizer collection (its newest frozen version) or a pinned version"
      required: [normalizer]
      properties:
        normalizer: { type: string, description: "normalizer/<name> or ver_…" }
        versionId: { type: string, description: The version it resolves to now; absent when the registry has none }
        version: { type: string }
    LanguagePackSummary:
      type: object
      required: [locale, path, sha, files, boost, scoring]
      properties:
        locale: { $ref: "#/components/schemas/PackLocaleName" }
        path: { type: string, description: "lang/<locale>" }
        sha: { type: string, description: The last commit on main that changed the pack }
        files: { type: integer }
        boost: { type: array, items: { type: string }, description: Domains of its boost lists }
        scoring: { $ref: "#/components/schemas/PackScoring" }
    LanguagePackList:
      type: object
      required: [items, shipped]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/LanguagePackSummary" } }
        shipped: { type: array, items: { type: string }, description: Locales Cadence ships starter packs for }
    LanguagePack:
      type: object
      description: "A language pack (docs/spec/03-pipelines-defaults.md \"Language packs and hot words\"): lang/<locale>/ in the project repository"
      required: [locale, path, sha, commit, files, boost, scoring, issues]
      properties:
        locale: { $ref: "#/components/schemas/PackLocaleName" }
        path: { type: string, description: "lang/<locale>" }
        sha: { type: string, description: "The last commit that changed the pack: the ETag, and what entities pin" }
        commit: { type: string, description: The commit the pack was read at }
        branch: { type: string, description: "The branch the change landed on when it is not main (an agent's edit under the draft policy language_pack: draft); accept it with branches.accept" }
        files: { type: array, items: { $ref: "#/components/schemas/LanguagePackFile" } }
        boost: { type: array, items: { $ref: "#/components/schemas/BoostList" } }
        scoring: { $ref: "#/components/schemas/PackScoring" }
        issues: { type: array, items: { $ref: "#/components/schemas/ProblemFieldError" }, description: Files whose shape is wrong (a hand edit); empty when the pack checks out }
    LanguagePackFileChange:
      type: object
      required: [path]
      properties:
        path: { type: string, maxLength: 200, description: "Path inside the pack, e.g. normalizer.yaml or boost/names.txt" }
        content: { type: string, maxLength: 1000000, description: The new UTF-8 content (omit with delete) }
        delete: { type: boolean, description: Remove the file }
    LanguagePackEdit:
      type: object
      required: [files]
      properties:
        files: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/LanguagePackFileChange" } }
        message: { type: string, maxLength: 500, description: The commit message }
    BoostEdit:
      type: object
      required: [terms]
      properties:
        terms: { type: array, maxItems: 100000, items: { type: string, minLength: 1, maxLength: 200 }, description: The list's terms, replacing the current ones }
        weight: { type: number, format: double, description: "Boost weight; the list's current one when omitted, else defaults.yaml langpacks.boost_weight" }
        message: { type: string, maxLength: 500 }
    LineageNode:
      type: object
      required: [id, kind, label, distance, direction]
      properties:
        id: { type: string }
        kind: { type: string, description: "Entity kind: a registry kind (dataset_version, golden_set, model, …), source, pipeline_run, run, checkpoint, mix, project, or one another domain adds (eval)" }
        label: { type: string, description: "What to show: collection and version, a run's mix, a project's slug" }
        projectId: { type: string, description: Project work only }
        state: { type: string, description: "The entity's state or status, when it has one" }
        direction: { type: string, enum: [root, upstream, downstream] }
        distance: { type: integer, description: Hops from the root }
    LineageEdge:
      type: object
      required: [from, to, relation]
      properties:
        from: { type: string, description: The entity that was used }
        to: { type: string, description: The entity that used it }
        relation: { type: string, description: "How: the payload field that names it (datasetVersionId, lineage.runId, sourceIds), or mix, base, init, run, adopted, …" }
    Lineage:
      type: object
      required: [root, nodes, edges, truncated, hidden]
      properties:
        root: { type: string }
        nodes: { type: array, items: { $ref: "#/components/schemas/LineageNode" } }
        edges: { type: array, items: { $ref: "#/components/schemas/LineageEdge" } }
        truncated: { type: boolean, description: The node limit stopped the walk }
        hidden: { type: integer, description: Nodes left out because they belong to projects the caller cannot see }

    # ---------------------------------------------------------------- media: audio serving schemas (phase 3 · stream A) — add below
    AudioSignRequest:
      type: object
      additionalProperties: false
      properties:
        channel: { type: integer, minimum: 0, maximum: 15, description: "One channel (0-based); omitted: every channel" }
        start: { type: number, format: double, minimum: 0, description: Span start in seconds }
        end: { type: number, format: double, minimum: 0, description: Span end in seconds }
    AudioLink:
      type: object
      required: [url, expiresAt, utteranceId, audio, durationS, sampleRate, channels]
      properties:
        url: { type: string, description: "audio.get with the span and the signature (relative to the server, starts with /api/)" }
        expiresAt: { type: string, format: date-time }
        utteranceId: { type: string }
        audio: { type: string, description: "The audio's content hash (b3:…)" }
        durationS: { type: number, format: double, description: The utterance's duration }
        sampleRate: { type: integer, description: "Sample rate of what the link serves (16000)" }
        channels: { type: integer, description: Channels of what the link serves }
        originSampleRate: { type: integer, description: The stored audio's sample rate }
        start: { type: number, format: double }
        end: { type: number, format: double }
    AudioPeaks:
      type: object
      required: [utteranceId, channels, hopS, frames, start, durationS, encoding, data]
      properties:
        utteranceId: { type: string }
        channels: { type: integer }
        hopS: { type: number, format: double, description: Seconds per min/max pair }
        frames: { type: integer, description: Pairs per channel }
        start: { type: number, format: double, description: Time of the first pair }
        durationS: { type: number, format: double, description: The utterance's duration }
        originSampleRate: { type: integer, description: The stored audio's sample rate }
        clipped: { type: array, items: { type: integer }, description: "Frames where a sample of any channel reached full scale (at most 1000)" }
        encoding: { type: string, enum: [int8-minmax], description: "frames × channels × [min, max], int8, value / 127 = sample" }
        data: { type: string, format: byte, description: Base64 of the int8 bytes }
        artifact: { type: string, description: "The cached 10 ms peaks artifact (b3:…)" }
    SpectrogramLevel:
      type: object
      required: [level, hopS, frames, tiles]
      properties:
        level: { type: integer }
        hopS: { type: number, format: double }
        frames: { type: integer }
        tiles: { type: integer }
    SpectrogramManifest:
      type: object
      description: "manifest.json of a spectrogram_tiles artifact (format cadence.spectrogram-tiles/1)"
      required: [schema, sampleRate, originSampleRate, channels, bins, binHz, tileFrames, encoding, levels, peakDb, durationS]
      properties:
        schema: { type: string, enum: [cadence.spectrogram-tiles/1] }
        artifact: { type: string, description: "The spectrogram_tiles artifact (b3:…)" }
        audio: { type: string, description: "The audio's content hash (b3:…)" }
        sampleRate: { type: integer }
        originSampleRate: { type: integer }
        channels: { type: integer }
        windowSamples: { type: integer }
        hopSamples: { type: integer }
        nFft: { type: integer }
        bins: { type: integer, description: "Bins kept: up to the origin's Nyquist" }
        binHz: { type: number, format: double }
        tileFrames: { type: integer }
        encoding:
          type: object
          required: [floorDb, stepDb]
          properties:
            floorDb: { type: number, format: double }
            stepDb: { type: number, format: double }
        levels: { type: array, items: { $ref: "#/components/schemas/SpectrogramLevel" } }
        peakDb: { type: array, items: { type: number, format: double } }
        durationS: { type: number, format: double }
    HypothesisWord:
      type: object
      required: [word, start, end]
      properties:
        word: { type: string }
        start: { type: number, format: double }
        end: { type: number, format: double }
        confidence: { type: number, format: double }
        op: { type: string, enum: ["=", S, I], description: "Against the reference (with scores): = correct, S substituted, I inserted" }
        ref: { type: string, description: "The reference word a substitution replaced" }
    DeletedWord:
      type: object
      required: [before, ref]
      properties:
        before: { type: integer, description: "Index of the hypothesis word the deletion sits before (words.length: at the end)" }
        ref: { type: string }
    PartialEvent:
      type: object
      required: [text]
      properties:
        text: { type: string }
        audioOffsetMs: { type: number, format: double, description: Audio time the partial covers up to }
        emitMs: { type: number, format: double, description: When the decoder emitted it (wall clock from the stream's start) }
    UtteranceWords:
      type: object
      required: [utteranceId, audio, text, words, deletions, aligned]
      properties:
        utteranceId: { type: string }
        audio: { type: string, description: "The audio's content hash (b3:…)" }
        text: { type: string, description: The hypothesis text }
        ref: { type: string, description: "The normalised reference (with scores)" }
        words: { type: array, items: { $ref: "#/components/schemas/HypothesisWord" } }
        deletions: { type: array, items: { $ref: "#/components/schemas/DeletedWord" } }
        aligned: { type: boolean, description: "The scores' alignment was mapped onto the timed words (false without scores, or when the normaliser changed the word count)" }
        partials: { type: array, items: { $ref: "#/components/schemas/PartialEvent" } }
        sub: { type: integer }
        del: { type: integer }
        ins: { type: integer }
        refWords: { type: integer }

    # ---------------------------------------------------------------- transcriptions and the live channel schemas (phase 3 · stream T) — add below
    TranscriptionNew:
      type: object
      additionalProperties: false
      required: [input, targets]
      properties:
        input: { $ref: "#/components/schemas/TranscriptionInput" }
        targets:
          type: array
          minItems: 1
          maxItems: 3
          description: "One to three targets; they receive the same audio (lanes A, B, C in this order unless blind)"
          items: { $ref: "#/components/schemas/TranscriptionTargetIn" }
        telephony: { $ref: "#/components/schemas/TelephonySimulation" }
        pace: { type: string, enum: [realtime, fast], default: realtime, description: "File and span inputs: play at real-time pace (latency shows) or as fast as the card allows" }
        blind: { type: boolean, default: false, description: "Shuffle the lanes; the page leaves them unnamed until the person picks the better one (the pick is not recorded)" }
    TranscriptionInput:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [microphone, file, span], description: "microphone (PCM16 frames from the browser), file (its bytes, decoded by the worker), or span (an utterance's audio read by the worker)" }
        utteranceId: { type: string, maxLength: 100, description: "kind span: the utterance (utt_… or its audio's b3: hash)" }
        start: { type: number, format: double, minimum: 0, description: "kind span: start in seconds (default 0)" }
        end: { type: number, format: double, minimum: 0, description: "kind span: end in seconds (default the end of the audio)" }
        channel: { type: integer, minimum: 0, maximum: 15, description: "kind span: the channel (default 0)" }
    TranscriptionTargetIn:
      type: object
      additionalProperties: false
      description: "Exactly one of checkpointId, modelVersionId and baseModelVersionId"
      properties:
        checkpointId: { type: string, maxLength: 100, description: "A checkpoint of the project (ckp_…)" }
        modelVersionId: { type: string, maxLength: 200, description: "A model version (ver_…, model/<name>, or @alias)" }
        baseModelVersionId: { type: string, maxLength: 200, description: "A base model version (ver_…, base-model/<name>, or @alias)" }
        profile: { type: string, maxLength: 40, description: "Latency profile (default: eval.primary_profile when the family declares it, else its first streaming profile)" }
        language: { type: string, maxLength: 35, description: "BCP 47 language the model decodes in (default: the project's first locale)" }
        boost: { type: string, maxLength: 300, description: "none (default), or a boost list of the project's language pack: lang/<locale>/boost/<file>.txt, optionally @<commit> (default main)" }
        boostWeight: { type: number, format: double, minimum: 0, maximum: 100, description: "Overrides the list's '# weight:' header" }
    TelephonySimulation:
      type: object
      additionalProperties: false
      description: "Phone-line simulation (R50): down to sampleRate, through the codec, back up to 16 kHz with the training resampler (streaming polyphase)"
      properties:
        codec: { type: string, enum: [ulaw, alaw, none], default: ulaw, description: "G.711 μ-law (default), A-law, or band-limit only" }
        sampleRate: { type: integer, enum: [8000], default: 8000 }
    TranscriptionSession:
      type: object
      required: [id, projectId, state, input, targets, pace, blind, family, liveKind, reservationMb, limits, allowance, createdAt]
      properties:
        id: { type: string, description: "trs_…" }
        projectId: { type: string }
        jobId: { type: string, description: "The interactive job (job_…); absent in a dry run" }
        state: { type: string, enum: [queued, loading, live, ended], description: "queued: waiting for room on a card; loading: leased, the worker loads the targets; live: the worker is on the socket; ended" }
        streamUrl: { type: string, description: "The live channel, relative to the server (/api/transcriptions/{id}/stream?ticket=…); absent in a dry run" }
        ticket: { type: string, description: "Single-use; absent in a dry run" }
        ticketExpiresAt: { type: string, format: date-time }
        input: { $ref: "#/components/schemas/TranscriptionInput" }
        targets: { type: array, items: { $ref: "#/components/schemas/TranscriptionLane" } }
        telephony: { $ref: "#/components/schemas/TelephonySimulation" }
        pace: { type: string, enum: [realtime, fast] }
        blind: { type: boolean }
        family: { type: string, description: "The targets' model family" }
        liveKind: { type: string, description: "The family's live role step kind (kind@version) that serves the session" }
        reservationMb: { type: integer, description: "Card memory the interactive job reserves: the family's interactive.memoryMb plus extraCheckpointMb per further distinct model" }
        position: { type: integer, description: "Place among the waiting interactive jobs (1 = next)" }
        reason: { type: string, description: "Why the session waits, when it does" }
        limits: { $ref: "#/components/schemas/TranscriptionLimits" }
        allowance: { $ref: "#/components/schemas/ManualTestAllowance" }
        createdAt: { type: string, format: date-time }
    TranscriptionLane:
      type: object
      required: [target, kind, id, label, family, profile, language, weightsKey]
      properties:
        target: { type: string, enum: [A, B, C], description: "The lane; live messages name it in target" }
        kind: { type: string, enum: [checkpoint, model, base_model] }
        id: { type: string, description: "ckp_… or ver_…" }
        label: { type: string, description: "What the lane runs (the page hides it until the person picks, when blind)" }
        family: { type: string }
        profile: { type: string }
        latencyMs: { type: integer }
        chunkMs: { type: integer }
        language: { type: string }
        boost: { $ref: "#/components/schemas/TranscriptionBoost" }
        weightsKey: { type: string, description: "Lanes with the same key share one model on the card" }
    TranscriptionBoost:
      type: object
      required: [list, weight, terms]
      properties:
        list: { type: string, description: "lang/<locale>/boost/<file>.txt" }
        commit: { type: string }
        weight: { type: number, format: double }
        terms: { type: integer }
    TranscriptionLimits:
      type: object
      required: [sessionSeconds, idleSeconds, ticketSeconds, frameMs, maxFileSeconds, maxFileBytes, maxMessageBytes, queueWaitSeconds]
      properties:
        sessionSeconds: { type: integer, description: "Longest session once live (transcriptions.session_max_minutes, less when the allowance has less left)" }
        idleSeconds: { type: integer, description: "Closed after this long without audio, keepalive or ping" }
        ticketSeconds: { type: integer }
        frameMs: { type: integer, description: "Longest microphone frame (PCM16 at the capture rate)" }
        maxFileSeconds: { type: integer }
        maxFileBytes: { type: integer }
        maxMessageBytes: { type: integer, description: "Largest message the socket accepts (send a file in chunks of this size or less)" }
        queueWaitSeconds: { type: integer, description: "Longest wait for a card before the session gives up" }
    ManualTestAllowance:
      type: object
      required: [gpuHoursPerDay, usedGpuHours, remainingGpuHours]
      description: "The project's daily allowance of manual tests (budgets.manual_test_gpu_hours_per_project_per_day), metered as interactive lease wall time"
      properties:
        gpuHoursPerDay: { type: number, format: double }
        usedGpuHours: { type: number, format: double }
        remainingGpuHours: { type: number, format: double }

    # The live channel (R48). Text frames are JSON discriminated by type; audio goes in binary frames.
    LiveClientMessage:
      description: "Client → server text frames: start first, then fileEnd, finalize, keepalive, ping and end in any order; audio in binary frames"
      oneOf:
        - $ref: "#/components/schemas/LiveStart"
        - $ref: "#/components/schemas/LiveFileEnd"
        - $ref: "#/components/schemas/LiveFinalize"
        - $ref: "#/components/schemas/LiveKeepalive"
        - $ref: "#/components/schemas/LivePing"
        - $ref: "#/components/schemas/LiveEnd"
      discriminator:
        propertyName: type
        mapping:
          start: "#/components/schemas/LiveStart"
          fileEnd: "#/components/schemas/LiveFileEnd"
          finalize: "#/components/schemas/LiveFinalize"
          keepalive: "#/components/schemas/LiveKeepalive"
          ping: "#/components/schemas/LivePing"
          end: "#/components/schemas/LiveEnd"
    LiveStart:
      type: object
      required: [type, input]
      description: "The first message: what the audio is. Telephony, pace and targets were fixed by transcriptions.new"
      properties:
        type: { type: string, enum: [start] }
        input: { $ref: "#/components/schemas/LiveInput" }
    LiveInput:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [microphone, file, span] }
        sampleRate: { type: integer, minimum: 8000, maximum: 192000, description: "microphone: the capture rate (the AudioContext's rate; no resampling in the browser)" }
        frameMs: { type: number, description: "microphone: the frame length the page sends (≤ limits.frameMs)" }
        settings: { type: object, additionalProperties: true, description: "microphone: the track's getSettings() (echo cancellation, noise suppression, auto gain, channel count, device)" }
        raw: { type: boolean, description: "microphone: echo cancellation, noise suppression and auto gain were asked off" }
        fileName: { type: string, maxLength: 255 }
        fileBytes: { type: integer, minimum: 0, description: "file: the size the page will send" }
    LiveFileEnd:
      type: object
      required: [type]
      description: "file: every byte was sent; the worker decodes the file (ffmpeg) and streams it at the session's pace"
      properties:
        type: { type: string, enum: [fileEnd] }
    LiveFinalize:
      type: object
      required: [type]
      description: "A segment boundary: pad the right context with silence, force end of utterance, emit the finals; the next audio opens a new decoder stream (fresh encoder cache)"
      properties:
        type: { type: string, enum: [finalize] }
    LiveKeepalive:
      type: object
      required: [type]
      description: "Keeps the session open without audio; the worker answers pong (source worker), behind any audio already sent"
      properties:
        type: { type: string, enum: [keepalive] }
        t: { type: number, description: "The client's clock, echoed in pong" }
    LivePing:
      type: object
      required: [type]
      description: "Answered by the relay itself (pong, source relay): the control plane hop alone"
      properties:
        type: { type: string, enum: [ping] }
        t: { type: number, description: "The client's clock, echoed in pong" }
    LiveEnd:
      type: object
      required: [type]
      description: "Flush every target, send summary, close with 1000"
      properties:
        type: { type: string, enum: [end] }

    LiveServerMessage:
      description: "Server → client text frames. partial replaces the segment's previous partial; final never changes; every result states the audio time it covers (audioEnd, seconds of session audio)"
      oneOf:
        - $ref: "#/components/schemas/LiveWaiting"
        - $ref: "#/components/schemas/LiveStarted"
        - $ref: "#/components/schemas/LivePartial"
        - $ref: "#/components/schemas/LiveFinal"
        - $ref: "#/components/schemas/LiveStats"
        - $ref: "#/components/schemas/LivePong"
        - $ref: "#/components/schemas/LiveError"
        - $ref: "#/components/schemas/LiveSummary"
      discriminator:
        propertyName: type
        mapping:
          waiting: "#/components/schemas/LiveWaiting"
          started: "#/components/schemas/LiveStarted"
          partial: "#/components/schemas/LivePartial"
          final: "#/components/schemas/LiveFinal"
          stats: "#/components/schemas/LiveStats"
          pong: "#/components/schemas/LivePong"
          error: "#/components/schemas/LiveError"
          summary: "#/components/schemas/LiveSummary"
    LiveWaiting:
      type: object
      required: [type, state]
      description: "From the relay until started: the job waits for a card (queued, with its place and why) or the worker loads the targets (loading)"
      properties:
        type: { type: string, enum: [waiting] }
        state: { type: string, enum: [queued, loading] }
        position: { type: integer, description: "queued: place among the waiting interactive jobs (1 = next)" }
        reason: { type: string, description: "queued: why no card takes it yet" }
        reservationMb: { type: integer }
        waitedS: { type: number }
    LiveStarted:
      type: object
      required: [type, targets, resampler]
      description: "Every target is loaded and the decoder takes audio: the effective configuration per target"
      properties:
        type: { type: string, enum: [started] }
        targets: { type: array, items: { $ref: "#/components/schemas/LiveStartedTarget" } }
        captureRate: { type: integer, description: "The rate the worker resamples from (the start message's, or the file's)" }
        resampler: { type: string, description: "streaming polyphase (scipy.signal.resample_poly), the import and training resampler" }
        telephony: { $ref: "#/components/schemas/LiveTelephony" }
        pace: { type: string, enum: [realtime, fast] }
        input: { $ref: "#/components/schemas/LiveInput" }
        durationS: { type: number, description: "file and span: the audio's duration" }
    LiveStartedTarget:
      type: object
      required: [target, profile, chunkMs, language, loadS]
      properties:
        target: { type: string, enum: [A, B, C] }
        profile: { type: string }
        chunkMs: { type: integer }
        language: { type: string }
        loadS: { type: number, description: "Seconds the target's model took to load (shared weights load once)" }
        decoder: { type: string, description: "The decoder, as in an eval's decoding (same words as an eval of the same transcribe kind)" }
        boost: { type: object, properties: { terms: { type: integer }, weight: { type: number } } }
    LiveTelephony:
      type: object
      required: [chain, codec, sampleRate]
      properties:
        chain: { type: string, description: "16k → 8k (polyphase) → codec → 16k (polyphase)" }
        codec: { type: string, enum: [ulaw, alaw, none] }
        sampleRate: { type: integer }
    LivePartial:
      type: object
      required: [type, target, segment, seq, text, audioEnd]
      properties:
        type: { type: string, enum: [partial] }
        target: { type: string, enum: [A, B, C] }
        segment: { type: integer, description: "The segment it belongs to (a final closes it)" }
        seq: { type: integer, description: "Per target, over partials and finals" }
        text: { type: string }
        audioEnd: { type: number, description: "Seconds of session audio the partial covers" }
    LiveFinal:
      type: object
      required: [type, target, segment, seq, text, words, endpoint, audioEnd, space]
      properties:
        type: { type: string, enum: [final] }
        target: { type: string, enum: [A, B, C] }
        segment: { type: integer }
        seq: { type: integer }
        text: { type: string, description: "The segment's transcript (not the words joined: a word segmenter may split a word)" }
        words: { type: array, items: { $ref: "#/components/schemas/LiveWord" } }
        endpoint: { type: string, enum: [eou, finalize, end], description: "eou: the model's end of utterance; finalize: the client's; end: the session's" }
        audioEnd: { type: number }
        space: { type: boolean, description: "false: the text continues the previous final's last word (an end of utterance inside a word) — join without a space" }
    LiveWord:
      type: object
      required: [word]
      properties:
        word: { type: string }
        start: { type: number, description: "Seconds of session audio (absent when the decoder gave no timing)" }
        end: { type: number }
        confidence: { type: number, minimum: 0, maximum: 1 }
    LiveStats:
      type: object
      required: [type, source]
      properties:
        type: { type: string, enum: [stats] }
        source: { type: string, enum: [worker, relay] }
        rtf: { type: number, description: "worker: decode time over audio time so far, every target together" }
        audioS: { type: number, description: "worker: seconds of audio decoded" }
        queued: { type: integer, description: "relay: messages waiting for the worker" }
        upP50Us: { type: number, description: "relay: forwarding time client → worker, µs" }
        upP95Us: { type: number }
        downP50Us: { type: number, description: "relay: forwarding time worker → client, µs" }
        downP95Us: { type: number }
        upN: { type: integer }
        downN: { type: integer }
    LivePong:
      type: object
      required: [type, source]
      properties:
        type: { type: string, enum: [pong] }
        source: { type: string, enum: [relay, worker] }
        t: { type: number }
    LiveError:
      type: object
      required: [type, problem, fatal]
      properties:
        type: { type: string, enum: [error] }
        problem: { $ref: "#/components/schemas/Problem" }
        fatal: { type: boolean, description: "The session closes after it" }
    LiveSummary:
      type: object
      required: [type, audioS, rtf, targets]
      description: "The session's totals, last; the socket then closes with 1000. Nothing of it is stored"
      properties:
        type: { type: string, enum: [summary] }
        audioS: { type: number }
        rtf: { type: number }
        targets: { type: object, additionalProperties: { $ref: "#/components/schemas/LiveTargetSummary" } }
        gpu: { type: object, additionalProperties: true, description: "Peak memory of the job" }
        load: { type: object, additionalProperties: true }
        frameMsP50: { type: number }
        frameMsP95: { type: number }
    LiveTargetSummary:
      type: object
      properties:
        profile: { type: string }
        steps: { type: integer }
        stepMsP50: { type: number }
        stepMsP95: { type: number }
        stepMsMax: { type: number }
        finals: { type: integer }

    # ---------------------------------------------------------------- experiments and sweeps schemas (phase 3 · stream X) — add below
    ExperimentNew:
      type: object
      additionalProperties: false
      required: [name, question, mix]
      properties:
        name: { type: string, minLength: 1, maxLength: 80, description: "A short name, unique in the project" }
        question: { type: string, minLength: 1, maxLength: 2000, description: "The question the experiment's runs answer" }
        mix: { type: string, maxLength: 200, description: "The mix every run trains on (mix_… or its name)" }
        mixRevision: { type: integer, minimum: 1, description: "The fixed mix revision (default the mix's current one)" }
        baseModel: { type: string, description: "Base model version (ver_…), collection name or @alias, pinned to a version (default the defaults' base model)" }
        tag: { type: string, maxLength: 63, pattern: "^[a-z0-9][a-z0-9._-]*$", description: "A short tag for filters and search (default derived from the name)" }
    ExperimentMixRef:
      type: object
      required: [id, name, revision]
      properties:
        id: { type: string, description: "mix_…" }
        name: { type: string }
        revision: { type: integer, description: The fixed mix revision }
        replayShare: { type: number, format: double, description: "The revision's replay share (a sweep may vary it)" }
    ExperimentParameter:
      type: object
      required: [name, swept, departs]
      properties:
        name: { type: string, description: "A train-step parameter, or replayShare (the mix's)" }
        default: { description: "The value runs get when nothing sets it (defaults.yaml, or the mix revision's replay share)" }
        swept: { type: boolean, description: A sweep of the experiment varies it }
        departs: { type: boolean, description: At least one run departs from the default }
    ExperimentEval:
      type: object
      required: [evalId, status]
      properties:
        evalId: { type: string, description: "evl_…" }
        status: { $ref: "#/components/schemas/EvalStatus" }
        verdict: { type: string, enum: [passed, failed], description: "The gate's verdict, once evals.gate ran" }
    ExperimentRun:
      type: object
      required: [runId, status, values, departures, gpuHours, best, createdAt]
      properties:
        runId: { type: string, description: "run_…" }
        status: { $ref: "#/components/schemas/RunStatus" }
        sweepId: { type: string, description: "The sweep that generated the run (swp_…)" }
        point: { type: integer, description: The run's point in its sweep }
        values: { type: object, additionalProperties: true, description: "The compared parameters' values for this run (parameter name → value)" }
        departures: { type: array, items: { type: string }, description: Compared parameters whose value differs from the default }
        bestValWer: { type: number, format: double, description: The lowest validation WER of the run's checkpoints (a fraction) }
        bestCheckpointId: { type: string, description: The checkpoint with that WER }
        bestStep: { type: integer, format: int64, description: The optimiser step of that checkpoint }
        gpuHours: { type: number, format: double }
        estimateGpuHours: { type: number, format: double, description: The run's estimate at start }
        best: { type: boolean, description: The experiment's best run }
        eval: { $ref: "#/components/schemas/ExperimentEval" }
        error: { type: string }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    ExperimentBest:
      type: object
      required: [runId, checkpointId, valWer, registrable]
      properties:
        runId: { type: string }
        checkpointId: { type: string }
        valWer: { type: number, format: double }
        eval: { $ref: "#/components/schemas/ExperimentEval" }
        registrable: { type: boolean, description: "models.register would accept the checkpoint now: its latest gated eval passed" }
        reason: { type: string, description: "Why it cannot be registered yet, and the next command" }
    Experiment:
      type: object
      required: [id, projectId, name, question, mix, baseModel, runCount, sweeps, rev, actor, createdAt, updatedAt]
      properties:
        id: { type: string, description: "exp_…" }
        projectId: { type: string }
        name: { type: string }
        question: { type: string }
        tag: { type: string }
        mix: { $ref: "#/components/schemas/ExperimentMixRef" }
        baseModel: { $ref: "#/components/schemas/RegistryVersion" }
        runCount: { type: integer }
        parameters: { type: array, items: { $ref: "#/components/schemas/ExperimentParameter" }, description: "The compared parameters, swept ones first (experiments.get only)" }
        runs: { type: array, items: { $ref: "#/components/schemas/ExperimentRun" }, description: "Oldest first (experiments.get only)" }
        best: { $ref: "#/components/schemas/ExperimentBest" }
        sweeps: { type: array, items: { $ref: "#/components/schemas/Sweep" }, description: Newest first }
        rev: { type: integer }
        actor: { $ref: "#/components/schemas/Actor" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ExperimentList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Experiment" } }
    SweepMode:
      type: string
      enum: [grid, random]
    SweepState:
      type: string
      description: "running: a run is queued or training; done: every point ran; stopped: the cap was reached first; cancelled: its running run was cancelled; failed: a run could not be started"
      enum: [running, done, stopped, cancelled, failed]
    SweepParameter:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 63, description: "A train-step parameter (peak_lr, warmup_steps, augmentation, …) or replayShare" }
        values: { type: array, minItems: 1, maxItems: 32, items: {}, description: "The values to try (grid: required; random: drawn from)" }
        min: { type: number, format: double, description: "random: the lower bound of a numeric range" }
        max: { type: number, format: double, description: "random: the upper bound" }
        scale: { type: string, enum: [linear, log], description: "random: draw uniformly on this scale (default linear; log for learning rates)" }
        integer: { type: boolean, description: "random: round drawn values to integers" }
    SweepNew:
      type: object
      additionalProperties: false
      required: [parameters]
      properties:
        mode: { $ref: "#/components/schemas/SweepMode" }
        parameters: { type: array, minItems: 1, maxItems: 8, items: { $ref: "#/components/schemas/SweepParameter" } }
        runs: { type: integer, minimum: 1, maximum: 64, description: "random: how many points (default sweeps.random_runs); grid: at most this many of the combinations (default all of them, up to sweeps.max_runs)" }
        gpuHourCap: { type: number, format: double, minimum: 0.001, description: "Most GPU-hours the sweep's runs may use (default sweeps.gpu_hour_cap)" }
        seed: { type: integer, minimum: 0, maximum: 2147483647, description: "random: the seed of the draw (default sweeps.seed)" }
        steps: { type: integer, minimum: 1, description: "Step budget of every run (default training.steps)" }
        priority: { type: integer, minimum: -100, maximum: 100, description: "Queue priority of the runs' step jobs (default 0)" }
    SweepPoint:
      type: object
      required: [index, values, state]
      properties:
        index: { type: integer }
        values: { type: object, additionalProperties: true, description: "Parameter name → value" }
        state: { type: string, enum: [pending, queued, running, paused, done, failed, cancelled, skipped], description: "pending: not started yet; skipped: the sweep ended first; else the run's status" }
        runId: { type: string }
        estimateGpuHours: { type: number, format: double, description: "The point's estimate when the sweep was planned" }
        gpuHours: { type: number, format: double }
    Sweep:
      type: object
      required: [id, experimentId, mode, parameters, gpuHourCap, state, points, runsDone, gpuHoursSpent, estimateGpuHours, rev, actor, createdAt, updatedAt]
      properties:
        id: { type: string, description: "swp_…" }
        experimentId: { type: string }
        mode: { $ref: "#/components/schemas/SweepMode" }
        parameters: { type: array, items: { $ref: "#/components/schemas/SweepParameter" } }
        seed: { type: integer }
        steps: { type: integer }
        gpuHourCap: { type: number, format: double }
        state: { $ref: "#/components/schemas/SweepState" }
        stopReason: { type: string, description: "Why the sweep ended before its last point (the cap, a cancelled or failed run)" }
        points: { type: array, items: { $ref: "#/components/schemas/SweepPoint" } }
        runsDone: { type: integer, description: Runs that ended }
        currentRunId: { type: string, description: The run queued or training now }
        gpuHoursSpent: { type: number, format: double, description: GPU-hours the sweep's runs used }
        estimateGpuHours: { type: number, format: double, description: The sum of the points' estimates when the sweep started }
        rev: { type: integer }
        actor: { $ref: "#/components/schemas/Actor" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    SweepPlan:
      type: object
      required: [experimentId, mode, points, estimateGpuHours, gpuHourCap, withinCap, fits, basis, budget]
      properties:
        experimentId: { type: string }
        mode: { $ref: "#/components/schemas/SweepMode" }
        seed: { type: integer }
        steps: { type: integer }
        points: { type: array, items: { $ref: "#/components/schemas/SweepPoint" } }
        estimateGpuHours: { $ref: "#/components/schemas/EstimateRange" }
        gpuHourCap: { type: number, format: double }
        withinCap: { type: boolean, description: "The whole estimate fits the cap (otherwise the real call answers sweep-over-cap)" }
        fits: { type: integer, description: How many points, in order, fit the cap by their estimates }
        basis: { type: string, description: "table, measured or mixed: where the points' estimates come from" }
        budget:
          type: object
          required: [remainingGpuHours, withinDailyBudget]
          properties:
            remainingGpuHours: { type: number, format: double, description: "The project's daily budget minus today's use and committed work" }
            withinDailyBudget: { type: boolean, description: "The whole estimate fits today's remaining budget (over it, an agent's sweep waits for an approval)" }
    # ---------------------------------------------------------------- mounts, cache, storage schemas (phase 4 · stream M) — add below
    MountKind:
      type: string
      enum: [local, nfs, smb, s3, hf]
      description: "local, nfs and smb: a path the OS mounted (one driver); s3: an S3-compatible bucket; hf: a Hugging Face Hub repository at a pinned revision"
    MountNew:
      type: object
      required: [name, kind, root]
      properties:
        name: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$", description: "The name URIs use: mount://<name>/<path>" }
        kind: { $ref: "#/components/schemas/MountKind" }
        root:
          type: string
          minLength: 1
          maxLength: 1000
          description: "local/nfs/smb: the absolute path where workers and the control plane see it (/mnt/corpora); s3: bucket[/prefix]; hf: datasets/<org>/<name> or <org>/<model>"
        endpoint: { type: string, maxLength: 500, description: "s3 only: the endpoint URL (https://minio.example:9000)" }
        region: { type: string, maxLength: 64, description: "s3 only: the signing region (default us-east-1)" }
        revision: { type: string, pattern: "^[0-9a-f]{40}$", description: "hf only (required): the commit SHA every read is pinned to" }
        credentials: { type: string, maxLength: 100, description: "The name of a secret: s3 <accessKeyId>:<secretAccessKey> (required); hf a token (optional, gated repositories)" }
        readOnly: { type: boolean, default: true, description: "Cadence never writes to a read-only mount; writable mounts take exports" }
        licenceHint: { type: string, maxLength: 200, description: "The licence sources ingested from this mount usually carry (a hint; each source records its own)" }
        description: { type: string, maxLength: 1000 }
    MountScan:
      type: object
      properties:
        path: { type: string, maxLength: 1000, description: "Scan only this path under the root (default: the whole mount)" }
    MountHealth:
      type: object
      required: [state]
      description: The last health check a worker ran (mount_check@1)
      properties:
        state: { type: string, enum: [unknown, checking, healthy, unhealthy] }
        checkedAt: { type: string, format: date-time }
        host: { type: string, description: The compute host whose worker checked }
        reachable: { type: boolean }
        writable: { type: boolean, description: "A writable mount accepted a probe file (removed again)" }
        freeBytes: { type: integer, format: int64 }
        totalBytes: { type: integer, format: int64 }
        throughputMBps: { type: number, format: double, description: "MB/s reading a sample of the mount's files" }
        sampledBytes: { type: integer, format: int64 }
        detail: { type: string, description: Why the mount is unhealthy, or what the check saw }
        jobId: { type: string }
    MountEntry:
      type: object
      required: [path, files, bytes]
      properties:
        path: { type: string, description: "A top-level entry (or one level deeper: <source>/<revision>)" }
        files: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
    MountInventory:
      type: object
      required: [scannedAt, files, bytes, entries, blobs, blobBytes]
      description: The last scan
      properties:
        scannedAt: { type: string, format: date-time }
        path: { type: string, description: The path scanned under the root (empty for all of it) }
        files: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
        truncated: { type: boolean, description: "The scan stopped at storage.mount_scan_max_files" }
        entries: { type: array, items: { $ref: "#/components/schemas/MountEntry" } }
        blobs: { type: integer, format: int64, description: "Content-store blobs found under cas/b3/ (copies of cached blobs)" }
        blobBytes: { type: integer, format: int64 }
        jobId: { type: string }
    Mount:
      type: object
      required: [id, name, kind, root, readOnly, licenceHint, description, health, utterances, copies, copyBytes, rev, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, description: "mnt_…" }
        name: { type: string }
        kind: { $ref: "#/components/schemas/MountKind" }
        root: { type: string }
        endpoint: { type: string }
        region: { type: string }
        revision: { type: string }
        credentials: { type: string, description: The secret's name (its value is never shown) }
        readOnly: { type: boolean }
        licenceHint: { type: string }
        description: { type: string }
        uri: { type: string, description: "mount://<name>/ — the prefix of every URI on this mount" }
        health: { $ref: "#/components/schemas/MountHealth" }
        inventory: { $ref: "#/components/schemas/MountInventory" }
        utterances: { type: integer, format: int64, description: Utterances with a URI on this mount }
        copies: { type: integer, format: int64, description: Content-store blobs with a copy on this mount }
        copyBytes: { type: integer, format: int64 }
        rev: { type: integer }
        createdBy: { $ref: "#/components/schemas/Actor" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MountList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Mount" } }
    LeaseMount:
      type: object
      required: [name, kind, root, readOnly]
      description: "A mount as a worker resolves mount://<name>/<path> URIs (cadence_worker.mounts)"
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/MountKind" }
        root: { type: string }
        readOnly: { type: boolean }
        endpoint: { type: string }
        region: { type: string }
        revision: { type: string }
        credentialsEnv: { type: string, description: "The lease env variable holding the mount's credentials, when the step may read them" }
    StorageProject:
      type: object
      required: [projectId, slug, datasetBytes, quotaBytes, over]
      properties:
        projectId: { type: string }
        slug: { type: string }
        datasetBytes: { type: integer, format: int64, description: Cached bytes of the dataset versions this project froze }
        quotaBytes: { type: integer, format: int64, description: "storage.project_quota_gb" }
        over: { type: boolean }
    StorageDataset:
      type: object
      required: [versionId, name, version, artifact, bytes, state, pinned, copies]
      properties:
        versionId: { type: string }
        name: { type: string }
        version: { type: string }
        artifact: { type: string, description: The dataset's directory artifact (b3) }
        projectId: { type: string, description: The project that froze it, when one did }
        bytes: { type: integer, format: int64 }
        state: { type: string, enum: [cached, evicted], description: "evicted: datasets.materialize brings it back" }
        pinned: { type: array, items: { type: string }, description: "Why it stays (empty when nothing pins it)" }
        copies: { type: integer, description: "Shards with a copy on a mount, of shards" }
        shards: { type: integer }
        evictable: { type: boolean, description: "Every shard also lives on a mount (or in another cached artifact) and nothing pins it" }
        lastUsedAt: { type: string, format: date-time }
    StorageUse:
      type: object
      required: [totalBytes, freeBytes, usedPct, highWaterPct, lowWaterPct, artifactBytes, datasetBytes, projects, datasets]
      properties:
        totalBytes: { type: integer, format: int64, description: The content store's filesystem }
        freeBytes: { type: integer, format: int64 }
        usedPct: { type: number, format: double }
        highWaterPct: { type: number, format: double, description: "storage.cache_high_water_pct" }
        lowWaterPct: { type: number, format: double, description: "storage.cache_low_water_pct" }
        artifactBytes: { type: integer, format: int64, description: Bytes of every live artifact in the store }
        datasetBytes: { type: integer, format: int64, description: Bytes of cached dataset versions }
        evictableBytes: { type: integer, format: int64, description: What an eviction down to the low mark could free }
        lastSweepAt: { type: string, format: date-time }
        projects: { type: array, items: { $ref: "#/components/schemas/StorageProject" } }
        datasets: { type: array, items: { $ref: "#/components/schemas/StorageDataset" }, description: "Dataset versions with a content-store artifact, least recently used first" }
    DatasetCacheRequest:
      type: object
      required: [versionId]
      properties:
        versionId: { type: string, description: "Dataset version id (ver_…)" }
    DatasetCacheSource:
      type: object
      required: [mount, shards, bytes]
      properties:
        mount: { type: string }
        shards: { type: integer }
        bytes: { type: integer, format: int64 }
    DatasetCachePlan:
      type: object
      required: [versionId, artifact, state, shards, bytes, copyShards, copyBytes, from, missing, freeShards, freeBytes, pinned, blocked]
      properties:
        versionId: { type: string }
        artifact: { type: string }
        state: { type: string, enum: [cached, evicted] }
        shards: { type: integer }
        bytes: { type: integer, format: int64 }
        copyShards: { type: integer, description: "materialize: shards not in the cache" }
        copyBytes: { type: integer, format: int64 }
        from: { type: array, items: { $ref: "#/components/schemas/DatasetCacheSource" }, description: "materialize: where the copies come from" }
        missing: { type: integer, description: "materialize: shards in no cache and on no mount" }
        freeShards: { type: integer, description: "evict: shards deleted from the cache" }
        freeBytes: { type: integer, format: int64 }
        pinned: { type: array, items: { type: string }, description: What pins the version }
        blocked: { type: array, items: { type: string }, description: "Why the command cannot proceed (empty when it can)" }
    # ---------------------------------------------------------------- interoperability: imports, exports, noise bank schemas (phase 4 · stream I) — add below
    DatasetExportFormat:
      type: string
      enum: [lhotse-shar, nemo-manifest, cadence-bundle, hf-hub]
      description: "lhotse-shar: Shar shards (cuts and recording tars); nemo-manifest: manifest.<split>.jsonl with the WAV files; cadence-bundle: the registry record, sources and blobs laid out as a content store, for another Cadence instance; hf-hub: an audiofolder dataset pushed to the Hugging Face Hub (approval)"
    DatasetExportRequest:
      type: object
      required: [version, format]
      additionalProperties: false
      properties:
        version: { type: string, description: "The frozen dataset version (ver_…)" }
        format: { $ref: "#/components/schemas/DatasetExportFormat" }
        project: { type: string, maxLength: 63, description: "Slug of the project the export's pipeline run runs in; default the project the version was ingested or imported in" }
        target: { type: string, maxLength: 1000, description: "cas, or a directory on a writable path mount (mount://exports/<path>); default mount://<storage.export_mount>/<collection>/<version>/<format> when that mount is registered and writable, else cas. Not used by hf-hub" }
        hubRepo: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,95}/[A-Za-z0-9][A-Za-z0-9._-]{0,95}$", description: "hf-hub: the dataset repository <org>/<name>; created when missing" }
        hubPrivate: { type: boolean, description: "hf-hub: create the repository private (default storage.export_hub_private)" }
    DatasetExportPlan:
      type: object
      required: [versionId, collection, version, format, projectId, project, target, stepKind, utterances, hours, bytes, licence, sources, approval, copies]
      properties:
        versionId: { type: string }
        collection: { type: string, example: dataset/fleurs-sr }
        version: { type: string }
        format: { $ref: "#/components/schemas/DatasetExportFormat" }
        projectId: { type: string }
        project: { type: string, description: The project's slug }
        target: { type: string, description: "cas, mount://… or hf://datasets/<repo>" }
        stepKind: { type: string, example: shar_export@1 }
        utterances: { type: integer }
        hours: { type: number, format: double }
        bytes: { type: integer, format: int64, description: The version's audio bytes (what the export reads) }
        licence: { type: string, description: The version's licence }
        sources: { type: array, items: { type: string }, description: Names of the sources the version holds }
        approval: { type: boolean, description: "True when the real call waits for an approval (hf-hub)" }
        copies: { type: boolean, description: "True when the audio lands unchanged on a mount and becomes copies of its content-store blobs (the cache may then evict the version)" }
    DatasetExportState: { type: string, enum: [running, done, failed, cancelled], description: "The state of the export's pipeline run; done once the export artifact is recorded" }
    DatasetExportFile:
      type: object
      required: [path, bytes]
      properties:
        path: { type: string, description: "Relative to the target (a mount directory) or to files/ in the export artifact" }
        hash: { type: string, pattern: "^b3:[0-9a-f]{64}$" }
        bytes: { type: integer, format: int64 }
    DatasetExportHub:
      type: object
      required: [repo]
      properties:
        repo: { type: string }
        commit: { type: string }
        url: { type: string }
        private: { type: boolean }
    DatasetExport:
      type: object
      required: [id, format, projectId, target, state, files, bytes, copies, createdBy, createdAt, rev]
      properties:
        id: { type: string, description: "dex_…" }
        versionId: { type: string, description: Empty when an export step ran in a project pipeline on a dataset artifact no version names }
        collection: { type: string }
        version: { type: string }
        format: { $ref: "#/components/schemas/DatasetExportFormat" }
        projectId: { type: string }
        target: { type: string }
        state: { $ref: "#/components/schemas/DatasetExportState" }
        pipelineRunId: { type: string }
        stepKind: { type: string }
        artifact: { type: string, description: "The export artifact (b3:…): export.json and, with target cas, the files" }
        files: { type: integer, description: Files the export wrote }
        bytes: { type: integer, format: int64 }
        copies: { type: integer, description: "Content-store blobs the export placed on a mount unchanged (recorded as mount copies)" }
        sample: { type: array, items: { $ref: "#/components/schemas/DatasetExportFile" }, description: The first files written (up to 20) }
        hub: { $ref: "#/components/schemas/DatasetExportHub" }
        error: { type: string, description: Why the export's pipeline run failed }
        createdBy: { $ref: "#/components/schemas/Actor" }
        approvalId: { type: string }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        rev: { type: integer }
    DatasetExportList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DatasetExport" } }
    # ---------------------------------------------------------------- ingest, draft datasets, freeze schemas (phase 4 · stream D) — add below
    SourceNew:
      type: object
      required: [name, licence, kind]
      additionalProperties: false
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,98}[a-z0-9]$", description: "Lowercase letters, digits, dots, dashes and underscores (parlaspeech-rs)" }
        licence: { type: string, minLength: 1, maxLength: 200, description: "The corpus's licence, an SPDX id where one exists (CC-BY-4.0); unknown, none and NOASSERTION are refused for ingest" }
        kind: { $ref: "#/components/schemas/SourceKind" }
        languages: { type: array, maxItems: 50, items: { type: string, minLength: 2, maxLength: 35 } }
        url: { type: string, maxLength: 500, description: "Where the corpus comes from (a homepage, hf://datasets/…, mount://corpora/…)" }
        description: { type: string, maxLength: 2000 }
    SourceClearance:
      type: object
      description: One change of a source's licence or training clearance
      required: [licence, trainingCleared, actor, at]
      properties:
        licence: { type: string }
        trainingCleared: { type: boolean }
        actor: { $ref: "#/components/schemas/Actor" }
        at: { type: string, format: date-time }
        change: { type: string, enum: [created, licence, cleared, uncleared], description: What changed }
    SourceIngest:
      type: object
      description: A dataset version registered from the source by an import or an ingest
      required: [datasetVersionId, utterances, hours, at]
      properties:
        datasetVersionId: { type: string }
        pipelineRunId: { type: string }
        projectId: { type: string }
        stepKind: { type: string, example: sdp_ingest@1 }
        frozen: { type: boolean }
        utterances: { type: integer }
        hours: { type: number, format: double }
        at: { type: string, format: date-time }
    DatasetQualityCheck:
      type: object
      required: [name, status, value, threshold]
      properties:
        name: { type: string, enum: [silence_share, clipping_share, length_outliers], description: "silence_share: mean non-speech share; clipping_share: share of segments with clipped samples; length_outliers: share of segments whose characters per second lie past the z threshold" }
        status: { type: string, enum: [pass, warn] }
        value: { type: number, format: double }
        threshold: { type: number, format: double }
        message: { type: string }
    DatasetQuality:
      type: object
      description: Data-quality checks of the version (warnings never block a freeze; they are in the card)
      required: [passed, checks]
      properties:
        passed: { type: boolean }
        checks: { type: array, items: { $ref: "#/components/schemas/DatasetQualityCheck" } }
    DatasetCard:
      type: object
      description: The dataset card (Markdown) in the content store
      required: [hash]
      properties:
        hash: { type: string, pattern: "^b3:[0-9a-f]{64}$" }
        bytes: { type: integer, format: int64 }
    DatasetHistogram:
      type: object
      description: Binned counts; edges are lower bounds and the last bucket is open
      required: [edges, counts]
      properties:
        edges: { type: array, items: { type: number, format: double } }
        counts: { type: array, items: { type: integer } }
    DatasetStatsGroup:
      type: object
      required: [utterances, hours]
      properties:
        origin: { type: string }
        role: { type: string, description: "caller, bot or mono" }
        utterances: { type: integer }
        hours: { type: number, format: double }
    DatasetStats:
      type: object
      description: Statistics the Dataset version panel charts (R53), binned by the step that computed them
      properties:
        durationHistogram: { $ref: "#/components/schemas/DatasetHistogram" }
        charsPerSecondHistogram: { $ref: "#/components/schemas/DatasetHistogram" }
        levelHistogram: { $ref: "#/components/schemas/DatasetHistogram" }
        durationPercentiles:
          type: object
          properties:
            p5: { type: number, format: double }
            p50: { type: number, format: double }
            p95: { type: number, format: double }
        origins: { type: array, items: { $ref: "#/components/schemas/DatasetStatsGroup" } }
        roles: { type: array, items: { $ref: "#/components/schemas/DatasetStatsGroup" } }
        sourceRates:
          type: array
          items:
            type: object
            required: [rate, utterances]
            properties: { rate: { type: integer }, utterances: { type: integer } }
        speakers: { type: integer }
    DatasetShard:
      type: object
      description: "One shard of a frozen version: a Lhotse cuts manifest over the version's audio in the content store"
      required: [index, hash, utterances, bytes, seconds, location, pinned]
      properties:
        index: { type: integer }
        hash: { type: string, description: "b3 hash of the shard's cuts manifest (shards/cuts.NNNNNN.jsonl.gz)" }
        path: { type: string, description: Path of the cuts manifest inside the dataset artifact }
        utterances: { type: integer }
        bytes: { type: integer, format: int64, description: Audio bytes of the shard's utterances }
        seconds: { type: number, format: double }
        location: { type: string, description: "Where the shard lives: cas (the content store); mounts and exports come with the cache (stream M)" }
        pinned: { type: boolean, description: "Kept from eviction (set by the cache; false until it pins the version)" }
    DatasetRecipe:
      type: object
      description: The project recipe a draft was ingested from
      properties:
        projectId: { type: string }
        pipeline: { type: string, example: data-ingest }
        commit: { type: string, description: The commit of the project repository the pipeline was read at }
        stepKind: { type: string, example: dataset_freeze@1 }
        params: { type: object, additionalProperties: true, description: The draft step's parameters }
    DatasetFreezeState:
      type: object
      description: The freeze of a draft
      properties:
        pipelineRunId: { type: string }
        startedAt: { type: string, format: date-time }
        frozenAt: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/Actor" }
    DatasetLeakage:
      type: object
      required: [passed, goldenSets]
      properties:
        passed: { type: boolean }
        goldenSets: { type: integer, description: Golden sets checked }
    DatasetFreeze:
      type: object
      required: [version, leakage]
      properties:
        version: { $ref: "#/components/schemas/DatasetVersion" }
        leakage: { $ref: "#/components/schemas/DatasetLeakage" }
        pipelineRunId: { type: string, description: "The freeze pipeline run, when one was started" }
    DatasetFreezeRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: string, description: "The draft dataset version (ver_…)" }
    DatasetPreviewRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: string, description: "The dataset version to preview (ver_…)" }
        minDuration: { type: number, format: double, minimum: 0, description: Drop utterances shorter than this (seconds) }
        maxDuration: { type: number, format: double, minimum: 0, description: Drop utterances longer than this (seconds) }
        minCharsPerSecond: { type: number, format: double, minimum: 0 }
        maxCharsPerSecond: { type: number, format: double, minimum: 0 }
        languages: { type: array, maxItems: 50, items: { type: string }, description: "Keep only these languages (he matches he-IL)" }
        origins: { type: array, maxItems: 20, items: { type: string }, description: Keep only transcripts of these origins }
        splits: { type: array, items: { $ref: "#/components/schemas/DatasetSplitName" }, description: Keep only these splits }
    DatasetPreviewCell:
      type: object
      required: [language, split, utterances, hours]
      properties:
        language: { type: string }
        split: { $ref: "#/components/schemas/DatasetSplitName" }
        utterances: { type: integer }
        hours: { type: number, format: double }
        speakers: { type: integer }
    DatasetPreview:
      type: object
      required: [versionId, frozen, utterances, hours, cells, dropped]
      properties:
        versionId: { type: string }
        frozen: { type: boolean }
        utterances: { type: integer, description: Kept after the filters }
        hours: { type: number, format: double }
        cells: { type: array, items: { $ref: "#/components/schemas/DatasetPreviewCell" }, description: Kept utterances and hours per language and split }
        dropped:
          type: object
          description: Utterances each filter drops (the first filter that drops one counts it)
          additionalProperties: { type: integer }
    # ---------------------------------------------------------------- auxiliary models, pseudo-labels schemas (phase 4 · stream X) — add below
