    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: jobLogs.list
      summary: Read a job's log lines from its worker, filtered by level and text, after a line number
      tags: [jobs]
      x-cadence:
        toolDescription: >
          Read the log of a job that ran on a worker: lines {seq, t, level, msg, fields}. level=warn keeps warn and
          error; text matches the message (case-insensitive); after=<seq> pages forward (nextAfter); tail=true returns
