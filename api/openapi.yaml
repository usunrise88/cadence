      parameters:
        - { name: timeout, in: query, description: Seconds to wait, schema: { type: integer, minimum: 0, maximum: 60, default: 30 } }
      responses:
        "200":
          description: The pipeline run, ended or as it is at the timeout
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/PipelineRun" } } }
        default: { $ref: "#/components/responses/Problem" }


