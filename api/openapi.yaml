  # ---------------------------------------------------------------- runs, checkpoints, metrics (phase 2 · wave 2 · stream R) — add paths below this line
  /projects/{p}/runs:
    x-cadence: { entity: runs }
    parameters: [{ $ref: "#/components/parameters/ProjectSlug" }]
    get:
      operationId: runs.list
      summary: Training runs of a project, newest first
      tags: [runs]
      x-cadence:
        toolDescription: >
          List the project's training runs, newest first: status (queued, running, paused, done, failed, cancelled),
          start (base model or checkpoint), mix revision, step budget, final metrics and the best checkpoint. Filter
          by status. Open one with runs.get.
      parameters:
        - { name: status, in: query, description: Only runs in this status, schema: { $ref: "#/components/schemas/RunStatus" } }
        - { name: experiment, in: query, description: "Only runs of this experiment (exp_…)", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Runs, newest first
          content: { application/json: { schema: { $ref: "#/components/schemas/RunList" } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: runs.new
      summary: Start a training run (one optimisation stage); ?dryRun=true answers the estimate first
      tags: [runs]
      x-cadence:
        toolDescription: >
          Start one training stage: a base model (init base) or a checkpoint (init checkpoint, ckp_…), a mix (mix_…
          or its name, at its current revision unless mixRevision), the project's train-stage pipeline at a commit,
          a step budget and a seed. Always call it with dryRun=true first: the answer is the estimate (GPU-hours,
          duration, card, data volume, basis table or measured, ±, today's GPU spend against the project's budget).
          Without dryRun it answers 201 with the run, or 202 with an approvalId when the estimate exceeds today's
          remaining GPU budget of the project or of your session — then wait for approval.decided. Eval-only
          datasets are refused. Follow the run with runs.get and metrics.get; checkpoints arrive on checkpoints.list.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RunNew" } } }
      responses:
        "200":
          description: Dry run — the estimate; nothing was written or queued
          content: { application/json: { schema: { $ref: "#/components/schemas/RunEstimate" } } }
        "201":
          description: The run, queued
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } }
        "202": { $ref: "#/components/responses/ApprovalAccepted" }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{p}/runs:calibrate:
    x-cadence: { entity: runs }
    parameters: [{ $ref: "#/components/parameters/ProjectSlug" }]
    post:
      operationId: runs.calibrate
      summary: Measure seconds per step and batch sizes for a base model on the training card (the family's calibrate step)
      tags: [runs]
      x-cadence:
        toolDescription: >
          Calibrate before the first run of a base model on a card: runs the model family's calibrate step on the
          mix's data under the card's memory cap. When it finishes, runs.new?dryRun=true estimates switch from basis
          table to basis measured for that base model, card class, memory cap and precision. Answers 201 with the
          pipeline run (follow it with pipelineRuns.wait), or 202 with an approvalId when today's GPU budget is spent.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RunCalibrate" } } }
      responses:
        "200":
          description: Dry run — the calibration's key and plan; nothing was queued
          content: { application/json: { schema: { $ref: "#/components/schemas/RunCalibration" } } }
        "201":
          description: The calibration's pipeline run, queued
          content: { application/json: { schema: { $ref: "#/components/schemas/RunCalibration" } } }
        "202": { $ref: "#/components/responses/ApprovalAccepted" }
        default: { $ref: "#/components/responses/Problem" }

  /runs/{id}:
    x-cadence: { entity: runs }
    parameters: [{ name: id, in: path, required: true, description: "Run id (run_…)", schema: { type: string } }]
    get:
      operationId: runs.get
      summary: Get a run with its stage timeline, final metrics, departures from defaults and parent run
      tags: [runs]
      x-cadence:
        toolDescription: >
          A training run: status, the stage timeline (calibrate, train, … with their states and attempts), the job
          to pause or cancel (currentJobId, via jobs.pause | jobs.resume | jobs.cancel), OOM retries (batch scale),
          final metrics, departures from defaults, the parent run and the config diff against it, the best
          checkpoint and the estimate it started with.
      responses:
        "200":
          description: The run
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } }
        default: { $ref: "#/components/responses/Problem" }

  /runs/{id}:resume:
    x-cadence: { entity: runs }
    parameters: [{ name: id, in: path, required: true, description: "Run id (run_…)", schema: { type: string } }]
    post:
      operationId: runs.resume
      summary: Continue a stopped or failed run from its last training state (same stage, same optimiser state)
      tags: [runs]
      x-cadence:
        toolDescription: >
          Continue the same stage of a cancelled or failed run from its last saved training-state (same optimiser
          and sampler state, same step budget). A paused step job resumes with jobs.resume instead. Send ifMatch with
          the run's etag. Answers the run (queued again), 409 no-training-state when it never saved one (start a new
          run), or 202 with an approvalId when the remaining steps exceed today's GPU budget.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      responses:
        "200":
          description: The run, queued again (or, for a dry run, what it would be)
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } }
        "202": { $ref: "#/components/responses/ApprovalAccepted" }
        default: { $ref: "#/components/responses/Problem" }

  /runs/{id}:stage:
    x-cadence: { entity: runs }
    parameters: [{ name: id, in: path, required: true, description: "The parent run (run_…)", schema: { type: string } }]
    post:
      operationId: runs.stage
      summary: Start a new stage from a checkpoint of this run with an explicit peak learning rate
      tags: [runs]
      x-cadence:
        toolDescription: >
          Start the next training stage from a checkpoint of this run (default its best kept checkpoint): a new run
          with init checkpoint, a new optimiser and the peak learning rate you give (peakLr, e.g. 2e-5 for a
          continuation), on the parent's mix unless you name another. The new run records the parent, and runs.get
          shows the config diff against it. Send ifMatch with the parent's etag; dryRun=true answers the estimate.
          Answers 201 with the new run or 202 with an approvalId over budget.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RunStage" } } }
      responses:
        "200":
          description: Dry run — the new stage's estimate
          content: { application/json: { schema: { $ref: "#/components/schemas/RunEstimate" } } }
        "201":
          description: The new run, queued
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } }
        "202": { $ref: "#/components/responses/ApprovalAccepted" }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{p}/checkpoints:
    x-cadence: { entity: checkpoints }
    parameters: [{ $ref: "#/components/parameters/ProjectSlug" }]
    get:
      operationId: checkpoints.list
      summary: Checkpoints of a project or of one run, best validation WER first
      tags: [runs]
      x-cadence:
        toolDescription: >
          Checkpoints registered by training runs (step, validation WER, family, weights hash; trained or averaged),
          best validation WER first. Filter by run; kept=true lists only the top k per run (training.keep_top_k).
          Average some with checkpoints.average; start a new stage from one with runs.stage.
      parameters:
        - { name: run, in: query, description: "Only this run's checkpoints (run_…)", schema: { type: string } }
        - { name: kept, in: query, description: Only the checkpoints in their run's top k, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Checkpoints, best validation WER first
          content: { application/json: { schema: { $ref: "#/components/schemas/CheckpointList" } } }
        default: { $ref: "#/components/responses/Problem" }

  /checkpoints/{id}:
    x-cadence: { entity: checkpoints }
    parameters: [{ name: id, in: path, required: true, description: "Checkpoint id (ckp_…)", schema: { type: string } }]
    get:
      operationId: checkpoints.get
      summary: Get a checkpoint with its artifact, metrics and lineage
      tags: [runs]
      responses:
        "200":
          description: The checkpoint
          content: { application/json: { schema: { $ref: "#/components/schemas/Checkpoint" } } }
        default: { $ref: "#/components/responses/Problem" }

  /runs/{id}/checkpoints:average:
    x-cadence: { entity: checkpoints }
    parameters: [{ name: id, in: path, required: true, description: "Run id (run_…)", schema: { type: string } }]
    post:
      operationId: checkpoints.average
      summary: Average chosen checkpoints of a run with the family's average step; the result is a new checkpoint of the run
      tags: [runs]
      x-cadence:
        toolDescription: >
          Average two or more checkpoints of one run (ids from checkpoints.list, typically the top k) with the model
          family's average step. Answers 201 with the pipeline run; when it finishes the averaged checkpoint appears
          in checkpoints.list (kind averaged, averagedFrom) with its own validation WER when the step measures one.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CheckpointAverage" } } }
      responses:
        "200":
          description: Dry run — the plan; nothing was queued
          content: { application/json: { schema: { $ref: "#/components/schemas/CheckpointAverageStarted" } } }
        "201":
          description: The averaging pipeline run, queued
          content: { application/json: { schema: { $ref: "#/components/schemas/CheckpointAverageStarted" } } }
        "202": { $ref: "#/components/responses/ApprovalAccepted" }
        default: { $ref: "#/components/responses/Problem" }

  /metrics/{id}:
    x-cadence: { entity: metrics }
    parameters: [{ name: id, in: path, required: true, description: "The run whose metrics to read (run_…)", schema: { type: string } }]
    get:
      operationId: metrics.get
      summary: A run's metric series, binned server-side for charts (min and max per bucket), with checkpoint marks
      tags: [runs]
      x-cadence:
        toolDescription: >
          Metric series of a training run (loss, val_wer, lr, …) for charts and for judging progress: choose names,
          the x axis (step, epoch, wall seconds since the first point, or GPU-hours), and maxPoints — longer series
          are binned server-side, each point carrying the bucket's mean value with min and max. afterStep returns
          only newer points (live append). Checkpoint marks come along.
      parameters:
        - name: names
          in: query
          description: "Metric names (all when absent): repeat the parameter (names=loss&names=val_wer), as every array query parameter"
          schema: { type: array, maxItems: 50, items: { type: string, maxLength: 100 } }
        - { name: x, in: query, description: The x axis, schema: { $ref: "#/components/schemas/MetricAxis" } }
        - { name: maxPoints, in: query, description: Points per series at most; longer series are binned, schema: { type: integer, minimum: 2, maximum: 10000, default: 1000 } }
        - { name: afterStep, in: query, description: Only points after this optimiser step (live append), schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        "200":
          description: The series
          content: { application/json: { schema: { $ref: "#/components/schemas/MetricSeriesSet" } } }
        default: { $ref: "#/components/responses/Problem" }


  # ---------------------------------------------------------------- playbooks (phase 2 · wave 2 · stream K) — add paths below this line
  /playbooks:
    x-cadence: { entity: playbooks }
    get:
      operationId: playbooks.list
      summary: The playbooks Cadence ships, with their inputs, chain, stop conditions and estimate
      tags: [playbooks]
      x-cadence:
        toolDescription: >
          List the playbooks: prefilled chains of commands with inputs, stop conditions and an estimate (the sum of
          the chain's step estimates). With project, inputs taken from the project (its base model, its adopted replay
          corpus) are filled in and the estimate uses them. runnable says whether the playbook can run yet.
      parameters:
        - { name: project, in: query, description: "A project slug: fill project facts and estimate with them", schema: { $ref: "#/components/schemas/Slug" } }
      responses:
        "200":
          description: Playbooks
          content: { application/json: { schema: { $ref: "#/components/schemas/PlaybookList" } } }
        default: { $ref: "#/components/responses/Problem" }

  /playbooks/{name}:
    x-cadence: { entity: playbooks }
    parameters:
      - { name: name, in: path, required: true, description: "Playbook name (templates/playbooks/<name>.yaml)", schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,62}$" } }
    get:
      operationId: playbooks.get
      summary: One playbook with its inputs, chain, prompt template and estimate
      tags: [playbooks]
      parameters:
        - { name: project, in: query, description: "A project slug: fill project facts and estimate with them", schema: { $ref: "#/components/schemas/Slug" } }
      responses:
        "200":
          description: The playbook
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Playbook" } } }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{p}/playbooks/{name}:run:
    x-cadence: { entity: playbooks }
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - { name: name, in: path, required: true, description: "Playbook name", schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,62}$" } }
    post:
      operationId: playbooks.run
      summary: Start a playbook session — dryRun answers the estimate, the plan and the rendered prompt without starting
      tags: [playbooks]
      x-cadence:
        toolDescription: >
          Run a playbook in a project: resolves its inputs (given, from defaults.yaml or from the project), renders its
          prompt, sums the chain's estimate and starts an agent session of kind playbook whose plan is the chain. Call
          it with dryRun=true first to see the estimate and the plan; ifMatch is the playbook's version (the etag of
          playbooks.get) or "*". Agents cannot start playbook sessions; use playbooks.get for the estimate.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/PlaybookRunNew" } } }
      responses:
        "200":
          description: Dry run — the resolved inputs, estimate, plan and prompt; no session was started
          content: { application/json: { schema: { $ref: "#/components/schemas/PlaybookRunResult" } } }
        "201":
          description: Started; the result carries the playbook session
          content: { application/json: { schema: { $ref: "#/components/schemas/PlaybookRunResult" } } }
        default: { $ref: "#/components/responses/Problem" }



  # ---------------------------------------------------------------- content-store retention (phase 2 · stream E) — add paths below this line
  /artifacts:evict:
    x-cadence: { entity: artifacts }
    post:
      operationId: artifacts.evict
      summary: Free content-store space by deleting superseded training states (always waits for an approval)
      tags: [artifacts]
      x-cadence:
        toolDescription: >
          Delete the blobs of superseded training-state artifacts from the content store: every state of a run whose
          pipeline finished, and every state but the newest of a failed or cancelled run (runs.resume continues from
          the newest). States a waiting or running step job names, inputs of running pipelines, artifacts a frozen
          registry version or a checkpoint references and files another live artifact lists are kept. dryRun=true
          answers the candidates, the artifacts kept with the reason and the bytes it would free. A real call always
          answers 202 with an approvalId, for people too; once a person approves it, a job deletes the blobs (the
          approval's result is 202 with its jobId) and marks the artifacts evicted (their index rows stay, so lineage still
          resolves). Agents may not evict. The backup mirror is the way back.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/ArtifactEvict" } } }
      responses:
        "200":
          description: Dry run — the artifacts that would be evicted, the ones kept and the bytes freed; nothing changed
          content: { application/json: { schema: { $ref: "#/components/schemas/EvictionPlan" } } }
        "202": { $ref: "#/components/responses/ApprovalAccepted" }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- golden sets, normalizers, leakage (phase 3 · stream G) — add paths below this line
  /registry/normalizers:
    x-cadence: { entity: normalizers, kind: normalizer }
    get:
      operationId: normalizers.list
      summary: List scoring normalizer versions (the text rules both sides of a WER are compared after, R21)
      tags: [registry]
      x-cadence:
        toolDescription: >
          List scoring normalizer versions (normalizer/basic, normalizer/he-il, …): the Unicode form, case folding,
          punctuation, combining-mark removal and literal mappings applied to reference and hypothesis before WER is
          computed. Every golden set is frozen with one normalizer version, so its scores stay comparable over time.
      parameters:
        - $ref: "#/components/parameters/RegistryCollectionFilter"
        - $ref: "#/components/parameters/RegistryStateFilter"
      responses:
        "200":
          description: Normalizer versions, newest first
          content: { application/json: { schema: { $ref: "#/components/schemas/NormalizerVersionList" } } }
        default: { $ref: "#/components/responses/Problem" }

  /registry/normalizers/{id}:
    x-cadence: { entity: normalizers, kind: normalizer }
    parameters: [{ $ref: "#/components/parameters/VersionId" }]
    get:
      operationId: normalizers.get
      summary: Get a scoring normalizer version with its rules and the projects that use it
      tags: [registry]
      responses:
        "200":
          description: The version
          content: { application/json: { schema: { $ref: "#/components/schemas/NormalizerVersion" } } }
        default: { $ref: "#/components/responses/Problem" }

  /registry/golden-sets:
    x-cadence: { entity: goldenSets, kind: golden_set }
    get:
      operationId: goldenSets.list
      summary: List golden set versions (frozen eval-only dataset versions tied to a scoring normalizer)
      tags: [registry]
      x-cadence:
        toolDescription: >
          List golden sets: frozen, held-out test sets per language and domain, each an eval-only dataset version
          tied to one scoring normalizer version. Runs never read them: a dataset version or mix sharing an
          utterance (by id or fingerprint) with any golden set is refused for training (golden-set-leakage).
          Adopt one into a project with projects.adopt.
      parameters:
        - $ref: "#/components/parameters/RegistryCollectionFilter"
        - $ref: "#/components/parameters/RegistryStateFilter"
      responses:
        "200":
          description: Golden set versions, newest first
          content: { application/json: { schema: { $ref: "#/components/schemas/GoldenSetVersionList" } } }
        default: { $ref: "#/components/responses/Problem" }

  /registry/golden-sets/{id}:
    x-cadence: { entity: goldenSets, kind: golden_set }
    parameters: [{ $ref: "#/components/parameters/VersionId" }]
    get:
      operationId: goldenSets.get
      summary: Get a golden set version with its dataset, normalizer, size and the projects that use it
      tags: [registry]
      responses:
        "200":
          description: The version
          content: { application/json: { schema: { $ref: "#/components/schemas/GoldenSetVersion" } } }
        default: { $ref: "#/components/responses/Problem" }

  /registry/golden-sets:freeze:
    x-cadence: { entity: goldenSets, kind: golden_set }
    post:
      operationId: goldenSets.freeze
      summary: Freeze an eval-only dataset version and a scoring normalizer into a golden set (always waits for the admin's approval)
      tags: [registry]
      x-cadence:
        toolDescription: >
          Freeze a golden set from a frozen dataset version registered eval-only (datasets.get shows
          dataset.evalOnly: true) and a scoring normalizer version (normalizers.list; default defaults.yaml
          eval.normalizer). The dataset's utterances must not overlap any trainable dataset version by utterance or
          fingerprint, else golden-set-leakage lists the overlapping versions and counts. dryRun=true checks
          everything and answers the would-be golden set. A real call always answers 202 with an approvalId, for
          people too: freezing is a registry-scope approval only the admin decides; the approved request registers
          golden-set/<name> (default: the dataset collection's name). Freezing the same content again answers the
          version already frozen.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GoldenSetFreeze" } } }
      responses:
        "200":
          description: Dry run — the golden set that would be frozen; or the version this content was already frozen as
          content: { application/json: { schema: { $ref: "#/components/schemas/GoldenSetVersion" } } }
        "201":
          description: Frozen (the approved request)
          content: { application/json: { schema: { $ref: "#/components/schemas/GoldenSetVersion" } } }
        "202": { $ref: "#/components/responses/ApprovalAccepted" }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- evals, gates, models (phase 3 · stream E) — add paths below this line
  /projects/{p}/evals:
    x-cadence: { entity: evals }
    parameters: [{ $ref: "#/components/parameters/ProjectSlug" }]
    get:
      operationId: evals.list
      summary: List the project's evals, newest first (cells omitted; evals.get has them)
      tags: [evals]
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/EvalStatus" } }
        - { name: subject, in: query, required: false, description: "Only evals of this subject (ckp_…, or a model or base model version ver_…)", schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Evals, newest first
          content: { application/json: { schema: { $ref: "#/components/schemas/EvalList" } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: evals.new
      summary: Evaluate a checkpoint, model or base model against the baseline on golden sets × latency profiles × decoding; ?dryRun=true answers the plan
      tags: [evals]
      x-cadence:
        toolDescription: >
          Run the eval matrix (R20–R24): subject (exactly one of checkpointId ckp_…, modelVersionId or
          baseModelVersionId ver_…) × golden sets × latency profiles × decoding variants, each cell compared with the
          same cell of the baseline. Everything is optional but the subject: golden sets default to the ones the
          project's gates.yaml names (target and replay), else its adopted golden sets; profiles to
          eval.matrix_profiles the model family declares, always with the primary profile; decoding to [{boost: none}];
          augmentations (the robustness axis) to [{profile: none}] — add {profile: augment/<name>.yaml@<commit>,
          seed?} to decode the golden sets also through that augmentation profile; baseline to the project's
          @baseline alias, else its default base model. Cells already in the eval records
          (any project, same weights × golden set × normalizer × decoding × scorer) are reused; only missing cells run
          (baseline cells included). Always call it with dryRun=true first: the answer is the plan — cells cached and
          to compute and the GPU-hour estimate. Without dryRun it answers 201 with the eval (follow it with evals.get;
          eval.{id}.progress reports cells done), or 202 with an approvalId when the estimate exceeds today's GPU budget.
          Then evals.gate applies the project's gate.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EvalNew" } } }
      responses:
        "200":
          description: Dry run — the plan (cells, cached and to compute, estimate); nothing was written or queued
          content: { application/json: { schema: { $ref: "#/components/schemas/EvalPlan" } } }
        "201":
          description: The eval, queued (done at once when every cell was cached)
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Eval" } } }
        "202": { $ref: "#/components/responses/ApprovalAccepted" }
        default: { $ref: "#/components/responses/Problem" }

  /evals/{id}:
    x-cadence: { entity: evals }
    parameters: [{ name: id, in: path, required: true, description: "Eval id (evl_…)", schema: { type: string } }]
    get:
      operationId: evals.get
      summary: Get an eval with its cells, deltas against the baseline with confidence intervals, and the worst utterances of a cell
      tags: [evals]
      x-cadence:
        toolDescription: >
          An eval: status, progress, and one cell per role (subject, baseline) × golden set × profile × decoding with
          WER, CER, the punctuation-insensitive WER, substitutions / deletions / insertions, duration buckets and
          partial stability; subject cells carry the delta against the baseline's cell with a paired blockwise
          bootstrap interval (significant when it excludes zero). worst=N adds the N utterances with the most errors to
          each subject cell that passes the filters (cell=evc_… for one cell): reference, hypothesis and the alignment
          ops (=, S, D, I). Filters: goldenSet, profile, role. Each cell's metrics carry entity accuracy for the
          language pack's ITN classes and latency to final (p50/p95 ms, real-time pace) when available, else the
          reason; with augmentations, robustness lists each augmented cell's WER against the same cell without
          augmentation (reported, not gated).
      parameters:
        - { name: worst, in: query, required: false, description: "Add the N worst utterances (most errors) to each matching cell", schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cell, in: query, required: false, description: "Only this cell (evc_…)", schema: { type: string } }
        - { name: goldenSet, in: query, required: false, description: "Only cells of this golden set (ver_… or its collection name)", schema: { type: string } }
        - { name: profile, in: query, required: false, description: Only cells of this latency profile, schema: { type: string } }
        - { name: role, in: query, required: false, schema: { $ref: "#/components/schemas/EvalCellRole" } }
      responses:
        "200":
          description: The eval
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Eval" } } }
        default: { $ref: "#/components/responses/Problem" }

  /evals/{id}:gate:
    x-cadence: { entity: evals }
    parameters: [{ name: id, in: path, required: true, description: "Eval id (evl_…)", schema: { type: string } }]
    post:
      operationId: evals.gate
      summary: Apply the project's gate (gates.yaml at main) to a finished eval and record the verdict
      tags: [evals]
      x-cadence:
        toolDescription: >
          Apply the gate to a done eval: gates.yaml at the head of main (defaults gate.* and eval.* where it is
          silent). At the primary profile it checks the target golden sets (beat-baseline: the WER delta's whole
          interval below zero), the replay golden sets (fail when the delta exceeds maxRegression and its interval
          excludes zero) and deletions bought with insertions on the target sets. Answers the eval with gate: verdict
          passed | failed, each check passed | failed | inconclusive with its numbers, and the gates.yaml commit used.
          models.register needs the latest gated eval of a checkpoint to have passed.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      responses:
        "200":
          description: The eval with its verdict (a dry run computes it without recording)
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Eval" } } }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{p}/gates:
    x-cadence: { entity: gates, singleton: true }
    parameters: [{ $ref: "#/components/parameters/ProjectSlug" }]
    get:
      operationId: gates.get
      summary: Get the project's gate (gates.yaml at main, with the defaults it departs from)
      tags: [evals]
      x-cadence:
        toolDescription: >
