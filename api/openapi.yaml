          apply), its effective configuration with defaults filled in, and the departures from defaults.yaml. The ETag
          is the commit that last changed the file ("defaults" when there is none); gates.edit takes it as If-Match.
      responses:
        "200":
          description: The gate
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Gates" } } }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: gates.edit
      summary: Commit a new gates.yaml to main (approval for agents); dryRun validates
      tags: [evals]
      x-cadence:
        toolDescription: >
          Change the project's gate: send content (the YAML) or config (the same as an object) with If-Match = the
          ETag of gates.get. The file is validated first (gate-config-invalid lists every problem); dryRun validates
          and commits nothing. For agents this waits for a person's approval (gates decide what counts as better).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GatesEdit" } } }
      responses:
        "200":
          description: The gate as committed (a dry run shows it as it would be)
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Gates" } } }
