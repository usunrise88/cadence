          description: The session with its merge state; for a dry run, what would merge
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentSession" } } }
        default: { $ref: "#/components/responses/Problem" }

  /agent-sessions/{id}:revert:
    x-cadence: { entity: agentSessions }
    parameters: [{ $ref: "#/components/parameters/AgentSessionId" }]
    post:
      operationId: agentSessions.revert
      summary: Discard the session branch as a whole and end the session
      tags: [agentSessions]
      x-cadence:
        toolDescription: >
          Discard a session's changes: delete its branch session/<id>; main does not change. The session must be
          paused or ended; a paused one ends.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      responses:
        "200":
          description: The session with merge state discarded
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentSession" } } }
        default: { $ref: "#/components/responses/Problem" }

  /agent-sessions/{id}/agent-messages:
    x-cadence: { entity: agentMessages }
    parameters: [{ $ref: "#/components/parameters/AgentSessionId" }]
    get:
      operationId: agentMessages.list
      summary: The session transcript in order, one page after a sequence number
      tags: [agentSessions]
      parameters:
        - { name: after, in: query, description: Only entries with a larger seq (the last seq of the previous page), schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        "200":
          description: Transcript entries, oldest first
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentMessageList" } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: agentMessages.new
      summary: Send a user message with entity references; the agent answers on agent.session.{id}
      tags: [agentSessions]
      x-cadence:
        toolDescription: >
          Send a message to an agent session. References (@run:123, @mix:mix_…, @utt:…#t=…) expand into a compact
          context block for the agent and become its selection://current. Agents cannot send messages to sessions.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentMessageNew" } } }
      responses:
        "200":
          description: Dry run — the entry with its expanded context; nothing was sent
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentMessage" } } }
        "201":
          description: >
            Queued for the agent (delivery pending until the host takes it). A session paused for idleness is resumed
            first; a session paused for any other reason answers 409 conflict with the reason until it is resumed
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentMessage" } } }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- agent host protocol (exempt: tag host, never MCP tools)
  # Authenticated by the agent-host credential (cah_…); every other credential is refused. These are the host's
  # protocol, not commands: a report carries entry keys the host chose, so a retried batch upserts the same rows.
  /host-sessions:claim:
    x-cadence: { entity: hostSessions }
    post:
      operationId: hostSessions.claim
      summary: Long-poll for work — sessions to start, messages to deliver, controls and permission decisions
      tags: [host]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HostClaim" } } }
      responses:
        "200":
          description: Work for this host (empty lists when the wait passed with nothing to do)
          content: { application/json: { schema: { $ref: "#/components/schemas/HostWork" } } }
        default: { $ref: "#/components/responses/Problem" }

  /host-sessions/{id}:report:
    x-cadence: { entity: hostSessions }
    parameters: [{ $ref: "#/components/parameters/AgentSessionId" }]
    post:
      operationId: hostSessions.report
      summary: Post a batch of transcript entries, the session state, usage and the ACP session id
      tags: [host]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HostReport" } } }
      responses:
        "200":
          description: The session after the report
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentSession" } } }
        default: { $ref: "#/components/responses/Problem" }

  /host-sessions/{id}:ask:
    x-cadence: { entity: hostSessions }
    parameters: [{ $ref: "#/components/parameters/AgentSessionId" }]
    post:
      operationId: hostSessions.ask
      summary: Raise an ACP permission request; the preset answers it or it becomes an agent-permission approval
      tags: [host]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HostAsk" } } }
      responses:
        "200":
          description: The answer, or the approval a person decides (outcome pending)
          content: { application/json: { schema: { $ref: "#/components/schemas/HostDecision" } } }
        default: { $ref: "#/components/responses/Problem" }

  /host-sessions/{id}:decision:
    x-cadence: { entity: hostSessions }
    parameters: [{ $ref: "#/components/parameters/AgentSessionId" }]
    get:
      operationId: hostSessions.decision
      summary: Read (or wait for) the decision on an agent-permission approval
      tags: [host]
      parameters:
        - { name: approvalId, in: query, required: true, schema: { type: string } }
        - { name: hostId, in: query, required: true, description: The host process asking (it must run the session), schema: { type: string } }
        - { name: wait, in: query, description: Seconds to wait for a decision, schema: { type: integer, minimum: 0, maximum: 30, default: 0 } }
      responses:
        "200":
          description: The decision (outcome pending while nobody decided)
          content: { application/json: { schema: { $ref: "#/components/schemas/HostDecision" } } }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- agent credentials (instance-wide, the admin's; exempt: tag agentCredentials, never MCP tools)
  # The agents' own model accounts (docs/spec/08-resolutions.md R3, R6): the Claude Code subscription token and
  # opencode's providers. Values are write-only: they pass through the secret store's transit area to the agent host,
  # which writes them into the agent-credentials volume; Postgres keeps metadata only. Admin only (full scope); the
  # tag keeps them out of the MCP tool list, and the presets forbid them as well.
  /agent-credentials:
    x-cadence: { entity: agentCredentials }
    get:
      operationId: agentCredentials.list
      summary: The agents' model accounts (metadata only), whether an agent host is connected, and opencode's default model
      tags: [agentCredentials]
      responses:
        "200":
          description: Configured agent credentials, Claude Code first
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentCredentialList" } } }
        default: { $ref: "#/components/responses/Problem" }

  /agent-credentials/{id}:
    x-cadence: { entity: agentCredentials }
    parameters: [{ $ref: "#/components/parameters/AgentCredentialId" }]
    get:
      operationId: agentCredentials.get
      summary: One agent credential's metadata (never its value)
      tags: [agentCredentials]
      responses:
        "200":
          description: The credential
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentCredential" } } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: agentCredentials.set
      summary: Connect or change an agent's model account (write-only value) or choose opencode's default model
      tags: [agentCredentials]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatchOptional"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentCredentialSet" } } }
      responses:
        "200":
          description: The credential as set; a new value waits for the agent host to write it (delivery pending)
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentCredential" } } }
        default: { $ref: "#/components/responses/Problem" }

  /agent-credentials/{id}:verify:
    x-cadence: { entity: agentCredentials }
    parameters: [{ $ref: "#/components/parameters/AgentCredentialId" }]
    post:
      operationId: agentCredentials.verify
      summary: Ask the agent host for a tiny real request through the agent (and opencode's model list); the result arrives as an event
      tags: [agentCredentials]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      responses:
        "200":
          description: The credential with its verification pending
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentCredential" } } }
        default: { $ref: "#/components/responses/Problem" }

  /agent-credentials/{id}:archive:
    x-cadence: { entity: agentCredentials }
    parameters: [{ $ref: "#/components/parameters/AgentCredentialId" }]
    post:
      operationId: agentCredentials.archive
      summary: Disconnect an agent's model account; the agent host removes it from the agent-credentials volume
      tags: [agentCredentials]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      responses:
        "200":
          description: The archived credential (its removal from the volume is pending until the host acknowledges)
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentCredential" } } }
        default: { $ref: "#/components/responses/Problem" }

  /agent-providers:
    x-cadence: { entity: agentProviders }
    get:
      operationId: agentProviders.list
      summary: The provider catalogue the Agents settings choose from (Claude subscription; opencode providers and their API hosts)
      tags: [agentCredentials]
      responses:
        "200":
          description: Providers per agent
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentProviderList" } } }
        default: { $ref: "#/components/responses/Problem" }

  # The agent host's side of agent credentials (tag host): it claims pending writes, removals and verifications and
  # reports each one back; the control plane then deletes the transit copy of the value.
  /host-credentials:claim:
    x-cadence: { entity: hostCredentials }
    post:
      operationId: hostCredentials.claim
      summary: Long-poll for agent credential tasks — values to write into the agent-credentials volume, removals, verifications
      tags: [host]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HostCredentialClaim" } } }
      responses:
        "200":
          description: Tasks for this host, oldest first (empty when the wait passed with nothing to do)
          content: { application/json: { schema: { $ref: "#/components/schemas/HostCredentialWork" } } }
        default: { $ref: "#/components/responses/Problem" }

  /host-credentials/{id}:report:
    x-cadence: { entity: hostCredentials }
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: hostCredentials.report
      summary: Acknowledge an agent credential task with its outcome (written, removed, verified with the model list)
      tags: [host]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HostCredentialReport" } } }
      responses:
        "200":
          description: The task as recorded
          content: { application/json: { schema: { $ref: "#/components/schemas/HostCredentialAck" } } }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- egress proxy protocol (exempt: tag egress, never MCP tools)
  /egress-hosts:
    x-cadence: { entity: egressHosts }
    get:
      operationId: egressHosts.list
      summary: The hosts the agent sandbox may reach beyond the proxy's static list (configured providers, custom base URLs)
      tags: [egress]
      responses:
        "200":
          description: Hosts derived from the agent credentials, sorted
          content: { application/json: { schema: { $ref: "#/components/schemas/EgressHostList" } } }
        default: { $ref: "#/components/responses/Problem" }

  /host-sessions:release:
    x-cadence: { entity: hostSessions }
    post:
      operationId: hostSessions.release
      summary: Give back every live session of a host that is shutting down, so the next host takes them at once
      description: >
        The host stops its agents first (their last turn is committed and reported), then releases. Each session
        loses its host and token, a turn in progress counts as interrupted (the next host tells the agent, and its
        pending permission requests are withdrawn as interrupted, not declined), messages the host took but never gave
        the agent go back to pending, and the Chat shows the session as reconnecting until a host claims it.
      tags: [host]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HostRelease" } } }
      responses:
        "200":
          description: The sessions released
          content: { application/json: { schema: { $ref: "#/components/schemas/HostReleased" } } }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- worker protocol (exempt: tag worker, never MCP tools; phase 2 · wave 0)
  /worker-registrations:
    x-cadence: { entity: workerRegistrations }
    post:
      operationId: workerRegistrations.new
      summary: Publish the worker's runtime, step kinds and model families at start; answers the worker id
      tags: [worker]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkerRegistration" } } }
      responses:
        "200":
          description: The worker as registered, with the registry versions its publication resolved to
          content: { application/json: { schema: { $ref: "#/components/schemas/Worker" } } }
        default: { $ref: "#/components/responses/Problem" }

  /worker-leases:claim:
    x-cadence: { entity: workerLeases }
    post:
      operationId: workerLeases.claim
      summary: Long-poll for a step to run on one of this worker's cards
      tags: [worker]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkerClaim" } } }
      responses:
        "200":
          description: A lease (absent when the wait passed with nothing this worker may run)
          content: { application/json: { schema: { $ref: "#/components/schemas/WorkerClaimResult" } } }
        default: { $ref: "#/components/responses/Problem" }

  /worker-leases/{id}:report:
    x-cadence: { entity: workerLeases }
    parameters: [{ $ref: "#/components/parameters/LeaseId" }]
    post:
      operationId: workerLeases.report
      summary: Heartbeat with progress and card telemetry; three missed beats reap the lease
      tags: [worker]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkerReport" } } }
      responses:
        "200":
          description: Whether the worker must stop the step (the job was cancelled or paused)
          content: { application/json: { schema: { $ref: "#/components/schemas/WorkerReportAck" } } }
        default: { $ref: "#/components/responses/Problem" }

  /worker-leases/{id}/worker-logs:
    x-cadence: { entity: workerLogs }
    parameters: [{ $ref: "#/components/parameters/LeaseId" }]
    post:
      operationId: workerLogs.new
      summary: Append NDJSON log lines to the job's log; they stream on job.{id}.log
      tags: [worker]
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema: { type: string, description: "One WorkerLogLine JSON object per line; at most 1 MiB per request" }
      responses:
        "204": { description: Appended }
        default: { $ref: "#/components/responses/Problem" }

  /worker-leases/{id}/worker-metrics:
    x-cadence: { entity: workerMetrics }
    parameters: [{ $ref: "#/components/parameters/LeaseId" }]
    post:
      operationId: workerMetrics.new
      summary: Append a batch of metric points (loss, validation WER, LR, throughput, card memory)
      tags: [worker]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkerMetricBatch" } } }
      responses:
        "204": { description: Stored }
        default: { $ref: "#/components/responses/Problem" }

  /worker-leases/{id}/worker-outputs:
    x-cadence: { entity: workerOutputs }
    parameters: [{ $ref: "#/components/parameters/LeaseId" }]
    post:
      operationId: workerOutputs.new
      summary: Publish an intermediate output of a running step (a validation checkpoint); recorded and hooked at once
      description: >
        The artifact must already be in the content store and name one of the step's outputs with its declared type.
        The control plane records it and runs the output hooks of its type in their own transaction (a `checkpoint`
        registers on the run and re-ranks its top k), so outputs published during a lease survive a pause, a window
        close or a failure. Publishing the same hash again is a no-op. The release still sends the step's final
        outputs.
      tags: [worker]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkerOutput" } } }
      responses:
        "204": { description: Recorded (or recorded before) }
        default: { $ref: "#/components/responses/Problem" }

  /worker-leases/{id}:release:
    x-cadence: { entity: workerLeases }
    parameters: [{ $ref: "#/components/parameters/LeaseId" }]
    post:
      operationId: workerLeases.release
      summary: Complete a lease with the step's outcome, its output artifacts and final metrics, or a typed error
      tags: [worker]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StepOutcome" } } }
      responses:
        "204": { description: Recorded; the control plane advances the pipeline }
        default: { $ref: "#/components/responses/Problem" }

  /worker-artifacts/{hash}:
    x-cadence: { entity: workerArtifacts }
    parameters: [{ $ref: "#/components/parameters/ArtifactHash" }]
    put:
      operationId: workerArtifacts.set
      summary: Upload a blob into the content store (workers without the shared volume); the hash is verified
      tags: [worker]
      requestBody:
        required: true
        content: { application/octet-stream: { schema: { type: string, format: binary } } }
      responses:
        "204": { description: Stored (or already present) }
        default: { $ref: "#/components/responses/Problem" }

