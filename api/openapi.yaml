  # ---------------------------------------------------------------- artifacts and pipelines (phase 2 · stream P) — add paths below this line
  /artifacts/{hash}:
    x-cadence: { entity: artifacts }
    parameters: [{ $ref: "#/components/parameters/ArtifactHash" }]
    get:
      operationId: artifacts.get
      summary: Get an artifact by hash — type, size, metadata, producing step, a directory's files, and small content
      tags: [artifacts]
      x-cadence:
        toolDescription: >
          Read an artifact of the content store by its hash (b3:<64 hex>): type, size, neutral metadata, the pipeline
          step that produced it and, for a directory artifact, its file list. With content=true a file artifact of at
          most 1 MiB comes back inline (utf8 or base64); for a directory pass path to read one of its files. Larger
          content is omitted (contentOmitted says why) — artifacts are read by steps, not copied into a context.
      parameters:
        - { name: content, in: query, description: "Include the content when it is at most 1 MiB", schema: { type: boolean, default: false } }
        - { name: path, in: query, description: "With content=true on a directory artifact: the file to read", schema: { type: string, maxLength: 1000 } }
      responses:
        "200":
          description: The artifact
          content: { application/json: { schema: { $ref: "#/components/schemas/Artifact" } } }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{p}/pipelines:
    x-cadence: { entity: pipelines }
    parameters: [{ $ref: "#/components/parameters/ProjectSlug" }]
    get:
      operationId: pipelines.list
      summary: The project's pipelines (pipelines/*.yaml at a ref) and the bundled templates it does not override
      tags: [pipelines]
      x-cadence:
        toolDescription: >
          List the pipelines this project can run: every pipelines/<name>.yaml of the project repository at ref
          (default main) plus the bundled templates it has no file for. Each has its version (the commit that last
          changed the file; send it as ifMatch to pipelines.run), its inputs by artifact type and its steps pinned as
          kind@version with only the parameters that depart from defaults. A file that does not parse carries error.
      parameters:
        - { name: ref, in: query, description: "Branch, tag or commit (default main)", schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: Pipelines by name
          content: { application/json: { schema: { $ref: "#/components/schemas/PipelineList" } } }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{p}/pipelines/{name}:run:
    x-cadence: { entity: pipelines }
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - { name: name, in: path, required: true, description: "Pipeline name (pipelines/<name>.yaml)", schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,62}$" } }
    post:
      operationId: pipelines.run
      summary: Validate a pipeline against the step registry and start a pipeline run (dryRun validates and estimates)
      tags: [pipelines]
      x-cadence:
        toolDescription: >
          Run a pipeline of this project. Always call it with dryRun=true first: that validates the pipeline against
          the published step kinds (kind@version exists, input and output artifact types match, parameters fit each
          kind's schema, no cycles), resolves every parameter from defaults.yaml, lists the departures from defaults
          and sums the known estimates, without starting anything; a broken pipeline answers pipeline-invalid with one
          error per problem. Then run it for real with the same body and ifMatch = the pipeline's version from
          pipelines.list (or "*" for whatever is at ref). inputs maps each pipeline input to an artifact {hash, type};
          params overrides parameters per step id; finished steps with the same input hash are reused unless fresh.
          The answer is the pipeline run (plr_…): follow pipeline_run.{id} or call pipelineRuns.wait. Spending GPU time
          over the budget answers 202 with an approvalId instead. A dataset input of an eval-only version (or a mix
          input referencing one) that a training step reads answers eval-only-dataset.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PipelineRunNew" } } }
      responses:
        "200":
          description: Dry run — the validated plan with resolved parameters, departures and the estimate; nothing started
          content: { application/json: { schema: { $ref: "#/components/schemas/PipelinePlan" } } }
        "201":
          description: Started; the pipeline run with its steps (ready steps are queued as step jobs)
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/PipelineRun" } } }
        "202": { $ref: "#/components/responses/ApprovalAccepted" }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{p}/pipeline-runs:
    x-cadence: { entity: pipelineRuns }
    parameters: [{ $ref: "#/components/parameters/ProjectSlug" }]
    get:
      operationId: pipelineRuns.list
      summary: Pipeline runs of a project, newest first
      tags: [pipelines]
      parameters:
        - { name: state, in: query, description: Only runs in this state, schema: { $ref: "#/components/schemas/PipelineRunState" } }
        - { name: pipeline, in: query, description: Only runs of this pipeline, schema: { type: string, maxLength: 63 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Pipeline runs, newest first (without their steps)
          content: { application/json: { schema: { $ref: "#/components/schemas/PipelineRunList" } } }
        default: { $ref: "#/components/responses/Problem" }

  /pipeline-runs/{id}:
    x-cadence: { entity: pipelineRuns }
    parameters: [{ name: id, in: path, required: true, description: "Pipeline run id (plr_…)", schema: { type: string } }]
    get:
      operationId: pipelineRuns.get
      summary: Get a pipeline run with the status, inputs, outputs, attempts and departures of every step
      tags: [pipelines]
      responses:
        "200":
          description: The pipeline run
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/PipelineRun" } } }
        default: { $ref: "#/components/responses/Problem" }

  /pipeline-runs/{id}:cancel:
    x-cadence: { entity: pipelineRuns }
    parameters: [{ name: id, in: path, required: true, description: "Pipeline run id (plr_…)", schema: { type: string } }]
    post:
      operationId: pipelineRuns.cancel
      summary: Cancel a pipeline run; waiting steps never start and running step jobs are cancelled
      tags: [pipelines]
      x-cadence:
        toolDescription: >
          Cancel a pipeline run: steps that have not started are cancelled, queued and running step jobs are
          cancelled (a running step stops on its worker), finished steps keep their outputs for reuse. Send ifMatch
          with the run's etag (rev) from pipelineRuns.get.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      responses:
        "200":
          description: The cancelled pipeline run
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/PipelineRun" } } }
        default: { $ref: "#/components/responses/Problem" }

  /pipeline-runs/{id}:retry:
    x-cadence: { entity: pipelineRuns }
    parameters: [{ name: id, in: path, required: true, description: "Pipeline run id (plr_…)", schema: { type: string } }]
    post:
      operationId: pipelineRuns.retry
      summary: Retry a failed step of a pipeline run as a new attempt; the run continues from there
      tags: [pipelines]
      x-cadence:
        toolDescription: >
          Retry one failed (or cancelled) step of a pipeline run as a new attempt, with the same resolved parameters
          and inputs; finished steps are not re-run and the run continues after it. Without step, every failed step
          is retried. batchScale (0–1] shrinks the batch after an out-of-memory failure. Send ifMatch with the run's
          etag (rev).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/PipelineRunRetry" } } }
      responses:
        "200":
          description: The pipeline run with the step queued again
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/PipelineRun" } } }
        default: { $ref: "#/components/responses/Problem" }

  /pipeline-runs/{id}:wait:
    x-cadence: { entity: pipelineRuns }
    parameters: [{ name: id, in: path, required: true, description: "Pipeline run id (plr_…)", schema: { type: string } }]
    get:
      operationId: pipelineRuns.wait
      summary: Wait until a pipeline run ends or the timeout passes, then return it (agents)
      tags: [pipelines]
      x-cadence:
        toolDescription: >
          Wait for a pipeline run started by pipelines.run. Returns the run as soon as it is done, failed or
