components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-chosen key; a repeat with the same key returns the original result
      schema: { type: string, minLength: 8, maxLength: 200 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The revision the change is based on (the ETag of the last read); a mismatch answers 412 with currentRev
      schema: { type: string }
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: The revision the change is based on; required unless the target does not exist yet
      schema: { type: string }
    DryRun:
      name: dryRun
      in: query
      required: false
      description: Validate and report what would happen without changing anything
      schema: { type: boolean, default: false }
    ProjectSlug:
      name: p
      in: path
      required: true
      description: Project slug
      schema: { $ref: "#/components/schemas/Slug" }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    VersionId:
      name: id
      in: path
      required: true
      description: Registry version id (ver_…)
      schema: { type: string }
    RegistryCollectionFilter:
      name: collection
      in: query
      required: false
      description: "Only versions of this collection (id reg_… or name, e.g. dataset/fleurs-he-smoke)"
      schema: { type: string }
    RegistryStateFilter:
      name: state
      in: query
      required: false
      description: Only versions in this state
      schema: { $ref: "#/components/schemas/VersionState" }

  headers:
    ETag:
      description: The entity revision, quoted (e.g. "3"); send it back as If-Match
      schema: { type: string }

  requestBodies:
    PlannedBody:
      required: false
      content: { application/json: { schema: { type: object, additionalProperties: true } } }

  responses:
    Problem:
      description: Error (RFC 9457)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    JobAccepted:
      description: Accepted; follow the job on job.{jobId}
      content: { application/json: { schema: { $ref: "#/components/schemas/JobAccepted" } } }
    ApprovalAccepted:
      description: Gated; a person decides the approval on the approvals topic
      content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalAccepted" } } }
    PlannedEntity:
      description: Shape defined when the operation's phase implements it
      content: { application/json: { schema: { type: object, additionalProperties: true } } }

  schemas:
    Slug:
      type: string
      pattern: "^[a-z][a-z0-9-]{1,38}[a-z0-9]$"
      description: Lowercase letters, digits and dashes; 3–40 characters
    WorkspaceName:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9 _-]{0,62}$"

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, description: "https://cadence.local/help/errors/<slug> — the help article for this error" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        currentRev: { type: integer, description: Present on 412 — the revision to rebase on }
        errors:
          type: array
          description: Field-level problems on 422
          items: { $ref: "#/components/schemas/ProblemFieldError" }
    ProblemFieldError:
      type: object
      required: [path, message]
      properties: { path: { type: string }, message: { type: string } }

    JobAccepted:
      type: object
      required: [jobId]
      properties: { jobId: { type: string } }
    ApprovalAccepted:
      type: object
      required: [approvalId]
      properties: { approvalId: { type: string } }

    Actor:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, enum: [user, agent, automation] }
        id: { type: string }
        name: { type: string }
        sessionId: { type: string }

    Project:
      type: object
      required: [id, slug, name, rev, createdAt, updatedAt]
      properties:
        id: { type: string }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        description: { type: string }
        rev: { type: integer }
        archivedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectNew:
      type: object
      required: [slug, name]
      additionalProperties: false
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
    ProjectEdit:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
    ProjectList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Project" } }

    Workspace:
      type: object
      required: [id, name, schemaVersion, layout, panels, rev, updatedAt]
      properties:
        id: { type: string }
        name: { $ref: "#/components/schemas/WorkspaceName" }
        schemaVersion: { type: integer, minimum: 1 }
        layout: { type: object, additionalProperties: true, description: "Dockview api.toJSON()" }
        panels:
          type: object
          additionalProperties: { $ref: "#/components/schemas/PanelState" }
        rev: { type: integer }
        updatedAt: { type: string, format: date-time }
    WorkspaceSet:
      type: object
      required: [schemaVersion, layout, panels]
      additionalProperties: false
      properties:
        schemaVersion: { type: integer, minimum: 1 }
        layout: { type: object, additionalProperties: true }
        panels:
          type: object
          additionalProperties: { $ref: "#/components/schemas/PanelState" }
    PanelState:
      type: object
      properties:
        pinnedTo: { type: string, description: "Document reference kind:id" }
        viewState: { type: object, additionalProperties: true }
    WorkspaceSummary:
      type: object
      required: [name, rev, updatedAt]
      properties:
        name: { $ref: "#/components/schemas/WorkspaceName" }
        rev: { type: integer }
        updatedAt: { type: string, format: date-time }
    WorkspaceList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WorkspaceSummary" } }

    CadenceEvent:
      type: object
      required: [seq, topic, type, actor, at]
      properties:
        seq: { type: integer, format: int64, description: Global, monotonic; the SSE id for resume }
        topic: { type: string, example: entity.project.4b1c… }
        type: { type: string, example: project.created }
        projectId: { type: string, description: Work events only; registry events carry none }
        entity:
          type: object
          required: [kind, id, rev]
          properties: { kind: { type: string }, id: { type: string }, rev: { type: integer } }
        actor: { $ref: "#/components/schemas/Actor" }
        causedBy:
          type: object
          required: [commandId]
          properties:
            commandId: { type: string }
            toolCallId: { type: string, description: The agent tool call (Cadence-Tool-Call-Id request header) }
            approvalId: { type: string, description: The approval a person granted for this command }
        payload: { type: object, additionalProperties: true }
        at: { type: string, format: date-time }
    EventList:
      type: object
      required: [items, lastSeq]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CadenceEvent" } }
        lastSeq: { type: integer, format: int64, description: Pass as `after` to continue }

    HelpArticle:
      type: object
      required: [id, title, section, body]
      properties:
        id: { type: string }
        title: { type: string }
        section: { type: string, enum: [errors, panels, steps, guides, shell] }
        summary: { type: string }
        body: { type: string, description: Markdown }
        contexts: { type: array, items: { type: string }, description: "Qualifiers this article answers, e.g. panel:library" }
    HelpHit:
      type: object
      required: [id, title, section]
      properties:
        id: { type: string }
        title: { type: string }
        section: { type: string }
        summary: { type: string }
    HelpSearchResult:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/HelpHit" } }

    RegistryVersion:
      type: object
      description: One immutable version of a registry collection. Versions never change once frozen; only aliases move.
      required: [kind, id, collectionId, name, version, state, tags, licence, fingerprint, actor, createdAt, updatedAt]
      properties:
        kind: { $ref: "#/components/schemas/RegistryKind" }
        id: { type: string, description: "ver_…" }
        collectionId: { type: string, description: "reg_…" }
        name: { type: string, description: "The collection's name, e.g. dataset/fleurs-he-smoke" }
        version:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}\\.[0-9a-f]{12}$"
          description: "YYYY-MM-DD.<sha>: the registration date and the first 12 hex digits of the content fingerprint"
        state: { $ref: "#/components/schemas/VersionState" }
        tags: { type: array, items: { type: string }, description: "The collection's tags (locale:he-IL, domain:telephony, …)" }
        licence: { type: string, description: The collection's licence (SPDX id where one exists) }
        fingerprint: { type: string, description: "sha256 of the version's canonical content (hex)" }
        actor: { $ref: "#/components/schemas/Actor" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: The last state change }
    RegistryKindCount:
      type: object
      required: [kind, count]
      properties: { kind: { $ref: "#/components/schemas/RegistryKind" }, count: { type: integer } }
    RegistrySearchResult:
      type: object
      required: [items, kinds]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RegistryVersion" } }
        kinds: { type: array, items: { $ref: "#/components/schemas/RegistryKindCount" } }

    # ---------------------------------------------------------------- auth and credentials schemas (stream A) — add below
    #
    #
    #

    # ---------------------------------------------------------------- registry, compute, secrets, defaults, policies schemas (stream B) — add below
    #
    #
    #
    RegistryKind:
      type: string
      enum: [base_model, dataset_version, template]
      description: The kinds registered so far; golden sets, sources, normalizers and model versions join in later phases
    VersionState:
      type: string
      enum: [draft, frozen, deprecated]
      description: "draft → frozen → deprecated; a frozen version never changes"
    UsedBy:
      type: object
      description: A project that adopted the version, and its aliases pointing at it
      required: [projectId, projectSlug, adoptedAt, aliases]
      properties:
        projectId: { type: string }
        projectSlug: { $ref: "#/components/schemas/Slug" }
        adoptedAt: { type: string, format: date-time }
        aliases: { type: array, items: { $ref: "#/components/schemas/AliasName" } }
    VersionSummary:
      type: object
      required: [id, version, state, createdAt]
      properties:
        id: { type: string }
        version: { type: string }
        state: { $ref: "#/components/schemas/VersionState" }
        createdAt: { type: string, format: date-time }
    Collection:
      type: object
      description: A named series of immutable versions of one kind
      required: [id, kind, name, description, tags, licence, versionCount, createdAt]
      properties:
        id: { type: string, description: "reg_…" }
        kind: { $ref: "#/components/schemas/RegistryKind" }
        name: { type: string, description: "<kind>/<name>, e.g. dataset/fleurs-he-smoke" }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        licence: { type: string }
        versionCount: { type: integer }
        latest: { $ref: "#/components/schemas/VersionSummary" }
        versions: { type: array, items: { $ref: "#/components/schemas/VersionSummary" }, description: "Newest first; collections.get only" }
        createdAt: { type: string, format: date-time }
    CollectionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Collection" } }

    BaseModelPayload:
      type: object
      description: An upstream checkpoint pinned to one Hugging Face revision
      required: [hfRepo, revision, licence, familyId, locales]
      properties:
        hfRepo: { type: string, example: nvidia/nemotron-3.5-asr-streaming-0.6b }
        revision: { type: string, description: The pinned Hugging Face commit sha }
        licence: { type: string }
        licenceUrl: { type: string }
        familyId: { type: string, description: "Model family descriptor id (R41); the descriptor itself arrives with the worker in phase 2" }
        checkpointFile: { type: string, description: "The file a run initialises from, e.g. the .nemo archive" }
        parameters: { type: string, description: "Model size as the model card states it, e.g. 0.6B" }
        sampleRateHz: { type: integer }
        locales: { type: array, items: { type: string }, description: Locales the model card lists }
    BaseModelVersion:
      allOf:
        - $ref: "#/components/schemas/RegistryVersion"
        - type: object
          required: [baseModel, usedBy]
          properties:
            baseModel: { $ref: "#/components/schemas/BaseModelPayload" }
            usedBy: { type: array, items: { $ref: "#/components/schemas/UsedBy" } }
    BaseModelVersionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BaseModelVersion" } }

    DatasetSplit:
      type: object
      required: [name, utterances, hours]
      properties:
        name: { type: string, example: train }
        utterances: { type: integer }
        hours: { type: number, format: double }
        speakers: { type: integer }
    DatasetPayload:
      type: object
      description: A fingerprinted selection of utterances with splits, statistics and lineage
      required: [source, locales, splits, hours, utterances, bytes, fixture]
      properties:
        source: { type: string, description: "Where the audio comes from, e.g. hf://datasets/google/fleurs" }
        sourceRevision: { type: string, description: The pinned revision of the source }
        subset: { type: string, description: "The source's configuration or subset, e.g. he_il" }
        locales: { type: array, items: { type: string } }
        domain: { type: string }
        sampleRateHz: { type: integer }
        splits: { type: array, items: { $ref: "#/components/schemas/DatasetSplit" } }
        hours: { type: number, format: double }
        utterances: { type: integer }
        bytes: { type: integer, format: int64, description: Size of the frozen shards; estimated for fixtures }
        fixture: { type: boolean, description: "Metadata only: no audio is stored (phase-1 fixture so mixes have something to reference)" }
    DatasetVersion:
      allOf:
        - $ref: "#/components/schemas/RegistryVersion"
        - type: object
          required: [dataset, usedBy]
          properties:
            dataset: { $ref: "#/components/schemas/DatasetPayload" }
            usedBy: { type: array, items: { $ref: "#/components/schemas/UsedBy" } }
    DatasetVersionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DatasetVersion" } }

    TemplateKind:
      type: string
      enum: [instructions, preset, skill, pipeline, agent-config]
    TemplateFile:
      type: object
      required: [path, sha256, bytes]
      properties:
        path: { type: string, description: Path inside the bundled templates tree }
        sha256: { type: string }
        bytes: { type: integer }
    TemplatePayload:
      type: object
      description: Bundled configuration the bootstrap copies into a project; the contents ship in the binary
      required: [templateKind, path, files]
      properties:
        templateKind: { $ref: "#/components/schemas/TemplateKind" }
        path: { type: string, description: "Directory or file in the templates tree, e.g. instructions/default" }
        files: { type: array, items: { $ref: "#/components/schemas/TemplateFile" } }
    TemplateVersion:
      allOf:
        - $ref: "#/components/schemas/RegistryVersion"
        - type: object
          required: [template, usedBy]
          properties:
            template: { $ref: "#/components/schemas/TemplatePayload" }
            usedBy: { type: array, items: { $ref: "#/components/schemas/UsedBy" } }
    TemplateVersionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TemplateVersion" } }

    AdoptionNew:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: string, description: "The registry version to adopt (ver_…)" }
    Adoption:
      type: object
      required: [projectId, version, actor, adoptedAt, aliases]
      properties:
        projectId: { type: string }
        version: { $ref: "#/components/schemas/RegistryVersion" }
        actor: { $ref: "#/components/schemas/Actor" }
        adoptedAt: { type: string, format: date-time }
        aliases: { type: array, items: { $ref: "#/components/schemas/AliasName" } }
    AdoptionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Adoption" } }

    AliasName:
      type: string
      pattern: "^[a-z][a-z0-9-]{1,38}[a-z0-9]$"
      description: "Lowercase letters, digits and dashes, shown with a leading @; baseline and production are reserved (R8)"
    AliasSet:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: string, description: "A registry version the project adopted (ver_…)" }
    Alias:
      type: object
      required: [id, name, projectId, version, reserved, rev, actor, updatedAt]
      properties:
        id: { type: string, description: "als_…" }
        name: { $ref: "#/components/schemas/AliasName" }
        projectId: { type: string }
        version: { $ref: "#/components/schemas/RegistryVersion" }
        reserved:
          type: string
          enum: [free, gated, promotion]
          description: "free: aliases.set moves it; gated: aliases.set needs an approval (baseline); promotion: only deployments.promote moves it (production)"
        rev: { type: integer }
        actor: { $ref: "#/components/schemas/Actor" }
        updatedAt: { type: string, format: date-time }
    AliasList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Alias" } }

    JobKind:
      type: string
      enum: [training, eval, shadow, export]
    ComputeCard:
      type: object
      required: [index, name, cardClass, memoryGb, memoryCapGb, allowedJobKinds]
      properties:
        index: { type: integer, minimum: 0, description: The card's index on its host (CUDA device order) }
        name: { type: string }
        cardClass: { type: string, description: Key into the estimate table in defaults.yaml }
        memoryGb: { type: number, format: double }
        memoryCapGb: { type: number, format: double, description: "The memory a Cadence job may use on this card (CADENCE_GPU_MEMORY_CAP_GB)" }
        allowedJobKinds: { type: array, items: { $ref: "#/components/schemas/JobKind" } }
    ComputeHealth:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [unknown, healthy, degraded, unreachable], description: "unknown until a worker reports (phase 2)" }
        checkedAt: { type: string, format: date-time }
        detail: { type: string }
    ComputeHost:
      type: object
      required: [id, name, description, cards, health, rev, createdAt, updatedAt]
      properties:
        id: { type: string, description: "cmp_…" }
        name: { type: string }
        description: { type: string }
        cards: { type: array, items: { $ref: "#/components/schemas/ComputeCard" } }
        health: { $ref: "#/components/schemas/ComputeHealth" }
        rev: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ComputeList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ComputeHost" } }
    ComputeCardEdit:
      type: object
      required: [index]
      additionalProperties: false
      properties:
        index: { type: integer, minimum: 0 }
        memoryCapGb: { type: number, format: double, exclusiveMinimum: 0 }
        allowedJobKinds: { type: array, uniqueItems: true, items: { $ref: "#/components/schemas/JobKind" } }
    ComputeEdit:
      type: object
      additionalProperties: false
      properties:
        description: { type: string, maxLength: 2000 }
        cards: { type: array, minItems: 1, items: { $ref: "#/components/schemas/ComputeCardEdit" } }

    SecretKind:
      type: string
      enum: [huggingface, ngc, github, s3, judge-api, other]
    SecretName:
      type: string
      pattern: "^[a-z][a-z0-9_-]{1,62}$"
    SecretScope:
      type: string
      pattern: "^(instance|project:[a-z][a-z0-9-]{1,38}[a-z0-9])$"
      description: "instance, or project:<slug> when only that project's jobs and bootstrap may read it"
    Secret:
      type: object
      description: A named credential; its value is never returned
      required: [id, name, kind, scope, rev, actor, createdAt]
      properties:
        id: { type: string, description: "sec_…" }
        name: { $ref: "#/components/schemas/SecretName" }
        kind: { $ref: "#/components/schemas/SecretKind" }
        scope: { $ref: "#/components/schemas/SecretScope" }
        rev: { type: integer }
        actor: { $ref: "#/components/schemas/Actor" }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, description: The last time a server-side consumer read the value }
    SecretNew:
      type: object
      required: [name, kind, value]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/SecretName" }
        kind: { $ref: "#/components/schemas/SecretKind" }
        scope: { $ref: "#/components/schemas/SecretScope" }
        value: { type: string, writeOnly: true, minLength: 1, maxLength: 16384, description: Write-only; stored encrypted outside the database }
    SecretList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Secret" } }

    DefaultRange:
      type: object
      properties:
        min: { type: number, format: double }
        max: { type: number, format: double }
        values: { type: array, items: { type: string } }
    DefaultValue:
      type: object
      description: One default with its description, source and safe range
      required: [value, description, source]
      properties:
        value: { description: "The default: a number, string, boolean or list" }
        unit: { type: string }
        description: { type: string }
        source: { type: string, description: "The published source, or \"Cadence recommendation\"" }
        range: { $ref: "#/components/schemas/DefaultRange" }
    DefaultSection:
      type: object
      additionalProperties: { $ref: "#/components/schemas/DefaultValue" }
    TrainingEstimateRow:
      type: object
      description: "Seconds per training step for one base model × card class × memory cap × precision (R12 table path)"
      required: [base_model, card_class, memory_cap_gb, precision, seconds_per_step, plus_minus, description, source]
      properties:
        base_model: { type: string, description: Registry collection name of the base model }
        card_class: { type: string }
        memory_cap_gb: { type: number, format: double }
        precision: { type: string }
        seconds_per_step: { type: number, format: double }
        plus_minus: { type: number, format: double, description: "Relative uncertainty: 0.5 means ±50%" }
        description: { type: string }
        source: { type: string }
    DefaultCard:
      type: object
      required: [index, name, card_class, memory_gb, memory_cap_gb, allowed_job_kinds]
      properties:
        index: { type: integer }
        name: { type: string }
        card_class: { type: string }
        memory_gb: { type: number, format: double }
        memory_cap_gb: { type: number, format: double }
        allowed_job_kinds: { type: array, items: { $ref: "#/components/schemas/JobKind" } }
    DefaultHost:
      type: object
      description: A compute host seeded at first start
      required: [name, description, cards, source]
      properties:
        name: { type: string }
        description: { type: string }
        cards: { type: array, items: { $ref: "#/components/schemas/DefaultCard" } }
        source: { type: string }
    Defaults:
      type: object
      description: "defaults.yaml (R11): keys are snake_case, addressed as <section>.<key> (x-cadence.defaultRef)"
      required: [version, wizard, budgets, timeouts, training, estimates, cache, compute]
      properties:
        version: { type: integer }
        wizard: { $ref: "#/components/schemas/DefaultSection" }
        budgets: { $ref: "#/components/schemas/DefaultSection" }
        timeouts: { $ref: "#/components/schemas/DefaultSection" }
        training: { $ref: "#/components/schemas/DefaultSection" }
        cache: { $ref: "#/components/schemas/DefaultSection" }
        estimates:
          type: object
          required: [bytes_per_audio_hour, training]
          properties:
            bytes_per_audio_hour: { $ref: "#/components/schemas/DefaultValue" }
            training: { type: array, items: { $ref: "#/components/schemas/TrainingEstimateRow" } }
        compute:
          type: object
          required: [hosts]
          properties:
            hosts: { type: array, items: { $ref: "#/components/schemas/DefaultHost" } }

    PolicyBudgets:
      type: object
      required: [gpuHoursPerProjectPerDay, agentTurnsPerSession]
      properties:
        gpuHoursPerProjectPerDay: { type: number, format: double, description: "Default budgets.gpu_hours_per_project_per_day" }
        agentTurnsPerSession: { type: integer, description: "Default budgets.agent_turns_per_session" }
    Policies:
      type: object
      required: [rev, updatedAt, budgets, departures]
      properties:
        rev: { type: integer }
        updatedAt: { type: string, format: date-time }
        budgets: { $ref: "#/components/schemas/PolicyBudgets" }
        departures:
          type: array
          items: { type: string }
          description: "Fields that differ from defaults.yaml, e.g. budgets.gpuHoursPerProjectPerDay"
    PoliciesEdit:
      type: object
      additionalProperties: false
      properties:
        budgets:
          type: object
          additionalProperties: false
          properties:
            gpuHoursPerProjectPerDay: { type: number, format: double }
            agentTurnsPerSession: { type: integer }

    RunInit:
      type: string
      enum: [base, checkpoint]
      description: "Where the weights start (R44); scratch is deferred"
    Precision:
      type: string
      enum: [bf16, fp16, fp32]
    RunNew:
      type: object
      additionalProperties: false
      properties:
        init: { $ref: "#/components/schemas/RunInit" }
        baseModel:
          type: string
          description: "Base model version (ver_…), collection name (its newest frozen version) or @alias; default the defaults' base model"
        checkpoint: { type: string, description: "Required when init is checkpoint (checkpoints arrive in phase 2)" }
        steps: { type: integer, minimum: 1, description: "Default training.steps" }
        precision: { $ref: "#/components/schemas/Precision" }
        gpus: { type: integer, minimum: 1, description: "Cards for the run; v1 accepts 1 (training.gpus)" }
        compute: { type: string, description: "Host id or name; default the first host whose card allows training" }
        datasets:
          type: array
          maxItems: 100
          items: { type: string }
          description: "Dataset versions (ver_… or @alias) the run reads, for the data volume; the mix replaces this in phase 2"
    EstimateRange:
      type: object
      required: [value, low, high]
      properties:
        value: { type: number, format: double }
        low: { type: number, format: double }
        high: { type: number, format: double }
    RunEstimate:
      type: object
      description: "What a run would cost (R12). basis table: from the estimate table in defaults.yaml; measured: from runs.calibrate (phase 2)"
      required: [basis, plusMinus, gpuHours, durationSeconds, secondsPerStep, steps, gpus, precision, init, baseModel, card, data, budget, source]
      properties:
        basis: { type: string, enum: [measured, table] }
        plusMinus: { type: number, format: double, description: "Relative uncertainty: 0.5 means ±50%" }
        gpuHours: { $ref: "#/components/schemas/EstimateRange" }
        durationSeconds: { $ref: "#/components/schemas/EstimateRange" }
        secondsPerStep: { type: number, format: double }
        steps: { type: integer }
        gpus: { type: integer }
        precision: { $ref: "#/components/schemas/Precision" }
        init: { $ref: "#/components/schemas/RunInit" }
        baseModel: { $ref: "#/components/schemas/RegistryVersion" }
        card:
          type: object
          required: [computeId, host, index, cardClass, memoryCapGb]
          properties:
            computeId: { type: string }
            host: { type: string }
            index: { type: integer }
            cardClass: { type: string }
            memoryCapGb: { type: number, format: double }
        data:
          type: object
          required: [datasets, hours, bytes]
          properties:
            datasets: { type: array, items: { type: string }, description: Resolved dataset version ids }
            hours: { type: number, format: double }
            bytes: { type: integer, format: int64, description: What must be materialised on the worker's disk }
        budget:
          type: object
          required: [gpuHoursPerProjectPerDay, withinDailyBudget]
          properties:
            gpuHoursPerProjectPerDay: { type: number, format: double }
            withinDailyBudget: { type: boolean, description: "The upper bound fits the project's daily GPU-hour budget" }
        source: { type: string, description: The source of the estimate-table row }

    # ---------------------------------------------------------------- approvals, audit, jobs schemas (stream C) — add below
    #
    #
    #
    Approval:
      type: object
      required: [id, state, scope, operation, actor, rule, reason, request, rev, createdAt, expiresAt]
      properties:
        id: { type: string, description: "apr_<uuidv7>" }
        state: { type: string, enum: [pending, approved, denied] }
        scope: { type: string, enum: [project, registry], description: Registry approvals are decided by the admin only }
        operation: { type: string, description: "The gated operation, e.g. projects.archive" }
        projectId: { type: string }
        actor: { $ref: "#/components/schemas/Actor" }
        rule: { type: string, description: The policy rule that asked for approval }
        reason: { type: string }
        estimate: { $ref: "#/components/schemas/PolicyEstimate" }
        request: { $ref: "#/components/schemas/ApprovalRequest" }
        rev: { type: integer }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: Pending approvals are denied when this passes (24 h) }
        decidedAt: { type: string, format: date-time }
        decidedBy: { $ref: "#/components/schemas/Actor" }
        decision: { $ref: "#/components/schemas/ApprovalDecision" }
        result: { $ref: "#/components/schemas/ApprovalResult" }
    ApprovalDecision:
      type: object
      required: [grant]
      properties:
        grant:
          type: string
          enum: [once, session]
          description: session also allows the same operation on the same path for the rest of the agent session
        note: { type: string }
        expired: { type: boolean, description: Denied because nobody decided within 24 h }
    ApprovalRequest:
      type: object
      required: [method, path, headers]
      description: The stored request, without credentials or cookies
      properties:
        method: { type: string }
        path: { type: string }
        query: { type: string }
        headers: { type: object, additionalProperties: { type: string } }
        body: { description: The JSON body, when there was one }
    ApprovalResult:
      type: object
      required: [status, commandId]
      description: What the replayed request answered
      properties:
        status: { type: integer }
        commandId: { type: string }
        body: { description: The JSON body of the replay's response }
    PolicyEstimate:
      type: object
      properties:
        gpuHours: { type: number, format: double, minimum: 0 }
        remainingGpuHours: { type: number, format: double }
    ApprovalApprove:
      type: object
      additionalProperties: false
      properties:
        grant: { type: string, enum: [once, session], default: once }
        note: { type: string, maxLength: 2000 }
    ApprovalDeny:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 2000 }
    ApprovalList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Approval" } }

    AuditEntry:
      type: object
      required: [id, operation, actor, outcome, status, at]
      properties:
        id: { type: string, description: "aud_<uuidv7>" }
        commandId: { type: string }
        operation: { type: string }
        actor: { $ref: "#/components/schemas/Actor" }
        preset: { type: string, description: The permission preset the policy engine applied }
        projectId: { type: string }
        outcome:
          type: string
          description: "ok, approval (stored as an approval), denied (policy), expired (approval nobody decided), or the problem slug of a failed attempt"
        status: { type: integer, description: HTTP status answered }
        rule: { type: string, description: The policy rule that decided }
        causedBy: { $ref: "#/components/schemas/AuditCause" }
        at: { type: string, format: date-time }
    AuditCause:
      type: object
      properties:
        commandId: { type: string }
        toolCallId: { type: string }
        approvalId: { type: string }
    AuditList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        next: { type: string, description: Pass as `before` for the next (older) page; absent on the last page }

    JobState:
      type: string
      enum: [queued, running, done, failed, cancelled]
    Job:
      type: object
      required: [id, kind, state, progress, attempt, rev, actor, createdAt, updatedAt]
      properties:
        id: { type: string, description: "job_<uuidv7>" }
        kind: { type: string }
        projectId: { type: string }
        state: { $ref: "#/components/schemas/JobState" }
        progress: { type: number, format: double, minimum: 0, maximum: 1 }
        message: { type: string, description: The last progress message }
        result: { description: What the job produced (kind-specific JSON), once done }
        error: { type: string, description: Why it failed, once failed }
        attempt: { type: integer }
        rev: { type: integer }
        actor: { $ref: "#/components/schemas/Actor" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        cancelRequestedAt: { type: string, format: date-time }
    JobList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Job" } }
