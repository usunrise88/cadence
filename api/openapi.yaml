      parameters:
        - $ref: "#/components/parameters/RegistryCollectionFilter"
        - $ref: "#/components/parameters/RegistryStateFilter"
      responses:
        "200":
          description: Step kind versions, newest first
          content: { application/json: { schema: { $ref: "#/components/schemas/StepKindVersionList" } } }
        default: { $ref: "#/components/responses/Problem" }

  /registry/step-kinds/{id}:
    x-cadence: { entity: stepKinds, kind: step_kind }
    parameters: [{ $ref: "#/components/parameters/VersionId" }]
    get:
      operationId: stepKinds.get
      summary: Get a step kind version
      tags: [registry]
      responses:
        "200":
          description: The version
          content: { application/json: { schema: { $ref: "#/components/schemas/StepKindVersion" } } }
        default: { $ref: "#/components/responses/Problem" }

  /jobs/{id}:pause:
    x-cadence: { entity: jobs }
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: jobs.pause
      summary: Pause a step job; a queued one is held back, a running one saves its state and returns to the queue
      tags: [jobs]
      x-cadence:
        toolDescription: >
          Pause a step job (training, eval, data). A queued job is not started until jobs.resume; a running one is
          told to stop at its next heartbeat, saves its training state and waits in the queue, resuming from that
          state. Only jobs that run on a worker can be paused.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      responses:
        "200":
          description: The job with pausedAt set
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } }
        default: { $ref: "#/components/responses/Problem" }

  /jobs/{id}:resume:
    x-cadence: { entity: jobs }
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: jobs.resume
      summary: Resume a paused step job; it waits in the queue for a free card (from its saved training state)
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      responses:
        "200":
          description: The job without pausedAt
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } }
        default: { $ref: "#/components/responses/Problem" }

  /jobs/{id}/job-logs:
    x-cadence: { entity: jobLogs }
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: jobLogs.list
      summary: Read a job's log lines from its worker, filtered by level and text, after a line number
      tags: [jobs]
      x-cadence:
        toolDescription: >
          Read the log of a job that ran on a worker: lines {seq, t, level, msg, fields}. level=warn keeps warn and
          error; text matches the message (case-insensitive); after=<seq> pages forward (nextAfter); tail=true returns
          the last lines instead of the first. Live lines stream on job.{id}.log.
      parameters:
        - { name: level, in: query, description: Minimum level, schema: { type: string, enum: [debug, info, warn, error] } }
        - { name: text, in: query, description: Text the message must contain (case-insensitive), schema: { type: string, maxLength: 200 } }
        - { name: after, in: query, description: Only lines after this line number, schema: { type: integer, minimum: 0 } }
        - { name: tail, in: query, description: The last matching lines instead of the first, schema: { type: boolean, default: false } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 500 } }
      responses:
        "200":
          description: Matching lines in order
          content: { application/json: { schema: { $ref: "#/components/schemas/JobLogPage" } } }
        default: { $ref: "#/components/responses/Problem" }

  /queue-entries:
    x-cadence: { entity: queueEntries }
    get:
      operationId: queueEntries.list
      summary: The step queue across projects — waiting, paused and running step jobs with their card and lease
      tags: [jobs]
      x-cadence:
        toolDescription: >
          The GPU queue: step jobs waiting, paused or running on a worker, in start order (priority, then first
          come), with the card and worker holding each running one. Reorder with jobs.edit (priority), pause with
          jobs.pause. A project-scoped credential sees its own project's entries only.
      parameters:
        - { name: project, in: query, description: Only this project's entries (slug), schema: { type: string } }
      responses:
        "200":
          description: Entries, running ones first, then in start order
          content: { application/json: { schema: { $ref: "#/components/schemas/QueueEntryList" } } }
        default: { $ref: "#/components/responses/Problem" }

