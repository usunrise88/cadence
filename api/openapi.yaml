        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      responses:
        "200":
          description: The discarded branch
          content: { application/json: { schema: { $ref: "#/components/schemas/Branch" } } }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- search and saved views (phase 1 · wave 2 · search) — add paths below this line
  # R1: search.query becomes projects.search — the agent token is project-bound; the scope:all qualifier reaches
  # the registry and, for a credential that reaches them, the other projects. Saved views are per user and tagged me.
  /projects/{p}:search:
    x-cadence: { entity: projects }
    parameters: [{ $ref: "#/components/parameters/ProjectSlug" }]
    get:
      operationId: projects.search
      summary: Search entities of this project and the registry with free text and qualifiers
      tags: [projects]
      x-cadence:
        toolDescription: >
          Search what Cadence knows — projects, mixes, registry versions and collections, jobs, approvals, help articles —
          from this project. q is free text (typos and identifiers match by trigram; Hebrew is matched without
          niqqud) plus qualifiers: kind:<kind>[,<kind>] (e.g. kind:dataset_version,job), status:<s> (alias
          state:), lang:<locale> (he matches he-IL), actor:agent|user|automation|<id>, updated:>2026-09-01
          (also <, >=, <=, a day, or a..b), project:<slug> or scope:all|project|registry, tag:<tag>,
          alias:@<name>, and numeric comparisons such as wer<10, progress>=0.5 or dur:2..8. Without a scope
          qualifier the search covers this project and the registry. Results are grouped by kind, this project's
          newest first. An unknown qualifier answers invalid-query with the list of qualifiers.
      parameters:
        - name: q
          in: query
          description: "Free text plus qualifiers, e.g. `fleurs kind:dataset_version tag:telephony updated:>2026-09-01`"
          schema: { type: string, maxLength: 1000 }
        - name: limit
          in: query
          description: Most hits returned over all groups
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Hits grouped by kind, with the parsed qualifiers
          content: { application/json: { schema: { $ref: "#/components/schemas/SearchResult" } } }
        default: { $ref: "#/components/responses/Problem" }

  /me/projects/{p}/views:
    x-cadence: { entity: views, kind: saved_search }
    parameters: [{ $ref: "#/components/parameters/ProjectSlug" }]
    get:
      operationId: views.list
      summary: The user's saved searches in a project, by name
      tags: [me]
      responses:
        "200":
          description: Saved searches
          content: { application/json: { schema: { $ref: "#/components/schemas/SavedViewList" } } }
        default: { $ref: "#/components/responses/Problem" }

  /me/projects/{p}/views/{name}:
    x-cadence: { entity: views, kind: saved_search }
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - { name: name, in: path, required: true, schema: { $ref: "#/components/schemas/SavedViewName" } }
    get:
      operationId: views.get
      summary: Get a saved search
      tags: [me]
      responses:
        "200":
          description: The saved search
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/SavedView" } } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: views.set
      summary: Save a search under a name (If-Match; omit it only to create)
      tags: [me]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatchOptional"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SavedViewSet" } } }
      responses:
        "200":
          description: Saved (or, for a dry run, what would be saved)
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/SavedView" } } }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- mixes, drafts, presence (phase 1 · wave 2 · mix stream) — add paths below this line
  #
  #
  #
  /projects/{p}/mixes:
    x-cadence: { entity: mixes }
    parameters: [{ $ref: "#/components/parameters/ProjectSlug" }]
    get:
      operationId: mixes.list
      summary: The project's mixes, most recently changed first
      tags: [mixes]
      responses:
        "200":
          description: Mixes
          content: { application/json: { schema: { $ref: "#/components/schemas/MixList" } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: mixes.new
      summary: Save a new mix (groups over dataset versions, weights, temperature, replay share) at revision 1
      tags: [mixes]
      x-cadence:
        toolDescription: >
          Save a new mix: named groups of frozen dataset versions (ver_…, @alias or a collection name such as
          dataset/fleurs-he-smoke, resolved to its newest frozen version), each with a weight, plus the sampling
          temperature and the replay share. Omitted values come from defaults.yaml (defaults://). Call
          mixes.preview first to see hours per language. A mix is project work with revisions (R13).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MixNew" } } }
      responses:
        "200":
          description: Dry run — the mix that would be saved; nothing was written
          content: { application/json: { schema: { $ref: "#/components/schemas/Mix" } } }
        "201":
          description: Saved
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Mix" } } }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{p}/mixes:preview:
    x-cadence: { entity: mixes }
    parameters: [{ $ref: "#/components/parameters/ProjectSlug" }]
    post:
      operationId: mixes.preview
      summary: Hours per language and sampling shares of a mix without saving it (metadata only, no GPU)
      tags: [mixes]
      x-cadence:
        toolDescription: >
          Preview a mix without saving it: the source hours of every group and language and the share of training
          samples each would get under the weights, temperature and replay share. Reads dataset-version metadata
          only; nothing is written and no GPU is used.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MixNew" } } }
      responses:
        "200":
          description: The preview
          content: { application/json: { schema: { $ref: "#/components/schemas/MixPreview" } } }
        default: { $ref: "#/components/responses/Problem" }

  /mixes/{id}:
    x-cadence: { entity: mixes }
    parameters: [{ $ref: "#/components/parameters/MixId" }]
    get:
      operationId: mixes.get
      summary: Get a mix at its current revision, with its preview and who is editing it
      tags: [mixes]
      responses:
        "200":
          description: The mix
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Mix" } } }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: mixes.edit
      summary: Edit a mix; a person's edit makes a new revision, an agent's lands as a draft when the draft policy says so
      tags: [mixes]
      x-cadence:
        toolDescription: >
          Edit a mix: the fields you send replace the current ones (groups as a whole list). Send ifMatch with the
          etag (or rev) of your last mixes.get; a stale revision fails with precondition-failed and the current
          revision. Under the project's draft policy (the default for agents) the edit does not change the mix: it
          lands as a draft (result.draft) that a person accepts or reverts, and your later edits update the same
          draft. mixes.get shows your open draft under presence.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MixEdit" } } }
      responses:
        "200":
          description: >
            The mix, plus the draft when the edit landed as one (the mix is then unchanged and ETag is its
            revision); for a dry run, what would happen
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/MixEditResult" } } }
        default: { $ref: "#/components/responses/Problem" }

  /drafts:
    x-cadence: { entity: drafts }
    get:
      operationId: drafts.list
      summary: Drafts of one entity (open ones by default), newest first
      tags: [drafts]
      parameters:
        - { name: entityKind, in: query, required: true, description: "Kind of the drafted entity", schema: { $ref: "#/components/schemas/DraftableKind" } }
        - { name: entityId, in: query, required: true, description: "Id of the drafted entity (mix_…)", schema: { type: string } }
        - { name: state, in: query, description: "Only drafts in this state; all lists every state", schema: { type: string, enum: [open, accepted, reverted, all], default: open } }
      responses:
        "200":
          description: Drafts
          content: { application/json: { schema: { $ref: "#/components/schemas/DraftList" } } }
        default: { $ref: "#/components/responses/Problem" }

  /drafts/{id}:
    x-cadence: { entity: drafts }
    parameters: [{ $ref: "#/components/parameters/DraftId" }]
    get:
      operationId: drafts.get
      summary: Get a draft with its changes against the revision it was based on
      tags: [drafts]
      responses:
        "200":
          description: The draft
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Draft" } } }
        default: { $ref: "#/components/responses/Problem" }

  /drafts/{id}:accept:
    x-cadence: { entity: drafts }
    parameters: [{ $ref: "#/components/parameters/DraftId" }]
    post:
      operationId: drafts.accept
      summary: Apply a draft as a new revision of its entity, attributed to the person who accepts it
      tags: [drafts]
      x-cadence:
        toolDescription: >
          Accept a draft: its content becomes a new revision of the entity, attributed to the caller, with causedBy
          naming the draft. Send ifMatch with the draft's etag (rev). A draft whose entity moved on since it was made
