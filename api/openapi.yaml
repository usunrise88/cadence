      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      responses:
        "200":
          description: The accepted draft and the entity at its new revision; ETag is the draft's revision
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/DraftAccepted" } } }
        default: { $ref: "#/components/responses/Problem" }

  /drafts/{id}:revert:
    x-cadence: { entity: drafts }
    parameters: [{ $ref: "#/components/parameters/DraftId" }]
    post:
      operationId: drafts.revert
      summary: Discard a draft; its entity stays as it is
      tags: [drafts]
      x-cadence:
        toolDescription: >
          Revert (discard) a draft; the entity does not change. Send ifMatch with the draft's etag (rev).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      responses:
        "200":
          description: The reverted draft
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Draft" } } }
        default: { $ref: "#/components/responses/Problem" }

