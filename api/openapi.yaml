          content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeVersionList" } } }
        default: { $ref: "#/components/responses/Problem" }

  /registry/runtimes/{id}:
    x-cadence: { entity: runtimes, kind: runtime }
    parameters: [{ $ref: "#/components/parameters/VersionId" }]
    get:
      operationId: runtimes.get
      summary: Get a runtime version with the workers that run it
      tags: [registry]
      responses:
        "200":
          description: The version
          content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeVersion" } } }
        default: { $ref: "#/components/responses/Problem" }

  /registry/model-families:
    x-cadence: { entity: modelFamilies, kind: model_family }
    get:
      operationId: modelFamilies.list
      summary: List model family versions (architecture, capabilities, latency profiles, role step kinds) published by runtimes
      tags: [registry]
      x-cadence:
        toolDescription: >
          List model families: what a runtime can train and decode — framework, architecture, capabilities, latency
