      requestBody:
        required: true
        content: { application/octet-stream: { schema: { type: string, format: binary } } }
      responses:
        "204": { description: Stored (or already present) }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- worker, queue, telemetry, runtimes (phase 2 · stream W) — add paths below this line
  /registry/runtimes:
