  /projects/{p}/models:register:
    x-cadence: { entity: models }
    parameters: [{ $ref: "#/components/parameters/ProjectSlug" }]
    post:
      operationId: models.register
      summary: Register a checkpoint whose latest gated eval passed as a model version, with its model card (approval for agents)
      tags: [evals]
      x-cadence:
        toolDescription: >
          Publish a checkpoint (ckp_…) as a registry model version (collection model/<name>, default model/<project
          slug>) with its eval, gate verdict, lineage (run, mix, recipe, dataset versions) and a generated model card.
          The checkpoint's latest gated eval (or evalId) must have passed (gate-not-passed otherwise). dryRun shows the
          version's payload and card. For agents it waits for a person's approval (registry changes are shared).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ModelRegister" } } }
      responses:
