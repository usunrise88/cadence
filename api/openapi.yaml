      tags: [agentSessions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentSessionResume" } } }
      responses:
        "200":
          description: The session with the resume pending on the agent host
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentSession" } } }
        default: { $ref: "#/components/responses/Problem" }

  /agent-sessions/{id}:accept:
    x-cadence: { entity: agentSessions }
    parameters: [{ $ref: "#/components/parameters/AgentSessionId" }]
    post:
      operationId: agentSessions.accept
      summary: Merge the session branch into main as a whole and end the session
      tags: [agentSessions]
      x-cadence:
        toolDescription: >
          Accept a session's changes: merge its branch session/<id> into main (fast-forward, or a merge commit; a
