          description: Dry run — the collection and payload the registration would write
          content: { application/json: { schema: { $ref: "#/components/schemas/ModelRegistration" } } }
        "201":
          description: The model version, frozen and adopted by the project
          content: { application/json: { schema: { $ref: "#/components/schemas/ModelVersion" } } }
        "202": { $ref: "#/components/responses/ApprovalAccepted" }
        default: { $ref: "#/components/responses/Problem" }

  /registry/models:
    x-cadence: { entity: models, kind: model }
    get:
      operationId: models.list
