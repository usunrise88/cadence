    x-cadence: { entity: stepKinds, kind: step_kind }
    get:
      operationId: stepKinds.list
      summary: List step kind versions (parameter schema with defaults, inputs, outputs, resources, runtime)
      tags: [registry]
      x-cadence:
        toolDescription: >
          List step kinds a pipeline can pin as kind@version: the parameter schema (every parameter with its default,
          description, source and safe range), consumed and produced artifact types, resources and the runtime that
