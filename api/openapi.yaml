openapi: 3.1.0
info:
  title: Cadence API
  version: 0.1.0
  description: >
    Source of truth for the Go server, the TypeScript client and the MCP tools.
    Naming (docs/spec/08-resolutions.md R1): operationId = MCP tool = UI command = <entity>.<verb>; the entity is
    declared once per path in x-cadence.entity; verbs come from api/vocabulary.yaml; the HTTP shape fixes the verb.
    Mutations are commands: Idempotency-Key, If-Match on the revision, ?dryRun=true; they emit one outbox event.
    Long work returns 202 {jobId}; gated work returns 202 {approvalId}. Errors are application/problem+json
    (RFC 9457) whose type resolves to a help article. Operations with x-cadence.planned are named here so the
    naming contract covers them; the server answers 501 until their phase implements them.
servers:
  - url: /api
tags:
  - { name: projects, description: Units of work with their own repository, budgets and gates }
  - { name: me, description: The signed-in user's own state; not published as MCP tools }
  - { name: events, description: The single event stream (outbox → SSE) }
  - { name: help, description: Versioned help articles bundled with the binary }
  - { name: registry, description: Cadence-wide immutable versioned assets }
  - { name: auth, description: Sign-in, first start and second factor; not published as MCP tools }
  - { name: credentials, description: API keys and agent session tokens; hashed at rest, revoked by command }
  - { name: compute, description: Hosts and their cards, memory caps and allowed job kinds }
  - { name: secrets, description: Named credentials whose values are write-only }
  - { name: defaults, description: The versioned defaults every parameter and form starts from }
  - { name: policies, description: Instance-wide policies (budgets, retention, quotas) }
  - { name: approvals, description: Gated commands waiting for a person }
  - { name: audit, description: Every command with its actor and cause }
  - { name: jobs, description: "Long work that answers 202 and reports on job.{id}" }
  - { name: mixes, description: "Project mixes: groups, weights, temperature and replay share over dataset versions (R13)" }
  - { name: drafts, description: Unaccepted changes to draftable entities that a person accepts or reverts }
  - { name: catalog, description: What the project wizard and Agent settings choose from (agent models per driver) }
  - { name: agentSessions, description: "Claude Code and opencode sessions: lifecycle, transcript, branch accept or revert" }
  - { name: agentCredentials, description: "The agents' own model accounts (instance-wide, admin only); values are write-only and never MCP tools" }
  - { name: host, description: The agent host's protocol (claim work, report, ask); exempt from the vocabulary and never MCP tools }
  - { name: egress, description: The egress proxy's protocol (the allowlist it learns); exempt from the vocabulary and never MCP tools }
  - { name: worker, description: "The GPU worker's protocol (registry, leases, logs, metrics, artifacts); exempt from the vocabulary and never MCP tools" }
  - { name: artifacts, description: "The content store: artifacts addressed by BLAKE3 hash, with type, size, metadata and producing step (R15)" }
  - { name: pipelines, description: "Pipelines of typed steps pinned as kind@version, and their runs with per-step status (R11, R15)" }
  - { name: notifications, description: "The notification routing table, quiet hours, the daily digest and the Telegram bot" }
  - { name: backups, description: "Nightly backup sets (pg_dump plus the content store), the weekly restore test and retention" }
  - { name: playbooks, description: "Prefilled chains of commands with inputs, stop conditions and an estimate, run as playbook sessions (R16)" }
  - { name: runs, description: "Training runs (one optimisation stage each), calibration, checkpoints and metric series (R12, R13, R44)" }
  - { name: evals, description: "The eval matrix against the baseline, eval records, the project's gate and model registration (R20–R24)" }
  - { name: media, description: "Audio for people: an utterance's audio, peaks, spectrogram tiles and words, live transcription (R25, R47); exempt from the vocabulary and never MCP tools; agents are refused" }
  - { name: storage, description: "Mounts (local, NFS/SMB, S3-compatible, Hub), the local cache with pinning, eviction and quotas, dataset materialisation" }
  - { name: planned, description: Named now, implemented in a later phase (501 until then) }

paths:
  # ---------------------------------------------------------------- projects
  /projects:
    x-cadence: { entity: projects }
    get:
      operationId: projects.list
      summary: List projects
      tags: [projects]
      parameters:
        - { name: archived, in: query, description: Include archived projects, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Projects, newest first
          content: { application/json: { schema: { $ref: "#/components/schemas/ProjectList" } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: projects.new
      summary: Create a project from the wizard's choices and bootstrap its repository (202 with the bootstrap job)
      tags: [projects]
      x-cadence:
        toolDescription: >
          Create a project: a unit of work with its own repository, budgets and gates. Only name is required; every
          other wizard choice (slug, locales, domain, base model, agent driver and model, permission preset,
          instructions template, repository, budgets) defaults from defaults.yaml (defaults.get, section wizard).
          The project is created in state bootstrapping and the answer is 202 with the bootstrap job's id: follow
          job.{jobId} (jobs.wait) until the repository is written and the project is active. A dry run answers 200
          with the project that would be created and queues nothing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectNew" } } }
      responses:
        "200":
          description: Dry run — the project that would be created; nothing was written and no job queued
          content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } }
        "202": { $ref: "#/components/responses/JobAccepted" }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{p}:
    x-cadence: { entity: projects }
    parameters: [{ $ref: "#/components/parameters/ProjectSlug" }]
    get:
      operationId: projects.get
      summary: Get a project
      tags: [projects]
      responses:
        "200":
          description: The project
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: projects.edit
      summary: Change a project's name, description, locales, domain, base model or budgets
      tags: [projects]
      x-cadence:
        toolDescription: >
          Change what the wizard set: name, description, locales, domain, the default base model (a frozen
          base-model version id; it is adopted when it is not yet) and budgets. Changes to project facts re-render
          project.yaml and AGENTS.md and commit them to main. Send ifMatch with the etag (or rev) of your last
          projects.get; a stale revision fails with precondition-failed and the current revision to re-read.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectEdit" } } }
      responses:
        "200":
          description: The edited project (or, for a dry run, what it would become)
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{p}:archive:
    x-cadence: { entity: projects }
    parameters: [{ $ref: "#/components/parameters/ProjectSlug" }]
    post:
      operationId: projects.archive
      summary: Archive a project (soft; reversible)
      tags: [projects]
      x-cadence:
        toolDescription: >
          Archive a project (soft; reversible): it leaves the default projects.list but still resolves by
          slug; its server-side worktrees and working clone are removed and its repository becomes read-only (no
          more commits or pushes). Send ifMatch with the etag (or rev) of your last projects.get.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      responses:
        "202": { $ref: "#/components/responses/ApprovalAccepted" }
        "200":
          description: The archived project
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- me
  /me:
    x-cadence: { entity: me, kind: user, singleton: true }
    get:
      operationId: me.get
      summary: The current actor
      tags: [me]
      responses:
        "200":
          description: The actor every command of this caller is attributed to
          content: { application/json: { schema: { $ref: "#/components/schemas/Actor" } } }
        default: { $ref: "#/components/responses/Problem" }

  /me/projects/{p}/workspaces:
    x-cadence: { entity: workspaces }
    parameters: [{ $ref: "#/components/parameters/ProjectSlug" }]
    get:
      operationId: workspaces.list
      summary: The user's saved workspaces in a project (names and revisions, no layouts)
      tags: [me]
      responses:
        "200":
          description: Saved workspaces
          content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceList" } } }
        default: { $ref: "#/components/responses/Problem" }

  /me/projects/{p}/workspaces/{name}:
    x-cadence: { entity: workspaces }
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - { name: name, in: path, required: true, schema: { $ref: "#/components/schemas/WorkspaceName" } }
    get:
      operationId: workspaces.get
      summary: Get a saved workspace
      tags: [me]
      responses:
        "200":
          description: The workspace
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Workspace" } } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: workspaces.set
      summary: Save a workspace layout (If-Match; omit it only to create)
      tags: [me]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatchOptional"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceSet" } } }
      responses:
        "200":
          description: Saved
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Workspace" } } }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- events
  /events:
    x-cadence: { entity: events }
    get:
      operationId: events.list
      summary: Events after a sequence number; with Accept text/event-stream, the live stream
      tags: [events]
      x-cadence:
        toolDescription: >
          Events after a sequence number, oldest first, optionally filtered by topic patterns (a trailing * matches
          the remaining segments, e.g. run.123.*) and project. Use the last seq as `after` to continue.
      parameters:
        - name: topics
          in: query
          description: Comma-separated topic patterns; a trailing `*` matches one or more segments. Default all.
          schema: { type: string, example: "entity.project.*,agent.session.*" }
        - name: project
          in: query
          description: Keep work events of this project (registry events, which carry no projectId, always pass)
          schema: { type: string }
        - name: after
          in: query
          description: Only events with seq greater than this; SSE clients may send Last-Event-ID instead
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          description: Page size for the JSON form
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - { name: Last-Event-ID, in: header, description: SSE resume point, schema: { type: string } }
      responses:
        "200":
          description: "A page of events (JSON) or the live stream (SSE frames `id: <seq>` + `data: <CadenceEvent JSON>`, no event name)"
          content:
            application/json: { schema: { $ref: "#/components/schemas/EventList" } }
            text/event-stream: { schema: { type: string } }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- help
  /help:
    x-cadence: { entity: help, kind: help_article }
    get:
      operationId: help.search
      summary: Search help articles by text or by context (panel, step kind, error type, field)
      tags: [help]
      parameters:
        - { name: q, in: query, description: Free text, schema: { type: string } }
        - name: context
          in: query
          description: "Qualifier of the place the user is in: panel:<id>, step:<kind>, error:<slug>, field:<path>"
          schema: { type: string, example: "panel:library" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Matching articles, best first, without bodies
          content: { application/json: { schema: { $ref: "#/components/schemas/HelpSearchResult" } } }
        default: { $ref: "#/components/responses/Problem" }

  /help/{id}:
    x-cadence: { entity: help, kind: help_article }
    parameters:
      - name: id
        in: path
        required: true
        description: "<section>.<slug>, e.g. errors.not-found, panels.library"
        schema: { type: string, pattern: "^[a-z]+\\.[a-z0-9-]+$" }
    get:
      operationId: help.get
      summary: Get a help article (markdown)
      tags: [help]
      x-cadence:
        toolDescription: >
          Get a help article (markdown) by id <section>.<slug>. Every error a tool returns names its article
          (errors.<slug>): read it for what went wrong and how to fix it.
      responses:
        "200":
          description: The article
          content: { application/json: { schema: { $ref: "#/components/schemas/HelpArticle" } } }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- registry
  /registry:
    x-cadence: { entity: registry, kind: registry_version }
    get:
      operationId: registry.search
      summary: Search registry versions of every kind by text and qualifiers (kind:, tag:, locale:, state:)
      tags: [registry]
      x-cadence:
        toolDescription: >
          Search registry versions of every kind (base models, dataset versions, templates). q is free text matched
          against collection names and descriptions plus qualifiers: kind:base_model, tag:telephony, locale:he-IL,
          state:frozen. project=<slug> keeps only what that project adopted. Get one version with baseModels.get,
          datasets.get or templates.get.
      parameters:
        - { name: q, in: query, description: "Free text with qualifiers (kind:, tag:, locale:, state:)", schema: { type: string } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/RegistryKind" } }
        - { name: project, in: query, description: Only versions this project adopted (slug), schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Versions and the kinds that exist, with counts
          content: { application/json: { schema: { $ref: "#/components/schemas/RegistrySearchResult" } } }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- auth and credentials (phase 1 · stream A) — add paths below this line
  # Operations tagged auth are reachable without a session (docs/spec/06-platform.md "Authentication and access"),
  # are not commands (no actor before sign-in; a browser session is not an entity with a revision) and are never
  # MCP tools (R1). Browsers send `Cadence-Client: web` on every POST, PUT and PATCH (the CSRF rule).
  /auth:
    x-cadence: { entity: auth, singleton: true }
    get:
      operationId: auth.get
      summary: Sign-in state — whether first start is pending and who is signed in
      tags: [auth]
      responses:
        "200":
          description: First-start state and the signed-in actor, if any
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthStatus" } } }
        default: { $ref: "#/components/responses/Problem" }

  /auth:setup:
    x-cadence: { entity: auth, singleton: true }
    post:
      operationId: auth.setup
      summary: First start — set the admin password once and sign in; refused (409) once a password is set
      tags: [auth]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AuthSetup" } } }
      responses:
        "200":
          description: The admin account is set up and signed in
          headers: { Set-Cookie: { $ref: "#/components/headers/SessionCookie" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthStatus" } } }
        default: { $ref: "#/components/responses/Problem" }

  /auth:login:
    x-cadence: { entity: auth, singleton: true }
    post:
      operationId: auth.login
      summary: Sign in with username, password and, when enabled, a TOTP code; rate-limited per address and username
      tags: [auth]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AuthLogin" } } }
      responses:
        "200":
          description: Signed in; the session cookie is set
          headers: { Set-Cookie: { $ref: "#/components/headers/SessionCookie" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthStatus" } } }
        default: { $ref: "#/components/responses/Problem" }

  /auth:logout:
    x-cadence: { entity: auth, singleton: true }
    post:
      operationId: auth.logout
      summary: Sign out — revoke this browser's session and clear its cookie
      tags: [auth]
      responses:
        "204":
          description: Signed out (also when there was no session)
          headers: { Set-Cookie: { $ref: "#/components/headers/SessionCookie" } }
        default: { $ref: "#/components/responses/Problem" }

  /auth/totp:enroll:
    x-cadence: { entity: totp, singleton: true }
    post:
      operationId: totp.enroll
      summary: Start TOTP enrollment for the signed-in user — a new secret, active once confirmed
      tags: [auth]
      responses:
        "200":
          description: The pending secret and its otpauth URI (shown once)
          content: { application/json: { schema: { $ref: "#/components/schemas/TotpEnrollment" } } }
        default: { $ref: "#/components/responses/Problem" }

  /auth/totp:confirm:
    x-cadence: { entity: totp, singleton: true }
    post:
      operationId: totp.confirm
      summary: Confirm TOTP enrollment with a current code; sign-in asks for a code from then on
      tags: [auth]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TotpCode" } } }
      responses:
        "200":
          description: TOTP is on
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthStatus" } } }
        default: { $ref: "#/components/responses/Problem" }

  /auth/totp:disable:
    x-cadence: { entity: totp, singleton: true }
    post:
      operationId: totp.disable
      summary: Turn TOTP off for the signed-in user with a current code
      tags: [auth]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TotpCode" } } }
      responses:
        "200":
          description: TOTP is off
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthStatus" } } }
        default: { $ref: "#/components/responses/Problem" }

  /credentials:
    x-cadence: { entity: credentials }
    get:
      operationId: credentials.list
      summary: List credentials (sessions, API keys, agent tokens) without their secrets
      tags: [credentials]
      parameters:
        - { name: kind, in: query, description: Only this kind, schema: { $ref: "#/components/schemas/CredentialKind" } }
        - { name: revoked, in: query, description: Include revoked and expired credentials, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Credentials, newest first
          content: { application/json: { schema: { $ref: "#/components/schemas/CredentialList" } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: credentials.new
      summary: Create a personal API key (cdk_) scoped to one project or to registry read
      tags: [credentials]
      x-cadence:
        toolDescription: >
          Create a personal API key (Bearer cdk_…) for automation and the CLI, scoped to one project or to reading
          the registry. The token is returned once, in this response only; Cadence stores its hash.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CredentialNew" } } }
      responses:
        "200":
          description: Dry run — the key that would be created (no token); nothing was written
          content: { application/json: { schema: { $ref: "#/components/schemas/CredentialCreated" } } }
        "201":
          description: Created; `token` is shown once (an idempotent replay omits it)
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/CredentialCreated" } } }
        default: { $ref: "#/components/responses/Problem" }

  /credentials/{id}:revoke:
    x-cadence: { entity: credentials }
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: credentials.revoke
      summary: Revoke a credential; requests carrying it are refused from now on (irreversible)
      tags: [credentials]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/DryRun"
      responses:
        "200":
          description: The revoked credential
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Credential" } } }
        default: { $ref: "#/components/responses/Problem" }


  # ---------------------------------------------------------------- registry, compute, secrets, defaults, policies (phase 1 · stream B) — add paths below this line
  #
  #
  #
  /registry/collections:
    x-cadence: { entity: collections, kind: registry_collection }
    get:
      operationId: collections.list
      summary: List registry collections (named series of immutable versions), optionally of one kind or tag
      tags: [registry]
      x-cadence:
        toolDescription: >
          List registry collections such as base-model/nemotron-3.5-asr-streaming-0.6b or dataset/fleurs-he-smoke.
          A collection groups immutable versions of one kind; list the versions with baseModels.list,
          datasets.list or templates.list (filter collection=<name>).
      parameters:
        - { name: kind, in: query, description: Only collections of this kind, schema: { $ref: "#/components/schemas/RegistryKind" } }
        - { name: tag, in: query, description: "Only collections carrying this tag (e.g. locale:he-IL)", schema: { type: string } }
      responses:
        "200":
          description: Collections by name
          content: { application/json: { schema: { $ref: "#/components/schemas/CollectionList" } } }
        default: { $ref: "#/components/responses/Problem" }

  /registry/collections/{id}:
    x-cadence: { entity: collections, kind: registry_collection }
    parameters:
      - { name: id, in: path, required: true, description: "Collection id (reg_…) or name with the slash escaped (dataset%2Ffleurs-he-smoke)", schema: { type: string } }
    get:
      operationId: collections.get
      summary: Get a registry collection with its versions, newest first
      tags: [registry]
      responses:
        "200":
          description: The collection
          content: { application/json: { schema: { $ref: "#/components/schemas/Collection" } } }
        default: { $ref: "#/components/responses/Problem" }

  /registry/base-models:
    x-cadence: { entity: baseModels, kind: base_model }
    get:
      operationId: baseModels.list
      summary: List base model versions (Hugging Face repository at a pinned revision, licence, model family)
      tags: [registry]
      parameters:
        - $ref: "#/components/parameters/RegistryCollectionFilter"
        - $ref: "#/components/parameters/RegistryStateFilter"
      responses:
        "200":
          description: Base model versions, newest first
          content: { application/json: { schema: { $ref: "#/components/schemas/BaseModelVersionList" } } }
        default: { $ref: "#/components/responses/Problem" }

  /registry/base-models/{id}:
    x-cadence: { entity: baseModels, kind: base_model }
    parameters: [{ $ref: "#/components/parameters/VersionId" }]
    get:
      operationId: baseModels.get
      summary: Get a base model version with the projects that use it
      tags: [registry]
      responses:
        "200":
          description: The version
          content: { application/json: { schema: { $ref: "#/components/schemas/BaseModelVersion" } } }
        default: { $ref: "#/components/responses/Problem" }

  /registry/datasets:
    x-cadence: { entity: datasets, kind: dataset_version }
    get:
      operationId: datasets.list
      summary: List dataset versions (immutable, fingerprinted selections with splits and statistics)
      tags: [registry]
      parameters:
        - $ref: "#/components/parameters/RegistryCollectionFilter"
        - $ref: "#/components/parameters/RegistryStateFilter"
      responses:
        "200":
          description: Dataset versions, newest first
          content: { application/json: { schema: { $ref: "#/components/schemas/DatasetVersionList" } } }
        default: { $ref: "#/components/responses/Problem" }

  /registry/datasets/{id}:
    x-cadence: { entity: datasets, kind: dataset_version }
    parameters: [{ $ref: "#/components/parameters/VersionId" }]
    get:
