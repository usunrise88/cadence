services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: cadence
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]

  control-plane:
    build: ./control-plane
    environment:
      DATABASE_URL: postgres://cadence:${POSTGRES_PASSWORD:-change-me}@postgres:5432/cadence?sslmode=disable
      CADENCE_DATA_DIR: /data
    volumes:
      - ${CADENCE_DATA_DIR:-./data}:/data
      - ./recipes:/recipes
    ports: ["8080:8080"]
    depends_on: [postgres]

  agent-host:
    build: ./agent-host
    environment:
      CADENCE_API: http://control-plane:8080
    volumes:
      - ./recipes:/recipes
      - ~/.claude:/root/.claude:ro   # Claude subscription login shared from the host
      - ~/.config/opencode:/root/.config/opencode:ro
    depends_on: [control-plane]

  # GPU worker: runs on the staging host inside the NeMo Speech container.
