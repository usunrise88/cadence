# Cadence — one version for every image: `make up` sets CADENCE_VERSION from git.
# The agent host runs on an internal network whose only way out is the egress proxy (R3, R4); Caddy TLS in front of
# the control plane is the host's own (R39, B7).
x-version: &version
  CADENCE_VERSION: ${CADENCE_VERSION:-dev}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cadence
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published: only the compose network reaches the database (B7).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cadence"]
      interval: 2s
      timeout: 3s
      retries: 30

  control-plane:
    image: cadence/control-plane:${CADENCE_VERSION:-dev}
    build:
      context: .
      dockerfile: control-plane/Dockerfile
      args: *version
    environment:
      DATABASE_URL: postgres://cadence:${POSTGRES_PASSWORD}@postgres:5432/cadence?sslmode=disable
      CADENCE_LOG_LEVEL: ${CADENCE_LOG_LEVEL:-info}
      # Secret-store master key (R9); generated on first start when the file is missing — back it up.
      CADENCE_MASTER_KEY_FILE: ${CADENCE_MASTER_KEY_FILE:-/data/master.key}
      # The agent host's token (cah_…): issued at start when the file holds none that works; the host reads it.
      CADENCE_HOST_TOKEN_FILE: /host-credential/token
      # The egress proxy's own token (cep_…): it reads the allowlist of configured agent providers, nothing else.
      CADENCE_EGRESS_TOKEN_FILE: /egress-credential/token
    volumes:
      - cadence-data:/data # the image runs as uid 65532; a named volume is writable by it
      - host-credential:/host-credential
      - egress-credential:/egress-credential
    ports: ["127.0.0.1:${CADENCE_PORT:-8080}:8080"] # localhost only; TLS ends at the host's Caddy (R39)
    networks: [default, agents]
    depends_on:
      postgres: { condition: service_healthy }

  # Runs the agent sessions (docs/spec/05-agents.md). Root inside the container only to start each session as its
  # own Unix user (R3); no host mounts: the agents' own logins live in the agent-credentials volume — connected from
  # Settings → Agents (the host writes them there), or with the fallback `docker compose run --rm -it agent-host
  # login claude` / `… login opencode` — and worktrees in agent-sessions.
  agent-host:
    image: cadence/agent-host:${CADENCE_VERSION:-dev}
    build:
      context: ./agent-host
      args: *version
    environment:
      CADENCE_URL: http://control-plane:8080
      CADENCE_HOST_TOKEN_FILE: /host-credential/token
      CADENCE_AGENT_CREDENTIALS: /agent-credentials
      CADENCE_LOG_LEVEL: ${CADENCE_LOG_LEVEL:-info}
      # Everything but the control plane leaves through the allowlisting proxy (R4); agents inherit these.
      HTTPS_PROXY: http://egress-proxy:3128
      HTTP_PROXY: http://egress-proxy:3128
      NO_PROXY: control-plane,localhost,127.0.0.1
    volumes:
      - host-credential:/host-credential:ro
      - agent-credentials:/agent-credentials
      - agent-sessions:/var/lib/cadence-host
    networks: [agents]
    depends_on: [control-plane, egress-proxy]
    # On SIGTERM the host stops its agents, commits their interrupted turns and releases the sessions
    # (hostSessions.release) so the next host takes them at once; it releases after 20 s at the latest.
    stop_grace_period: 30s

  # The agent sandbox's only egress (R4): HTTP CONNECT to the allowed hosts, 403 for anything else. It is the control
  # plane binary (`cadence egress-proxy`, internal/egress). CADENCE_EGRESS_ALLOW is the static base list — model
  # providers, Hugging Face, PyPI and NGC; the API hosts of the providers configured in Settings → Agents (and a
  # custom base URL's host) come from the control plane, polled with the proxy's own token. The control plane itself
  # is reached directly on the agents network.
  egress-proxy:
    image: cadence/control-plane:${CADENCE_VERSION:-dev}
    command: ["egress-proxy"]
    environment:
      CADENCE_URL: http://control-plane:8080
      CADENCE_EGRESS_TOKEN_FILE: /egress-credential/token
      CADENCE_EGRESS_ALLOW: >-
        api.anthropic.com console.anthropic.com claude.ai
        api.minimax.io api.minimaxi.com
        opencode.ai models.dev
        huggingface.co *.huggingface.co *.hf.co
        pypi.org files.pythonhosted.org
        nvcr.io *.nvcr.io ngc.nvidia.com *.ngc.nvidia.com
      # opencode.ai serves OpenCode Zen, the free model of development and gated live tests only (R6).
    volumes:
      - egress-credential:/egress-credential:ro
    networks: [agents, default]
    depends_on: [control-plane]

  # GPU worker: runs on the staging host inside the NeMo Speech container.
  # Uncomment once spike A3 fixes the image tag and memory cap.
  # worker:
  #   image: nvcr.io/nvidia/nemo-speech:26.07.00
  #   command: python -m cadence_worker
  #   environment:
  #     CADENCE_API: http://control-plane:8080
  #     CADENCE_GPU_MEMORY_CAP_GB: "24"
  #   volumes:
  #     - ./worker:/workspace/worker
  #     - ${CADENCE_CACHE_DIR:-./cache}:/cache
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

networks:
  # No route out: the agent host reaches the control plane here and everything else through egress-proxy.
  agents:
    internal: true

volumes:
  pgdata:
  cadence-data:
  host-credential:
  egress-credential:
  agent-credentials:
  agent-sessions:
