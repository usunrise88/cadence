# Cadence — one version for every image: `make up` sets CADENCE_VERSION from git.
# The agent host runs on an internal network whose only way out is the egress proxy (R3, R4); Caddy TLS in front of
# the control plane is the host's own (R39, B7).
x-version: &version
  CADENCE_VERSION: ${CADENCE_VERSION:-dev}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cadence
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published: only the compose network reaches the database (B7).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cadence"]
      interval: 2s
      timeout: 3s
      retries: 30

  control-plane:
    image: cadence/control-plane:${CADENCE_VERSION:-dev}
    build:
      context: .
      dockerfile: control-plane/Dockerfile
      args: *version
    environment:
      DATABASE_URL: postgres://cadence:${POSTGRES_PASSWORD}@postgres:5432/cadence?sslmode=disable
      CADENCE_LOG_LEVEL: ${CADENCE_LOG_LEVEL:-info}
      # Secret-store master key (R9); generated on first start when the file is missing — back it up.
      CADENCE_MASTER_KEY_FILE: ${CADENCE_MASTER_KEY_FILE:-/data/master.key}
      # The agent host's token (cah_…): issued at start when the file holds none that works; the host reads it.
      CADENCE_HOST_TOKEN_FILE: /host-credential/token
      # The egress proxy's own token (cep_…): it reads the allowlist of configured agent providers, nothing else.
      CADENCE_EGRESS_TOKEN_FILE: /egress-credential/token
      # Nightly backup sets and the content-store mirror (pg_dump from the image's postgresql-client-17).
      CADENCE_BACKUP_DIR: /backups
      # The workers' token (cwk_…): issued at start like the host token; the worker services read it.
      CADENCE_WORKER_TOKEN_FILE: /worker-credential/token
      # The content store, shared with the workers by volume (blobs b3/<ab>/<hash>, mode 0440, uid 65532 on both sides).
      CADENCE_CAS_DIR: /var/lib/cadence/cas
    volumes:
      - cadence-data:/data # the image runs as uid 65532; a named volume is writable by it
      - host-credential:/host-credential
      - egress-credential:/egress-credential
      - cadence-backups:/backups
      - worker-credential:/worker-credential
      - artifacts:/var/lib/cadence
    ports: ["127.0.0.1:${CADENCE_PORT:-8080}:8080"] # localhost only; TLS ends at the host's Caddy (R39)
    networks: [default, agents]
    # A pipeline's dry run checks that a service an auxiliary model names answers (auxiliary/oasis on the host).
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: { condition: service_healthy }

  # Runs the agent sessions (docs/spec/05-agents.md). Root inside the container only to start each session as its
  # own Unix user (R3); no host mounts: the agents' own logins live in the agent-credentials volume — connected from
  # Settings → Agents (the host writes them there), or with the fallback `docker compose run --rm -it agent-host
  # login claude` / `… login opencode` — and worktrees in agent-sessions.
  agent-host:
    image: cadence/agent-host:${CADENCE_VERSION:-dev}
    build:
      context: ./agent-host
      args: *version
    environment:
      CADENCE_URL: http://control-plane:8080
      CADENCE_HOST_TOKEN_FILE: /host-credential/token
      CADENCE_AGENT_CREDENTIALS: /agent-credentials
      CADENCE_LOG_LEVEL: ${CADENCE_LOG_LEVEL:-info}
      # Everything but the control plane leaves through the allowlisting proxy (R4); agents inherit these.
      HTTPS_PROXY: http://egress-proxy:3128
      HTTP_PROXY: http://egress-proxy:3128
      NO_PROXY: control-plane,localhost,127.0.0.1
    volumes:
      - host-credential:/host-credential:ro
      - agent-credentials:/agent-credentials
      - agent-sessions:/var/lib/cadence-host
    networks: [agents]
    depends_on: [control-plane, egress-proxy]
    # On SIGTERM the host stops its agents, commits their interrupted turns and releases the sessions
    # (hostSessions.release) so the next host takes them at once; it releases after 20 s at the latest.
    stop_grace_period: 30s

  # The agent sandbox's only egress (R4): HTTP CONNECT to the allowed hosts, 403 for anything else. It is the control
  # plane binary (`cadence egress-proxy`, internal/egress). CADENCE_EGRESS_ALLOW is the static base list — model
  # providers, Hugging Face, PyPI and NGC; the API hosts of the providers configured in Settings → Agents (and a
  # custom base URL's host) come from the control plane, polled with the proxy's own token. The control plane itself
  # is reached directly on the agents network.
  egress-proxy:
    image: cadence/control-plane:${CADENCE_VERSION:-dev}
    command: ["egress-proxy"]
    environment:
      CADENCE_URL: http://control-plane:8080
      CADENCE_EGRESS_TOKEN_FILE: /egress-credential/token
      CADENCE_EGRESS_ALLOW: >-
        api.anthropic.com console.anthropic.com claude.ai
        api.minimax.io api.minimaxi.com
        opencode.ai models.dev
        huggingface.co *.huggingface.co *.hf.co
        pypi.org files.pythonhosted.org
        nvcr.io *.nvcr.io ngc.nvidia.com *.ngc.nvidia.com
      # opencode.ai serves OpenCode Zen, the free model of development and gated live tests only (R6).
    volumes:
      - egress-credential:/egress-credential:ro
    networks: [agents, default]
    depends_on: [control-plane]

  # Workers (R40: one service per runtime) pull steps from the control plane (workerLeases.claim) and write outputs into
  # the shared content store; per-lease scratch lives on the same volume so inputs are hard links, not copies. They run
  # as uid 65532 like the control plane and reach nothing but the control plane.
  # The GPU worker, runtime nemo-speech (NeMo Speech 26.07 by digest): `docker compose --profile gpu up -d worker`.
  worker:
    image: cadence/worker:${CADENCE_VERSION:-dev}
    profiles: [gpu]
    build:
      context: .
      dockerfile: worker/Dockerfile
      args: *version
    environment:
      CADENCE_URL: http://control-plane:8080
      CADENCE_WORKER_TOKEN_FILE: /worker-credential/token
      CADENCE_WORKER_HOST: staging
      CADENCE_CAS_DIR: /var/lib/cadence/cas
      CADENCE_WORKER_SCRATCH: /var/lib/cadence/scratch
    volumes:
      - worker-credential:/worker-credential:ro
      - artifacts:/var/lib/cadence
    ipc: host # NeMo's data loaders need more shared memory than the 64 MB default
    depends_on: [control-plane]
    # On SIGTERM a training step writes its training state and the lease is released as cancelled with it: at least
    # the step stop grace (CADENCE_STOP_GRACE_SECONDS, 60 s) plus the release (worker/tests/test_compose.py).
    stop_grace_period: 90s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # The CPU toy worker, runtime toy (R45): proves the seams end to end; `docker compose --profile toy up -d worker-toy`.
  worker-toy:
    image: cadence/worker-toy:${CADENCE_VERSION:-dev}
    profiles: [toy]
    build:
      context: .
      dockerfile: worker/Dockerfile.toy
      args: *version
    environment:
      CADENCE_URL: http://control-plane:8080
      CADENCE_WORKER_TOKEN_FILE: /worker-credential/token
      CADENCE_WORKER_HOST: staging
      CADENCE_CAS_DIR: /var/lib/cadence/cas
      CADENCE_WORKER_SCRATCH: /var/lib/cadence/scratch
    volumes:
      - worker-credential:/worker-credential:ro
      - artifacts:/var/lib/cadence
    depends_on: [control-plane]
    # The step stop grace (CADENCE_STOP_GRACE_SECONDS, 60 s) plus the release, as for the GPU worker
    # (worker/tests/test_compose.py ties the numbers).
    stop_grace_period: 90s

  # The CPU services worker, runtime services: step kinds that call a running service an auxiliary model names
  # (oasis_transcribe → auxiliary/oasis on the host at host.docker.internal:50051). Cadence never starts the service.
  # `docker compose --profile services up -d worker-services`; create the secret oasis-token first (secrets.new).
  worker-services:
    image: cadence/worker-services:${CADENCE_VERSION:-dev}
    profiles: [services]
    build:
      context: .
      dockerfile: worker/Dockerfile.services
      args: *version
    environment:
      CADENCE_URL: http://control-plane:8080
      CADENCE_WORKER_TOKEN_FILE: /worker-credential/token
      CADENCE_WORKER_HOST: staging
      CADENCE_CAS_DIR: /var/lib/cadence/cas
      CADENCE_WORKER_SCRATCH: /var/lib/cadence/scratch
    volumes:
      - worker-credential:/worker-credential:ro
      - artifacts:/var/lib/cadence
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [control-plane]
    stop_grace_period: 90s

networks:
  # No route out: the agent host reaches the control plane here and everything else through egress-proxy.
  agents:
    internal: true

volumes:
  pgdata:
  cadence-data:
  cadence-backups:
  host-credential:
  egress-credential:
  agent-credentials:
  agent-sessions:
  worker-credential:
  artifacts: # the content store and the workers' scratch (one file system: hard links)
