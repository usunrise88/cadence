# Weekly performance job: workspace restore, drag frame time, theming coverage (spikes S1, S3, S4) against their
# budgets; SSE fan-out and search latency join as those land.
name: performance
on:
  schedule: [{ cron: "0 3 * * 1" }]
  workflow_dispatch:

jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: control-plane/go.mod, cache-dependency-path: control-plane/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "web/package-lock.json" }
      - run: cd web && npm ci && npx playwright install --with-deps chromium
      - run: make spikes-measure
        env: { CI: "1" }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: shell-performance, path: web/test-results/spikes, retention-days: 90 }
