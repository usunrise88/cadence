# Every pull request: lint, unit, contract, integration and UI layers (docs/spec/06-platform.md "Testing strategy").
name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.14.0
  UV_VERSION: "0.12.20"

jobs:
  lint:
    name: lint + generated code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: control-plane/go.mod, cache-dependency-path: control-plane/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "web/package-lock.json" }
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}" }
      - run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"
      - run: (cd web && npm ci) && (cd agent-host && npm ci) && (cd worker && uv sync --python 3.12)
      - run: make check-gen
      - run: make lint

  unit:
    name: unit + contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: control-plane/go.mod, cache-dependency-path: control-plane/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "web/package-lock.json" }
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}" }
      - run: (cd web && npm ci && npx playwright install --with-deps chromium) && (cd agent-host && npm ci) && (cd worker && uv sync --python 3.12)
      - run: make test

  integration:
    name: integration (Postgres)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: control-plane/go.mod, cache-dependency-path: control-plane/go.sum }
      - run: make test-integration

  ui:
    name: UI (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: control-plane/go.mod, cache-dependency-path: control-plane/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "web/package-lock.json" }
      - run: cd web && npm ci && npx playwright install --with-deps chromium
      - run: make ui-e2e
        env: { CI: "1" }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: web/playwright-report, retention-days: 14 }

  evals:
    name: agent evals (offline)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: control-plane/go.mod, cache-dependency-path: control-plane/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "agent-host/package-lock.json" }
      - run: cd agent-host && npm ci
      - run: make evals
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: agent-evals, path: agent-host/evals/results, retention-days: 14 }

  image:
    name: images (one version)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: POSTGRES_PASSWORD=ci CADENCE_VERSION=ci-${{ github.sha }} docker compose build
