# Nightly slot (docs/spec/06-platform.md): agent evals (skills and playbooks on a fixture project, both drivers) and
# the smoke project on the staging card (`make e2e`) from phase 4. The offline evals run on every pull request (ci.yml);
# live ones need the agents' model accounts, which GitHub runners never get: they run on the staging host.
name: nightly
on:
  schedule: [{ cron: "30 1 * * *" }]
  workflow_dispatch:

jobs:
  agent-evals:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Live agent evals run on the staging host (CADENCE_LIVE_AGENTS=1 make evals, agent-host/evals/README.md)."
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "The smoke project runs on the staging host from phase 4 (R34); it never runs on GitHub runners."
