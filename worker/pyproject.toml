[project]
name = "cadence-worker"
version = "0.2.0"
description = "Cadence worker: the lease harness, the step contract and the runtime-neutral core step kinds"
requires-python = ">=3.12"
# Framework stacks (NeMo Speech, Lhotse, PyTorch) come from each runtime's image; do not pin them here.
# Runtime deps are ranges because the images provide some of them; uv.lock pins the dev environment.
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "blake3>=1,<2",
  "numpy>=1.26",
  # The import and training resampler (resample_poly), streamed by live sessions; already in the NeMo image.
  "scipy>=1.11",
  # The live channel's client (a live job dials the relay; BSD-3).
  "websockets>=13,<16",
]

# Runtime-neutral core step kinds ship in every runtime image (docs/review/2026-09-30-phase-2-plan.md). Framework
# packs register their own kinds and families from their own distributions (packs/toy, the NeMo pack).
[project.entry-points."cadence.steps"]
echo = "cadence_worker.steps.echo:EchoStep"
dataset_import = "cadence_worker.steps.dataset_import:DatasetImportStep"
wer_score = "cadence_worker.steps.wer_score:WerScoreStep"
spectrogram_tiles = "cadence_worker.steps.spectrogram_tiles:SpectrogramTilesStep"
augment_dataset = "cadence_worker.steps.augment_dataset:AugmentDatasetStep"
entity_score = "cadence_worker.steps.entity_score:EntityScoreStep"
latency_score = "cadence_worker.steps.latency_score:LatencyScoreStep"
sdp_ingest = "cadence_worker.steps.sdp_ingest:SdpIngestStep"
text_normalise = "cadence_worker.steps.text_normalise:TextNormaliseStep"
manifest_filter = "cadence_worker.steps.manifest_filter:ManifestFilterStep"
speaker_disjoint_split = "cadence_worker.steps.speaker_disjoint_split:SpeakerDisjointSplitStep"
dataset_freeze = "cadence_worker.steps.dataset_freeze:DatasetFreezeStep"
mount_check = "cadence_worker.steps.mount_check:MountCheckStep"
pseudolabel_ensemble = "cadence_worker.steps.pseudolabel_ensemble:PseudolabelEnsembleStep"
shar_export = "cadence_worker.steps.shar_export:SharExportStep"
dataset_export = "cadence_worker.steps.dataset_export:DatasetExportStep"
hf_push = "cadence_worker.steps.hf_push:HfPushStep"
noise_mine = "cadence_worker.steps.noise_mine:NoiseMineStep"
segments_cut = "cadence_worker.steps.segments_cut:SegmentsCutStep"

[dependency-groups]
dev = [
  "ruff==0.16.9",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "types-PyYAML==6.0.12.20260906",
  # The CPU toy pack (R45): its conformance run and unit tests need it and its CPU PyTorch.
  "cadence-toy",
  # The NeMo pack: its pure parts are unit-tested here with NeMo mocked; its conformance runs in the NeMo image.
  "cadence-nemo",
  # The services pack (CPU, gRPC clients of running services); grpcio-tools regenerates its OASIS module.
  "cadence-services",
  "grpcio-tools>=1.75,<2",
  "types-grpcio>=1.75,<2",
  "types-protobuf>=6.30,<7",
]

[tool.uv.workspace]
members = ["packs/toy", "packs/nemo", "packs/services"]

[tool.uv.sources]
cadence-toy = { workspace = true }
cadence-nemo = { workspace = true }
cadence-services = { workspace = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadence_worker"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Generated by grpcio-tools from the vendored OASIS proto (packs/services/scripts/gen_proto.py).
extend-exclude = ["packs/services/cadence_services/oasis_gen"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["cadence_worker", "cadence_toy", "cadence_nemo", "cadence_services"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

# The NeMo pack imports its framework stack from the NeMo Speech image; the dev environment does not install it.
[[tool.mypy.overrides]]
module = ["nemo.*", "lightning.*", "omegaconf.*", "lhotse.*", "huggingface_hub.*", "soundfile.*", "scipy.*",
          "transformers.*", "speechbrain.*", "grpc_tools.*"]
ignore_missing_imports = true

# Generated protobuf code (its .pyi stubs type the rest of the pack).
[[tool.mypy.overrides]]
module = ["cadence_services.oasis_gen.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests", "packs/toy/tests", "packs/nemo/tests", "packs/services/tests"]
markers = [
  "gpu: needs a CUDA card; excluded from the default run",
  "conformance: the full conformance flow of a pack (make conformance)",
]
addopts = "-m 'not gpu and not conformance' --import-mode=importlib"
