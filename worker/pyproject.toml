[project]
name = "cadence-worker"
version = "0.1.0"
description = "Cadence GPU worker: step registry and NeMo Speech jobs"
requires-python = ">=3.12"
# NeMo Speech, Lhotse and PyTorch come from the NeMo Speech NGC container (26.07.00); do not pin them here.
# Runtime deps are ranges because the container provides some of them; uv.lock pins the dev environment.
dependencies = ["httpx>=0.28,<1", "pydantic>=2.11,<3", "pyyaml>=6,<7"]

[project.entry-points."cadence.steps"]
echo = "cadence_worker.steps.echo:EchoStep"
dataset_import = "cadence_worker.steps.dataset_import:DatasetImportStep"
# nemotron_finetune = "cadence_worker.steps.nemotron_finetune:FinetuneStep"   # spike A3
# export_onnx = "cadence_worker.steps.export_onnx:ExportOnnxStep"             # spike A3

[dependency-groups]
dev = ["ruff==0.16.9", "mypy==2.3.1", "pytest==9.1.1", "types-PyYAML==6.0.12.20260906"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadence_worker"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA card; excluded from the default run"]
addopts = "-m 'not gpu'"
