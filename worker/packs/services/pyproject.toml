[project]
name = "cadence-services"
version = "0.1.0"
description = "Cadence services pack (runtime `services`, CPU): step kinds that call a running service an auxiliary model names (R26); Cadence never starts the service"
requires-python = ">=3.12"
# gRPC and protobuf for the OASIS client (proto vendored under proto/, generated into cadence_services/oasis_gen).
# The generated module needs a protobuf runtime at least as new as the generator (scripts/gen_proto.py).
dependencies = ["cadence-worker", "numpy>=1.26", "grpcio>=1.75,<2", "protobuf>=6.33.5,<7"]

# The pack's step kinds (runtime `services`). No model family: members of the pseudo-label ensemble fill no family role.
[project.entry-points."cadence.steps"]
oasis_transcribe = "cadence_services.steps.oasis_member:OasisTranscribeStep"

[tool.uv.sources]
cadence-worker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadence_services"]
