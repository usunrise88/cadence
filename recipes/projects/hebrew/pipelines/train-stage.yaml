# Starter pipeline: one training stage from a mix — calibrate batch sizes under the card's memory cap, then train.
# Parameters equal to their defaults (defaults.yaml) are omitted; a written value is a departure from defaults.
name: train-stage
description: One training stage from a mix and a base model (calibrate, then fine-tune)
inputs: { mix: mix, base: base_model }
steps:
  - id: calibrate
    kind: oomptimizer_calibrate@1
    in: { base: $inputs.base, data: $inputs.mix }
  - id: train
    kind: nemotron_finetune@2
    in: { base: $inputs.base, data: $inputs.mix, calibration: calibrate.calibration }
