name: eval-matrix
steps:
  - id: eval
    kind: streaming_eval@1
    params:
      checkpoint: ""
      golden_sets: []
      att_context_sizes: [[56, 0], [56, 1], [56, 13]]
    outputs: { report: eval_report }
  - id: gate
    kind: gate_evaluate@1
    inputs: { report: eval.report }
    params: { gate: default }
