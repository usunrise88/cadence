# Starter pipeline: the streaming eval matrix of a checkpoint, then the gate (step kinds arrive in phase 3).
name: eval-matrix
description: Evaluate a checkpoint at the latency profiles of the matrix and apply the project's gate
inputs: { checkpoint: checkpoint }
steps:
  - id: eval
    kind: streaming_eval@1
    in: { checkpoint: $inputs.checkpoint }
  - id: gate
    kind: gate_evaluate@1
    in: { report: eval.report }
